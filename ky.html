ндө маалымат<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Көңүл ачуу<\/td>\n<td>Оюндар, концерттер<\/td>\n<td>Мобилдик оюндар, соцтармактардагы фильтрлер<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>6. Чакырыктар жана келечек<\/h2>\n<p><strong>Чакырыктар<\/strong>: жабдуунун жана контентти иштеп чыгуунун наркы; кошуунун тактыгы жана батареянын иштөө убактысы боюнча чектөөлөр; чайкалуу жана чарчоо; купуялуулук (камералар айлана-чөйрөнү дайыма сканерлейт); жергиликтүү тилдерде сапаттуу контенттин жетишсиздиги.<\/p>\n<p><strong>Келечек<\/strong>: смартфондун ордуна жеңил AR-көз айнектер; ЖИ менен интеграция (үн жардамчылары, объекттерди таануу); окутуу үчүн ишканалардын «санариптик эгиздери»; билим берүүдө жана өнөр жайда XR рыногунун өсүшү.<\/p>\n<h2>7. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Каалаган AR-тиркемени (мисалы, эмеректи «кийгизип көрүү», камера менен котормочу) орнотуп, сүрөттөңүз: ARдин түрү, эмне таанылат, тиркеме колдонуучунун кандай милдетин чечет.<\/li>\n<li>Университет үчүн VR же AR чечиминин идеясын сунуштаңыз: максаттуу аудитория, колдонуу сценарийи, жабдуу, күтүлгөн натыйжа.<\/li>\n<\/ol>\n<h2>8. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>VR менен ARдин ортосунда кандай айырма бар?<\/li>\n<li>Аралаш чындык жана XR деген эмне?<\/li>\n<li>Эмне үчүн VRде кадрлардын жыштыгы жана кечигүү маанилүү?<\/li>\n<li>ARдин кандай түрлөрүн билесиз?<\/li>\n<li>VR/ARди иштеп чыгуу үчүн кандай куралдар колдонулат?<\/li>\n<li>Медицинада жана ритейлде VR менен ARди колдонуунун мисалдарын келтириңиз.<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Виртуалдык чындык · толукталган чындык · аралаш чындык · XR · метааалам · VR-шлем · SLAM · маркердик AR · Unity · ARKit · ARCore · WebXR · кибероору.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Unity XR документациясы. — docs.unity3d.com.<\/li>\n<li>Apple ARKit. — developer.apple.com/augmented-reality.<\/li>\n<li>Google ARCore. — developers.google.com/ar.<\/li>\n<\/ol>\n"}, {"id": "lec-14", "kind": "lec", "num": 14, "title": "Санариптик маркетинг жана аналитика", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n2-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Студенттерди санариптик маркетингдин каналдары жана куралдары, сатуу воронкасы, натыйжалуулуктун негизги көрсөткүчтөрү (KPI) жана жарнамалык кампаниялардын аналитикасынын ыкмалары менен тааныштыруу.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Санариптик маркетингдин түшүнүгү жана максаттары.<\/li>\n<li>Санариптик маркетингдин каналдары.<\/li>\n<li>Сатуу воронкасы жана кардардын жолу.<\/li>\n<li>Натыйжалуулуктун негизги көрсөткүчтөрү.<\/li>\n<li>Аналитиканын куралдары.<\/li>\n<li>Стратегия жана тренддер.<\/li>\n<\/ol>\n<h2>1. Санариптик маркетингдин түшүнүгү жана максаттары<\/h2>\n<p><strong>Санариптик маркетинг<\/strong> — санариптик каналдарды: сайттарды, издөө системаларын, социалдык тармактарды, электрондук почтаны, мессенджерлерди, мобилдик тиркемелерди колдонуу менен товарларды жана кызматтарды илгерилетүү.<\/p>\n<p>Салттуу маркетингден айырмачылыктары: аудиторияны так тандоо (<strong>таргетинг<\/strong>); ар бир аракеттин өлчөнүүчүлүгү; жыйынтыктары боюнча кампанияны тез өзгөртүү мүмкүнчүлүгү; кардар менен эки тараптуу байланыш.<\/p>\n<p>Максаттар: брендди таанымал кылуу; трафик тартуу; арыздарды (лиддерди) түзүү; сатуунун өсүшү; кардарларды кармап калуу жана алардын берилгендиги.<\/p>\n<h2>2. Санариптик маркетингдин каналдары<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Канал<\/th>\n<th>Маңызы<\/th>\n<th>Куралдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>SEO (издөө системалары үчүн оптималдаштыруу)<\/td>\n<td>Сайт издөөнүн акысыз жыйынтыктарында жогорку орундарды ээлеши үчүн аны жакшыртуу<\/td>\n<td>Ачкыч сөздөр, сапаттуу контент, сайттын ылдамдыгы, шилтемелер<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Контексттик жарнама (PPC, SEM)<\/td>\n<td>Колдонуучунун сурамы боюнча издөөдө жана сайттарда көрсөтүлгөн акылуу жарыялар<\/td>\n<td>Google Ads, Яндекс Директ<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SMM (социалдык тармактардагы маркетинг)<\/td>\n<td>Соцтармактарда илгерилетүү жана аудитория менен баарлашуу<\/td>\n<td>Instagram, Facebook, TikTok, Telegram, Meta Business Suite<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Таргеттелген жарнама<\/td>\n<td>Жынысы, жашы, кызыкчылыктары, геолокациясы боюнча тандалган аудиторияга жарыяларды көрсөтүү<\/td>\n<td>Соцтармактардын жарнама кабинеттери<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Контент-маркетинг<\/td>\n<td>Аудиторияны тарткан жана кармаган пайдалуу контент<\/td>\n<td>Макалалар, видео, подкасттар, инфографика<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Email-маркетинг<\/td>\n<td>Жазылуучуларга жөнөтмөлөр<\/td>\n<td>Mailchimp, SendPulse<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Таасир маркетинги<\/td>\n<td>Блогерлер менен кызматташуу<\/td>\n<td>Сын-пикирлер, интеграциялар<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Мессенджер-маркетинг<\/td>\n<td>Мессенджерлердеги чат-боттор жана жөнөтмөлөр<\/td>\n<td>WhatsApp Business, Telegram-боттор<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Видеомаркетинг<\/td>\n<td>Роликтер, түз эфирлер<\/td>\n<td>YouTube, Reels<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Сатуу воронкасы жана кардардын жолу<\/h2>\n<p><strong>Сатуу воронкасы<\/strong> — сатып алууга карай жолдун ар бир баскычында потенциалдуу кардарлардын саны кантип азаярын көрсөткөн модель.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Баскыч<\/th>\n<th>Колдонуучунун аракети<\/th>\n<th>Көрсөткүч<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Камтуу / көрсөтүүлөр<\/td>\n<td>Жарнаманы көрдү<\/td>\n<td>Impressions, камтуу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Кызыгуу<\/td>\n<td>Басты, сайтка өттү<\/td>\n<td>Басуулар, CTR<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Кароо<\/td>\n<td>Товарды изилдеди, себетке кошту<\/td>\n<td>Сайттагы убакыт, кароонун тереңдиги<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Конверсия<\/td>\n<td>Сатып алды, арыз калтырды<\/td>\n<td>Конверсиялар, CR<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Берилгендик<\/td>\n<td>Кайра сатып алды, сунуштады<\/td>\n<td>Кайталанган сатып алуулар, LTV<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>AIDA<\/strong> модели: көңүл буруу (Attention) → кызыгуу (Interest) → каалоо (Desire) → аракет (Action).<\/p>\n<h2>4. Натыйжалуулуктун негизги көрсөткүчтөрү (KPI)<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Көрсөткүч<\/th>\n<th>Формула<\/th>\n<th>Мааниси<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>CTR (басылуучулук)<\/td>\n<td>Басуулар / Көрсөтүүлөр × 100 %<\/td>\n<td>Жарыя көңүлдү канчалык тартат<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CPC (бир басуунун баасы)<\/td>\n<td>Чыгымдар / Басуулар<\/td>\n<td>Бир өтүүнүн наркы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CPM (1000 көрсөтүүнүн баасы)<\/td>\n<td>Чыгымдар / Көрсөтүүлөр × 1000<\/td>\n<td>Камтуунун наркы<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CR (конверсия коэффициенти)<\/td>\n<td>Конверсиялар / Басуулар × 100 %<\/td>\n<td>Максаттуу аракетти жасаган келүүчүлөрдүн үлүшү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CPA (аракеттин баасы)<\/td>\n<td>Чыгымдар / Конверсиялар<\/td>\n<td>Бир сатуу же арыз канча турат<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ROI (инвестициялардын өзүн актоосу)<\/td>\n<td>(Киреше − Чыгымдар) / Чыгымдар × 100 %<\/td>\n<td>Кампаниянын рентабелдүүлүгү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ROMI / ROAS<\/td>\n<td>Жарнамадан киреше / Жарнамага чыгымдар<\/td>\n<td>Маркетингдик салымдардын кайтарымы<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>LTV (кардардын баалуулугу)<\/td>\n<td>Орточо чек × сатып алуулардын жыштыгы × кардардын «өмүрү»<\/td>\n<td>Кардар бүт убакыт ичинде канча алып келет<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CAC (тартуунун наркы)<\/td>\n<td>Маркетингге чыгымдар / Жаңы кардарлар<\/td>\n<td>Бир жаңы кардарга кеткен чыгымдар<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Мисал.<\/em> Кафе жарнамага 10 000 сом короткон: 50 000 көрсөтүү, 1 000 басуу, 40 буйрутма, түшүм 32 000 сом. CTR = 2 %, CPC = 10 сом, CR = 4 %, CPA = 250 сом, ROI = (32 000 − 10 000) / 10 000 = 220 %.<\/p>\n<p>Өз кампаниянын көрсөткүчтөрүн калькулятордо эсептеңиз:<\/p>\n<div class=\"widget\" data-w=\"mkt\">\n\n<\/div>\n<h2>5. Аналитиканын куралдары<\/h2>\n<ul>\n<li><strong>Google Analytics 4<\/strong>, <strong>Яндекс Метрика<\/strong> — сайтка келүүчүлүк, трафиктин булактары, колдонуучулардын жүрүм-туруму, конверсиялар; Метрика ошондой эле сеанстарды жазат (Вебвизор) жана басуулардын карталарын түзөт.<\/li>\n<li><strong>Meta Business Suite<\/strong>, TikTok жана Telegram статистикасы — камтуу, тартылгандык, аудиториянын демографиясы.<\/li>\n<li><strong>Google Tag Manager<\/strong> — программалоосуз окуяларды көзөмөлдөөнү жөндөө.<\/li>\n<li><strong>UTM-белгилер<\/strong> — өтүүнүн булагын аныктоого мүмкүндүк берген шилтемедеги параметрлер (<code>?utm_source=instagram&amp;utm_campaign=autumn<\/code>).<\/li>\n<li><strong>A/B-тестирлөө<\/strong> — эң жакшысын тандоо үчүн жарыянын же барактын эки вариантын колдонуучулардын ар кандай топторунда салыштыруу.<\/li>\n<li><strong>CRM<\/strong> — жарнамалык арыздарды реалдуу сатуулар менен байланыштырат.<\/li>\n<\/ul>\n<h2>6. Стратегия жана тренддер<\/h2>\n<p><strong>Стратегияны түзүүнүн кадамдары<\/strong>: максаттарды аныктоо (SMART боюнча); максаттуу аудиторияны сүрөттөө (кардардын портрети — персона); каналдарды тандоо; контент-план түзүү; бюджетти аныктоо; KPI коюу; ишке киргизүү, өлчөө, оптималдаштыруу.<\/p>\n<p><strong>Тренддер<\/strong>: маалыматтардын жана ЖИнин негизинде жекелештирүү; контент түзүү үчүн генеративдик ЖИ; кыска вертикалдык видеолор; түздөн-түз соцтармактарда сатуу (social commerce); үн менен издөө; купуялуулукту коргоо жана үчүнчү тараптын cookie файлдарынан баш тартуу; омниканалдык аналитика.<\/p>\n<h2>7. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Жергиликтүү бизнести тандап, ал санариптик маркетингдин кайсы каналдарын колдонорун аныктаңыз. Бир жаңы каналды сунуштап, тандооңузду негиздеңиз.<\/li>\n<li>Шарттуу кампания үчүн CTR, CPC, CR, CPA жана ROIну эсептеп, анын натыйжалуулугу жөнүндө корутунду чыгарыңыз.<\/li>\n<\/ol>\n<h2>8. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Санариптик маркетинг салттуудан эмнеси менен айырмаланат?<\/li>\n<li>SEO контексттик жарнамадан эмнеси менен айырмаланат?<\/li>\n<li>Сатуу воронкасынын баскычтарын сүрөттөңүз.<\/li>\n<li>CTR, CPA жана ROI кантип эсептелет?<\/li>\n<li>UTM-белгилер жана A/B-тесттер эмне үчүн керек?<\/li>\n<li>Таргетинг деген эмне?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Санариптик маркетинг · таргетинг · SEO · контексттик жарнама · SMM · контент-маркетинг · сатуу воронкасы · AIDA · CTR · CPC · CPM · CR · CPA · ROI · LTV · Google Analytics · UTM · A/B-тест.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Котлер Ф. Маркетинг 5.0: технологии для человечности. — М. : Альпина, 2021.<\/li>\n<li>Google Digital Garage: санариптик маркетингдин негиздери. — learndigital.withgoogle.com.<\/li>\n<li>Google Analytics маалымдамасы. — support.google.com/analytics.<\/li>\n<\/ol>\n"}, {"id": "lec-15", "kind": "lec", "num": 15, "title": "Бизнестин санариптик трансформациясы", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n2-модуль\n<\/p>\n<p>\nЖК-1, КК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Курстун материалын жалпылоо жана санариптик трансформацияны уюмдун бизнес-моделин, процесстерин жана маданиятын комплекстүү өзгөртүү катары көрсөтүү: анын баскычтары, негизги технологиялары, санариптик жетилгендикти баалоо, натыйжанын көрсөткүчтөрү, тоскоолдуктар жана ийгиликтүү трансформациялардын мисалдары.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Санариптик трансформация түшүнүгү.<\/li>\n<li>Трансформациянын кыймылдаткыч күчтөрү.<\/li>\n<li>Санариптик трансформациянын баскычтары.<\/li>\n<li>Негизги технологиялар.<\/li>\n<li>Уюмдун санариптик жетилгендиги.<\/li>\n<li>Натыйжаны баалоо.<\/li>\n<li>Тоскоолдуктар жана ийгилик факторлору.<\/li>\n<li>Трансформациянын мисалдары; Кыргызстандагы санариптик трансформация.<\/li>\n<\/ol>\n<h2>1. Санариптик трансформация түшүнүгү<\/h2>\n<p><strong>Бизнестин санариптик трансформациясы<\/strong> — кардарлар үчүн жаңы баалуулук түзүү жана атаандаштыкка жөндөмдүүлүктү жогорулатуу максатында санариптик технологиялардын жана маалыматтардын негизинде бизнес-моделди, процесстерди, продуктыларды, уюштуруучулук түзүмдү жана корпоративдик маданиятты терең өзгөртүү.<\/p>\n<p>Трансформация — программаларды сатып алуу эмес, <strong>компания баалуулукту кантип түзүп, жеткирерин<\/strong> өзгөртүү. Анын төрт өлчөмү: <em>кардарлар<\/em> (жаңы кардар тажрыйбасы), <em>процесстер<\/em> (автоматташтыруу жана интеграция), <em>бизнес-модель<\/em> (жаңы продуктылар жана киреше булактары), <em>адамдар жана маданият<\/em> (көндүмдөр, баалуулуктар, ийкемдүү командалар).<\/p>\n<h2>2. Трансформациянын кыймылдаткыч күчтөрү<\/h2>\n<ul>\n<li>Кардарлардын күтүүлөрүнүн өзгөрүшү: тездик, жекелештирүү, мобилдүүлүк.<\/li>\n<li>Санариптик компаниялардын жана платформалардын атаандаштыгы.<\/li>\n<li>Технологиялардын наркынын төмөндөшү: булуттар, датчиктер, эсептөөлөр.<\/li>\n<li>Маалыматтардын көлөмүнүн өсүшү.<\/li>\n<li>Мамлекеттин санариптештирүү саясаты.<\/li>\n<li>Онлайнга өтүүнү тездеткен кризистер (COVID-19 пандемиясы).<\/li>\n<\/ul>\n<h2>3. Санариптик трансформациянын баскычтары<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Баскыч<\/th>\n<th>Мазмуну<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Учурдагы абалды баалоо жана максаттарды коюу<\/td>\n<td>Процесстердин, системалардын, маалыматтардын, компетенциялардын аудити; санариптик жетилгендикти баалоо; максаттарды жана KPIди аныктоо<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2. Стратегияны жана жол картасын иштеп чыгуу<\/td>\n<td>Артыкчылыктуу багыттар, долбоорлор, бюджет, мөөнөттөр, жооптуу адамдар<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3. Пилоттук долбоорлор<\/td>\n<td>Чечимдерди чектелген участокто текшерүү, тез жыйынтыктар<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4. Масштабдоо<\/td>\n<td>Ийгиликтүү чечимдерди бүт уюмга жайылтуу, системаларды интеграциялоо<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5. Адамдарды жана маданиятты өнүктүрүү<\/td>\n<td>Окутуу, жаңы ролдор (продукт ээси, маалымат аналитиги), өзгөрүүлөрдү башкаруу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>6. Мониторинг жана үзгүлтүксүз жакшыртуу<\/td>\n<td>KPIни көзөмөлдөө, стратегияны тууралоо<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>4. Трансформациянын негизги технологиялары<\/h2>\n<p>Курсту жалпылоо:<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Технология<\/th>\n<th>Трансформацияга салымы<\/th>\n<th>Лекция<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Маалыматтар жана аналитика, BI<\/td>\n<td>Маалыматтарга негизделген чечимдер<\/td>\n<td>3–5<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Булуттук технологиялар<\/td>\n<td>Масштабдалуучулук, каалаган жерден жетүү, чыгымдарды азайтуу<\/td>\n<td>10<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Жасалма интеллект жана ML<\/td>\n<td>Болжолдор, чечимдерди автоматташтыруу, жекелештирүү<\/td>\n<td>11<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Буюмдар интернети<\/td>\n<td>Физикалык объекттер жөнүндө маалыматтар, операцияларды автоматташтыруу<\/td>\n<td>12<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>VR/AR<\/td>\n<td>Жаңы кардар тажрыйбасы жана окутуу<\/td>\n<td>13<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Санариптик маркетинг<\/td>\n<td>Санариптик каналдарда кардарларды тартуу жана кармоо<\/td>\n<td>14<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>КМС (ERP, CRM) жана BPM<\/td>\n<td>Процесстерди интеграциялоо жана оптималдаштыруу<\/td>\n<td>8<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Киберкоопсуздук<\/td>\n<td>Ишеним жана бизнестин үзгүлтүксүздүгү<\/td>\n<td>9<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Блокчейн, RPA, low-code<\/td>\n<td>Бүтүмдөрдүн ачык-айкындуулугу, күнүмдүк иштерди автоматташтыруу, тез иштеп чыгуу<\/td>\n<td>1, 7<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. Уюмдун санариптик жетилгендиги<\/h2>\n<p><strong>Санариптик жетилгендик<\/strong> — уюмдун өз максаттарына жетүү үчүн санариптик технологияларды колдонууга даярдыгынын даражасы. Адатта ал бир нече өлчөм боюнча бааланат: стратегия, кардарлар, процесстер, маалыматтар, технологиялар, персонал жана маданият, башкаруу жана коопсуздук — 1ден 5ке чейинки шкала боюнча.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Деңгээл<\/th>\n<th>Мүнөздөмөсү<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Баштапкы<\/td>\n<td>Айрым санариптик куралдар, кагаз процесстер, стратегия жок<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2. Өнүгүп жаткан<\/td>\n<td>Айрым функциялар автоматташтырылган, маалыматтар чачыранды<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3. Башкарылуучу<\/td>\n<td>Стратегия бар, негизги системалар интеграцияланган<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4. Интеграцияланган<\/td>\n<td>Аягына чейинки санариптик процесстер, маалыматтарга негизделген чечимдер<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5. Трансформациялык<\/td>\n<td>Санариптик бизнес-модель, туруктуу инновациялар<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>6. Натыйжаны баалоо<\/h2>\n<p>Көрсөткүчтөр: түшүмдүн жана онлайн-сатуунун үлүшүнүн өсүшү; операциялык чыгымдардын азайышы; процесстердин убактысынын кыскарышы (мисалы, буйрутманы иштетүү); кардарлардын канааттануусу (NPS); эмгек өндүрүмдүүлүгү; инвестициялардын өзүн актоосу (ROI, NPV, өзүн актоо мөөнөтү).<\/p>\n<p><strong>Таза келтирилген нарк<\/strong> NPV = Σ CFₜ / (1 + r)ᵗ − I₀, мында CFₜ — <em>t<\/em> жылдын акча агымы, <em>r<\/em> — дисконттоо ставкасы, I₀ — баштапкы инвестициялар. Эгер NPV &gt; 0 болсо, долбоор пайдалуу.<\/p>\n<h2>7. Тоскоолдуктар жана ийгилик факторлору<\/h2>\n<p><strong>Тоскоолдуктар<\/strong>: өзгөрүүлөргө каршылык; компетенциялардын жетишсиздиги; интеграциялоо кыйын болгон эскирген системалар; чектелген бюджет; жетекчиликтин колдоосунун жоктугу; чачыранды маалыматтар; коопсуздук тобокелдиктери.<\/p>\n<p><strong>Ийгилик факторлору<\/strong>: биринчи жетекчинин колдоосу; бизнес-максаттар менен байланышкан так стратегия; кардарга багытталуу; тез пилоттор жана өлчөнүүчү жыйынтыктар; адамдарга инвестициялар; сапаттуу маалыматтар; технологиялык компаниялар менен өнөктөштүк.<\/p>\n<blockquote>\n<p>Консалтингдик компаниялардын баалоолору боюнча трансформация программаларынын олуттуу үлүшү максаттарына жетпейт. Негизги себептер — техникалык эмес, уюштуруучулук жана маданий.<\/p>\n<\/blockquote>\n<h2>8. Трансформациянын мисалдары<\/h2>\n<ol type=\"1\">\n<li><strong>Netflix<\/strong> — DVD ижарасынан агымдык платформага жана көрүүчүлөр жөнүндө маалыматтардын негизинде өз контентин өндүрүүгө.<\/li>\n<li><strong>DBS Bank (Сингапур)<\/strong> — «технологиялык компания сыяктуу» иштөөгө өттү: булуттар, микросервистер, ийкемдүү командалар; дүйнөдөгү эң мыкты санариптик банктардын бирине айланды.<\/li>\n<li><strong>Domino’s Pizza<\/strong> — каалаган каналдар аркылуу буйрутма (тиркеме, мессенджерлер, акылдуу колонкалар), буйрутманы реалдуу убакытта көзөмөлдөө.<\/li>\n<li><strong>Логистикалык компаниялар<\/strong> — транспорттогу IoT-датчиктер жана маршруттарды ML менен оптималдаштыруу жеткирүү убактысын жана күйүүчү май сарпын кыскартат.<\/li>\n<\/ol>\n<p><strong>Кыргызстандагы санариптик трансформация.<\/strong> КРнын 2024–2028-жылдарга Санариптик трансформациянын концепциясы төмөнкү багыттарды аныктайт: санариптик мамлекет (электрондук кызматтар, «Түндүк» ведомстволор аралык өз ара аракеттенүү системасы), санариптик экономика, инфраструктураны жана санариптик көндүмдөрдү өнүктүрүү. Бизнесте — мобилдик банкинг жана QR-төлөмдөр, электрондук эсеп-фактуралар, онлайн-соода, байланыш операторлорунун санариптик кызматтары.<\/p>\n<h2>9. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Тааныш уюмдун санариптик жетилгендигин алты өлчөм боюнча (1–5) баалап, өнүктүрүүнүн артыкчылыктарын аныктаңыз.<\/li>\n<li>Чакан компания үчүн санариптик трансформациянын жол картасын даярдаңыз: максаттар, 3–4 долбоор, технологиялар, мөөнөттөр, KPI, тобокелдиктер.<\/li>\n<\/ol>\n<h2>10. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Санариптик трансформация санариптештирүүдөн эмнеси менен айырмаланат?<\/li>\n<li>Санариптик трансформациянын баскычтарын атаңыз.<\/li>\n<li>Кайсы технологиялар трансформация үчүн негизги болуп саналат?<\/li>\n<li>Санариптик жетилгендик деген эмне жана ал кантип бааланат?<\/li>\n<li>Трансформациянын натыйжасын баалоо үчүн кандай көрсөткүчтөр колдонулат?<\/li>\n<li>Эмне үчүн көптөгөн трансформациялар максаттарына жетпейт?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Санариптик трансформация · бизнес-модель · жол картасы · пилоттук долбоор · масштабдоо · санариптик жетилгендик · өзгөрүүлөрдү башкаруу · NPS · NPV · ROI · ийгилик факторлору.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Кыргыз Республикасынын 2024–2028-жылдарга Санариптик трансформациянын концепциясы. — cbd.minjust.gov.kg.<\/li>\n<li>Прохоров А., Коник Л. Цифровая трансформация: анализ, тренды, мировой опыт. — 2021.<\/li>\n<li>Фролов К. В. и др. Цифровые технологии : учеб. пособие. — СПб., 2024.<\/li>\n<\/ol>\n"}, {"id": "pz-1", "kind": "pz", "num": 1, "lec": 7, "title": "Азыркы бизнес-тренддер жана санариптик технологиялардын актуалдуулугу", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\nКейс-ыкма, топтук иш\n<\/p>\n<p>\nЖК-1, КК-1\n<\/p>\n<\/div>\n<h2>1. Сабактын максаты<\/h2>\n<p>Азыркы бизнес-тренддер жана санариптик технологиялардын ролу жөнүндө билимди бекемдөө; компаниянын көйгөйлөрүн талдоону жана негиздүү санариптик чечимдерди сунуштоону үйрөнүү.<\/p>\n<p><strong>Сабактан кийин студент<\/strong>: негизги бизнес-тренддерди жана технологияларды атай алат; бизнестин көйгөйүн ылайыктуу технология менен байланыштыра алат; альтернативалуу чечимдерди критерийлер боюнча салыштыра алат; киргизүүнүн тобокелдиктерин түзө алат.<\/p>\n<h2>2. Сабактын планы<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Баскыч<\/th>\n<th>Мазмуну<\/th>\n<th>Убакыт<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Кайталоо: тренддер жана технологиялар (ЖИ, чоң маалыматтар, IoT, булуттар, киберкоопсуздук, алыстан иштөө, жекелештирүү, электрондук коммерция)<\/td>\n<td>15 мүн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Топтордо «Буква» кейсин талдоо<\/td>\n<td>45 мүн<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Чечимдерди презентациялоо жана талкуу<\/td>\n<td>30 мүн<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. № 1 тапшырма. Тренддер жана технологиялар<\/h2>\n<p>Ар бир тренд үчүн компаниянын (дүйнөлүк же кыргызстандык) мисалын жана ал негизделген технологияны келтириңиз.<\/p>\n<div class=\"answer\" data-key=\"pz-1-a1\" data-label=\"Тренддер: жекелештирүү, омниканалдуулук, платформалар, алыстан иштөө, туруктуу өнүгүү — ар бири үчүн мисал жана технология\">\n\n<\/div>\n<h2>4. № 2 тапшырма. «Буква» кейси<\/h2>\n<blockquote>\n<p>«Буква» китеп дүкөндөрүнүн тармагы (Бишкекте жана Ошто 5 дүкөн) онлайн-дүкөндөрдүн жана электрондук китептердин өсүшүнөн улам эки жылда сатуунун 18 %га төмөндөшүнө туш болду. Сатып алуучулар — негизинен студенттер жана мектеп окуучуларынын ата-энелери. Онлайн-буйрутма берүүчү сайт жок, берилгендик программасы — кагаз карталар. Санариптештирүүгө бюджет чектелүү.<\/p>\n<\/blockquote>\n<p><strong>2.1. Диагностика.<\/strong> Сатуунун төмөндөшүнүн үч негизги себебин жана бул себептерди тастыктоо үчүн компанияга кандай маалыматтар керектигин аныктаңыз.<\/p>\n<div class=\"answer\" data-key=\"pz-1-a2\" data-label=\"Сатуунун төмөндөшүнүн себептери жана керектүү маалыматтар\">\n\n<\/div>\n<p><strong>2.2. Чечимдердин варианттары.<\/strong> Мүмкүн болгон багыттар: сунуштары, берилгендик программасы жана онлайн-буйрутмасы бар мобилдик тиркеме; жазылуу боюнча электрондук жана аудиокитептердин онлайн-платформасы; онлайн-иш-чаралар (авторлор менен жолугушуулар, адабий клубдар); социалдык тармактарда илгерилетүү жана таргеттелген жарнама; дүкөндөрдө толукталган чындык (мукабаны сканерлейсиң — пикирлерди жана үзүндүнү көрөсүң).<\/p>\n<p>Варианттарды көп критерийлүү баалоо моделинде баалаңыз. Критерийлердин салмактарын жана бааларды тобуңуздун пикирине ылайык өзгөртүңүз.<\/p>\n<div class=\"widget\" data-w=\"mca-pz1\">\n\n<\/div>\n<p><strong>2.3. Чечим.<\/strong> 2–3 чечимди тандап, тандооңузду негиздеңиз, киргизүүнүн тартибин жана күтүлгөн жыйынтыктарды (көрсөткүчтөрдү) сүрөттөңүз.<\/p>\n<div class=\"answer\" data-key=\"pz-1-a3\" data-label=\"Тандалган чечимдер, киргизүүнүн тартиби, күтүлгөн KPI\">\n\n<\/div>\n<p><strong>2.4. Тобокелдиктер.<\/strong> Тандалган чечимдер кандай тобокелдиктер менен байланышкан жана аларды кантип азайтса болот?<\/p>\n<div class=\"answer\" data-key=\"pz-1-a4\" data-label=\"Киргизүүнүн тобокелдиктери жана аларды азайтуу чаралары\">\n\n<\/div>\n<h2>5. Талкуу<\/h2>\n<ol type=\"1\">\n<li>Кайсы чечимдер тез натыйжа берет, кайсылары узак мөөнөттүү?<\/li>\n<li>Чакан компания ири онлайн-платформалар менен атаандаша алабы? Эмненин эсебинен?<\/li>\n<li>Эмне үчүн бизнести тренддерге ыңгайлаштыруу маанилүү, аларды сөзмө-сөз кайталоо эмес?<\/li>\n<\/ol>\n<div class=\"answer\" data-key=\"pz-1-a5\" data-label=\"Талкуунун жыйынтыгы боюнча корутундулар\">\n\n<\/div>\n<h2>6. Кошумча тапшырмалар<\/h2>\n<ul>\n<li>«Менин ишмердүүлүк чөйрөмдөгү санариптик трансформация» темасында <strong>эссе<\/strong> (1–2 бет).<\/li>\n<li><strong>Изилдөө<\/strong>: санариптик технологияларды ийгиликтүү киргизген конкреттүү компаниянын тажрыйбасын талдоо.<\/li>\n<\/ul>\n<h2>7. Баалоо критерийлери<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Критерий<\/th>\n<th>Баллдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Түшүнүктөрдүн жана мисалдардын тактыгы (1-тапшырма)<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Негиздүү диагностика (2.1)<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Туура көп критерийлүү баалоо (2.2)<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>KPI менен аргументтелген чечим (2.3)<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Тобокелдиктерди талдоо (2.4)<\/td>\n<td>1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}, {"id": "pz-2", "kind": "pz", "num": 2, "lec": 1, "title": "ИТ-индустриянын эволюциясы", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\nТоптук иш, оюн элементтери\n<\/p>\n<p>\nЖК-1, КК-1\n<\/p>\n<\/div>\n<h2>1. Сабактын максаты<\/h2>\n<p>ИТ-индустриянын өнүгүүсүнүн негизги баскычтарын үйрөнүү, технологиялык өзгөрүүлөрдүн бизнеске жана коомго таасирин түшүнүү, талдоо жана болжолдоо көндүмдөрүн өнүктүрүү.<\/p>\n<h2>2. Сабактын планы<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Баскыч<\/th>\n<th>Мазмуну<\/th>\n<th>Убакыт<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Мээ чабуулу: ИТ жөнүндө ойлогондо кандай технологиялар эсиңизге келет?<\/td>\n<td>15 мүн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>«Убакыт боюнча саякат»: топтор өз мезгили жөнүндө мини-презентация даярдашат<\/td>\n<td>45 мүн<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Талкуу жана «келечекке көз караш»<\/td>\n<td>30 мүн<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. № 1 тапшырма. Мээ чабуулу<\/h2>\n<p>Сиздин оюңуз боюнча ИТнин өнүгүшүн аныктаган 10 технологияны санап, аларды хронологиялык тартипте жайгаштырыңыз.<\/p>\n<div class=\"answer\" data-key=\"pz-2-a1\" data-label=\"Хронологиялык тартиптеги 10 негизги технология\">\n\n<\/div>\n<h2>4. № 2 тапшырма. Убакыт боюнча саякат<\/h2>\n<p>Ар бир мезгил боюнча таблицаны толтуруңуз: негизги технологиялар, окуялар жана адамдар, бизнеске жана коомго таасири.<\/p>\n<h4>1. 1950–1960-жылдар<\/h4>\n<p>\nНегизги технологиялар жана окуялар (ЭЭМ, программалоо тилдери)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nБизнеске жана коомго таасири\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>2. 1970–1980-жылдар<\/h4>\n<p>\nНегизги технологиялар жана окуялар (микропроцессор, ЖК, ARPANET)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nБизнеске жана коомго таасири\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>3. 1990-жылдар<\/h4>\n<p>\nНегизги технологиялар жана окуялар (WWW, браузерлер, мобилдик телефондор)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nБизнеске жана коомго таасири\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f6\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>4. 2000-жылдар<\/h4>\n<p>\nНегизги технологиялар жана окуялар (издөө системалары, соцтармактар, смартфондор)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f7\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nБизнеске жана коомго таасири\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f8\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>5. 2010-жылдар – азыркы мезгил<\/h4>\n<p>\nНегизги технологиялар жана окуялар (булуттар, чоң маалыматтар, ЖИ, IoT)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f9\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nБизнеске жана коомго таасири\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f10\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>5. № 3 тапшырма. Тенденциялар<\/h2>\n<p>ИТнин өнүгүшүндө кандай аягына чейинки тенденциялар байкалат (эсептөөлөрдүн наркы, түзүлүштөрдүн өлчөмү, колдонуучулардын саны, байланыштын ылдамдыгы)? Таблицадан далилдерди келтириңиз.<\/p>\n<div class=\"answer\" data-key=\"pz-2-a2\" data-label=\"ИТ өнүгүүсүнүн аягына чейинки тенденциялары мисалдары менен\">\n\n<\/div>\n<h2>6. № 4 тапшырма. Келечекке көз караш<\/h2>\n<p>Кийинки 10–20 жылда ИТнин өнүгүшүн кайсы үч технология аныктайт? Алар сиздин келечектеги кесибиңизди кантип өзгөртөт?<\/p>\n<div class=\"answer\" data-key=\"pz-2-a3\" data-label=\"Болжол: келечектин үч технологиясы жана алардын кесипке таасири\">\n\n<\/div>\n<h2>7. Кошумча тапшырмалар<\/h2>\n<ul>\n<li>«ИТнин менин кесибиме таасири» темасында <strong>эссе<\/strong>.<\/li>\n<li>Бир технологиянын тарыхы боюнча <strong>инфографика<\/strong> (интернет, мобилдик байланыш, жасалма интеллект).<\/li>\n<\/ul>\n<h2>8. Баалоо критерийлери<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Критерий<\/th>\n<th>Баллдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Мезгилдер таблицасынын толуктугу жана тактыгы<\/td>\n<td>4<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Тенденцияларды талдоо<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Негиздүү болжол<\/td>\n<td>3<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}, {"id": "pz-3", "kind": "pz", "num": 3, "lec": 8, "title": "Корпоративдик маалыматтык системалар", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\nКейстер, топтук иш\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Сабактын максаты<\/h2>\n<p>Корпоративдик маалыматтык системалардын (КМС) түрлөрү, алардын функциялары жана артыкчылыктары менен таанышуу; бизнестин муктаждыктарын талдоону жана ылайыктуу системаны тандоону үйрөнүү.<\/p>\n<h2>2. Кыскача теория<\/h2>\n<p><strong>КМС<\/strong> — ишкананын ресурстарын жана процесстерин башкарууну автоматташтырган интеграцияланган маалыматтык система.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Класс<\/th>\n<th>Функциялары<\/th>\n<th>Мисалдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>ERP<\/td>\n<td>Бирдиктүү базада финансы, сатып алуу, кампа, өндүрүш, сатуу, персонал<\/td>\n<td>SAP, Oracle, Microsoft Dynamics, 1С:ERP, Odoo<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CRM<\/td>\n<td>Кардарлар жөнүндө маалыматты чогултуу жана талдоо, сатууну жана маркетингди автоматташтыруу, кардарларды колдоо<\/td>\n<td>Salesforce, Bitrix24, amoCRM<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SCM<\/td>\n<td>Пландоо, сатып алуу, өндүрүш, бөлүштүрүү, кайтаруулар<\/td>\n<td>SAP SCM, Oracle SCM Cloud<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>HRM<\/td>\n<td>Персоналды тандоо, эсепке алуу, окутуу, баалоо<\/td>\n<td>SAP SuccessFactors, 1С:ЗУП<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>BI<\/td>\n<td>Отчёттуулук жана аналитика<\/td>\n<td>Power BI, Tableau<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>КМСтин артыкчылыктары: чачыранды таблицалардын ордуна бирдиктүү маалымат базасы; автоматташтыруу; ачык-айкындуулук; чыгымдарды кыскартуу; негиздүү чечимдер.<\/p>\n<h2>3. № 1 тапшырма. Классификация<\/h2>\n<p>Ар бир милдетти КМСтин кайсы классы чечерин аныктаңыз: (а) менеджер кардар акыркы жолу качан чалганын билбейт; (б) бухгалтерия менен кампа калдыктар жөнүндө ар башка маалыматтарды жүргүзөт; (в) чийки зат кечигип келет; (г) жетекчи филиалдар боюнча сатууну реалдуу убакытта көрбөйт; (д) кадрдык эсеп Excelде жүргүзүлөт.<\/p>\n<div class=\"answer\" data-key=\"pz-3-a1\" data-label=\"а–д милдеттери үчүн КМС классы түшүндүрмөсү менен\">\n\n<\/div>\n<h2>4. № 2 тапшырма. Компаниялардын кейстери<\/h2>\n<p>Ар бир топ бир компанияны алат.<\/p>\n<blockquote>\n<p><strong>А компаниясы.<\/strong> Эмерек фабрикасы (120 кызматкер): буйрутмалар телефон аркылуу кабыл алынат, материалдардын бар-жогу кол менен текшерилет, даярдоо мөөнөттөрү бузулат.<\/p>\n<p><strong>Б компаниясы.<\/strong> Дарыканалар тармагы (15 түйүн): препараттардын тез-тез жетишсиздиги жана ашыкчасы, мөөнөтү өткөн калдыктар.<\/p>\n<p><strong>В компаниясы.<\/strong> Жеке тил мектеби (800 студент): кардарлардын бирдиктүү базасы жок, курстарды кайра сатуу төмөн, сайттан келген арыздар жоголот.<\/p>\n<\/blockquote>\n<p><strong>2.1.<\/strong> Компанияңыздын абалын талдаңыз: көйгөйлөр, алардын себептери, тиешелүү процесстер.<\/p>\n<div class=\"answer\" data-key=\"pz-3-a2\" data-label=\"Компаниянын көйгөйлөрүн талдоо\">\n\n<\/div>\n<p><strong>2.2.<\/strong> КМСтин кайсы классы керектигин аныктап, тандооңузду негиздеңиз. Биринчи кезекте кайсы модулдар керек болот?<\/p>\n<div class=\"answer\" data-key=\"pz-3-a3\" data-label=\"КМС классын жана модулдарды негиздеме менен тандоо\">\n\n<\/div>\n<p><strong>2.3.<\/strong> Үч конкреттүү системаны критерийлер боюнча салыштырыңыз. Моделдеги салмактарды жана бааларды өзгөртүңүз.<\/p>\n<div class=\"widget\" data-w=\"mca-pz3\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-3-a4\" data-label=\"Системанын акыркы тандоосу жана аргументтер\">\n\n<\/div>\n<h2>5. № 3 тапшырма. Киргизүү<\/h2>\n<p>Тандалган системаны киргизүүнүн баскычтарын (изилдөө, жөндөө, маалыматтарды көчүрүү, окутуу, ишке киргизүү, колдоо) жана үч негизги татаалдыкты сүрөттөңүз.<\/p>\n<div class=\"answer\" data-key=\"pz-3-a5\" data-label=\"Киргизүүнүн баскычтары жана татаалдыктар\">\n\n<\/div>\n<h2>6. Талкуу үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>КМСти тандоого кандай факторлор таасир этет (өлчөмү, тармагы, бюджети, муктаждыктары)?<\/li>\n<li>Чакан бизнес үчүн булуттук КМСтин артыкчылыктары кандай?<\/li>\n<li>ЖИ жана чоң маалыматтар КМСти кантип өзгөртөт?<\/li>\n<\/ol>\n<h2>7. Кошумча тапшырмалар<\/h2>\n<ul>\n<li>КМСтердин бири (ERP, CRM же SCM) жөнүндө кыскача баяндама даярдоо.<\/li>\n<li>Кыргызстандын бир тармагындагы КМС рыногун талдоо.<\/li>\n<\/ul>\n"}, {"id": "pz-4", "kind": "pz", "num": 4, "lec": 8, "title": "Ишкананын архитектурасынын методологиясы", "html": "<div class=\"meta\">\n<p>\n4 академиялык саат (2 сабак)\n<\/p>\n<p>\nМоделдөө, топтук иш\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Сабактын максаты<\/h2>\n<p>Ишкананын архитектурасы түшүнүгүн, анын деңгээлдерин жана методологияларын (TOGAF, Zachman) өздөштүрүү; компаниянын бизнес-максаттарынан технологияларга чейинки жөнөкөйлөтүлгөн архитектуралык моделин курууну үйрөнүү.<\/p>\n<p><strong>Программалык камсыздоо<\/strong>: draw.io (diagrams.net), Archi (ArchiMate), Bizagi Modeler же Microsoft Visio.<\/p>\n<h2>2. 1-сабак. Теориялык негиз<\/h2>\n<p><strong>Архитектуранын деңгээлдери<\/strong>: бизнес-архитектура (максаттар, процесстер, түзүм, эрежелер) → маалыматтардын архитектурасы → тиркемелердин архитектурасы → технологиялык архитектура (жабдуу, тармактар, булуттар, коопсуздук).<\/p>\n<p><strong>TOGAF ADM<\/strong>: алдын ала фаза → A. Көрүнүш → B. Бизнес-архитектура → C. Маалыматтык системалардын архитектурасы → D. Технологиялык архитектура → E. Мүмкүнчүлүктөр жана чечимдер → F. Миграцияны пландоо → G. Киргизүүнү башкаруу → H. Өзгөрүүлөрдү башкаруу; борборунда — талаптарды башкаруу.<\/p>\n<p><strong>№ 1 тапшырма.<\/strong> Компанияга ишкананын архитектурасы эмне үчүн керек экенин жана ансыз кандай көйгөйлөр пайда болорун өз сөзүңүз менен түшүндүрүңүз.<\/p>\n<div class=\"answer\" data-key=\"pz-4-a1\" data-label=\"Ишкананын архитектурасынын арналышы жана ал жок болгондогу көйгөйлөр\">\n\n<\/div>\n<p><strong>№ 2 тапшырма.<\/strong> TOGAF менен Zachman Frameworkту салыштырыңыз: бул процессби же классификациябы, күчтүү жактары, качан колдонуу керек.<\/p>\n<div class=\"answer\" data-key=\"pz-4-a2\" data-label=\"TOGAF жана Zachmanды салыштыруу\">\n\n<\/div>\n<h2>3. 2-сабак. Кейс: интернет-дүкөндүн архитектурасы<\/h2>\n<blockquote>\n<p>«ТехноДом» тиричилик техникасынын интернет-дүкөнү (Бишкек) сайт жана Instagram аркылуу сатат, кампасы жана курьердик кызматы бар. Instagramдан келген буйрутмалар кол менен таризделет, сайттагы калдыктар кампа менен дал келбейт, кардарлар жеткирүү жөнүндө маалыматтын жоктугуна нааразы. Максат — бир жылдын ичинде онлайн-сатууну 40 %га көбөйтүү жана жеткирүү убактысын 1 күнгө чейин кыскартуу.<\/p>\n<\/blockquote>\n<p>Архитектуралык сүрөттөмөнү ADM баскычтары боюнча толтуруңуз.<\/p>\n<h4>A. Архитектуранын көрүнүшү<\/h4>\n<p>\nБизнес-максаттар жана өлчөнүүчү көрсөткүчтөр\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nКызыкдар тараптар жана алардын талаптары\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>B. Бизнес-архитектура<\/h4>\n<p>\nНегизги бизнес-процесстер (буйрутманы кабыл алуу, төлөм, комплекттөө, жеткирүү, кайтаруу)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nУюштуруучулук түзүм жана ролдор\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>C. Маалыматтардын жана тиркемелердин архитектурасы<\/h4>\n<p>\nНегизги маалыматтар (кардарлар, товарлар, буйрутмалар, калдыктар) жана алар кайда сакталат\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nТиркемелер жана алардын интеграциясы (сайт, CRM, кампа системасы, төлөм кызматы)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f6\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>D. Технологиялык архитектура<\/h4>\n<p>\nИнфраструктура: хостинг же булут, тармактар, коопсуздук\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f7\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>E–F. Чечимдер жана миграция планы<\/h4>\n<p>\nAS-IS менен TO-BE ортосундагы ажырым жана аны жоюу үчүн долбоорлор\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f8\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nБаскычтар жана мөөнөттөр боюнча өтүү планы\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f9\" rows=\"3\"><\/textarea>\n<\/p>\n<p><strong>№ 3 тапшырма.<\/strong> draw.io же Archi программасында «ТехноДомдун» архитектурасынын төрт деңгээлинин схемасын түзүп, деңгээлдердин ортосундагы байланыштарды сүрөттөңүз.<\/p>\n<div class=\"answer\" data-key=\"pz-4-a3\" data-label=\"Архитектура схемасынын жана деңгээлдердин ортосундагы байланыштардын сүрөттөмөсү\">\n\n<\/div>\n<h2>4. Талкуу<\/h2>\n<ol type=\"1\">\n<li>Ишкананын архитектурасын иштеп чыгууда кандай татаалдыктар пайда болот?<\/li>\n<li>Ишкананын архитекторунун ролу кандай?<\/li>\n<li>Микросервистер жана булуттар архитектурага кандай таасир этет?<\/li>\n<\/ol>\n<h2>5. Кошумча тапшырмалар<\/h2>\n<ul>\n<li>Тандалган методология (TOGAF, Zachman, FEA) жөнүндө презентация.<\/li>\n<li>Ачык булактар боюнча реалдуу ишкананын архитектурасын талдоо.<\/li>\n<\/ul>\n"}, {"id": "pz-5", "kind": "pz", "num": 5, "lec": 12, "title": "Буюмдар интернети (IoT)", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\nТалдоо жана долбоорлоо\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Сабактын максаты<\/h2>\n<p>Буюмдар интернетинин архитектурасы жана компоненттери жөнүндө билимди бекемдөө; даяр IoT-чечимдерди талдоону жана экономикалык натыйжаны эсептөө менен жөнөкөй IoT-системаны долбоорлоону үйрөнүү.<\/p>\n<h2>2. Сабактын планы<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Баскыч<\/th>\n<th>Мазмуну<\/th>\n<th>Убакыт<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Кайталоо: компоненттер, архитектуранын деңгээлдери, протоколдор<\/td>\n<td>20 мүн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Даяр IoT-чечимди талдоо<\/td>\n<td>25 мүн<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>IoT-системаны долбоорлоо жана натыйжаны эсептөө<\/td>\n<td>45 мүн<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. № 1 тапшырма. IoT-чечимди талдоо<\/h2>\n<p>Бир чечимди тандаңыз: акылдуу үй, үй жаныбарлары үчүн трекер, фитнес-билерик, электр энергиясынын акылдуу эсептегичи, жылуу жайды сугаруу системасы. Аны архитектуранын деңгээлдери боюнча сүрөттөңүз.<\/p>\n<h4>Тандалган чечим<\/h4>\n<p>\nЧечимдин аталышы жана арналышы\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-5-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nТүзүлүштөр деңгээли: датчиктер жана аткаруучу түзүлүштөр\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-5-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nТармактык деңгээл: байланыш технологиясы жана протокол\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-5-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nИштетүү деңгээли: маалыматтар сакталган жана талданган платформа\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-5-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nТиркемелер деңгээли: колдонуучу эмнени көрөт жана эмне кыла алат\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-5-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<div class=\"answer\" data-key=\"pz-5-a1\" data-label=\"Чечимдин артыкчылыктары жана кемчиликтери, коопсуздук тобокелдиктери\">\n\n<\/div>\n<h2>4. № 2 тапшырма. Долбоор: температураны жана нымдуулукту мониторингдөө<\/h2>\n<blockquote>\n<p>Университеттин сервер бөлмөсүндө жана эки окуу лабораториясында температураны (ченеми 18–24 °C) жана нымдуулукту (40–60 %) көзөмөлдөө керек. Чектен чыкканда жооптуу адам Telegramдан билдирүү алышы керек, ал эми кондиционер автоматтык түрдө күйүшү керек.<\/p>\n<\/blockquote>\n<p><strong>2.1.<\/strong> Компоненттерди тандаңыз: датчиктер (мисалы, DHT22, BME280), микроконтроллер (ESP32, Arduino + Wi-Fi), байланыш технологиясы, платформа (ThingSpeak, Blynk, Home Assistant), аткаруучу түзүлүш.<\/p>\n<div class=\"answer\" data-key=\"pz-5-a2\" data-label=\"Компоненттердин курамы тандоонун негиздемеси менен\">\n\n<\/div>\n<p><strong>2.2.<\/strong> Системанын иштөө алгоритмин кадамдар боюнча сүрөттөңүз (өлчөө → берүү → шартты текшерүү → аракет → журнал).<\/p>\n<div class=\"answer\" data-key=\"pz-5-a3\" data-label=\"Системанын иштөө алгоритми\">\n\n<\/div>\n<p><strong>2.3.<\/strong> Кандай коопсуздук чаралары керек (сырсөздөр, шифрлөө, жаңыртуулар, обочолонгон тармак)?<\/p>\n<div class=\"answer\" data-key=\"pz-5-a4\" data-label=\"IoT-системанын коопсуздук чаралары\">\n\n<\/div>\n<h2>5. № 3 тапшырма. Акылдуу жарыктын экономикалык натыйжасы<\/h2>\n<p>Компания кеңседе кыймыл жана жарыктык датчиктерин орнотууну пландап жатат. Электр энергиясын үнөмдөөнү жана өзүн актоо мөөнөтүн баалаңыз. Өз вариантыңыздын маалыматтарын коюңуз.<\/p>\n<div class=\"widget\" data-w=\"iot\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-5-a5\" data-label=\"Корутунду: киргизүү пайдалуубу, кайсы шарттарда ал тезирээк актайт\">\n\n<\/div>\n<h2>6. Кошумча тапшырмалар<\/h2>\n<ul>\n<li>Кыргызстандын бир тармагында (айыл чарбасы, энергетика, ТКЧ) IoTнин келечеги жөнүндө баяндама.<\/li>\n<li>Жаңы IoT-түзүлүштүн же кызматтын концепциясы.<\/li>\n<\/ul>\n"}, {"id": "pz-6", "kind": "pz", "num": 6, "lec": 5, "title": "Чечим кабыл алууну колдоо жана маалыматтарды интеллектуалдык талдоо", "html": "<div class=\"meta\">\n<p>\n4 академиялык саат (2 сабак)\n<\/p>\n<p>\nМоделдер жана маалыматтар менен иштөө\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Сабактын максаты<\/h2>\n<p>Чечим кабыл алууну колдоо системалары (ЧКСС) жана маалыматтарды интеллектуалдык талдоо (Data Mining) ыкмалары менен таанышуу; көп критерийлүү баалоону колдонууну жана классификациялык моделдин сапатын баалоону үйрөнүү.<\/p>\n<h2>2. Кыскача теория<\/h2>\n<p><strong>ЧКСС<\/strong> — чечим кабыл алуучу адамга маалыматтарды талдоого, сценарийлерди моделдөөгө жана альтернативаларды салыштырууга жардам берген компьютердик система. Түрлөрү: маалыматтар менен башкарылуучу (BI, OLAP), моделдер менен башкарылуучу (оптималдаштыруу, көп критерийлүү талдоо), билим менен башкарылуучу (эксперттик системалар).<\/p>\n<p><strong>Чечим кабыл алуунун баскычтары (Г. Саймон боюнча)<\/strong>: көйгөйдү түшүнүү → альтернативаларды долбоорлоо → тандоо → ишке ашыруу жана көзөмөл.<\/p>\n<p><strong>Data Mining<\/strong> — чоң көлөмдөгү маалыматтардан жашыруун мыйзам ченемдүүлүктөрдү издөө. Ыкмалары: классификация (чечимдер дарактары, логистикалык регрессия, SVM); регрессия; кластерлөө (k-means, иерархиялык); ассоциацияларды издөө (Apriori). Процесстин стандарты — <strong>CRISP-DM<\/strong>: бизнести түшүнүү → маалыматтарды түшүнүү → даярдоо → моделдөө → баалоо → киргизүү.<\/p>\n<h2>3. 1-сабак. Көп критерийлүү тандоо<\/h2>\n<blockquote>\n<p>Супермаркеттер тармагы аналитика системасынын жеткирүүчүсүн тандап жатат. Альтернативалар: Power BI (булут), Tableau, Python менен өз алдынча иштеп чыгуу. Критерийлер: ээлик кылуу наркы, функционалдуулук, кызматкерлер үчүн жөнөкөйлүгү, киргизүү ылдамдыгы, маалыматтардын коопсуздугу.<\/p>\n<\/blockquote>\n<p><strong>№ 1 тапшырма.<\/strong> Критерийлердин салмактарын финансы директорунун атынан жана ИТ-директордун атынан аныктаңыз. Жыйынтыкты салыштырыңыз.<\/p>\n<div class=\"widget\" data-w=\"mca-pz6\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-6-a1\" data-label=\"Ар кандай салмактарда чечим кантип өзгөрөт; кайсы вариант туруктуу эң жакшы\">\n\n<\/div>\n<p><strong>№ 2 тапшырма.<\/strong> Эмне үчүн ЧКСС жетекчини алмаштырбай турганын жана салмактанган сумма ыкмасынын кандай чектөөлөрү бар экенин түшүндүрүңүз.<\/p>\n<div class=\"answer\" data-key=\"pz-6-a2\" data-label=\"ЧКССтеги адамдын ролу жана ыкманын чектөөлөрү\">\n\n<\/div>\n<h2>4. 2-сабак. Кейс: кардарлардын кетишин болжолдоо<\/h2>\n<blockquote>\n<p>Интернет-провайдер «кардар кийинки айда кетет / кетпейт» классификация моделин курду. 1000 кардардан турган тесттик тандоодо модель төмөндөгү каталар матрицасында көрсөтүлгөн жыйынтыктарды берди.<\/p>\n<\/blockquote>\n<p><strong>№ 3 тапшырма.<\/strong> Сапат метрикаларын эсептеп, аларды чечмелеңиз. Матрицанын маанилерин өзгөртүп, метрикалар кантип өзгөрөрүн караңыз.<\/p>\n<div class=\"widget\" data-w=\"cm\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-6-a3\" data-label=\"accuracy, precision, recall, F1 чечмелөө; моделдин сапаты бизнес үчүн жетиштүүбү\">\n\n<\/div>\n<p><strong>№ 4 тапшырма.<\/strong> Кармап калуу бөлүмү үчүн кетип жаткан кардарды жоготкондон көрө ашыкча кардарга чалуу арзаныраак. Кайсы метриканы жогорулатуу маанилүү — precisionбу же recallбы? Эмне үчүн?<\/p>\n<div class=\"answer\" data-key=\"pz-6-a4\" data-label=\"Артыкчылыктуу метриканы негиздеме менен тандоо\">\n\n<\/div>\n<p><strong>№ 5 тапшырма.<\/strong> Менеджментке сунуштарды түзүңүз: тобокелдик тобундагы кардарлар үчүн кандай аракеттерди көрүү керек, натыйжаны кантип өлчөө керек.<\/p>\n<div class=\"answer\" data-key=\"pz-6-a5\" data-label=\"Чечим кабыл алуу үчүн сунуштар\">\n\n<\/div>\n<p><strong>№ 6 тапшырма.<\/strong> Ар бир милдет үчүн Data Mining ыкмасын көрсөтүңүз: таргеттелген жарнама үчүн кардарларды сегменттөө; базар себетин талдоо; насыя тобокелдигин баалоо; сатуунун көлөмүн болжолдоо.<\/p>\n<div class=\"answer\" data-key=\"pz-6-a6\" data-label=\"Милдеттердин жана Data Mining ыкмаларынын шайкештиги\">\n\n<\/div>\n<h2>5. Талкуу<\/h2>\n<ol type=\"1\">\n<li>Data Miningдин этикалык аспекттери: жеке маалыматтар, басмырлоо.<\/li>\n<li>ЧКССтин тренддери: чоң маалыматтар, ЖИ, булуттар.<\/li>\n<\/ol>\n<h2>6. Кошумча тапшырмалар<\/h2>\n<ul>\n<li>Реалдуу компанияда Data Miningди колдонуунун мисалын табуу.<\/li>\n<li>Бир милдет үчүн Data Miningдин эки ыкмасын салыштыруу.<\/li>\n<\/ul>\n"}, {"id": "pz-7", "kind": "pz", "num": 7, "lec": 11, "title": "Моделдөө жана мультиагенттик системалар", "html": "<div class=\"meta\">\n<p>\n4 академиялык саат (2 сабак)\n<\/p>\n<p>\nМоделдөө, топтук иш\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Сабактын максаты<\/h2>\n<p>Мультиагенттик системалардын (МАС) концепциясы, алардын принциптери, архитектурасы жана колдонуу тармактары менен таанышуу; агенттерди, алардын максаттарын жана өз ара аракеттенүүсүн сүрөттөөнү, МАСтын артыкчылыктарын жана чектөөлөрүн баалоону үйрөнүү.<\/p>\n<h2>2. Кыскача теория<\/h2>\n<p><strong>Моделдөө<\/strong> — объектти анын моделинде изилдөө. Имитациялык моделдөөнүн түрлөрү: системалык динамика (агымдар жана топтоочулар), дискреттик-окуялык (кезектер, процесстер), <strong>агенттик<\/strong> (көптөгөн өз алдынча катышуучулардын жүрүм-туруму).<\/p>\n<p><strong>Агент<\/strong> — чөйрөнү кабыл алган, өз алдынча аракеттенген жана өз максатына умтулган программалык (же физикалык) нерсе. Агенттин касиеттери: <em>автономдуулук<\/em> (туруктуу башкаруусуз аракеттенет), <em>реактивдүүлүк<\/em> (чөйрөнүн өзгөрүүлөрүнө жооп кайтарат), <em>проактивдүүлүк<\/em> (максат үчүн өзү демилге көтөрөт), <em>социалдуулук<\/em> (башка агенттер менен өз ара аракеттенет).<\/p>\n<p><strong>Мультиагенттик система (МАС)<\/strong> — бир агент же борборлоштурулган программа чечүүсү кыйын болгон милдетти чечкен көптөгөн өз ара аракеттенген агенттерден турган система.<\/p>\n<p>Агенттердин түрлөрү: реактивдүү («шарт → аракет» эрежеси), үйрөнүүчү, максатка багытталган (BDI — ишенимдер, каалоолор, ниеттер). Өз ара аракеттенүүнүн формалары: кооперация, атаандаштык, сүйлөшүүлөр (аукциондор, Contract Net протоколу).<\/p>\n<p>Куралдар: AnyLogic, NetLogo, Mesa (Python), JADE (Java).<\/p>\n<h2>3. 1-сабак. Айланабыздагы агенттер<\/h2>\n<p><strong>№ 1 тапшырма.<\/strong> Турмуштан жана техникадан МАСтын үч мисалын келтириңиз (дрондордун тобу, кампадагы роботтор, биржадагы соода роботтору, светофорлорду башкаруу, айдоочусуз автомобилдер). Ар бири үчүн агенттерди, алардын максаттарын жана өз ара аракеттенүү ыкмасын көрсөтүңүз.<\/p>\n<div class=\"answer\" data-key=\"pz-7-a1\" data-label=\"МАСтын үч мисалы: агенттер, максаттар, өз ара аракеттенүү\">\n\n<\/div>\n<p><strong>№ 2 тапшырма.<\/strong> Такси диспетчерлөөнүн мисалында борборлоштурулган башкарууну жана МАСты салыштырыңыз: ишенимдүүлүк, масштабдалуучулук, жооп кайтаруу ылдамдыгы, татаалдык.<\/p>\n<div class=\"answer\" data-key=\"pz-7-a2\" data-label=\"Борборлоштурулган мамиле менен МАСты салыштыруу\">\n\n<\/div>\n<h2>4. 2-сабак. Модель долбоору: интернет-дүкөндүн кампасы<\/h2>\n<blockquote>\n<p>Кампада 20 чогултуучу робот иштейт. Буйрутмалар бир калыпта эмес келип түшөт; роботтор тапшырмаларды бөлүштүрүшү, бири-бирин айланып өтүшү, өз убагында кубатталышы керек. Максат — буйрутманы 15 мүнөттө чогултуу.<\/p>\n<\/blockquote>\n<h4>Агенттердин сүрөттөмөсү<\/h4>\n<p>\nАгенттердин түрлөрү (робот, буйрутма, кубаттоо станциясы, диспетчер) жана алардын максаттары\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-7-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nАр бир агент эмнени кабыл алат (датчиктер, билдирүүлөр)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-7-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nАгенттердин аракеттери жана жүрүм-турум эрежелери\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-7-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nӨз ара аракеттенүү протоколу: буйрутмалар кантип бөлүштүрүлөт (мисалы, аукцион)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-7-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p><strong>№ 3 тапшырма.<\/strong> Моделде кандай көрсөткүчтөрдү өлчөйсүз (чогултуунун орточо убактысы, роботтордун жүктөлүшү, кубаттоого кезек) жана кандай эксперименттерди жүргүзөсүз («роботтор 20 эмес, 15 болсочу?»)?<\/p>\n<div class=\"answer\" data-key=\"pz-7-a3\" data-label=\"Моделдин көрсөткүчтөрү жана эксперименттердин планы\">\n\n<\/div>\n<p><strong>№ 4 тапшырма.<\/strong> Бул кампа үчүн МАСтын артыкчылыктарын жана чектөөлөрүн баалаңыз.<\/p>\n<div class=\"answer\" data-key=\"pz-7-a4\" data-label=\"МАСтын артыкчылыктары жана чектөөлөрү\">\n\n<\/div>\n<h2>5. Талкуу<\/h2>\n<ol type=\"1\">\n<li>МАС Кыргызстанда кайда колдонулат же колдонулушу мүмкүн?<\/li>\n<li>МАС ЖИ жана буюмдар интернети менен кантип байланышкан?<\/li>\n<\/ol>\n<h2>6. Кошумча тапшырмалар<\/h2>\n<ul>\n<li>NetLogoдо даяр моделди ишке киргизип (мисалы, «Wolf Sheep Predation»), агенттерди жана эрежелерди сүрөттөө.<\/li>\n<li>Логистикада же энергетикада МАСты колдонуу жөнүндө реферат.<\/li>\n<\/ul>\n"}, {"id": "pz-8", "kind": "pz", "num": 8, "lec": 11, "title": "Машиналык окутуу", "html": "<div class=\"meta\">\n<p>\n4 академиялык саат (8–9-сабактар)\n<\/p>\n<p>\nЭсептөө иши, кейс\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Сабактын максаты<\/h2>\n<p>Машиналык окутуунун негизги түшүнүктөрүн бекемдөө; ML милдетин коюуну, окутуунун түрүн жана алгоритмди тандоону, жөнөкөй регрессиялык болжол моделин курууну жана анын сапатын баалоону үйрөнүү.<\/p>\n<h2>2. Сабактардын планы<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Баскыч<\/th>\n<th>Мазмуну<\/th>\n<th>Убакыт<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Кайталоо: окутуунун түрлөрү, милдеттер, алгоритмдер, метрикалар<\/td>\n<td>20 мүн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Бизнес-кырдаалдар үчүн ML милдеттерин коюу<\/td>\n<td>25 мүн<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Сатуунун болжол модели: сызыктуу регрессия<\/td>\n<td>60 мүн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>Кейс: интернет-дүкөндө суроо-талапты болжолдоо<\/td>\n<td>45 мүн<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5<\/td>\n<td>Жыйынтыктоо<\/td>\n<td>30 мүн<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. № 1 тапшырма. Милдеттерди коюу<\/h2>\n<p>Ар бир кырдаал үчүн окутуунун түрүн (мугалим менен / мугалимсиз / бекемдөө менен), милдеттин түрүн (регрессия / классификация / кластерлөө) жана мүмкүн болгон алгоритмди аныктаңыз:<\/p>\n<p>(а) банк насыя берүү-бербөөнү чечет; (б) дүкөн сатып алуучуларды топторго бөлөт; (в) такси-кызмат сапардын убактысын болжолдойт; (г) почта спамды бөлүп алат; (д) программа шахмат ойногонду үйрөнөт; (е) завод станоктун мүнөздүү эмес титирөөсүн аныктайт.<\/p>\n<div class=\"answer\" data-key=\"pz-8-a1\" data-label=\"а–е кырдаалдары үчүн окутуунун түрү, милдеттин түрү жана алгоритм\">\n\n<\/div>\n<h2>4. № 2 тапшырма. Сатуунун болжол модели<\/h2>\n<p>Дүкөн 8 ай бою жарнамага чыгымдарды (<em>x<\/em>, миң сом) жана сатууну (<em>y<\/em>, миң сом) жазып келген. Модель эң кичине квадраттар ыкмасы менен <em>y = a + b·x<\/em> сызыктуу регрессиясын курат.<\/p>\n<div class=\"widget\" data-w=\"linreg\">\n\n<\/div>\n<p><strong>2.1.<\/strong> Алынган теңдемени жазып, <em>a<\/em> жана <em>b<\/em> коэффициенттеринин маанисин түшүндүрүңүз.<\/p>\n<div class=\"answer\" data-key=\"pz-8-a2\" data-label=\"Регрессия теңдемеси жана коэффициенттердин мааниси\">\n\n<\/div>\n<p><strong>2.2.<\/strong> Моделдин сапатын R², MAE жана RMSE боюнча баалаңыз. Болжолго ишенүүгө болобу?<\/p>\n<div class=\"answer\" data-key=\"pz-8-a3\" data-label=\"Моделдин сапатын баалоо\">\n\n<\/div>\n<p><strong>2.3.<\/strong> Маалыматтарга «чыгып калуучу маанини» кошуңуз (мисалы, майрамы бар ай: жарнама 20, сатуу 400). Коэффициенттер жана метрикалар кантип өзгөрдү? Бул маалыматтарды даярдоо жөнүндө эмнени айтат?<\/p>\n<div class=\"answer\" data-key=\"pz-8-a4\" data-label=\"Чыгып калуучу маанинин моделге таасири\">\n\n<\/div>\n<p><strong>2.4.<\/strong> Жарнамага чыгымдар 45 миң сом болгондо сатуунун болжолун жасаңыз. Эмне үчүн бар маалыматтардын чегинен алыс (мисалы, 200 миң болгондо) болжолдоо коркунучтуу?<\/p>\n<div class=\"answer\" data-key=\"pz-8-a5\" data-label=\"Болжол жана экстраполяциянын чектөөлөрү\">\n\n<\/div>\n<h2>5. № 3 тапшырма. Кейс: суроо-талапты болжолдоо<\/h2>\n<blockquote>\n<p>Интернет-дүкөн кампада жетишсиздикке жана ашыкчага жол бербөө үчүн кийинки айда товарларга суроо-талапты болжолдогусу келет.<\/p>\n<\/blockquote>\n<p>\nКандай маалыматтар керек (сатуунун тарыхы, мезгилдүүлүк, баалар, арзандатуулар, майрамдар, аба ырайы)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-8-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nОкутуунун түрү жана милдеттин түрү\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-8-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nТалапкер алгоритмдер (сызыктуу регрессия, чечимдер дарагы, градиенттик бустинг)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-8-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nМаалыматтарды кантип бөлүү жана тактыкты баалоо (MAE, RMSE)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-8-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nМодель бизнесте кантип колдонулат жана аны жаңыртууга ким жооп берет\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-8-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>6. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Окутуучу жана тесттик тандоолор деген эмне жана аларды эмне үчүн бөлүү керек?<\/li>\n<li>Ашыкча окутуу деген эмне жана аны кантип аныктоого болот?<\/li>\n<li>MAE RMSEден эмнеси менен айырмаланат?<\/li>\n<\/ol>\n<h2>7. Кошумча тапшырмалар<\/h2>\n<ul>\n<li>Регрессияны Excelде (НАКЛОН, ОТРЕЗОК, КВПИРСОН функциялары) же Pythonдо (scikit-learn) кайра эсептеп, жыйынтыктарды салыштыруу.<\/li>\n<li>Kaggle Learn «Intro to Machine Learning» акысыз курсун өтүү.<\/li>\n<\/ul>\n", "label": "8–9"}, {"id": "pz-9", "kind": "pz", "num": 9, "lec": 13, "title": "Виртуалдык жана толукталган чындык (VR/AR)", "html": "<div class=\"meta\">\n<p>\n4 академиялык саат (10–11-сабактар)\n<\/p>\n<p>\nЧечимди долбоорлоо\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Сабактын максаты<\/h2>\n<p>VR, AR жана MR технологиялары жөнүндө билимди бекемдөө; милдетке ылайык технологияны тандоону, XR-тиркеменин концепциясын долбоорлоону жана анын пайдасын жана тобокелдиктерин баалоону үйрөнүү.<\/p>\n<h2>2. Сабактардын планы<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Баскыч<\/th>\n<th>Мазмуну<\/th>\n<th>Убакыт<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Көрсөтүү жана тажрыйба: смартфондогу AR-тиркемелер, 360° VR-видео<\/td>\n<td>30 мүн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Технологияларды жана колдонуу тармактарын салыштыруу<\/td>\n<td>30 мүн<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Эмерек дүкөнү үчүн AR-тиркеменин долбоору<\/td>\n<td>75 мүн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>Долбоорлорду презентациялоо<\/td>\n<td>45 мүн<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. № 1 тапшырма. Колдонуучунун тажрыйбасы<\/h2>\n<p>Бир AR-тиркемени (эмеректи «кийгизип көрүү», камера аркылуу котормочу, AR-фильтр) жана бир 360° VR-видеону сынап көрүңүз. Таасирлериңизди сүрөттөңүз: ыңгайлуулук, реалдуулук, чектөөлөр.<\/p>\n<div class=\"answer\" data-key=\"pz-9-a1\" data-label=\"AR жана VRди колдонуу тажрыйбасынын сүрөттөмөсү\">\n\n<\/div>\n<h2>4. № 2 тапшырма. Технологияны тандоо<\/h2>\n<p>Ар бир милдет үчүн VR, AR же MRди тандап, негиздеңиз: (а) өрт өчүрүүчүлөрдү түтүн баскан имараттагы аракеттерге үйрөтүү; (б) жабдуунун үстүндө станокту оңдоо боюнча нускама; (в) чет элдик туристтер үчүн тарыхый Өзгөн боюнча экскурсия; (г) интернет-дүкөндө көз айнекти «кийгизип көрүү»; (д) инженерлердин ГЭСтин 3D-модели менен биргелешип иштеши.<\/p>\n<div class=\"answer\" data-key=\"pz-9-a2\" data-label=\"а–д милдеттери үчүн технологияны негиздеме менен тандоо\">\n\n<\/div>\n<h2>5. № 3 тапшырма. Долбоор: эмерек дүкөнү үчүн AR-тиркеме<\/h2>\n<blockquote>\n<p>Эмерек дүкөндөрүнүн тармагы кардарлар эмеректи үйүндө смартфон аркылуу «кийгизип көрүп», ошол замат буйрутма бере алышын каалайт.<\/p>\n<\/blockquote>\n<p><strong>3.1.<\/strong> Ишке ашыруунун варианттарын критерийлер боюнча салыштырыңыз.<\/p>\n<div class=\"widget\" data-w=\"mca-pz9\">\n\n<\/div>\n<p><strong>3.2.<\/strong> Тиркеменин концепциясын иштеп чыгыңыз.<\/p>\n<p>\nМаксаттуу аудитория жана колдонуу сценарийи (колдонуучунун кадамдары)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-9-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nТиркеменин функциялары (3D-моделдердин каталогу, масштабда жайгаштыруу, түсүн алмаштыруу, себет)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-9-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nТехнологиялар жана жабдуу (ARKit, ARCore, Unity, 3D-моделдөө)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-9-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nКардарлар жана компания үчүн артыкчылыктар; ийгиликтин көрсөткүчтөрү\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-9-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nТобокелдиктер (наркы, кошуунун тактыгы, смартфондордун шайкештиги) жана чаралар\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-9-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>6. № 4 тапшырма. Билим берүүдөгү VR<\/h2>\n<p>Багытыңыздын бир дисциплинасы үчүн VR-лабораторияны сунуштаңыз: эмне моделденет, кандай жабдуу керек, кадимки сабактан эмнеси менен жакшы.<\/p>\n<div class=\"answer\" data-key=\"pz-9-a3\" data-label=\"VR-лабораториянын концепциясы\">\n\n<\/div>\n<h2>7. Талкуу үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>VRдин массалык жайылышын кандай чакырыктар тоскоолдук кылат?<\/li>\n<li>AR-көз айнектер смартфондорду алмаштырабы?<\/li>\n<li>AR-түзүлүштөр купуялуулук үчүн кандай тобокелдиктерди жаратат?<\/li>\n<\/ol>\n", "label": "10–11"}, {"id": "pz-10", "kind": "pz", "num": 10, "lec": 14, "title": "Санариптик маркетинг жана аналитика", "html": "<div class=\"meta\">\n<p>\n4 академиялык саат (12–13-сабактар)\n<\/p>\n<p>\nЭсептөө иши, стратегияны иштеп чыгуу\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Сабактын максаты<\/h2>\n<p>Санариптик жарнамалык каналдардын натыйжалуулугун негизги көрсөткүчтөр боюнча талдоону, чакан бизнес үчүн илгерилетүү стратегиясын иштеп чыгууну жана аналитика куралдарын тандоону үйрөнүү.<\/p>\n<h2>2. Сабактардын планы<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Баскыч<\/th>\n<th>Мазмуну<\/th>\n<th>Убакыт<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Кайталоо: каналдар, воронка, KPI<\/td>\n<td>20 мүн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Үч каналдын натыйжалуулугун талдоо<\/td>\n<td>50 мүн<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Кафе үчүн илгерилетүү стратегиясы<\/td>\n<td>70 мүн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>Стратегияларды коргоо<\/td>\n<td>40 мүн<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. № 1 тапшырма. Жарнамалык каналдарды салыштыруу<\/h2>\n<p>Спорттук кийим дүкөнү үч каналда бир айлык кампания өткөрдү. Модель ар бир канал үчүн CTR, CPC, CR, CPA жана ROIну эсептейт. Маалыматтарды өзгөртүүгө болот.<\/p>\n<div class=\"widget\" data-w=\"mkt-pz10\">\n\n<\/div>\n<p><strong>1.1.<\/strong> Кайсы канал ROI боюнча, кайсынысы кардарды тартуунун наркы (CPA) боюнча эң натыйжалуу? Корутундулар дал келеби?<\/p>\n<div class=\"answer\" data-key=\"pz-10-a1\" data-label=\"Каналдарды ROI жана CPA боюнча салыштыруу\">\n\n<\/div>\n<p><strong>1.2.<\/strong> Кийинки айга 60 000 сом бюджетти кантип кайра бөлүштүрүү керек? Негиздеңиз.<\/p>\n<div class=\"answer\" data-key=\"pz-10-a2\" data-label=\"Бюджетти негиздеме менен кайра бөлүштүрүү\">\n\n<\/div>\n<p><strong>1.3.<\/strong> Эмне үчүн жогорку CTR али натыйжалуу жарнама дегенди билдирбейт?<\/p>\n<div class=\"answer\" data-key=\"pz-10-a3\" data-label=\"CTR менен акыркы жыйынтыктын байланышы\">\n\n<\/div>\n<h2>4. № 2 тапшырма. Кафени илгерилетүү стратегиясы<\/h2>\n<blockquote>\n<p>Университеттин жанындагы чакан кафе социалдык тармактар жана онлайн-жарнама аркылуу келүүчүлөрдүн санын көбөйткүсү келет. Бюджет — айына 25 000 сом.<\/p>\n<\/blockquote>\n<p>\nSMART боюнча максаттар (эмне, канча, кайсы мөөнөткө чейин)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nМаксаттуу аудитория (кардардын портрети)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nИлгерилетүү каналдары жана алардын ролу\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nБир жумалык контент-план (жарыялардын форматтары жана темалары)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nАналитика куралдары (Google Analytics, Meta Business Suite, UTM-белгилер)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nKPI жана алардын максаттуу маанилери (CTR, CPA, тартылгандык, буйрутмалардын саны)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f6\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>5. № 3 тапшырма. A/B-тест<\/h2>\n<p>Кафенин жарнамалык жарыясы үчүн A/B-тест сунуштаңыз: варианттарда эмне айырмаланат, чечим кайсы метрика боюнча кабыл алынат, тест канча убакытка созулат.<\/p>\n<div class=\"answer\" data-key=\"pz-10-a4\" data-label=\"A/B-тесттин планы\">\n\n<\/div>\n<h2>6. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>CPC, CR жана CPA кантип байланышкан?<\/li>\n<li>ROI ROASтан эмнеси менен айырмаланат?<\/li>\n<li>UTM-белгилер эмне үчүн керек?<\/li>\n<\/ol>\n", "label": "12–13"}, {"id": "pz-11", "kind": "pz", "num": 11, "lec": 15, "title": "Бизнестин санариптик трансформациясы", "html": "<div class=\"meta\">\n<p>\n4 академиялык саат (14–15-сабактар)\n<\/p>\n<p>\nЖыйынтыктоочу топтук долбоор\n<\/p>\n<p>\nЖК-1, КК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Сабактын максаты<\/h2>\n<p>Курстун билимин жалпылоо: уюмдун санариптик жетилгендигин баалоо, анын санариптик трансформациясынын стратегиясын жана жол картасын иштеп чыгуу, экономикалык натыйжаны жана тобокелдиктерди баалоо.<\/p>\n<h2>2. Иштин тартиби<\/h2>\n<ol type=\"1\">\n<li>Топ уюмду тандайт: реалдуу (дүкөн, банк, ЖОЖ, дарыкана, логистикалык компания) же шарттуу.<\/li>\n<li>Анын санариптик жетилгендигин баалайт.<\/li>\n<li>Максаттарды аныктап, технологияларды тандайт.<\/li>\n<li>Жол картасын иштеп чыгып, натыйжаны баалайт.<\/li>\n<li>Стратегияны презентациялап, суроолорго жооп берет (коргоо — ар бир топко 10 мүнөт).<\/li>\n<\/ol>\n<h2>3. № 1 тапшырма. Уюм<\/h2>\n<p>\nУюмдун аталышы жана ишмердүүлүк чөйрөсү, масштабы\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nНегизги көйгөйлөр жана рыноктун чакырыктары\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>4. № 2 тапшырма. Санариптик жетилгендикти баалоо<\/h2>\n<p>Уюмду алты өлчөм боюнча баалаңыз (1 — баштапкы, 5 — трансформациялык деңгээл).<\/p>\n<div class=\"widget\" data-w=\"maturity\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-11-a1\" data-label=\"Чечмелөө: күчтүү жактар жана өнүктүрүүнүн артыкчылыктуу зоналары\">\n\n<\/div>\n<h2>5. № 3 тапшырма. Стратегия жана жол картасы<\/h2>\n<p>\nТрансформациянын максаттары жана KPI (1–2 жылга)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nКөйгөйлөр менен байланыштырылган тандалган технологиялар жана долбоорлор (кеминде үч)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nБаскычтар: баалоо, пилот, масштабдоо, персоналды окутуу — мөөнөттөрү менен\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nКеректүү ресурстар: бюджет, адистер, өнөктөштөр\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f6\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>6. № 4 тапшырма. Экономикалык натыйжа<\/h2>\n<p>Негизги долбоорду таза келтирилген нарк (NPV) боюнча баалаңыз. Инвестициялардын, пайдалардын жана чыгымдардын өз баалоолоруңузду коюңуз.<\/p>\n<div class=\"widget\" data-w=\"npv5\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-11-a2\" data-label=\"Долбоордун экономикалык максатка ылайыктуулугу жөнүндө корутунду\">\n\n<\/div>\n<h2>7. № 5 тапшырма. Тобокелдиктер жана өзгөрүүлөрдү башкаруу<\/h2>\n<p>Кеминде төрт тобокелдикти (технологиялык, финансылык, кадрдык, коопсуздук) жана аларды азайтуу чараларын аныктаңыз. Кызматкерлердин каршылыгын кантип жеңесиз?<\/p>\n<div class=\"answer\" data-key=\"pz-11-a3\" data-label=\"Тобокелдиктер, чаралар, өзгөрүүлөрдү башкаруу\">\n\n<\/div>\n<h2>8. Долбоорду баалоо критерийлери<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Критерий<\/th>\n<th>Баллдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Санариптик жетилгендикти негиздүү баалоо<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Максаттардын, көйгөйлөрдүн жана технологиялардын байланышы<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Реалдуу жол картасы<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Натыйжаны эсептөө<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Тобокелдиктерди талдоо жана коргоо<\/td>\n<td>1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "label": "14–15"}, {"id": "srs-0", "kind": "srs", "num": 0, "lec": 0, "title": "Студенттердин өз алдынча иши: жалпы жоболор", "html": "<div class=\"meta\">\n<p>\n60 саат СӨИ\n<\/p>\n<p>\nУчурдагы текшерүүгө кирет — 30 балл\n<\/p>\n<\/div>\n<h2>1. Арналышы<\/h2>\n<p>Студенттердин өз алдынча иши (СӨИ) лекциялардын жана практикалык сабактардын материалын бекемдейт, талдоо, маалымат издөө жана чечим иштеп чыгуу көндүмдөрүн өнүктүрөт. Окуу китебинде СӨИ экинчи модулдун темалары (8–15-лекциялар) боюнча <strong>сегиз колдонмо кейске<\/strong> курулган. Ар бир кейс — уюмдун практикасынан алынган кырдаал жана төрт тапшырма.<\/p>\n<h2>2. Дисциплина боюнча өз алдынча иштин түрлөрү<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Түрү<\/th>\n<th>Мазмуну<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Теорияны үйрөнүү<\/td>\n<td>Лекциялардын конспекти, адабияттар, онлайн-курстар (Coursera, Microsoft Learn, Google Digital Garage, Kaggle Learn)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Лекцияларга тапшырмалар<\/td>\n<td>Ар бир лекциянын аягындагы «Өз алдынча иш үчүн тапшырмалар» бөлүмү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>СӨИ кейстери<\/td>\n<td>Ушул бөлүмдүн отчёт менен сегиз кейси<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Өзүн-өзү текшерүү<\/td>\n<td>«Текшерүү» бөлүмүндөгү Блумдун деңгээлдери боюнча тесттер<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Модулдарга даярдануу<\/td>\n<td>1-модулдун тести жана 2-модулдун көзөмөл суроолору<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Кейсти аткарууга коюлуучу талаптар<\/h2>\n<ol type=\"1\">\n<li>Байланышкан лекцияны окуңуз (шилтеме кейстин башында).<\/li>\n<li>Ар бир тапшырмага жоопту өзүңүз, өз сөзүңүз менен териңиз. Талааларга текст коюу өчүрүлгөн.<\/li>\n<li>Жоопто болушу керек: кырдаалды талдоо, конкреттүү чечим (технологиялар, кадамдар, мөөнөттөр), негиздеме, күтүлгөн көрсөткүчтөр.<\/li>\n<li>Бир тапшырмага жооптун көлөмү — кеминде 5–7 сүйлөм.<\/li>\n<li>«Аткарылды» деп белгилеп, «Тапшыруу» бөлүмүндө отчётту тапшырыңыз.<\/li>\n<\/ol>\n<h2>4. Кейсти баалоо критерийлери<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Критерий<\/th>\n<th>Баллдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Кырдаалды жана көйгөйдүн себептерин талдоо<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Чечимдин конкреттүүлүгү жана ишке ашырылуучулугу<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Технологияларды негиздүү тандоо<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Өлчөнүүчү жыйынтыктар (KPI, эсептөө)<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Өз алдынчалык жана баяндоонун сабаттуулугу<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Кейс үчүн бардыгы<\/strong><\/td>\n<td><strong>5<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. График<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Кейс<\/th>\n<th>Тема<\/th>\n<th>Тапшыруу мөөнөтү<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>СӨИ-1<\/td>\n<td>Бизнес-процессти оптималдаштыруу<\/td>\n<td>9-жума<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>СӨИ-2<\/td>\n<td>Маалыматтардын агып кетиши<\/td>\n<td>10-жума<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>СӨИ-3<\/td>\n<td>Булутка өтүү<\/td>\n<td>11-жума<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>СӨИ-4<\/td>\n<td>Сатууну болжолдоо<\/td>\n<td>12-жума<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>СӨИ-5<\/td>\n<td>Акылдуу жарык<\/td>\n<td>13-жума<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>СӨИ-6<\/td>\n<td>Чекене соодадагы AR<\/td>\n<td>14-жума<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>СӨИ-7<\/td>\n<td>Кафенин маркетинги<\/td>\n<td>15-жума<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>СӨИ-8<\/td>\n<td>Логистиканын трансформациясы<\/td>\n<td>16-жума<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Конкреттүү мөөнөттөрдү окутуучу тактайт.<\/p>\n"}, {"id": "srs-1", "kind": "srs", "num": 1, "lec": 8, "title": "Өндүрүүчү компанияда бизнес-процессти оптималдаштыруу", "html": "<div class=\"meta\">\n<p>\n8-лекцияга кейс\n<\/p>\n<p>\n5 балл\n<\/p>\n<\/div>\n<h2>Кырдаал<\/h2>\n<p>Компания тиричилик техникасын чыгарат (300 кызматкер). Дилерлердин буйрутмалары электрондук почта жана телефон аркылуу келип түшөт, менеджер кампадагы тетиктердин бар-жогун кол менен текшерип, мөөнөттөрдү өндүрүштөн тактайт. Арызды иштетүүнүн орточо мөөнөтү — 4 жумуш күнү, атаандаштарда — 1 күн. Компания буйрутмаларды жоготуп жатат.<\/p>\n<h2>Тапшырмалар<\/h2>\n<p><strong>1.<\/strong> Буйрутманы иштетүүнүн учурдагы бизнес-процессинин картасын (AS-IS) түзүңүз: катышуучулар, кадамдар, документтер.<\/p>\n<div class=\"answer\" data-key=\"srs-1-a1\" data-label=\"Учурдагы AS-IS процессинин картасы\">\n\n<\/div>\n<p><strong>2.<\/strong> Процесстин «тар жерлерин» жана алардын себептерин аныктаңыз.<\/p>\n<div class=\"answer\" data-key=\"srs-1-a2\" data-label=\"Тар жерлер жана алардын себептери\">\n\n<\/div>\n<p><strong>3.<\/strong> Максаттуу процессти (TO-BE) жана оптималдаштыруунун санариптик стратегиясын сунуштаңыз; аны BPMN терминдеринде сүрөттөңүз (окуялар, тапшырмалар, шлюздар, жолчолор).<\/p>\n<div class=\"answer\" data-key=\"srs-1-a3\" data-label=\"BPMN терминдериндеги максаттуу TO-BE процесси\">\n\n<\/div>\n<p><strong>4.<\/strong> Технологияларды (ERP, CRM, дилердик портал) тандап, тандооңузду негиздеңиз. Арызды иштетүүнүн кайсы мөөнөтү максаттуу болот?<\/p>\n<div class=\"answer\" data-key=\"srs-1-a4\" data-label=\"Технологияларды тандоо жана максаттуу көрсөткүчтөр\">\n\n<\/div>\n"}, {"id": "srs-2", "kind": "srs", "num": 2, "lec": 9, "title": "Чекене тармактагы маалыматтардын агып кетиши", "html": "<div class=\"meta\">\n<p>\n9-лекцияга кейс\n<\/p>\n<p>\n5 балл\n<\/p>\n<\/div>\n<h2>Кырдаал<\/h2>\n<p>Чекене тармакта (40 дүкөн) берилгендик программасынын 60 000 катышуучусунун жеке маалыматтары агып кетти: аттары, телефондору, сатып алуулардын тарыхы. Маалыматтар интернетте сатыкка чыкты. Кызматкерлердин базага жалпы сырсөздөрү бар экени, маалыматтар шифрленбегени, ал эми менеджерлердин бири мурунку күнү сырсөзүн ырастоону суранган «ИТ-бөлүмдөн» кат алганы белгилүү.<\/p>\n<h2>Тапшырмалар<\/h2>\n<p><strong>1.<\/strong> Агып кетүүнүн мүмкүн болгон себептерин талдаңыз: адам фактору, техникалык жана уюштуруучулук кемчиликтер.<\/p>\n<div class=\"answer\" data-key=\"srs-2-a1\" data-label=\"Агып кетүүнүн себептерин талдоо\">\n\n<\/div>\n<p><strong>2.<\/strong> Жооп кайтаруунун жана коопсуздукту калыбына келтирүүнүн планын сунуштаңыз (алгачкы 72 саат жана кийинки 3 ай).<\/p>\n<div class=\"answer\" data-key=\"srs-2-a2\" data-label=\"Жооп кайтаруу жана калыбына келтирүү планы\">\n\n<\/div>\n<p><strong>3.<\/strong> Алдын алуунун техникалык чараларын иштеп чыгыңыз (шифрлөө, MFA, жетүүнү чектөө, журналдоо, камдоо).<\/p>\n<div class=\"answer\" data-key=\"srs-2-a3\" data-label=\"Коргоонун техникалык чаралары\">\n\n<\/div>\n<p><strong>4.<\/strong> Уюштуруучулук жана укуктук чараларды аныктаңыз (коопсуздук саясаты, окутуу, маалыматтарды коргоого жооптуу адам, кардарларды жана ыйгарым укуктуу органды кабарлоо).<\/p>\n<div class=\"answer\" data-key=\"srs-2-a4\" data-label=\"Уюштуруучулук жана укуктук чаралар\">\n\n<\/div>\n"}, {"id": "srs-3", "kind": "srs", "num": 3, "lec": 10, "title": "Компаниянын булуттук технологияларга өтүшү", "html": "<div class=\"meta\">\n<p>\n10-лекцияга кейс\n<\/p>\n<p>\n5 балл\n<\/p>\n<\/div>\n<h2>Кырдаал<\/h2>\n<p>Туристтик агенттик (25 кызматкер, 3 кеңсе) документтерди бир кеңсе компьютеринде, кардарлардын базасын Excelде, бухгалтерияны жергиликтүү программада сактайт. Компания гибриддик иш режимине өтүп жатат, кызматкерлерге маалыматтарга үйдөн жана сапарларда жетүү керек.<\/p>\n<h2>Тапшырмалар<\/h2>\n<p><strong>1.<\/strong> Кайсы маалыматтарды жана процесстерди булутка көчүрүүгө болорун, кайсынысын жергиликтүү калтырган жакшы экенин аныктаңыз. Негиздеңиз.<\/p>\n<div class=\"answer\" data-key=\"srs-3-a1\" data-label=\"Булутка көчүрүлүүчү маалыматтар жана процесстер\">\n\n<\/div>\n<p><strong>2.<\/strong> Булуттук кызматтарды жана моделдерди (SaaS, PaaS, IaaS) тандаңыз — мисалы, Google Workspace, Microsoft 365, булуттук CRM, булуттук бухгалтерия.<\/p>\n<div class=\"answer\" data-key=\"srs-3-a2\" data-label=\"Кызматтарды жана моделдерди негиздеме менен тандоо\">\n\n<\/div>\n<p><strong>3.<\/strong> Баскычтуу өтүү планын иштеп чыгыңыз (мөөнөттөр, жооптуу адамдар, окутуу).<\/p>\n<div class=\"answer\" data-key=\"srs-3-a3\" data-label=\"Баскычтуу өтүү планы\">\n\n<\/div>\n<p><strong>4.<\/strong> Коопсуздук чараларын көрсөтүп, булуттук кызматтарга айлык чыгымдарды баалаңыз.<\/p>\n<div class=\"answer\" data-key=\"srs-3-a4\" data-label=\"Коопсуздук чаралары жана чыгымдарды баалоо\">\n\n<\/div>\n"}, {"id": "srs-4", "kind": "srs", "num": 4, "lec": 11, "title": "Интернет-дүкөндө сатууну болжолдоо", "html": "<div class=\"meta\">\n<p>\n11-лекцияга кейс\n<\/p>\n<p>\n5 балл\n<\/p>\n<\/div>\n<h2>Кырдаал<\/h2>\n<p>Балдар товарларынын интернет-дүкөнү ар бир товарга кийинки айга суроо-талапты болжолдогусу келет. Азыр сатып алуулар «көз менен» жасалат: товарлардын бир бөлүгү майрамдарга чейин түгөнүп калат, башкалары кампада жарым жыл жатат. Үч жылдык сатуунун тарыхы бар.<\/p>\n<h2>Тапшырмалар<\/h2>\n<p><strong>1.<\/strong> Модель үчүн кандай маалыматтар керектигин аныктаңыз (сатуунун тарыхы, мезгилдүүлүк, майрамдар, баалар жана арзандатуулар, жарнама, калдыктар).<\/p>\n<div class=\"answer\" data-key=\"srs-4-a1\" data-label=\"Керектүү маалыматтар жана алардын булактары\">\n\n<\/div>\n<p><strong>2.<\/strong> Окутуунун түрүн жана милдеттин түрүн аныктаңыз; тандооңузду түшүндүрүңүз.<\/p>\n<div class=\"answer\" data-key=\"srs-4-a2\" data-label=\"Окутуунун түрү жана милдеттин түрү\">\n\n<\/div>\n<p><strong>3.<\/strong> Алгоритмдерди (сызыктуу регрессия, чечимдер дарагы, градиенттик бустинг) жана моделди куруунун тартибин сунуштаңыз.<\/p>\n<div class=\"answer\" data-key=\"srs-4-a3\" data-label=\"Алгоритмдер жана моделди куруунун баскычтары\">\n\n<\/div>\n<p><strong>4.<\/strong> Моделдин тактыгын кантип баалай турганыңызды (MAE, RMSE, акыркы айларда текшерүү) жана сатып алууда болжол кантип колдонуларын сүрөттөңүз.<\/p>\n<div class=\"answer\" data-key=\"srs-4-a4\" data-label=\"Тактыкты баалоо жана болжолду колдонуу\">\n\n<\/div>\n"}, {"id": "srs-5", "kind": "srs", "num": 5, "lec": 12, "title": "Кеңседеги ак
