e><\/div>\n<p><strong>Корреляция<\/strong> — эки өзгөрмөнүн ортосундагы статистикалык байланыш. Пирсондун корреляция коэффициенти <em>r<\/em> −1ден +1ге чейинки маанилерди алат: <em>r<\/em> +1ге жакын — күчтүү түз байланыш (бир чоңдук өссө, экинчиси да өсөт); −1ге жакын — күчтүү тескери байланыш; 0дүн тегерегинде — сызыктуу байланыш жок.<\/p>\n<blockquote>\n<p>Корреляция себептүүлүктү билдирбейт. Балмуздак сатуу жана күнгө күйүүнүн саны чогуу өсөт, бирок экөөнүн себеби бирөө — ысык аба ырайы.<\/p>\n<\/blockquote>\n<p><strong>Сыпаттама статистика калькулятору.<\/strong> Сандардын катарын боштук же үтүрлүү чекит аркылуу киргизиңиз — мисалы, күнүмдүк сатуулар.<\/p>\n<div class=\"widget\" data-w=\"stats\">\n\n<\/div>\n<h2>4. Визуалдаштыруунун негиздери: графиктердин түрлөрү<\/h2>\n<p><strong>Маалыматтарды визуалдаштыруу<\/strong> — кабыл алууну, салыштырууну жана мыйзам ченемдүүлүктөрдү издөөнү жеңилдеткен графикалык формада маалыматтарды көрсөтүү.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Милдет<\/th>\n<th>Ылайыктуу график<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Убакыт боюнча динамика<\/td>\n<td>Сызыктуу график<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Категорияларды салыштыруу<\/td>\n<td>Мамычалуу (тилкелүү) диаграмма<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Бүтүндүн үлүштөрү (категориялар аз)<\/td>\n<td>Тегерек же шакек диаграмма<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Маанилердин бөлүштүрүлүшү<\/td>\n<td>Гистограмма<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Эки өзгөрмөнүн байланышы<\/td>\n<td>Чекиттүү диаграмма (чачыроо диаграммасы)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Эки өлчөм боюнча интенсивдүүлүк<\/td>\n<td>Жылуулук картасы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Негизги көрсөткүчтөрдү мониторингдөө<\/td>\n<td>Дашборд<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. Натыйжалуу визуалдаштыруунун принциптери<\/h2>\n<ol type=\"1\">\n<li><strong>Жөнөкөйлүк<\/strong> — ашыкча элементтерди (көлөмдүү эффекттерди, фондук сүрөттөрдү) алып салуу.<\/li>\n<li><strong>Фокус<\/strong> — негизгисин түс же жазуу менен бөлүп көрсөтүү, калганын нейтралдуу кылуу.<\/li>\n<li><strong>Чынчыл шкала<\/strong> — мамычалуу диаграмманын огу нөлдөн башталат, болбосо айырмачылыктар бурмаланат.<\/li>\n<li><strong>Маанилүү түс<\/strong> — түшүнүктүү жана контрасттуу палитра, бардык графиктерде бир категория үчүн бир түс.<\/li>\n<li><strong>Маалымат түрүнө шайкештик<\/strong> — график сулуулугуна карап эмес, милдетине карап тандалат.<\/li>\n<li><strong>Жазуулар<\/strong> — аталышы, өлчөө бирдиктери, маалымат булагы.<\/li>\n<li><strong>Интерактивдүүлүк<\/strong> — чоң көлөмдөгү маалыматтар үчүн чыпкалар жана деталдаштыруу.<\/li>\n<\/ol>\n<h2>6. Визуалдаштыруу куралдары<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Курал<\/th>\n<th>Өзгөчөлүктөрү<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Microsoft Excel / Google Sheets<\/td>\n<td>Жыйынтык таблицалар, стандарттык диаграммалар, жеткиликтүүлүк<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Power BI<\/td>\n<td>Интерактивдүү дашборддор, көптөгөн булактарга туташуу, DAX тили<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tableau<\/td>\n<td>Күчтүү визуалдык аналитика, жарыялоо үчүн Tableau Public<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Looker Studio (Google Data Studio)<\/td>\n<td>Акысыз онлайн-отчёттор, Google Analytics менен интеграция<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Python (matplotlib, seaborn, plotly)<\/td>\n<td>Каалаган татаалдыктагы программалык визуалдаштыруу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>R (ggplot2)<\/td>\n<td>Статистикалык графика<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>7. Колдонулушу жана тренддер<\/h2>\n<ul>\n<li><strong>Сатуу<\/strong> — аймактар жана менеджерлер боюнча түшүмдүн дашборду.<\/li>\n<li><strong>Маркетинг<\/strong> — воронканы жана каналдардын натыйжалуулугун визуалдаштыруу.<\/li>\n<li><strong>Финансы<\/strong> — кирешелердин жана чыгымдардын динамикасы, план-факт.<\/li>\n<li><strong>Өндүрүш<\/strong> — жабдуунун жүктөлүшүн жана бракты мониторингдөө.<\/li>\n<\/ul>\n<p>Тренддер: интерактивдүү жана мобилдик дашборддор; табигый тилдеги аналитика («мартта сатуу канча?» деген суроого жооп график менен); ЖИ менен кеңейтилген аналитика; реалдуу убакыттагы аналитика.<\/p>\n<h2>8. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Ачык маалымат топтомун табыңыз (stat.gov.kg, Kaggle) жана Excelде ар түрдүү үч график түзүңүз. Ар бирин тандооңузду негиздеңиз.<\/li>\n<li>ЖМКдан ийгиликсиз визуалдаштыруунун мисалын таап, кайсы принцип бузулганын түшүндүрүңүз.<\/li>\n<\/ol>\n<h2>9. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Маалыматтарды талдоонун баскычтарын атаңыз.<\/li>\n<li>Үлүштөрдү көрсөтүү үчүн кайсы графикти, ал эми динамика үчүн кайсынысын тандоо керек?<\/li>\n<li>Корреляция коэффициенти эмнени көрсөтөт?<\/li>\n<li>Эмне үчүн мамычалуу диаграмманын огу нөлдөн башталышы керек?<\/li>\n<li>Маалыматтар менен иштөөдө Power BI Excelден эмнеси менен айырмаланат?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Маалыматтарды талдоо · сыпаттама талдоо · болжолдоочу талдоо · орточо · медиана · стандарттык четтөө · корреляция · гистограмма · чачыроо диаграммасы · дашборд · Power BI · Tableau.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Кузнецов Д. И. Основы анализа данных и машинного обучения. — М. : ДМК Пресс, 2020.<\/li>\n<li>Power BI расмий сайты. — powerbi.microsoft.com.<\/li>\n<li>Tableau Public. — public.tableau.com.<\/li>\n<\/ol>\n"}, {"id": "lec-6", "kind": "lec", "num": 6, "title": "Интернет-технологияларга киришүү", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n1-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Интернеттин түзүлүшү, даректөө жана домендик система, негизги протоколдор, веб-тиркемелердин иштөө принциптери жана базалык веб-технологиялар — HTML, CSS жана JavaScript жөнүндө түшүнүк калыптандыруу.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Интернет-технологиялар түшүнүгү жана алардын мааниси.<\/li>\n<li>Интернеттин негизги компоненттери: IP-дарек, DNS, URL.<\/li>\n<li>Кардар-сервердик модель жана браузердин иштеши.<\/li>\n<li>Интернет-протоколдор.<\/li>\n<li>Веб-технологиялар: HTML, CSS, JavaScript.<\/li>\n<li>Интернет-технологиялардын бизнесте колдонулушу, тренддер.<\/li>\n<\/ol>\n<h2>1. Интернет-технологиялар түшүнүгү<\/h2>\n<p><strong>Интернет<\/strong> — бирдиктүү TCP/IP протоколдор стегинин негизинде дүйнө жүзүндөгү компьютердик тармактарды бириктирген глобалдык тармак.<\/p>\n<p><strong>Интернет-технологиялар<\/strong> — тармакта маалыматтарды берүүнү, веб-сайттардын, кызматтардын жана тиркемелердин иштешин камсыз кылган каражаттардын жана протоколдордун жыйындысы.<\/p>\n<p>Мааниси: коммуникациялар (почта, мессенджерлер, видеобайланыш); бизнес (электрондук коммерция, санариптик платформалар); маалымат (издөө, сактоо, алмашуу); башкаруу (булуттук системалар, алыстан иштөө, электрондук өкмөт).<\/p>\n<h2>2. Интернеттин негизги компоненттери<\/h2>\n<p><strong>IP-дарек<\/strong> — тармактагы түзүлүштүн уникалдуу сандык дареги. IPv4 0дөн 255ке чейинки төрт сан менен жазылат (<code>192.168.1.10<\/code>) жана болжол менен 4,3 млрд дарек берет. IPv6 (<code>2001:0db8::1<\/code>) 128 битти колдонот жана даректердин жетишсиздиги маселесин чечет.<\/p>\n<p><strong>DNS (Domain Name System)<\/strong> — адамга түшүнүктүү аталыштарды (<code>mnu.kg<\/code>) IP-даректерге айландырган домендик аталыштар системасы. Домендер иерархияны түзөт: тамыр домен → жогорку деңгээлдеги домен (<code>.kg<\/code>, <code>.com<\/code>) → экинчи деңгээлдеги домен (<code>mnu.kg<\/code>) → субдомендер.<\/p>\n<p><strong>URL (Uniform Resource Locator)<\/strong> — интернеттеги ресурстун дареги.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>URLдин бөлүгү<\/th>\n<th>Мисал<\/th>\n<th>Мааниси<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Протокол (схема)<\/td>\n<td><code>https://<\/code><\/td>\n<td>Маалыматтарды кантип берүү керек<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Домендик аталыш<\/td>\n<td><code>www.example.kg<\/code><\/td>\n<td>Ресурс кайсы серверде жайгашкан<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Порт (адатта көрсөтүлбөйт)<\/td>\n<td><code>:443<\/code><\/td>\n<td>Ушул протокол үчүн сервердин «эшиги»<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Жол<\/td>\n<td><code>/catalog/books<\/code><\/td>\n<td>Ресурс сервердин кайсы жеринде<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Сурамдын параметрлери<\/td>\n<td><code>?q=sql&amp;page=2<\/code><\/td>\n<td>Кошумча маалыматтар<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Якорь<\/td>\n<td><code>#reviews<\/code><\/td>\n<td>Барактагы орун<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Башка компоненттер<\/strong>: серверлер (сайттарды сактайт жана кызмат көрсөтөт), кардарлар (браузерлер, тиркемелер), маршрутизаторлор жана шлюздар (маалыматтарды тармактардын ортосунда багыттайт), провайдерлер (интернетке жетүүнү берет).<\/p>\n<h2>3. Кардар-сервердик модель жана браузердин иштеши<\/h2>\n<p><strong>Кардар-сервердик модель<\/strong> — сервер ресурстарды жана кызматтарды берген, ал эми кардарлар ага сурамдар менен кайрылган архитектура. Альтернативасы — бардык катышуучулар тең укуктуу болгон бир деңгээлдүү тармактар (P2P).<\/p>\n<p><strong>Сайттын дарегин киргизгенде эмне болот<\/strong><\/p>\n<ol type=\"1\">\n<li>Браузер URLди талдап, сервердин IP-дарегин алуу үчүн DNSке кайрылат.<\/li>\n<li>TCP туташуусу орнотулат (HTTPS үчүн — кошумча TLS корголгон туташуусу).<\/li>\n<li>Браузер HTTP-сурамын жөнөтөт (<code>GET /catalog<\/code>).<\/li>\n<li>Сервер сурамды иштетет — көбүнчө маалымат базасына кайрылып — жана жооп кайтарат: абал коду (200 — ийгиликтүү, 404 — табылган жок, 500 — сервердин катасы) жана мазмуну — HTML, CSS, JavaScript, сүрөттөр.<\/li>\n<li>Браузер баракты түзүп, скрипттерди аткарат.<\/li>\n<\/ol>\n<p>Веб-тиркеменин мүнөздүү схемасы: <strong>кардар (браузер) → веб-сервер → тиркемелер сервери → маалымат базасы<\/strong>.<\/p>\n<h2>4. Интернет-протоколдор<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Протокол<\/th>\n<th>Арналышы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>IP<\/td>\n<td>Тармактардын ортосунда пакеттерди даректөө жана жеткирүү<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TCP<\/td>\n<td>Ырастоо жана жоготууларды калыбына келтирүү менен ишенимдүү берүү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>UDP<\/td>\n<td>Кепилдиксиз тез берүү (видеочалуулар, онлайн-оюндар)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>HTTP<\/td>\n<td>Гипертекстти (веб-барактарды) берүү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>HTTPS<\/td>\n<td>TLS шифрлөөсү бар HTTP: сырсөздөрдү жана төлөм маалыматтарын коргойт<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>FTP / SFTP<\/td>\n<td>Файлдарды берүү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SMTP<\/td>\n<td>Электрондук почтаны жөнөтүү<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>POP3 / IMAP<\/td>\n<td>Электрондук почтаны алуу<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DNS<\/td>\n<td>Домендик аталыштарды IP-даректерге айландыруу<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. Веб-технологиялар: HTML, CSS, JavaScript<\/h2>\n<p>Веб-барак үч катмардан түзүлөт: <strong>HTML<\/strong> — түзүм жана мазмун, <strong>CSS<\/strong> — сырткы көрүнүш, <strong>JavaScript<\/strong> — жүрүм-турум жана интерактивдүүлүк.<\/p>\n<p><strong>HTML (HyperText Markup Language)<\/strong> — веб-барактардын белгилөө тили. Элементтер тегдер менен берилет.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Тег<\/th>\n<th>Арналышы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>&lt;h1&gt;<\/code> … <code>&lt;h6&gt;<\/code><\/td>\n<td>Ар кандай деңгээлдеги аталыштар<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>&lt;p&gt;<\/code><\/td>\n<td>Абзац<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><code>&lt;a href=\"…\"&gt;<\/code><\/td>\n<td>Гипершилтеме<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>&lt;img src=\"…\" alt=\"…\"&gt;<\/code><\/td>\n<td>Сүрөт<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><code>&lt;ul&gt;<\/code>, <code>&lt;ol&gt;<\/code>, <code>&lt;li&gt;<\/code><\/td>\n<td>Маркерленген жана номерленген тизмелер, тизменин пункту<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>&lt;table&gt;<\/code>, <code>&lt;tr&gt;<\/code>, <code>&lt;td&gt;<\/code><\/td>\n<td>Таблица, сап, уяча<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><code>&lt;div&gt;<\/code><\/td>\n<td>Блок-контейнер<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>&lt;form&gt;<\/code>, <code>&lt;input&gt;<\/code>, <code>&lt;button&gt;<\/code><\/td>\n<td>Форма, киргизүү талаасы, баскыч<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<pre><code>&lt;h1&gt;«Ала-Тоо» кафеси&lt;/h1&gt;\n&lt;p&gt;Күн сайын саат 9:00дөн иштейбиз.&lt;/p&gt;\n&lt;a href=&quot;menu.html&quot;&gt;Меню&lt;/a&gt;<\/code><\/pre>\n<p><strong>CSS (Cascading Style Sheets)<\/strong> — стилдерди сүрөттөө тили. Эреже селектордон жана касиеттердин жыйындысынан турат.<\/p>\n<pre><code>h1 { color: #2a4a7a; text-align: center; }\np  { font-size: 16px; margin: 0 0 12px; }<\/code><\/pre>\n<p>Көп колдонулган касиеттер: <code>color<\/code> — тексттин түсү; <code>background<\/code> — фон; <code>font-size<\/code> — арип өлчөмү; <code>text-align<\/code> — текстти тегиздөө; <code>margin<\/code> жана <code>padding<\/code> — тышкы жана ички чегинүүлөр; <code>border<\/code> — алкак.<\/p>\n<p><strong>JavaScript<\/strong> — браузерде аткарылган жана барактарды интерактивдүү кылган программалоо тили: формаларды текшерет, мазмунду кайра жүктөбөй өзгөртөт, сервер менен маалымат алмашат.<\/p>\n<pre><code>let price = 250;\nprice += 50;                       // эми 300\nconst title = document.getElementById(&#39;title&#39;);\ntitle.textContent = &#39;Баасы: &#39; + price;\nconsole.log(price === 300);        // true<\/code><\/pre>\n<p>JavaScriptтин базалык түшүнүктөрү: өзгөрмөлөр (<code>let<\/code>, <code>const<\/code>); функциялар (<code>function<\/code>); шарттар (<code>if<\/code>); циклдер (<code>for<\/code>, <code>while<\/code>); катуу салыштыруу <code>===<\/code> (мааниси жана түрү боюнча); <strong>DOM (Document Object Model)<\/strong> — барактын объекттик модели, ал аркылуу скрипт элементтерди табат (<code>getElementById<\/code>, <code>querySelector<\/code>) жана өзгөртөт.<\/p>\n<h2>6. Интернет-технологиялардын бизнесте колдонулушу жана тренддер<\/h2>\n<ul>\n<li><strong>Электрондук коммерция<\/strong> — интернет-дүкөндөр жана маркетплейстер.<\/li>\n<li><strong>Веб-аналитика<\/strong> — Google Analytics, Яндекс Метрика.<\/li>\n<li><strong>Бизнести башкаруу<\/strong> — браузерден жетүүгө мүмкүн болгон булуттук CRM жана ERP.<\/li>\n<li><strong>Маркетинг<\/strong> — сайттар, социалдык тармактар, контексттик жарнама.<\/li>\n<\/ul>\n<p>Тренддер: буюмдар интернети; булуттук кызматтар; веб-кызматтардагы ЖИ (чат-боттор, сунуштар); 5G тармактары; бардык жерде HTTPSке өтүү; мобилдик тиркемелердей иштеген прогрессивдүү веб-тиркемелер (PWA).<\/p>\n<h2>7. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Кыргызстандын каалаган сайтынын URLин бөлүктөргө ажыратыңыз: протокол, домен, жол, параметрлер.<\/li>\n<li>Интернет-дүкөн үчүн «кардар — веб-сервер — маалымат базасы» схемасын тартып, ар бир кадамда кандай маалыматтар берилерин жазыңыз.<\/li>\n<li>Текст редакторунда визитка-барагы бар <code>index.html<\/code> файлын түзүңүз: аталыш, абзац, тизме, шилтеме, сүрөт. Аталыш үчүн CSS стилдерин кошуңуз.<\/li>\n<\/ol>\n<h2>8. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>IP-дарек деген эмне жана IPv6 IPv4төн эмнеси менен айырмаланат?<\/li>\n<li>DNS кандай милдетти чечет?<\/li>\n<li>Веб-баракты жүктөөнүн кадамдарын сүрөттөңүз.<\/li>\n<li>HTTP HTTPSтен эмнеси менен айырмаланат?<\/li>\n<li>HTML, CSS жана JavaScript эмне үчүн жооп берет?<\/li>\n<li>DOM деген эмне?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Интернет · TCP/IP · IP-дарек · DNS · URL · кардар-сервердик модель · HTTP · HTTPS · SMTP · FTP · HTML · CSS · JavaScript · DOM.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Таненбаум Э. С. Компьютерные сети. — СПб. : Питер, 2020.<\/li>\n<li>W3C документациясы. — w3.org.<\/li>\n<li>MDN Web Docs. — developer.mozilla.org.<\/li>\n<\/ol>\n"}, {"id": "lec-7", "kind": "lec", "num": 7, "title": "Азыркы бизнес-тренддер жана санариптештирүү", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n1-модуль\n<\/p>\n<p>\nЖК-1, КК-1\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Санариптештирүү бизнес-моделдерди, башкарууну жана корпоративдик маданиятты кантип өзгөртөрүн көрсөтүү; негизги бизнес-тренддерди, ийгиликтүү санариптештирүүнүн мисалдарын, ошондой эле компаниялар туш болгон кыйынчылыктарды кароо.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Бизнести санариптештирүү деген эмне. Индустрия 4.0.<\/li>\n<li>Санариптештирүү доорундагы негизги бизнес-тренддер.<\/li>\n<li>Санариптик бизнес-моделдер.<\/li>\n<li>Бизнестин функцияларында санариптик технологиялардын ролу.<\/li>\n<li>Ийгиликтүү кейстердин мисалдары.<\/li>\n<li>Санариптештирүүнүн башкарууга жана корпоративдик маданиятка таасири.<\/li>\n<li>Санариптештирүүнүн кыйынчылыктары жана чакырыктары.<\/li>\n<\/ol>\n<h2>1. Бизнести санариптештирүү деген эмне<\/h2>\n<p><strong>Бизнести санариптештирүү<\/strong> — натыйжалуулукту, тейлөөнүн сапатын жана атаандаштыкка жөндөмдүүлүктү жогорулатуу үчүн компаниянын процесстерине санариптик технологияларды киргизүү.<\/p>\n<p>Мисалдар: накталай акчанын ордуна электрондук төлөмдөргө жана QR-төлөмгө өтүү; кардарлар менен иштөө үчүн CRM киргизүү; ЖИ жардамы менен сунуштарды жекелештирүү; электрондук документ жүгүртүү жана электрондук кол тамга.<\/p>\n<p><strong>Индустрия 4.0<\/strong> (төртүнчү өнөр жай революциясы) — өнөр жайдын киберфизикалык системалардын, буюмдар интернетинин, чоң маалыматтардын, булуттук эсептөөлөрдүн жана жасалма интеллекттин негизинде «акылдуу» өндүрүшкө өтүшү. Үчүнчү революция айрым операцияларды компьютерлер менен автоматташтырса, төртүнчүсү жабдууну, продукцияны жана адамдарды чечимдер реалдуу убакыттагы маалыматтардын негизинде кабыл алынган бирдиктүү тармакка бириктирет.<\/p>\n<h2>2. Негизги бизнес-тренддер<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Тренд<\/th>\n<th>Мазмуну<\/th>\n<th>Мисал<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Маалыматтар стратегиялык актив катары<\/td>\n<td>Чечимдер маалыматтарды талдоонун негизинде кабыл алынат (data-driven)<\/td>\n<td>Ритейлер ассортиментти чектердин маалыматтары боюнча пландайт<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Процесстерди автоматташтыруу<\/td>\n<td>RPA-роботтор жана ЖИ күнүмдүк операцияларды аткарат<\/td>\n<td>Эсеп-дүмүрчөктөрдү автоматтык салыштыруу<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Омниканалдуулук<\/td>\n<td>Бардык каналдарда бирдиктүү кардар тажрыйбасы<\/td>\n<td>Онлайн буйрутма — дүкөндөн алуу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ЖИ жана машиналык окутуу<\/td>\n<td>Болжолдор, сунуштар, чат-боттор<\/td>\n<td>Онлайн-кинотеатрдагы жеке сунуштар<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Платформалар жана экосистемалар<\/td>\n<td>Бизнес рыноктун катышуучуларын бириктирип, кызматтардын байланышкан топтомун түзөт<\/td>\n<td>Маркетплейстер, банктардын «супертиркемелери»<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Алыстан жана гибриддик иштөө<\/td>\n<td>Кызматкерлер каалаган жерден иштешет<\/td>\n<td>Булуттук кеңсе пакеттери, видеобайланыш<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Туруктуу өнүгүү жана «жашыл» ИТ<\/td>\n<td>Энергия керектөөнү жана экологиялык изди азайтуу<\/td>\n<td>Энергияны үнөмдөөчү маалыматтарды иштетүү борборлору<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Жекелештирүү<\/td>\n<td>Конкреттүү кардарга ылайыкталган сунуш<\/td>\n<td>Дүкөндүн тиркемесиндеги жеке арзандатуулар<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Санариптик бизнес-моделдер<\/h2>\n<ul>\n<li><strong>Электрондук коммерция<\/strong> — товарларды жана кызматтарды интернет аркылуу сатуу.<\/li>\n<li><strong>Платформалык модель<\/strong> — компания товар өндүрбөйт, сатуучуларды жана сатып алуучуларды бириктирип, комиссиядан киреше табат (Uber, Airbnb, маркетплейстер).<\/li>\n<li><strong>Жазылуу (subscription)<\/strong> — кызматка жетүү үчүн үзгүлтүксүз төлөм (Netflix, Spotify, булуттук программалар).<\/li>\n<li><strong>Freemium<\/strong> — базалык функциялар акысыз, кеңейтилгендери — акылуу.<\/li>\n<li><strong>Биргелешип керектөө экономикасы<\/strong> — ээлик кылуунун ордуна ижара (каршеринг, самокаттар).<\/li>\n<li><strong>Санариптик продуктылар<\/strong> — электрондук китептер, программалар, онлайн-курстар: чыгымсыз көчүрүлөт жана кампасыз сатылат.<\/li>\n<\/ul>\n<h2>4. Бизнестин функцияларында санариптик технологиялардын ролу<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Функция<\/th>\n<th>Санариптик чечимдер<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Башкаруу<\/td>\n<td>ERP, BI-дашборддор, электрондук документ жүгүртүү<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Маркетинг<\/td>\n<td>Аналитика, социалдык тармактар, таргеттелген жарнама, CRM<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Өндүрүш<\/td>\n<td>Өнөр жайлык IoT, роботташтыруу, санариптик эгиздер<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Логистика<\/td>\n<td>GPS-трекинг, маршруттарды оптималдаштыруу, кампаны автоматташтыруу<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Финансы<\/td>\n<td>Онлайн-банкинг, автоматташтырылган отчёттуулук, ЖИ-скоринг<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Персонал<\/td>\n<td>HRM, онлайн-окутуу, алыстан иштөө<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. Санариптештирүүнүн ийгиликтүү кейстеринин мисалдары<\/h2>\n<ol type=\"1\">\n<li><strong>Amazon<\/strong> — сунуштар үчүн чоң маалыматтар, роботташтырылган кампалар, өз алдынча бизнеске айланган AWS булуттук платформасы.<\/li>\n<li><strong>Netflix<\/strong> — DVDлерди почта аркылуу ижарага берүүдөн агымдык видеого жана көрүүчүлөрдүн каалоолорун талдоонун негизинде өз контентин өндүрүүгө өтүү.<\/li>\n<li><strong>Tesla<\/strong> — автомобиль программа менен башкарылуучу түзүлүш катары: «аба аркылуу» жаңыртуулар, айдоочуга жардам системалары үчүн маалыматтарды чогултуу.<\/li>\n<li><strong>Starbucks<\/strong> — алдын ала буйрутма, төлөм жана берилгендик программасы бар мобилдик тиркеме; сатып алуулардын тарыхынын негизинде жеке сунуштар.<\/li>\n<\/ol>\n<p>Жергиликтүү контекст: Кыргызстанда мобилдик капчыктар жана QR-төлөмдөр, онлайн-банкинг, жеткирүү кызматтары жана такси-агрегаторлор, электрондук мамлекеттик кызматтар кеңири тараган.<\/p>\n<h2>6. Башкарууга жана корпоративдик маданиятка таасири<\/h2>\n<p><strong>Башкаруудагы өзгөрүүлөр<\/strong>: катуу вертикалдык иерархиядан ийкемдүү командаларга өтүү; дашборддордун аркасында процесстердин ачык-айкындуулугу; маалыматтардын негизинде башкаруу; чечим кабыл алуу циклинин ылдамдашы.<\/p>\n<p><strong>Маданияттагы өзгөрүүлөр<\/strong>: санариптик сабаттуулук бардык кызматкерлер үчүн милдеттүү болуп калат; ИТ-куралдар жана маалыматтар менен иштөө көндүмдөрү бааланат; гибриддик командалар жайылат; эксперименттер жана идеяларды тез текшерүү колдоого алынат.<\/p>\n<h2>7. Санариптештирүүнүн кыйынчылыктары жана чакырыктары<\/h2>\n<ol type=\"1\">\n<li><strong>Финансылык чыгымдар<\/strong> — жабдуу, лицензиялар, интеграция, окутуу.<\/li>\n<li><strong>Өзгөрүүлөргө каршылык<\/strong> — жумушунан ажырап калуудан коркуу, эски процесстерге көнүү.<\/li>\n<li><strong>Коопсуздук тобокелдиктери<\/strong> — маалыматтардын агып кетиши, кибер чабуулдар.<\/li>\n<li><strong>Квалификациялуу кадрлардын жетишсиздиги<\/strong> — аналитиктер, иштеп чыгуучулар, коопсуздук адистери.<\/li>\n<li><strong>Санариптештирүү үчүн санариптештирүү<\/strong> — бизнес-максатсыз технологияларды киргизүү, натыйжасыз процесс автоматташтырылганда.<\/li>\n<\/ol>\n<blockquote>\n<p>Жакшы эреже: адегенде процессти жакшыртуу, андан кийин аны автоматташтыруу.<\/p>\n<\/blockquote>\n<h2>8. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Компанияны (Amazon, Netflix, Tesla же жергиликтүү) тандап, сүрөттөңүз: ал кандай технологияларды колдонот, ар бири кандай маселени чечет жана кандай натыйжа алынган.<\/li>\n<li>Чакан бизнес (кафе, дүкөн, салон) үчүн кыскача санариптештирүү стратегиясын даярдаңыз: 3–5 кадам, керектүү куралдар, күтүлгөн жыйынтыктар.<\/li>\n<\/ol>\n<h2>9. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Индустрия 4.0 деген эмне?<\/li>\n<li>Санариптештирүү доорунун беш негизги бизнес-трендин атаңыз.<\/li>\n<li>Платформалык бизнес-модель салттуудан эмнеси менен айырмаланат?<\/li>\n<li>Санариптештирүү менеджердин ролун кантип өзгөртөт?<\/li>\n<li>Эмне үчүн натыйжасыз процессти автоматташтыруу коркунучтуу?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Бизнести санариптештирүү · Индустрия 4.0 · data-driven · омниканалдуулук · платформа · экосистема · жазылуу · freemium · RPA · санариптик маданият · өзгөрүүлөргө каршылык.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Котлер Ф. Маркетинг 5.0: технологии для человечности. — М. : Альпина, 2021.<\/li>\n<li>Прохоров А., Коник Л. Цифровая трансформация: анализ, тренды, мировой опыт. — 2021.<\/li>\n<\/ol>\n"}, {"id": "lec-8", "kind": "lec", "num": 8, "title": "Санариптештирүү үчүн ишканаларды долбоорлоонун методологиясы", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n2-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Студенттерди санариптештирүү шартында ишкананы долбоорлоонун ыкмалары менен тааныштыруу: долбоорлоонун баскычтары, методологиялар (системалык жана процесстик мамилелер, Agile, Lean, дизайн-ой жүгүртүү), ишкананын архитектурасы жана бизнес-процесстерди моделдөө куралдары.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Ишканаларды долбоорлоо түшүнүгү жана маңызы.<\/li>\n<li>Санариптештирүү ишкананын трансформациясынын фактору катары.<\/li>\n<li>Санариптештирүү үчүн долбоорлоонун негизги баскычтары.<\/li>\n<li>Санариптик долбоорлоонун методологиялары.<\/li>\n<li>Ишкананын архитектурасы: TOGAF, Zachman.<\/li>\n<li>Бизнес-процесстерди моделдөө: BPMN.<\/li>\n<li>Корпоративдик маалыматтык системалар.<\/li>\n<li>Кейстер, тобокелдиктер жана чакырыктар.<\/li>\n<\/ol>\n<h2>1. Ишканаларды долбоорлоо түшүнүгү<\/h2>\n<p><strong>Ишкананы долбоорлоо<\/strong> — уюмдун стратегиялык максаттарына жетүү үчүн анын түзүмүн, бизнес-процесстерин, маалыматтык системаларын жана технологияларын түзүү же өзгөртүү процесси.<\/p>\n<p>Принциптер:<\/p>\n<ul>\n<li><strong>системалык мамиле<\/strong> — ишкана өз ара байланышкан элементтердин бүтүн системасы катары каралат: бирөөнүн (мисалы, ИТ-системанын) өзгөрүшү башкаларына (процесстерге, адамдарга, түзүмгө) таасир этет;<\/li>\n<li><strong>максатка багытталуу<\/strong> — ар бир долбоордук чечим бизнестин өлчөнүүчү максатына алып барышы керек;<\/li>\n<li><strong>ийкемдүүлүк жана адаптациялануучулук<\/strong> — рыноктун жана технологиялардын тез өзгөрүүлөрүн эске алуу.<\/li>\n<\/ul>\n<h2>2. Санариптештирүү трансформациянын фактору катары<\/h2>\n<p>Санариптештирүү жаңы санариптик бизнес-моделдерди түзүүгө, автоматташтыруунун эсебинен процесстердин натыйжалуулугун жогорулатууга, реалдуу убакыттагы маалыматтардын аркасында чечим кабыл алууну тездетүүгө, бөлүмдөрдү жана өнөктөштөрдү бирдиктүү маалыматтык чөйрөгө бириктирүүгө мүмкүндүк берет.<\/p>\n<h2>3. Санариптештирүү үчүн долбоорлоонун баскычтары<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Баскыч<\/th>\n<th>Мазмуну<\/th>\n<th>Жыйынтыгы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Учурдагы абалды талдоо (AS-IS)<\/td>\n<td>Процесстерди, системаларды, маалыматтарды сүрөттөө; «тар жерлерди» издөө; санариптик жетилгендикти баалоо<\/td>\n<td>Процесстердин картасы жана көйгөйлөрдүн тизмеси<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2. Санариптик стратегияны иштеп чыгуу<\/td>\n<td>Максаттар, артыкчылыктар, бюджет, негизги көрсөткүчтөр<\/td>\n<td>Санариптештирүүнүн жол картасы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3. Процесстерди долбоорлоо (TO-BE)<\/td>\n<td>Технологиялардын мүмкүнчүлүктөрүн эске алган жаңы процесстер<\/td>\n<td>Максаттуу процесстердин моделдери<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4. Технологияларды киргизүү<\/td>\n<td>Системаларды тандоо жана жөндөө, интеграция, маалыматтарды көчүрүү, окутуу<\/td>\n<td>Иштеп жаткан системалар<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5. Мониторинг жана адаптация<\/td>\n<td>KPIни көзөмөлдөө, кайтарым байланышты чогултуу, жакшыртуулар<\/td>\n<td>Отчёттор, жакшыртуу планы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>4. Санариптик долбоорлоонун методологиялары<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Методология<\/th>\n<th>Негизги идея<\/th>\n<th>Качан колдонуу керек<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Системалык мамиле<\/td>\n<td>Ишкана өз ара байланышкан элементтердин системасы катары<\/td>\n<td>Дайыма — жалпы алкак катары<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Процесстик мамиле (BPM)<\/td>\n<td>Айрым функцияларды эмес, аягына чейинки бизнес-процесстерди башкаруу<\/td>\n<td>Операцияларды оптималдаштыруу, ERP киргизүү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Реинжиниринг (BPR)<\/td>\n<td>Процесстерди түп-тамырынан кайра долбоорлоо (М. Хаммер, Дж. Чампи)<\/td>\n<td>Акырындык менен жакшыртуу натыйжа бербегенде<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Agile (Scrum, Kanban)<\/td>\n<td>Кыска итерациялар, тез-тез кайтарым байланыш, ийкемдүү командалар<\/td>\n<td>Белгисиздик шартында санариптик продуктыларды иштеп чыгуу<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lean (үнөмдүү башкаруу)<\/td>\n<td>Жоготууларды жоюу: күтүүлөр, ашыкча операциялар, кайра жасоолор<\/td>\n<td>Өндүрүш, тейлөө процесстери<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Design Thinking<\/td>\n<td>Адамдын муктаждыктарынан баштап долбоорлоо: эмпатия → көйгөйдү аныктоо → идеялар → прототип → тест<\/td>\n<td>Жаңы кызматтар жана кардар тажрыйбасы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. Ишкананын архитектурасы<\/h2>\n<p><strong>Ишкананын архитектурасы (Enterprise Architecture, EA)<\/strong> — стратегиянын, бизнес-процесстердин, маалыматтардын, тиркемелердин жана технологиялардын байланышын көрсөткөн уюмдун бүтүн сүрөттөмөсү. Ал ИТни бизнестин максаттары менен шайкеш келтирүүгө жана өзгөрүүлөрдү башкарууга жардам берет.<\/p>\n<p><strong>Архитектуранын деңгээлдери (домендери)<\/strong><\/p>\n<ol type=\"1\">\n<li><em>Бизнес-архитектура<\/em> — максаттар, бизнес-функциялар, процесстер, уюштуруучулук түзүм.<\/li>\n<li><em>Маалыматтардын архитектурасы<\/em> — кандай маалыматтар бар, кайда сакталат, ким аларга ээлик кылат.<\/li>\n<li><em>Тиркемелердин архитектурасы<\/em> — маалыматтык системалар жана алардын өз ара аракеттенүүсү.<\/li>\n<li><em>Технологиялык архитектура<\/em> — серверлер, тармактар, булуттар, коопсуздук каражаттары.<\/li>\n<\/ol>\n<p><strong>TOGAF<\/strong> (The Open Group Architecture Framework) — эң кеңири тараган методология. Анын негизи — <strong>ADM<\/strong> (Architecture Development Method) цикли: алдын ала фаза → A. Архитектуранын көрүнүшү → B. Бизнес-архитектура → C. Маалыматтык системалардын архитектурасы (маалыматтар жана тиркемелер) → D. Технологиялык архитектура → E. Мүмкүнчүлүктөр жана чечимдер → F. Миграцияны пландоо → G. Киргизүүнү башкаруу → H. Архитектуранын өзгөрүүлөрүн башкаруу. Циклдин борборунда — талаптарды башкаруу.<\/p>\n<p><strong>Zachman Framework<\/strong> — 6×6 матрица: «Эмне? Кантип? Кайда? Ким? Качан? Эмне үчүн?» суроолору көз караштар (жетекчиден аткаруучуга чейин) менен кесилишет. Архитектуралык сүрөттөмөлөрдү классификациялоого жардам берет.<\/p>\n<h2>6. Бизнес-процесстерди моделдөө: BPMN<\/h2>\n<p><strong>BPMN (Business Process Model and Notation)<\/strong> — бизнеске да, ИТ-адистерге да түшүнүктүү болгон бизнес-процесстерди сүрөттөөнүн эл аралык графикалык нотациясы.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>BPMN элементи<\/th>\n<th>Белгиси<\/th>\n<th>Мааниси<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Окуя<\/td>\n<td>Тегерек<\/td>\n<td>Башталыш, аралык окуя, аяктоо<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Тапшырма (аракет)<\/td>\n<td>Бурчтары тегеректелген тик бурчтук<\/td>\n<td>Катышуучу аткарган иш<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Шлюз<\/td>\n<td>Ромб<\/td>\n<td>Агымдарды тармактоо же бириктирүү («ооба/жок» шарты)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Башкаруу агымы<\/td>\n<td>Тутумдаш жебе<\/td>\n<td>Аткаруунун тартиби<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Бассейн жана жолчолор<\/td>\n<td>Туурасынан кеткен тилкелер<\/td>\n<td>Катышуучулар жана алардын жоопкерчилик аймактары<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Маалымат объекти<\/td>\n<td>Бурчу бүктөлгөн барак<\/td>\n<td>Документ же маалыматтар<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>«Буйрутманы иштетүү» процессинин мисалы<\/em>: буйрутма алынды → товардын бар-жогун текшерүү → «товар барбы?» шлюзу → ооба: эсеп-дүмүрчөк берүү → төлөм алуу → жөнөтүү; жок: кардарга жеткирүү мөөнөттөрүн билдирүү.<\/p>\n<p><strong>Моделдөө куралдары<\/strong>: Bizagi Modeler, Camunda Modeler, draw.io, Microsoft Visio, ARIS; архитектура үчүн — Archi (ArchiMate тили).<\/p>\n<h2>7. Корпоративдик маалыматтык системалар<\/h2>\n<p><strong>Корпоративдик маалыматтык система (КМС)<\/strong> — ишкананын ресурстарын жана процесстерин башкарууну автоматташтырган интеграцияланган система.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>КМС классы<\/th>\n<th>Арналышы<\/th>\n<th>Мисалдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>ERP<\/td>\n<td>Ишкананын ресурстарын пландоо: финансы, сатып алуу, кампа, өндүрүш, персонал<\/td>\n<td>SAP S/4HANA, Oracle NetSuite, Microsoft Dynamics, 1С:ERP<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CRM<\/td>\n<td>Кардарлар менен мамилелерди башкаруу: сатуу, маркетинг, тейлөө<\/td>\n<td>Salesforce, Bitrix24, amoCRM<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SCM<\/td>\n<td>Жеткирүү чынжырларын башкаруу<\/td>\n<td>SAP SCM, Oracle SCM Cloud<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>HRM<\/td>\n<td>Персоналды башкаруу<\/td>\n<td>SAP SuccessFactors, 1С:ЗУП<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>BI<\/td>\n<td>Бизнес-аналитика жана отчёттуулук<\/td>\n<td>Power BI, Tableau<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ECM / ЭДЖ<\/td>\n<td>Электрондук документ жүгүртүү<\/td>\n<td>Directum, «Дело»<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>8. Кейстер, тобокелдиктер жана чакырыктар<\/h2>\n<ul>\n<li><strong>Siemens<\/strong> — Ambergдеги «санариптик фабрика»: продукция жана жабдуу бирдиктүү системага туташтырылган, операциялардын көпчүлүгү автоматташтырылган, брактын деңгээли өтө төмөн.<\/li>\n<li><strong>Uber<\/strong> — геолокацияга, тандоо жана динамикалык баа коюу алгоритмдерине курулган платформа.<\/li>\n<li><strong>Zara<\/strong> — дүкөндөрдөн сатуу маалыматтары күн сайын борборго келип, кайсы моделдерди өндүрүү керектигин аныктайт: «эскизден текчеге чейинки» цикл — бир нече жума.<\/li>\n<\/ul>\n<p><strong>Тобокелдиктер<\/strong>: эски системаларды интеграциялоонун техникалык татаалдыктары; бюджеттен ашып кетүү; кибер чабуулдар; адам фактору — каршылык жана көндүмдөрдүн жетишсиздиги.<\/p>\n<h2>9. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>«Студентти факультативдик курска жазуу» процессин BPMNде сүрөттөңүз (катышуучулар: студент, деканат, окутуучу).<\/li>\n<li>Гипотетикалык ишкана үчүн санариптештирүүнүн үч баскычын сунуштап, ар бир баскычта кандай КМС керектигин көрсөтүңүз.<\/li>\n<\/ol>\n<h2>10. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Санариптештирүү үчүн ишкананы долбоорлоо кандай баскычтарды камтыйт?<\/li>\n<li>Процесстик мамиле функционалдык мамиледен эмнеси менен айырмаланат?<\/li>\n<li>Ишкананын архитектурасынын деңгээлдерин атаңыз.<\/li>\n<li>TOGAFтагы ADM цикли деген эмне?<\/li>\n<li>BPMNдин кандай элементтерин билесиз?<\/li>\n<li>ERP CRMден эмнеси менен айырмаланат?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Ишкананы долбоорлоо · AS-IS / TO-BE · процесстик мамиле · BPR · Agile · Lean · Design Thinking · ишкананын архитектурасы · TOGAF · ADM · Zachman · BPMN · КМС · ERP · CRM · SCM.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Хаммер М., Чампи Дж. Реинжиниринг корпорации: манифест революции в бизнесе. — М. : Манн, Иванов и Фербер, 2020.<\/li>\n<li>BPMN спецификациясы. — omg.org/bpmn.<\/li>\n<li>The Open Group. TOGAF Standard. — opengroup.org.<\/li>\n<\/ol>\n"}, {"id": "lec-9", "kind": "lec", "num": 9, "title": "Санариптик коопсуздук жана маалыматты коргоо", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n2-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Санариптик коопсуздуктун негизги коркунучтары, маалыматты коргоонун принциптери жана ыкмалары, стандарттардын жана мыйзамдардын ролу, ошондой эле санариптик чөйрөдө коопсуз иштөөнүн базалык эрежелери жөнүндө түшүнүк калыптандыруу.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Санариптик коопсуздук түшүнүгү жана анын мааниси.<\/li>\n<li>Негизги коркунучтар.<\/li>\n<li>Маалыматты коргоонун принциптери (CIA триадасы).<\/li>\n<li>Коргоо ыкмалары: уюштуруучулук, техникалык, укуктук.<\/li>\n<li>Башкарууда жана бизнесте санариптик коопсуздук.<\/li>\n<li>Стандарттар жана мыйзамдар.<\/li>\n<li>Тренддер жана чакырыктар.<\/li>\n<\/ol>\n<h2>1. Санариптик коопсуздук түшүнүгү<\/h2>\n<p><strong>Киберкоопсуздук (санариптик коопсуздук)<\/strong> — маалыматтык системаларды, тармактарды, программаларды жана маалыматтарды чабуулдардан, уруксатсыз жетүүдөн, бузулуудан жана жоготуудан коргоо.<\/p>\n<p>Мааниси: жеке жана коммерциялык маалыматтарды коргоо; бизнес-процесстердин үзгүлтүксүздүгү; кардарлардын жана өнөктөштөрдүн ишеними; мыйзамды сактоо жана айыптардан качуу.<\/p>\n<p><strong>Кибертуруктуулук<\/strong> — уюмдун чабуул учурунда иштөөнү уланта алуу жана андан кийин тез калыбына келүү жөндөмдүүлүгү. Ал камдык көчүрмө, калыбына келтирүү пландары жана системаларды кайталоо аркылуу камсыз кылынат.<\/p>\n<h2>2. Негизги коркунучтар<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Коркунуч<\/th>\n<th>Маңызы<\/th>\n<th>Мисал<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Зыяндуу ПК (malware)<\/td>\n<td>Зыян келтирүүчү программалар: вирустар, курттар, трояндар, шпиондук программалар<\/td>\n<td>Троян браузерден сырсөздөрдү уурдайт<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Опузалоочу программалар (ransomware)<\/td>\n<td>Файлдарды шифрлеп, кун талап кылат<\/td>\n<td>Ооруканаларга жана муниципалитеттерге чабуулдар<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Фишинг<\/td>\n<td>Сырсөздөрдү жана карталардын маалыматтарын алдап алган жасалма каттар жана сайттар<\/td>\n<td>Жасалма кирүү барагына шилтемеси бар «банктан» кат<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Социалдык инженерия<\/td>\n<td>Техниканы бузуу эмес, адамдарды манипуляциялоо<\/td>\n<td>SMSтеги кодду айтууну суранган «банктын коопсуздук кызматынан» чалуу<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DDoS-чабуул<\/td>\n<td>Көптөгөн түзүлүштөрдөн эбегейсиз көп сурам менен серверди ашыкча жүктөө<\/td>\n<td>Арзандатуу күнү дүкөндүн сайты иштебей калат<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>SQL-инъекция<\/td>\n<td>Сайттын киргизүү талаалары аркылуу зыяндуу SQL-кодду киргизүү<\/td>\n<td>Кардарлардын базасына жетүү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Инсайдердик коркунучтар<\/td>\n<td>Кызматкерлердин аракеттери — атайылап же этиятсыздыктан<\/td>\n<td>Кызматкер кардарлардын базасын флешкага көчүрүп чыгат<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Маалыматтардын агып кетиши<\/td>\n<td>Маалыматтын уруксатсыз ачыкка чыгышы<\/td>\n<td>Миллиондогон колдонуучулардын жеке маалыматтарынын жарыяланышы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>Ийгиликтүү чабуулдардын көбү адам факторунан башталат: алсыз сырсөз, шилтемеге өтүү, кодду бөтөн адамга айтуу.<\/p>\n<\/blockquote>\n<h2>3. Маалыматты коргоонун принциптери<\/h2>\n<p>Негизи — <strong>CIA триадасы<\/strong>:<\/p>\n<ul>\n<li><strong>Купуялуулук (Confidentiality)<\/strong> — маалыматка ыйгарым укуктуу адамдар гана жете алат.<\/li>\n<li><strong>Бүтүндүк (Integrity)<\/strong> — маалымат мыйзамсыз өзгөртүлгөн эмес жана так бойдон калат.<\/li>\n<li><strong>Жеткиликтүүлүк (Availability)<\/strong> — маалымат жана системалар керек болгон учурда жеткиликтүү.<\/li>\n<\/ul>\n<p>Кошумча принциптер: <strong>аутентификация<\/strong> (колдонуучунун инсандыгын ырастоо), <strong>авторизация<\/strong> (укуктарды берүү), <strong>баш тартпоо<\/strong> (жасалган аракеттен баш тартуу мүмкүн эмес — электрондук кол тамга менен камсыз кылынат), <strong>минималдуу артыкчылыктар<\/strong> (ар ким керектүү укуктарды гана алат).<\/p>\n<h2>4. Маалыматты коргоонун ыкмалары<\/h2>\n<p><strong>Уюштуруучулук чаралар<\/strong>: маалыматтык коопсуздук саясаты; жетүү укуктарын чектөө; кызматкерлерди окутуу; сырсөздөр жана алып жүрүүчүлөр менен иштөө боюнча нускамалар; жооптуу адамды дайындоо (CISO — МК кызматынын жетекчиси); инциденттерге жооп кайтаруунун регламенти.<\/p>\n<p><strong>Техникалык чаралар<\/strong><\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Каражат<\/th>\n<th>Арналышы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Шифрлөө<\/td>\n<td>Маалыматтарды ачкычсыз жеткиликсиз түргө айландыруу. Симметриялык (бир ачкыч, AES) жана асимметриялык (ачык/жабык ачкычтардын жубу, RSA)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TLS/SSL, HTTPS<\/td>\n<td>Тармак аркылуу берүүдө маалыматтарды шифрлөө<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Көп факторлуу аутентификация (MFA, 2FA)<\/td>\n<td>Эки жана андан көп фактор менен кирүү: билим (сырсөз), ээлик (телефон, токен), биометрия<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Брандмауэр (файрвол)<\/td>\n<td>Эрежелер боюнча тармактардын ортосундагы трафикти чыпкалоо жана көзөмөлдөө<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Антивирустар жана EDR<\/td>\n<td>Зыяндуу программаларды аныктоо жана бөгөттөө<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>VPN<\/td>\n<td>Алыстан иштөө үчүн интернет аркылуу корголгон канал<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Камдык көчүрмө<\/td>\n<td>Иштен чыгуудан же чабуулдан кийин маалыматтарды калыбына келтирүү (3-2-1 эрежеси: үч көчүрмө, алып жүрүүчүлөрдүн эки түрү, бир көчүрмө кеңседен тышкары)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ПКны жаңыртуу<\/td>\n<td>Белгилүү алсыз жерлерди жоюу<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Мониторинг системалары (SIEM)<\/td>\n<td>Коопсуздук окуяларын чогултуу жана талдоо<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Укуктук чаралар<\/strong>: ачыкка чыгарбоо жөнүндө келишимдер (NDA); жеке маалыматтар жөнүндө мыйзамдарды сактоо; бузуулар үчүн жоопкерчилик.<\/p>\n<p><strong>Ишенимдүү сырсөздүн белгилери<\/strong>: кеминде 12 белги; ар кандай регистрдеги тамгалардын, сандардын жана белгилердин айкалышы; сөздүктөгү сөз же жеке маалымат эмес; ар бир кызмат үчүн өз сырсөзү; сырсөздөр менеджеринде сактоо.<\/p>\n<h2>5. Башкарууда жана бизнесте санариптик коопсуздук<\/h2>\n<ol type=\"1\">\n<li><strong>Тобокелдиктерди башкаруу<\/strong> — коркунучтардын ыктымалдуулугун жана зыянын баалоо, коргоо чараларын тандоо.<\/li>\n<li><strong>Мыйзамдарга шайкештик<\/strong> — кардарлардын жана кызматкерлердин жеке маалыматтарын коргоо.<\/li>\n<li><strong>Интеллектуалдык менчикти коргоо<\/strong> — коммерциялык сыр, баштапкы код, иштеп чыгуулар.<\/li>\n<li><strong>Бизнестин үзгүлтүксүздүгү<\/strong> — инциденттерден кийин калыбына келтирүү пландары.<\/li>\n<li><strong>Киберкамсыздандыруу<\/strong> — кибер чабуулдардан келген зыянды камсыздандыруу.<\/li>\n<\/ol>\n<h2>6. Стандарттар жана мыйзамдар<\/h2>\n<ul>\n<li><strong>ISO/IEC 27001<\/strong> — маалыматтык коопсуздукту башкаруу системасынын (МКБС) эл аралык стандарты.<\/li>\n<li><strong>ISO/IEC 27002<\/strong> — практикалардын жана коргоо чараларынын жыйнагы.<\/li>\n<li><strong>NIST Cybersecurity Framework<\/strong> — функциялары: аныктоо, коргоо, табуу, жооп кайтаруу, калыбына келтирүү.<\/li>\n<li><strong>PCI DSS<\/strong> — төлөм карталарынын маалыматтарынын коопсуздук стандарты.<\/li>\n<li><strong>GDPR<\/strong> — Европа Бирлигинин жеке маалыматтарды коргоо боюнча регламенти.<\/li>\n<li><strong>Кыргыз Республикасынын «Жеке мүнөздөгү маалымат жөнүндө» мыйзамы<\/strong> — жеке маалыматтарды чогултуунун, иштетүүнүн жана коргоонун эрежелери; көзөмөлдү жеке маалыматтарды коргоо боюнча ыйгарым укуктуу мамлекеттик орган жүргүзөт.<\/li>\n<\/ul>\n<h2>7. Тренддер жана чакырыктар<\/h2>\n<ul>\n<li>Киберкоопсуздукта ЖИ — аномалияларды аныктоо; ошол эле учурда ЖИни кылмышкерлер да колдонушат (жасалма үндөр жана видеолор — дипфейктер).<\/li>\n<li>Булуттук системаларды коргоо жана «нөлдүк ишеним» (Zero Trust) модели: ар бир жетүүдө ар бир колдонуучуну жана түзүлүштү текшерүү.<\/li>\n<li>Буюмдар интернетинин түзүлүштөрүнө чабуулдар.<\/li>\n<li>Кванттык криптография жана посткванттык алгоритмдер.<\/li>\n<li>«Кызмат катары киберкылмыштуулук» — чабуул үчүн даяр топтомдор даркнетте сатылат.<\/li>\n<\/ul>\n<h2>8. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Маалыматтардын агып кетишинин бир ири инцидентин изилдеңиз (Facebook 2019, Equifax 2017 же башка): себеби, зыяны, көрүлгөн чаралар.<\/li>\n<li>Чакан кеңсе үчүн кыскача коопсуздук саясатын иштеп чыгыңыз: сырсөздөр, жетүү, камдык көчүрмө, окутуу, инцидент учурундагы аракеттер.<\/li>\n<\/ol>\n<h2>9. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>CIA триадасына эмне кирет?<\/li>\n<li>Фишинг DDoS-чабуулдан эмнеси менен айырмаланат?<\/li>\n<li>Эмне үчүн эки факторлуу аутентификация сырсөздөн ишенимдүүрөөк?<\/li>\n<li>Уюштуруучулук коргоо чаралары техникалыктан эмнеси менен айырмаланат?<\/li>\n<li>Маалыматтык коопсуздуктун кандай стандарттарын билесиз?<\/li>\n<li>Кибертуруктуулук деген эмне?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Киберкоопсуздук · кибертуруктуулук · зыяндуу ПК · фишинг · социалдык инженерия · DDoS · CIA триадасы · шифрлөө · MFA · брандмауэр · VPN · ISO/IEC 27001 · жеке маалыматтар · Zero Trust.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>ISO/IEC 27001. Information security management systems.<\/li>\n<li>NIST Cybersecurity Framework. — nist.gov/cyberframework.<\/li>\n<li>Кыргыз Республикасынын «Жеке мүнөздөгү маалымат жөнүндө» мыйзамы. — cbd.minjust.gov.kg.<\/li>\n<\/ol>\n"}, {"id": "lec-10", "kind": "lec", "num": 10, "title": "Булуттук технологиялар", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n2-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Булуттук эсептөөлөр түшүнүгүн, алардын принциптерин, жайгаштыруу жана тейлөө моделдерин (IaaS, PaaS, SaaS), артыкчылыктарын жана тобокелдиктерин, ошондой эле уюмдун булутка өтүү ыкмаларын ачып берүү.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Булуттук технологиялар түшүнүгү.<\/li>\n<li>Булуттун иштөө принциптери.<\/li>\n<li>Жайгаштыруу моделдери: коомдук, жеке, гибриддик булут.<\/li>\n<li>Тейлөө моделдери: IaaS, PaaS, SaaS.<\/li>\n<li>Артыкчылыктар жана чакырыктар.<\/li>\n<li>Бизнесте жана башкарууда колдонуу мисалдары; булутка өтүү.<\/li>\n<li>Тренддер.<\/li>\n<\/ol>\n<h2>1. Булуттук технологиялар түшүнүгү<\/h2>\n<p><strong>Булуттук эсептөөлөр (cloud computing)<\/strong> — эсептөө ресурстарын (серверлерди, сактагычтарды, маалымат базаларын, программаларды) тармак аркылуу суроо боюнча, иш жүзүндө колдонулганы үчүн төлөм менен берүү модели.<\/p>\n<p>Булут өз жабдууларын сатып албастан маалыматтарды сактоого жана иштетүүгө, тиркемелерди ишке киргизүүгө жана эсептөө кубаттуулуктарын көбөйтүүгө мүмкүндүк берет. Булуттун техникалык негизи — <strong>виртуалдаштыруу<\/strong>: маалыматтарды иштетүү борборлорундагы (МИБ) физикалык серверлер көптөгөн виртуалдык машиналарга жана контейнерлерге бөлүнөт.<\/p>\n<h2>2. Булуттун иштөө принциптери<\/h2>\n<p>NIST аныктамасы боюнча булуттун беш мүнөздөмөсү бар:<\/p>\n<ol type=\"1\">\n<li><strong>Суроо боюнча өзүн-өзү тейлөө<\/strong> — колдонуучу ресурстарды веб-консоль аркылуу өзү буйрутма кылат.<\/li>\n<li><strong>Кеңири тармактык жетүү<\/strong> — каалаган түзүлүштөн интернет аркылуу иштөө.<\/li>\n<li><strong>Ресурстарды бириктирүү<\/strong> — бир эле серверлер көптөгөн кардарларды тейлейт (көп колдонуучулуу модель), ошол эле учурда кардарлардын маалыматтары обочолонгон.<\/li>\n<li><strong>Ийкемдүүлүк<\/strong> — жүктөм өскөндө ресурстар тез көбөйөт, азайганда кыскарат.<\/li>\n<li><strong>Өлчөнүүчү кызмат<\/strong> — иш жүзүндө керектелгени үчүн гана төлөө (pay-as-you-go).<\/li>\n<\/ol>\n<h2>3. Жайгаштыруу моделдери<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Модель<\/th>\n<th>Сыпаттамасы<\/th>\n<th>Артыкчылыктары<\/th>\n<th>Кемчиликтери<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Коомдук булут<\/td>\n<td>Провайдердин ресурстары көптөгөн кардарларга жеткиликтүү (AWS, Microsoft Azure, Google Cloud)<\/td>\n<td>Кирүү босогосу төмөн, масштабдалуучулук<\/td>\n<td>Көзөмөл азыраак, провайдерден көз карандылык<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Жеке булут<\/td>\n<td>Бир уюм үчүн булуттук инфраструктура — өзүнүн же ижарага алынган МИБде<\/td>\n<td>Көзөмөл, коопсуздук<\/td>\n<td>Чыгымдар жогору<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Гибриддик булут<\/td>\n<td>Жеке жана коомдук булуттардын айкалышы<\/td>\n<td>Ийкемдүүлүк: маанилүү маалыматтар — ичинде, калганы — коомдукта<\/td>\n<td>Интеграциянын татаалдыгы<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Жамааттык булут<\/td>\n<td>Жалпы милдеттери бар уюмдардын тобу үчүн булут (мисалы, мамлекеттик органдар)<\/td>\n<td>Чыгымдарды бөлүшүү<\/td>\n<td>Жалпы эрежелер керек<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>4. Тейлөө моделдери<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Модель<\/th>\n<th>Провайдер эмнени берет<\/th>\n<th>Кардар эмне кылат<\/th>\n<th>Мисалдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>IaaS (инфраструктура кызмат катары)<\/td>\n<td>Виртуалдык серверлер, тармактар, сактагычтар<\/td>\n<td>ОСти, программаларды орнотот, аларды башкарат<\/td>\n<td>Amazon EC2, Azure Virtual Machines, Google Compute Engine<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>PaaS (платформа кызмат катары)<\/td>\n<td>Тиркемелерди иштеп чыгуу жана ишке киргизүү үчүн платформа: ОС, аткаруу чөйрөлөрү, маалымат базалары<\/td>\n<td>Өз тиркемесин жазат жана жайгаштырат<\/td>\n<td>Google App Engine, Heroku, Azure App Service<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SaaS (программа кызмат катары)<\/td>\n<td>Браузер аркылуу жеткиликтүү даяр тиркеме<\/td>\n<td>Колдонот гана<\/td>\n<td>Google Workspace, Microsoft 365, Zoom, Bitrix24<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>«Кызмат катары пицца» аналогиясы: IaaS — сизге ашкана жана меш берилет, өзүңүз бышырасыз; PaaS — камыр жана меш берилет, сиз ичин саласыз; SaaS — пиццаны даяр алып келишет.<\/p>\n<p>Кошумча моделдер: <strong>DBaaS<\/strong> (маалымат базасы кызмат катары), <strong>FaaS / серверсиз эсептөөлөр<\/strong> (окуя боюнча айрым функцияларды ишке киргизүү — AWS Lambda), <strong>STaaS<\/strong> (сактагыч кызмат катары — Amazon S3, Google Drive).<\/p>\n<h2>5. Артыкчылыктар жана чакырыктар<\/h2>\n<p><strong>Артыкчылыктар<\/strong>: жабдууга капиталдык чыгымдар жок (CAPEX → OPEX); тез масштабдоо; каалаган жерден жетүү; автоматтык жаңыртуулар; ири провайдерлерде жогорку ишенимдүүлүк жана камдоо; жаңы долбоорлорду тез ишке киргизүү.<\/p>\n<p><strong>Чакырыктар жана тобокелдиктер<\/strong>: маалыматтардын коопсуздугу жана купуялуулугу; интернет байланышынан көз карандылык; провайдерден көз карандылык (vendor lock-in); жеке маалыматтарды сактоо ордуна мыйзамдын талаптары; туура эмес жөндөлгөндө чыгымдардын көзөмөлсүз өсүшү.<\/p>\n<p><strong>Бөлүштүрүлгөн жоопкерчилик модели<\/strong>: провайдер <em>булуттун<\/em> коопсуздугуна (МИБ, жабдуу, гипервизор), кардар — <em>булуттагы<\/em> коопсуздукка (өз маалыматтары, эсептик жазуулары, жетүү жөндөөлөрү) жооп берет. Модель канчалык жогору болсо (IaaS → SaaS), провайдер ошончолук көбүн өзүнө алат.<\/p>\n<h2>6. Бизнесте жана башкарууда колдонуу мисалдары<\/h2>\n<ul>\n<li><strong>Чакан бизнес<\/strong> — өз серверисиз булуттук бухгалтерия, CRM жана кеңсе пакети.<\/li>\n<li><strong>Ритейл<\/strong> — интернет-дүкөн «кара жумада» масштабдалат.<\/li>\n<li><strong>Билим берүү<\/strong> — Google Classroom, булуттагы Moodle, видеолекциялар.<\/li>\n<li><strong>Медиа<\/strong> — Netflix AWS инфраструктурасында иштейт.<\/li>\n<li><strong>Мамлекет<\/strong> — электрондук кызматтардын булуттук платформалары.<\/li>\n<\/ul>\n<p><strong>Булутка өтүүнүн баскычтары<\/strong><\/p>\n<ol type=\"1\">\n<li>Аудит: кайсы маалыматтарды жана процесстерди көчүрүүгө болот (документ жүгүртүү, почта, сатууну эсепке алуу, аналитика).<\/li>\n<li>Модельди (SaaS / PaaS / IaaS) жана провайдерди наркы, ишенимдүүлүгү, мыйзамдын талаптары боюнча тандоо.<\/li>\n<li>Бир процессте пилоттук долбоор.<\/li>\n<li>Маалыматтарды баскычтап көчүрүү жана кызматкерлерди окутуу.<\/li>\n<li>Коопсуздукту жөндөө: ролдор жана укуктар, MFA, шифрлөө, камдык көчүрмөлөр.<\/li>\n<li>Чыгымдарды жана өндүрүмдүүлүктү мониторингдөө.<\/li>\n<\/ol>\n<h2>7. Тренддер<\/h2>\n<ul>\n<li><strong>Мультибулут<\/strong> — бир эле учурда бир нече провайдерди колдонуу.<\/li>\n<li><strong>Контейнерлер жана Kubernetes<\/strong> — көчүрүлүүчү тиркемелер.<\/li>\n<li><strong>Четки (edge) жана тумандуу (fog) эсептөөлөр<\/strong> — маалыматтарды IoT түзүлүштөрүнө жакыныраак иштетүү.<\/li>\n<li><strong>Булуттук ЖИ<\/strong> — API аркылуу кепти таануу, которуу, генеративдик моделдердин даяр кызматтары.<\/li>\n<li><strong>«Жашыл» булуттар<\/strong> — кайра жаралуучу энергиядагы МИБ.<\/li>\n<\/ul>\n<h2>8. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Сиз колдонгон 10 кызматты (почта, сактагыч, видеобайланыш, онлайн-редакторлор ж. б.) IaaS, PaaS, SaaS моделдери боюнча классификациялаңыз.<\/li>\n<li>10 кызматкери бар чакан компания үчүн эки булуттук сактагычтын тарифтерин салыштырып, тандооңузду негиздеңиз.<\/li>\n<\/ol>\n<h2>9. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Булуттук эсептөөлөрдүн беш мүнөздөмөсүн атаңыз.<\/li>\n<li>Жеке булут коомдук жана гибриддик булуттан эмнеси менен айырмаланат?<\/li>\n<li>IaaS PaaS жана SaaSтан эмнеси менен айырмаланат? Мисалдарды келтириңиз.<\/li>\n<li>Булуттук технологиялар кандай тобокелдиктер менен байланышкан?<\/li>\n<li>Бөлүштүрүлгөн жоопкерчилик модели деген эмне?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Булуттук эсептөөлөр · виртуалдаштыруу · МИБ · ийкемдүүлүк · pay-as-you-go · коомдук / жеке / гибриддик булут · IaaS · PaaS · SaaS · vendor lock-in · мультибулут · Kubernetes.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>NIST SP 800-145. The NIST Definition of Cloud Computing.<\/li>\n<li>Microsoft Learn: булуттук эсептөөлөрдүн негиздери. — learn.microsoft.com.<\/li>\n<li>AWS Training and Certification. — aws.training.<\/li>\n<\/ol>\n"}, {"id": "lec-11", "kind": "lec", "num": 11, "title": "Машиналык окутуу", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n2-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Студенттерди машиналык окутуунун негиздери менен тааныштыруу: окутуунун түрлөрү, мүнөздүү милдеттер жана алгоритмдер, моделди иштеп чыгуунун баскычтары жана анын сапатынын метрикалары, ошондой эле колдонуу мисалдары жана чектөөлөрү.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Жасалма интеллект жана машиналык окутуу.<\/li>\n<li>Машиналык окутуунун түрлөрү.<\/li>\n<li>Мүнөздүү милдеттер жана алгоритмдер.<\/li>\n<li>Моделди иштеп чыгуунун баскычтары.<\/li>\n<li>Моделдердин сапатын баалоо.<\/li>\n<li>Куралдар.<\/li>\n<li>Колдонулушу, этикасы жана чектөөлөрү.<\/li>\n<\/ol>\n<h2>1. Жасалма интеллект жана машиналык окутуу<\/h2>\n<p><strong>Жасалма интеллект (ЖИ)<\/strong> — адамдын интеллектин талап кылган милдеттерди аткара алган системаларды түзгөн информатиканын тармагы: образдарды жана кепти таануу, тилди түшүнүү, чечим кабыл алуу.<\/p>\n<p><strong>Машиналык окутуу (Machine Learning, ML)<\/strong> — ЖИнин бөлүмү, анда компьютер ачык эрежелер менен программаланбайт, <strong>маалыматтарда окутулат<\/strong>: алгоритм мисалдардан мыйзам ченемдүүлүктөрдү табат жана аларды жаңы маалыматтарга колдонот.<\/p>\n<p><strong>Терең окутуу (Deep Learning)<\/strong> — көп катмарлуу нейрондук тармактардын негизиндеги машиналык окутуунун бөлүмү; сүрөттөр, кеп, текст үчүн колдонулат.<\/p>\n<p>ЖИ ⊃ машиналык окутуу ⊃ терең окутуу.<\/p>\n<p>Салттуу программалоодон айырмасы: салттуу программада <em>маалыматтар + эрежелер → жооп<\/em>; машиналык окутууда <em>маалыматтар + жооптор → эрежелер (модель)<\/em>.<\/p>\n<h2>2. Машиналык окутуунун түрлөрү<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Түрү<\/th>\n<th>Маалыматтар<\/th>\n<th>Милдет<\/th>\n<th>Мисал<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Мугалим менен окутуу (supervised)<\/td>\n<td>Жооптору (белгилери) белгилүү мисалдар<\/td>\n<td>Жаңы объект үчүн жоопту болжолдоо<\/td>\n<td>Арыздардын тарыхы боюнча кардар насыяны кайтарарын болжолдоо<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Мугалимсиз окутуу (unsupervised)<\/td>\n<td>Белгиси жок маалыматтар<\/td>\n<td>Түзүмдү табуу: топтор, аномалиялар<\/td>\n<td>Сатып алуучуларды жүрүм-туруму боюнча сегменттөө<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Бекемдөө менен окутуу (reinforcement)<\/td>\n<td>Агент чөйрөдө аракеттенип, сыйлык жана жаза алат<\/td>\n<td>Сыйлыкты максималдаштырган стратегияны иштеп чыгуу<\/td>\n<td>Роботту басууга үйрөтүү, оюн ЖИлери, светофорлорду башкаруу<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Мүнөздүү милдеттер жана алгоритмдер<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Милдет<\/th>\n<th>Эмне болжолдонот<\/th>\n<th>Алгоритмдер<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Регрессия<\/td>\n<td>Сан (баа, суроо-талап, температура)<\/td>\n<td>Сызыктуу регрессия, чечимдер дарактары, градиенттик бустинг<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Классификация<\/td>\n<td>Класс (спам / спам эмес, кетет / калат)<\/td>\n<td>Логистикалык регрессия, чечимдер дарагы, кокус токой, таяныч векторлор ыкмасы (SVM), k жакынкы кошуна<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Кластерлөө<\/td>\n<td>Окшош объекттердин топтору<\/td>\n<td>k-орточолор (k-means), иерархиялык кластерлөө, DBSCAN<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ассоциацияларды издөө<\/td>\n<td>Чогуу кездешкен элементтер<\/td>\n<td>Apriori (базар себетин талдоо)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Аномалияларды аныктоо<\/td>\n<td>Мүнөздүү эмес объекттер<\/td>\n<td>Isolation Forest, статистикалык ыкмалар<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Өлчөмдүүлүктү азайтуу<\/td>\n<td>Маалыматтарды кысылган көрсөтүү<\/td>\n<td>Негизги компоненттер ыкмасы (PCA)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Сызыктуу регрессия<\/strong> маалымат чекиттери аркылуу эң жакшы өткөн <em>y = a + b·x<\/em> түз сызыгын курат (эң кичине квадраттар ыкмасы). Мисалы, <em>x<\/em> — жарнамага чыгымдар, <em>y<\/em> — сатуу.<\/p>\n<p><strong>Чечимдер дарагы<\/strong> суроолордун удаалаштыгын берет («киреше &gt; 30 000?», «мөөнөтү өткөн карыздар барбы?») жана дарактын жалбырагындагы жоопко алып барат; оңой чечмеленет.<\/p>\n<p><strong>Нейрондук тармак<\/strong> жасалма нейрондордун катмарларынан турат; ар бир нейрон кирүүлөрдү салмактап кошуп, активдештирүү функциясын колдонот. Окутуу — салмактарды тандоо.<\/p>\n<h2>4. Моделди иштеп чыгуунун баскычтары<\/h2>\n<ol type=\"1\">\n<li><strong>Милдетти коюу<\/strong> — кайсы бизнес-суроону чечебиз, ийгиликтин кайсы метрикасы.<\/li>\n<li><strong>Маалыматтарды чогултуу<\/strong> — сатуунун тарыхы, кардарлардын маалыматтары, тышкы факторлор.<\/li>\n<li><strong>Маалыматтарды даярдоо<\/strong> — тазалоо, боштуктарды толтуруу, категорияларды коддоо, нормалаштыруу, белгилерди түзүү.<\/li>\n<li><strong>Тандоону бөлүү<\/strong> — окутуучу (адатта 70–80 %) жана тесттик (20–30 %) бөлүктөр.<\/li>\n<li><strong>Моделди окутуу<\/strong> — окутуучу тандоодо алгоритмдин параметрлерин тандоо.<\/li>\n<li><strong>Баалоо<\/strong> — модель көрбөгөн тесттик маалыматтарда текшерүү.<\/li>\n<li><strong>Киргизүү<\/strong> — системага интеграциялоо (сайт, CRM, тиркеме).<\/li>\n<li><strong>Мониторинг<\/strong> — сапатты көзөмөлдөө: убакыт өткөн сайын маалыматтар өзгөрөт, моделди кайра окутууга туура келет.<\/li>\n<\/ol>\n<p><strong>Ашыкча окутуу (overfitting)<\/strong> — модель окутуучу мисалдарды ызы-чуусу менен кошо «жаттап алган» жана жаңы маалыматтарда начар иштейт. <strong>Жетишсиз окутуу<\/strong> — модель өтө жөнөкөй жана мыйзам ченемдүүлүктөрдү кармай албайт.<\/p>\n<h2>5. Моделдердин сапатын баалоо<\/h2>\n<p><strong>Регрессия үчүн<\/strong>: MAE — орточо абсолюттук ката; RMSE — орточо квадраттык катанын тамыры (чоң каталарды катуураак жазалайт); R² — түшүндүрүлгөн дисперсиянын үлүшү (1ге канчалык жакын болсо, ошончолук жакшы).<\/p>\n<p><strong>Классификация үчүн<\/strong> <strong>каталар матрицасы<\/strong> колдонулат:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Божомол «ооба»<\/th>\n<th>Божомол «жок»<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Иш жүзүндө «ооба»<\/td>\n<td>TP — чыныгы оң<\/td>\n<td>FN — жалган терс<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Иш жүзүндө «жок»<\/td>\n<td>FP — жалган оң<\/td>\n<td>TN — чыныгы терс<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><em>Accuracy (жалпы тактык)<\/em> = (TP + TN) / бардык объекттер;<\/li>\n<li><em>Precision (тактык)<\/em> = TP / (TP + FP) — «ооба» деп болжолдонгондордун ичиндеги туурасынын үлүшү;<\/li>\n<li><em>Recall (толуктук)<\/em> = TP / (TP + FN) — бардык иш жүзүндөгү «ооба»лардын ичинен табылгандардын үлүшү;<\/li>\n<li><em>F1-өлчөм<\/em> — precision жана recallдын орточо гармониялыгы.<\/li>\n<\/ul>\n<blockquote>\n<p>Сейрек класс болгондо (алдамчылык операциялар — 1 %) дайыма «алдамчылык эмес» деп жооп берген модель 99 % accuracyге ээ, бирок пайдасыз. Ошондуктан precision жана recallга карашат.<\/p>\n<\/blockquote>\n<h2>6. Куралдар<\/h2>\n<p><strong>Python<\/strong> тили жана китепканалар: pandas (маалымат таблицалары), NumPy (эсептөөлөр), scikit-learn (MLдин классикалык алгоритмдери), matplotlib жана seaborn (графиктер), TensorFlow жана PyTorch (нейрондук тармактар). Чөйрөлөр: Jupyter Notebook, Google Colab. <strong>Kaggle<\/strong> платформасы — маалымат топтомдору жана мелдештер. Булуттук кызматтар: Google Vertex AI, Azure Machine Learning, Amazon SageMaker. Программалоосуз: AutoML, Orange.<\/p>\n<h2>7. Колдонулушу, этикасы жана чектөөлөрү<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Тармак<\/th>\n<th>Колдонулушу<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Финансы<\/td>\n<td>Насыялык скоринг, алдамчылыкты аныктоо<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ритейл<\/td>\n<td>Суроо-талапты болжолдоо, сунуштар, динамикалык баалар<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Медицина<\/td>\n<td>Сүрөттөрдү талдоо, тобокелдиктерди болжолдоо<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Өндүрүш<\/td>\n<td>Жабдууну болжолдоочу тейлөө, сапатты көзөмөлдөө<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Маркетинг<\/td>\n<td>Кардарлардын кетишин болжолдоо, сегменттөө<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Транспорт<\/td>\n<td>Маршруттарды оптималдаштыруу, айдоочусуз автомобилдер<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Этика жана чектөөлөр<\/strong>: модель окутуучу маалыматтардын бир жактуулугун кайталайт; татаал моделдерди түшүндүрүү кыйын («кара куту»); жеке маалыматтарды коргоо керек; моделдин сапаты маалыматтардын сапатынан жогору эмес («кирүүдө таштанды — чыгууда таштанды»).<\/p>\n<h2>8. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Үч бизнес-милдет (түшүмдү болжолдоо, спамды аныктоо, кардарларды топтоо) үчүн окутуунун түрүн жана милдеттин түрүн аныктаңыз.<\/li>\n<li>Kaggle платформасынан окуу маалымат топтомун (мисалы, Titanic) таап, сүрөттөңүз: максаттуу өзгөрмө, белгилер, милдеттин түрү.<\/li>\n<\/ol>\n<h2>9. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Машиналык окутуу салттуу программалоодон эмнеси менен айырмаланат?<\/li>\n<li>Мугалим менен окутуу мугалимсиз жана бекемдөө менен окутуудан эмнеси менен айырмаланат?<\/li>\n<li>Регрессия, классификация, кластерлөө кандай милдеттер үчүн колдонулат?<\/li>\n<li>Моделди иштеп чыгуунун баскычтарын санап бериңиз.<\/li>\n<li>Ашыкча окутуу деген эмне?<\/li>\n<li>Эмне үчүн accuracy классификаторду баалоо үчүн дайыма эле ылайыктуу эмес?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Жасалма интеллект · машиналык окутуу · терең окутуу · мугалим менен окутуу · мугалимсиз · бекемдөө менен · регрессия · классификация · кластерлөө · чечимдер дарагы · нейрондук тармак · ашыкча окутуу · MAE · каталар матрицасы · precision · recall.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Кузнецов Д. И. Основы анализа данных и машинного обучения. — М. : ДМК Пресс, 2020.<\/li>\n<li>scikit-learn документациясы. — scikit-learn.org.<\/li>\n<li>Kaggle Learn. — kaggle.com/learn.<\/li>\n<\/ol>\n"}, {"id": "lec-12", "kind": "lec", "num": 12, "title": "Буюмдар интернети (IoT)", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n2-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Студенттерди буюмдар интернетинин концепциясы, анын архитектурасы, түзүлүштөрү, байланыш протоколдору жана платформалары, колдонуу тармактары, ошондой эле IoTнин артыкчылыктары жана тобокелдиктери менен тааныштыруу.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Буюмдар интернети түшүнүгү.<\/li>\n<li>IoT архитектурасы.<\/li>\n<li>Компоненттер: датчиктер, аткаруучу түзүлүштөр, контроллерлер, шлюздар.<\/li>\n<li>Байланыш протоколдору жана технологиялары.<\/li>\n<li>IoT платформалары.<\/li>\n<li>Колдонуу тармактары.<\/li>\n<li>Артыкчылыктар, чакырыктар, тренддер.<\/li>\n<\/ol>\n<h2>1. Буюмдар интернети түшүнүгү<\/h2>\n<p><strong>Буюмдар интернети (Internet of Things, IoT)<\/strong> — адамдын туруктуу катышуусуз маалыматтарды чогулткан жана интернет аркылуу алмашкан датчиктер, программалар жана байланыш каражаттары менен жабдылган физикалык түзүлүштөрдүн тармагы.<\/p>\n<p>Негизги мүнөздөмөлөрү: туташуу; реалдуу убакытта маалыматтарды чогултуу; автоматтык жооп кайтаруу; алыстан башкаруу; масштаб — миллиарддаган түзүлүштөр.<\/p>\n<p><strong>Өнөр жайлык буюмдар интернети (IIoT)<\/strong> — IoTни өнөр жайда, энергетикада, транспортто колдонуу: жабдууну мониторингдөө, болжолдоочу тейлөө, ресурстарды эсепке алуу.<\/p>\n<h2>2. IoT архитектурасы<\/h2>\n<p>Классикалык төрт деңгээлдүү модель:<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Деңгээл<\/th>\n<th>Функциясы<\/th>\n<th>Мисалдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Кабыл алуу деңгээли (түзүлүштөр)<\/td>\n<td>Физикалык дүйнө жөнүндө маалыматтарды чогултуу жана ага таасир этүү<\/td>\n<td>Температура, нымдуулук, кыймыл датчиктери; реле, клапандар<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2. Тармактык деңгээл (берүү)<\/td>\n<td>Түзүлүштөрдөн маалыматтарды берүү<\/td>\n<td>Wi-Fi, Bluetooth, Zigbee, LoRaWAN, NB-IoT, 4G/5G; шлюздар<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3. Иштетүү деңгээли (платформа)<\/td>\n<td>Маалыматтарды сактоо, иштетүү, талдоо<\/td>\n<td>Булуттук платформалар, четки (edge) эсептөөлөр<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4. Тиркемелер деңгээли<\/td>\n<td>Жыйынтыктарды көрсөтүү жана башкаруу<\/td>\n<td>Мобилдик тиркеме, дашборд, автоматтык сценарийлер<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>IoT-система кантип иштейт — цикл<\/strong>: датчик параметрди өлчөйт → контроллер санариптештирип, маалыматтарды жөнөтөт → шлюз аларды булутка берет → платформа сактайт жана талдайт → эреже же модель чечим кабыл алат → буйрук аткаруучу түзүлүшкө кетет → колдонуучу жыйынтыкты тиркемеден көрөт.<\/p>\n<h2>3. IoT компоненттери<\/h2>\n<ul>\n<li><strong>Датчиктер (сенсорлор)<\/strong> — температураны, нымдуулукту, жарыктыкты, басымды, кыймылды, деңгээлди, газды, жайгашкан жерди (GPS) өлчөйт.<\/li>\n<li><strong>Аткаруучу түзүлүштөр (актуаторлор)<\/strong> — аракетти аткарат: реле жарыкты күйгүзөт, клапан сууну жабат, кыймылдаткыч пардаларды ачат.<\/li>\n<li><strong>Микроконтроллерлер жана бир платалуу компьютерлер<\/strong> — түзүлүштүн «мээси»: Arduino (прототиптөө), ESP32 жана ESP8266 (ичине орнотулган Wi-Fi менен), Raspberry Pi (толук кандуу мини-компьютер).<\/li>\n<li><strong>Шлюздар (gateways)<\/strong> — жергиликтүү протоколдордогу түзүлүштөрдү (Zigbee, Bluetooth) интернетке туташтырат жана алгачкы иштетүүнү аткарат.<\/li>\n<li><strong>Булуттук платформа жана тиркемелер<\/strong> — сактоо, аналитика, визуалдаштыруу, башкаруу.<\/li>\n<\/ul>\n<h2>4. Байланыш протоколдору жана технологиялары<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Технология<\/th>\n<th>Аралыгы<\/th>\n<th>Ылдамдыгы<\/th>\n<th>Энергия керектөө<\/th>\n<th>Колдонулушу<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Wi-Fi<\/td>\n<td>50–100 мге чейин<\/td>\n<td>Жогору<\/td>\n<td>Жогору<\/td>\n<td>Акылдуу үй, камералар<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bluetooth / BLE<\/td>\n<td>10–50 мге чейин<\/td>\n<td>Орточо<\/td>\n<td>Төмөн (BLE)<\/td>\n<td>Тагынуучу түзүлүштөр, белгилер<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Zigbee, Z-Wave<\/td>\n<td>10–100 м, уячалуу тармак<\/td>\n<td>Төмөн<\/td>\n<td>Өтө төмөн<\/td>\n<td>Акылдуу үй, жарык, датчиктер<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>LoRaWAN<\/td>\n<td>10–15 кмге чейин<\/td>\n<td>Өтө төмөн<\/td>\n<td>Өтө төмөн<\/td>\n<td>Айыл чарбасы, суу жана газ эсеби<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>NB-IoT, LTE-M<\/td>\n<td>Уюлдук тармак<\/td>\n<td>Төмөн<\/td>\n<td>Төмөн<\/td>\n<td>Эсептегичтер, трекерлер<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4G / 5G<\/td>\n<td>Уюлдук тармак<\/td>\n<td>Жогору<\/td>\n<td>Жогору<\/td>\n<td>Транспорт, видеобайкоо<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Билдирүү алмашуу протоколдору<\/strong>: <strong>MQTT<\/strong> — брокер аркылуу «жарыялоочу–жазылуучу» жеңил протоколу, IoT үчүн иш жүзүндөгү стандарт; <strong>CoAP<\/strong> — алсыз түзүлүштөр үчүн HTTPнин жеңилдетилген аналогу; <strong>HTTP/REST<\/strong> — ресурстары жетиштүү түзүлүштөр үчүн.<\/p>\n<h2>5. IoT платформалары<\/h2>\n<p>AWS IoT Core, Microsoft Azure IoT Hub, Google Cloud өнөктөштөрүнүн IoT-чечимдери, ThingSpeak (окуу долбоорлору), Blynk (мобилдик башкаруу), Home Assistant (ачык коддуу акылдуу үй). Платформалар түзүлүштөрдү туташтырууну, телеметрияны сактоону, автоматташтыруу эрежелерин, дашборддорду жана коопсуздукту камсыз кылат.<\/p>\n<h2>6. Колдонуу тармактары<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Тармак<\/th>\n<th>Мисалдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Акылдуу үй<\/td>\n<td>Жарык, жылытуу, күзөт сигнализациясы, суунун агышы<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Тагынуучу түзүлүштөр<\/td>\n<td>Фитнес-билериктер, акылдуу сааттар, медициналык мониторлор<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Акылдуу шаар<\/td>\n<td>Светофорлорду башкаруу, унаа токтотуучу жайлар, көчө жарыгы, абанын сапатын мониторингдөө<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Өнөр жай (IIoT)<\/td>\n<td>Станоктордун титирөөсүн жана температурасын мониторингдөө, болжолдоочу тейлөө<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Айыл чарбасы<\/td>\n<td>Топурак нымдуулугунун датчиктери, автоматтык сугаруу, жылуу жайларды жана малды мониторингдөө<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Логистика<\/td>\n<td>Жүктөрдү жана транспортту трекинг, рефрижераторлордо температураны көзөмөлдөө<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Энергетика<\/td>\n<td>Акылдуу эсептегичтер, керектөөнү эсепке алуу, тармактарды башкаруу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Геоэкология<\/td>\n<td>Капталдарды, жер көчкүлөрдү, дарыялардагы суунун деңгээлин мониторингдөө<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Санариптик эгиз<\/strong> — датчиктердин маалыматтары боюнча жаңыланып турган жана анын жүрүм-турумун болжолдоого мүмкүндүк берген физикалык объекттин виртуалдык модели.<\/p>\n<h2>7. Артыкчылыктар, чакырыктар жана тренддер<\/h2>\n<p><strong>Артыкчылыктар<\/strong>: автоматташтыруу; ресурстарды (энергияны, сууну, күйүүчү майды) үнөмдөө; реалдуу убакыттагы маалыматтар боюнча чечим кабыл алуу; авариялардын алдын алуу; жаңы кызматтар.<\/p>\n<p><strong>Чакырыктар<\/strong>: коопсуздук — демейки алсыз сырсөздөр түзүлүштөрдү ботнеттердин бутасына айлантат; ар кандай стандарттардын шайкештиги; маалыматтардын купуялуулугу; алыскы датчиктерди энергия менен камсыздоо; масштабдоонун наркы.<\/p>\n<p><strong>Тренддер<\/strong>: четки ЖИ (Edge AI) — түздөн-түз түзүлүштө талдоо; 5G жана NB-IoT тармактары; акылдуу үй үчүн Matter стандарты; ишканалардын жана шаарлардын санариптик эгиздери.<\/p>\n<h2>8. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Окуу аудиториясында температураны жана нымдуулукту мониторингдөө системасын сүрөттөңүз: датчиктер, контроллер, байланыш протоколу, платформа, кабарлоо эрежелери.<\/li>\n<li>Кыргызстанда IoTни колдонуунун мисалын табыңыз (электр энергиясын эсепке алуу, акылдуу аялдамалар, абаны мониторингдөө) жана анын архитектурасын төрт деңгээл боюнча сүрөттөңүз.<\/li>\n<\/ol>\n<h2>9. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Буюмдар интернетине аныктама бериңиз.<\/li>\n<li>IoT архитектурасынын деңгээлдерин жана алардын функцияларын атаңыз.<\/li>\n<li>Датчик аткаруучу түзүлүштөн эмнеси менен айырмаланат?<\/li>\n<li>Шлюз кандай ролду аткарат?<\/li>\n<li>MQTT протоколу эмне үчүн колдонулат?<\/li>\n<li>Эмне үчүн коопсуздук — IoTнин негизги чакырыгы?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Буюмдар интернети · IIoT · датчик · актуатор · микроконтроллер · Arduino · шлюз · Zigbee · LoRaWAN · MQTT · IoT платформасы · телеметрия · санариптик эгиз · Edge AI.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Интернет вещей (IoT): современные технологии и приложения / под ред. И. В. Савельева. — 2022.<\/li>\n<li>MQTT документациясы. — mqtt.org.<\/li>\n<li>Arduino Documentation. — docs.arduino.cc.<\/li>\n<\/ol>\n"}, {"id": "lec-13", "kind": "lec", "num": 13, "title": "Виртуалдык жана толукталган чындык (VR/AR)", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n2-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Студенттерди виртуалдык, толукталган жана аралаш чындык технологиялары, алардын иштөө принциптери, жабдуулары жана иштеп чыгуу каражаттары, колдонуу тармактары жана келечеги менен тааныштыруу.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>VR, AR, MR жана XR түшүнүктөрү.<\/li>\n<li>Технологиялардын иштөө принциптери.<\/li>\n<li>Жабдуулар.<\/li>\n<li>Иштеп чыгуу каражаттары.<\/li>\n<li>Тармактарда колдонулушу.<\/li>\n<li>Чакырыктар жана келечек.<\/li>\n<\/ol>\n<h2>1. VR, AR, MR жана XR түшүнүктөрү<\/h2>\n<p><strong>Виртуалдык чындык (Virtual Reality, VR)<\/strong> — компьютер түзгөн толугу менен жасалма үч өлчөмдүү чөйрө, колдонуучу ага шлем аркылуу чөмүлүп, аны менен өз ара аракеттенет.<\/p>\n<p><strong>Толукталган чындык (Augmented Reality, AR)<\/strong> — смартфон, планшет же көз айнек аркылуу реалдуу дүйнөнүн сүрөтүнүн үстүнө реалдуу убакытта санариптик объекттерди (сүрөттөрдү, жазууларды, 3D-моделдерди) кошкон технология.<\/p>\n<p><strong>Аралаш чындык (Mixed Reality, MR)<\/strong> — реалдуу жана виртуалдык дүйнөлөрдү бириктирүү, мында санариптик объекттер реалдуу мейкиндикке «байланган» жана алар менен физикалык объекттердей аракеттенүүгө болот.<\/p>\n<p><strong>Кеңейтилген чындык (Extended Reality, XR)<\/strong> — VR, AR жана MR үчүн жалпы термин.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Белги<\/th>\n<th>VR<\/th>\n<th>AR<\/th>\n<th>MR<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Реалдуу дүйнө менен байланыш<\/td>\n<td>Реалдуу дүйнө толугу менен алмаштырылган<\/td>\n<td>Реалдуу дүйнө санариптик катмарлар менен толукталган<\/td>\n<td>Реалдуу жана санариптик өз ара аракеттенет<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Түзүлүш<\/td>\n<td>VR-шлем<\/td>\n<td>Смартфон, планшет, AR-көз айнек<\/td>\n<td>MR-гарнитура<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Мисал<\/td>\n<td>Учкучтун тренажёру<\/td>\n<td>Смартфондун камерасы аркылуу эмеректи «кийгизип көрүү»<\/td>\n<td>Инженер кыймылдаткычтын голограммасы менен иштейт<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Метааалам<\/strong> — XRди колдонуп адамдар баарлашкан, иштеген жана сатып алуу жасаган туруктуу жалпы виртуалдык мейкиндиктердин концепциясы.<\/p>\n<h2>2. Иштөө принциптери<\/h2>\n<p><strong>VR<\/strong>: компьютер стерео эффект түзүү үчүн жылышуусу менен эки сүрөттү — ар бир көз үчүн — түзөт; датчиктер (гироскоп, акселерометр, камералар) баштын бурулушун жана дененин абалын көзөмөлдөйт, сүрөт заматта кайра курулат. Ыңгайлуулук үчүн кадрлардын жогорку жыштыгы (90 Гц жана андан жогору) жана кичине кечигүү керек, болбосо «чайкалуу» (кибероору) пайда болот.<\/p>\n<p><strong>AR<\/strong>: камера сүрөттү алат; программа тегиздиктерди, маркерлерди же объекттерди таанып (компьютердик көрүү, SLAM технологиясы — бир убакта локалдаштыруу жана карта түзүү); санариптик объект керектүү жерге жайгаштырылып, камера кыймылдаганда абалын сактайт.<\/p>\n<p>AR түрлөрү: <em>маркердик<\/em> (белгини же QR-кодду тааныйт); <em>маркерсиз<\/em> (беттерди жана мейкиндикти тааныйт); <em>геолокациялык<\/em> (GPS боюнча — Pokémon GO); <em>проекциялык<\/em> (сүрөт реалдуу беттерге проекцияланат).<\/p>\n<h2>3. Жабдуулар<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Класс<\/th>\n<th>Мисалдар<\/th>\n<th>Өзгөчөлүктөрү<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Автономдук VR-шлемдер<\/td>\n<td>Meta Quest<\/td>\n<td>Компьютер керек эмес, жеткиликтүү баа<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ПК үчүн VR-шлемдер<\/td>\n<td>HTC Vive, Valve Index<\/td>\n<td>Графиканын жогорку сапаты<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Аралаш чындык шлемдери<\/td>\n<td>Apple Vision Pro, Microsoft HoloLens<\/td>\n<td>Реалдуу айлана-чөйрөнү көрөт, жаңсоолор, көз карашты көзөмөлдөө<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Мобилдик AR<\/td>\n<td>Смартфондор жана планшеттер<\/td>\n<td>Эң массалык платформа<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Аксессуарлар<\/td>\n<td>Контроллерлер, кайтарым байланышы бар кол каптар, дене трекерлери, 360°-камералар<\/td>\n<td>Чөмүлүүнү күчөтөт<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>4. Иштеп чыгуу каражаттары<\/h2>\n<ul>\n<li><strong>Unity<\/strong> жана <strong>Unreal Engine<\/strong> — оюн кыймылдаткычтары, VR/AR-тиркемелер үчүн негизги платформалар.<\/li>\n<li><strong>ARKit<\/strong> (Apple, iOS) жана <strong>ARCore<\/strong> (Google, Android) — мобилдик AR үчүн куралдар топтому.<\/li>\n<li><strong>Vuforia<\/strong> — сүрөттөрдү жана объекттерди таануу.<\/li>\n<li><strong>WebXR<\/strong> — түздөн-түз браузердеги VR/AR.<\/li>\n<li>3D-моделдөө куралдары: Blender, 3ds Max.<\/li>\n<\/ul>\n<h2>5. Тармактарда колдонулушу<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Тармак<\/th>\n<th>VR<\/th>\n<th>AR<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Билим берүү<\/td>\n<td>Виртуалдык лабораториялар, экскурсиялар, тарыхый реконструкциялар<\/td>\n<td>Жанданган окуу китептери, органдардын жана механизмдердин 3D-моделдери<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Медицина<\/td>\n<td>Хирургиялык тренажёрлор, фобияларды дарылоо, реабилитация<\/td>\n<td>Операция учурунда сүрөттөрдү бейтаптын денесине кошуу<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Өнөр жай<\/td>\n<td>Персоналды коркунучтуу операцияларга окутуу<\/td>\n<td>Жабдуунун үстүндө оңдоо боюнча нускамалар, алыскы эксперт<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ритейл<\/td>\n<td>Виртуалдык шоурумдар<\/td>\n<td>Кийимди, көз айнекти, эмеректи виртуалдык «кийгизип көрүү» (IKEA Place)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Кыймылсыз мүлк жана архитектура<\/td>\n<td>Курулганга чейин объекттер боюнча виртуалдык турлар<\/td>\n<td>Имаратты участокто визуалдаштыруу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Туризм<\/td>\n<td>Виртуалдык саякаттар<\/td>\n<td>Камера аркылуу көрүнүктүү жерлер жөнү
