<!doctype html>
<html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Санариптик технологиялар</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Электронный учебник «Цифровые технологии» (710500): лекции, практические занятия, СРС, тесты по таксономии Блума, контрольные вопросы и отчёты.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>/* Layout: top bar with section tabs, left course map, reading column (~70ch), right on-page contents on wide screens.
   Look: a board-room dossier — cool paper, slate-blue ink, a stamp-red accent used only for marks and alerts. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunk:#e9ebe6; --ink:#1c2531; --muted:#5a6573; --line:#d6dbd9;
  --accent:#2a4a7a; --accent-soft:#e3e9f3; --stamp:#a5372a; --stamp-soft:#f6e6e2;
  --ok:#2d7a4d; --ok-soft:#e1f0e6; --warn:#a06a12; --warn-soft:#f6ecd8;
  --f-display:"Literata", "PT Serif", Georgia, serif;
  --f-read:"Literata", "PT Serif", Georgia, serif;
  --f-ui:"IBM Plex Sans", "PT Sans", "Segoe UI", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", "PT Mono", Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a21; --surface:#1c232c; --sunk:#232b36; --ink:#e4e8ee; --muted:#9aa5b3; --line:#323c49;
  --accent:#8fb0e3; --accent-soft:#25344a; --stamp:#e2816f; --stamp-soft:#3a2622;
  --ok:#7cc79a; --ok-soft:#1f3529; --warn:#e0b265; --warn-soft:#3a2f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a21; --surface:#1c232c; --sunk:#232b36; --ink:#e4e8ee; --muted:#9aa5b3; --line:#323c49;
  --accent:#8fb0e3; --accent-soft:#25344a; --stamp:#e2816f; --stamp-soft:#3a2622;
  --ok:#7cc79a; --ok-soft:#1f3529; --warn:#e0b265; --warn-soft:#3a2f1c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;line-height:1.15;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font-family:var(--f-display);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:8px 11px;border-radius:var(--r);text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.tabs a:hover{background:var(--sunk);color:var(--ink)}
.tabs a.on{color:var(--accent);background:var(--accent-soft)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;cursor:pointer}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr) 220px;gap:0;max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:18px 10px 40px max(16px,env(safe-area-inset-left,0px))}
.side h6{margin:16px 8px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side h6:first-child{margin-top:0}
.side a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:var(--r);text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.3}
.side a:hover{background:var(--sunk)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side a .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:34px;flex:none}
.side a.on .n{color:var(--accent)}
.side a .dot{margin-left:auto;flex:none;width:7px;height:7px;border-radius:50%;background:transparent;align-self:center}
.side a.done .dot{background:var(--ok)}

main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:760px;margin:0 auto}
.toc{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 57px);overflow-y:auto;padding:28px 16px 40px 8px;font-size:12.5px}
.toc b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.toc a{display:block;padding:3px 0 3px 10px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;line-height:1.35}
.toc a:hover,.toc a.on{color:var(--accent);border-left-color:var(--accent)}

/* page head */
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);font-weight:600;margin:0 0 8px}
h1.ttl{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:0 0 14px;text-wrap:balance}
.head-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.done-toggle{cursor:pointer}
.done-toggle input{accent-color:var(--ok)}
.done-toggle.is-done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

/* reading text */
.doc{font-family:var(--f-read);font-size:17px;line-height:1.7}
.doc h2{font-family:var(--f-display);font-size:23px;line-height:1.25;font-weight:600;margin:44px 0 12px;text-wrap:balance;scroll-margin-top:80px}
.doc h3{font-family:var(--f-ui);font-size:17px;font-weight:600;margin:28px 0 8px;scroll-margin-top:80px}
.doc h4{font-family:var(--f-ui);font-size:15px;font-weight:600;margin:22px 0 6px;color:var(--accent)}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{padding-left:24px;margin:0 0 14px}
.doc li p{margin:0 0 4px}
.doc blockquote{margin:0 0 14px;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0}
.doc blockquote p:last-child{margin:0}
.doc .meta{display:flex;flex-wrap:wrap;gap:6px 8px;font-family:var(--f-ui);font-size:13px;color:var(--muted);margin:0 0 8px}
.doc .meta p{margin:0;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.doc .meta p:has(br){border-radius:var(--r);flex-basis:100%;padding:8px 12px;line-height:1.55}
.doc .note{font-family:var(--f-ui);font-size:13.5px;color:var(--muted)}
.tbl{overflow-x:auto;margin:6px 0 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.doc table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--sunk);font-weight:600}
.doc tr:last-child td{border-bottom:0}
.doc td p,.doc th p{margin:0}
.katex{font-size:1.06em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}

/* answer fields */
.answer,.fld-wrap{font-family:var(--f-ui);margin:14px 0 26px;padding:14px;border:1px dashed var(--accent);border-radius:var(--r);background:var(--surface)}
.answer label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.answer label span{text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400}
textarea.fld,.answer textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:var(--bg);font-family:var(--f-ui);font-size:14.5px;line-height:1.5}
.answer.big textarea{min-height:160px}
.answer .saved{font-size:12px;color:var(--muted);margin-top:4px;min-height:1em}
.doc p > textarea.fld{display:block;margin-top:4px}
.doc input.chk{width:18px;height:18px;vertical-align:-3px;margin-right:8px;accent-color:var(--accent)}
.chk-count{font-family:var(--f-ui);font-weight:600;color:var(--accent)}

/* widgets */
.widget{font-family:var(--f-ui);font-size:14px;margin:18px 0 24px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.w-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline;padding:12px 16px;background:var(--sunk);border-bottom:1px solid var(--line)}
.w-head b{font-size:14.5px}
.w-head small{color:var(--muted)}
.w-body{padding:14px 16px;display:grid;gap:14px}
.w-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
.w-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.w-row label{font-size:13.5px}
.w-row output,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px}
.w-row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.w-in{display:flex;flex-direction:column;gap:4px;font-size:13px}
.w-in input,.w-in select{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:var(--bg);font-family:var(--f-mono);font-size:14px;width:100%}
.w-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.w-kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg)}
.w-kpi span{display:block;font-size:12px;color:var(--muted)}
.w-kpi b{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.w-kpi.good{border-color:var(--ok);background:var(--ok-soft)} .w-kpi.bad{border-color:var(--stamp);background:var(--stamp-soft)} .w-kpi.mid{border-color:var(--warn);background:var(--warn-soft)}
.w-msg{padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);font-size:13.5px}
.w-msg.bad{background:var(--stamp-soft)} .w-msg.good{background:var(--ok-soft)}
.w-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:13.5px}
.bar i{display:block;height:12px;border-radius:3px;background:var(--accent);min-width:2px;transition:width .2s}
.bar .trk{background:var(--sunk);border-radius:3px}
.bar.win i{background:var(--ok)} .bar.low i{background:var(--stamp)}
.bar b{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.alt{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;background:var(--bg)}
.alt h5{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.alt h5 .num{color:var(--accent);white-space:nowrap}
.alt.win{border-color:var(--ok)}
.sc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:4px 9px;cursor:pointer;font-family:var(--f-mono);font-size:13px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--surface)}
.rate-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.rate-tbl td,.rate-tbl th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.rate-tbl th{font-weight:600;color:var(--muted);font-size:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--stamp);border-color:var(--stamp)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--f-ui)}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;max-width:48%;color:var(--ink)}
.pager a small{color:var(--muted);font-size:12px}
.pager a:last-child{text-align:right;margin-left:auto}

/* title page */
.cover{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:30px 28px;display:grid;gap:18px;position:relative;overflow:hidden}
.cover .seal{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border:2px solid var(--stamp);border-radius:50%;opacity:.18}
.cover .seal::after{content:"";position:absolute;inset:12px;border:1px solid var(--stamp);border-radius:50%}
.cover h1{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,4.2vw,44px);line-height:1.1;margin:0;text-wrap:balance;max-width:16ch}
.cover .sub{font-size:15px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:10px 12px}
.facts b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--muted)}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:22px;margin:36px 0 12px}
.struct td .lnk{display:block;text-decoration:none;color:var(--ink);line-height:1.35}
.struct td .lnk small{font-family:var(--f-mono);color:var(--muted)}
.struct td .lnk.done small::after{content:" ✓";color:var(--ok)}
.prog{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card b{font-size:15px}
.card span{font-size:13px;color:var(--muted)}
.card .lvl{font-family:var(--f-mono);font-size:12px;color:var(--stamp)}
.card .res{margin-top:auto;font-size:12.5px;font-family:var(--f-mono)}

/* tests */
.quiz{font-family:var(--f-ui)}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px}
.q-prog{height:4px;background:var(--sunk);border-radius:2px;margin-bottom:22px;overflow:hidden}
.q-prog i{display:block;height:100%;background:var(--accent)}
.q-text{font-family:var(--f-read);font-size:20px;line-height:1.45;margin:0 0 18px}
.opts{display:grid;gap:8px;margin-bottom:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 14px;cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none;width:18px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--stamp);background:var(--stamp-soft)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:var(--r);margin-bottom:16px;font-size:14.5px}
.fb.good{background:var(--ok-soft)} .fb.bad{background:var(--stamp-soft)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.score-big{font-family:var(--f-mono);font-size:54px;font-weight:600;line-height:1}
.review{display:grid;gap:10px;margin-top:10px}
.review div{border:1px solid var(--line);border-left:3px solid var(--stamp);border-radius:var(--r);padding:10px 12px;background:var(--surface);font-size:14px}
.review p{margin:4px 0}

/* exam */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tickets a{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink);font-family:var(--f-mono);font-size:18px;font-weight:600}
.tickets a:hover{border-color:var(--accent);color:var(--accent)}
.tickets a.has{border-color:var(--ok);color:var(--ok)}
.tq{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;margin-bottom:14px;font-family:var(--f-ui)}
.tq .q{font-family:var(--f-read);font-size:17px;line-height:1.55;margin:6px 0 12px}

/* report */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-family:var(--f-ui)}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--surface);font-size:14.5px;color:var(--ink)}
.ready{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);font-family:var(--f-ui);display:grid;gap:8px}
.ready ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--stamp)}
.sheet{background:#fff;color:#111;font-family:"Times New Roman",Times,serif;font-size:15px;line-height:1.5;padding:40px 36px 40px 56px;border:1px solid var(--line);border-radius:4px;margin-top:14px;overflow-x:auto}
.sheet h3{text-align:center;font-size:16px;margin:0 0 6px}
.sheet h4{font-size:15px;margin:16px 0 4px}
.sheet p{margin:0 0 6px;white-space:pre-wrap}
.sheet .c{text-align:center}
.sheet .empty{color:#a5372a;font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--stamp)}

figure.flow{margin:10px 0 20px;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px}
figure.flow svg{display:block;min-width:640px;width:100%;height:auto}
figure.flow .nd{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
figure.flow .nd.end{fill:var(--ok-soft);stroke:var(--ok)}
figure.flow .nd.ask{fill:var(--warn-soft);stroke:var(--warn)}
figure.flow text{fill:var(--ink);font-family:var(--f-ui);font-size:13px}
figure.flow .lb{fill:var(--muted);font-size:12px}
figure.flow path{stroke:var(--muted);stroke-width:1.4;fill:none}

<script>window.__DATA__={"sections": [{"id": "program", "kind": "program", "num": 0, "title": "Дисциплинанын иштөө программасы", "html": "<h2>1. Жалпы мүнөздөмө<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Көрсөткүч<\/th>\n<th>Мазмуну<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Дисциплинанын коду<\/td>\n<td>Б.1.3.10<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Даярдоо багыты<\/td>\n<td>710500 «Интернет-технологиялар жана башкаруу»<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Профили<\/td>\n<td>Интернет-технологиялар жана башкаруу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Академиялык даража<\/td>\n<td>Бакалавриат<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Эмгек сыйымдуулугу<\/td>\n<td>4 кредит (ECTS) / 120 академиялык саат<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Лекциялар<\/td>\n<td>30 саат<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Практикалык сабактар<\/td>\n<td>30 саат<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Студенттердин өз алдынча иши<\/td>\n<td>60 саат<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Жыйынтыктоочу аттестация<\/td>\n<td>Экзамен (компьютердик тестирлөө)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Калыптандырылуучу компетенциялар<\/td>\n<td>ЖК-1, КК-1, ИК-2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Иштеп чыккан<\/td>\n<td>ф.-м.и.к., доцент Канетова Д. Э.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Кафедра<\/td>\n<td>«Маалыматтык технологиялар жана математика», К. Ш. Токтомаматов атындагы ЭАУ<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>2. Дисциплинанын максаты<\/h2>\n<p>Студенттерде маалыматтык технологиялар жана башкаруу чөйрөсүндөгү кесиптик милдеттерди чечүү үчүн зарыл болгон заманбап санариптик технологиялар боюнча базалык билимди жана практикалык көндүмдөрдү калыптандыруу: санариптик трансформациянын фундаменталдык аспекттерин, маалыматтарды чогултуу жана талдоо куралдарын жана платформаларын, бизнес-процесстерди оптималдаштыруу жана башкаруучулук чечимдерди кабыл алуу үчүн интернет-технологиялардын негиздерин үйрөнүү.<\/p>\n<h2>3. Дисциплинанын милдеттери<\/h2>\n<ol type=\"1\">\n<li>Санариптик системалардын жана платформалардын иштөө принциптерин өздөштүрүү.<\/li>\n<li>Процесстерди автоматташтыруу жана башкаруу үчүн санариптик куралдарды колдонуу көндүмдөрүн алуу.<\/li>\n<li>Башкаруучулук чечимдерди колдоо үчүн маалыматтарды чогултуу, иштетүү жана талдоо ыкмаларын үйрөнүү.<\/li>\n<li>Интернет-технологиялар, анын ичинде веб-иштеп чыгуу жана киберкоопсуздуктун негиздери боюнча билимди өнүктүрүү.<\/li>\n<li>Санариптик дүйнөнүн тез өзгөргөн талаптарына ыңгайлашуу жана атаандаштык артыкчылыктарга жетүү үчүн жаңы технологияларды колдонуу жөндөмдүүлүгүн калыптандыруу.<\/li>\n<\/ol>\n<h2>4. Дисциплинанын орду<\/h2>\n<p><strong>Пререквизиттер<\/strong>: информатика; математика жана статистика; маалыматтык системалар жана технологиялар; англис тили (базалык деңгээл).<\/p>\n<p><strong>Постреквизиттер<\/strong>: веб-иштеп чыгуу жана веб-дизайн; маалыматтарды талдоо жана машиналык окутуу; маалыматтык коопсуздук; санариптик маркетинг жана SMM; маалымат базалары жана чоң маалыматтар; санариптик долбоорлорду башкаруу.<\/p>\n<h2>5. Компетенциялар жана окутуунун натыйжалары<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Код<\/th>\n<th>Компетенция<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>ЖК-1<\/td>\n<td>Курчап турган дүйнө жөнүндө илимий билимди сынчыл баалоого жана колдонууга, турмуштун жана маданияттын баалуулуктарында багыт алууга, активдүү жарандык позицияны ээлөөгө жөндөмдүү<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>КК-1<\/td>\n<td>Интернет-технологиялар рыногун изилдөөгө жана талдоого жөндөмдүү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ИК-2<\/td>\n<td>Иште жана окууда татаал көйгөйлөрдү чечүү үчүн маалыматтык технологияларды колдонуу менен жаңы билимдерди алууга жана колдонууга жөндөмдүү<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ОН-1.<\/strong> Маалыматтык технологияларды колдонуу менен кесиптик иште базалык билимди колдонууга, илимдеги жана техникадагы көрүнүштөрдү талдоого жана баалоого жөндөмдүү.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Студент<\/th>\n<th>Мазмуну<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Билиши керек<\/td>\n<td>Санариптик технологиялардын иштөө принциптерин; маалыматтарды иштетүүнүн жана талдоонун негиздерин; интернет-технологиялардын, маалымат базаларынын жана маалыматтык системалардын принциптерин; киберкоопсуздуктун негиздерин; санариптик трансформациянын негиздерин<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Жасай алышы керек<\/td>\n<td>Маалыматтарды талдоо жана чечимдерди колдоо үчүн санариптик куралдарды колдонууну; интернет-технологияларды колдонууну; жумушчу процесстерди автоматташтырууну; маалыматтарды талдоону жана визуалдаштырууну; санариптик платформалар менен иштөөнү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Ээ болушу керек<\/td>\n<td>Программалоонун жана маалыматтар менен иштөөнүн базалык көндүмдөрүнө; веб-иштеп чыгуунун жана маалыматтарды талдоонун куралдарына; маалыматтарды коргоо ыкмаларына; өз алдынча билим алуу жана англис тилиндеги документтер менен иштөө көндүмдөрүнө<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>6. Тематикалык план<\/h2>\n<p>Ар бир тема 2 саат лекцияны, 2 саат практикалык сабакты жана 4 саат СӨИни камтыйт.<\/p>\n<table style=\"width:100%;\">\n\n<thead>\n<tr class=\"header\">\n<th>№<\/th>\n<th>Тема<\/th>\n<th>Лек.<\/th>\n<th>Пр.<\/th>\n<th>СӨИ<\/th>\n<th>Модуль<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Санариптик технологияларга киришүү<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Компьютердик технологиялардын негиздери<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Маалыматтар менен иштөөнүн негиздери<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>Маалымат базалары жана SQL<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5<\/td>\n<td>Маалыматтарды талдоо жана визуалдаштыруу<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>6<\/td>\n<td>Интернет-технологияларга киришүү<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>7<\/td>\n<td>Азыркы бизнес-тренддер жана санариптештирүү<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>8<\/td>\n<td>Санариптештирүү үчүн ишканаларды долбоорлоонун методологиясы<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>9<\/td>\n<td>Санариптик коопсуздук жана маалыматты коргоо<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>10<\/td>\n<td>Булуттук технологиялар<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>11<\/td>\n<td>Машиналык окутуу<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>12<\/td>\n<td>Буюмдар интернети (IoT)<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>13<\/td>\n<td>Виртуалдык жана толукталган чындык (VR/AR)<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>14<\/td>\n<td>Санариптик маркетинг жана аналитика<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>15<\/td>\n<td>Бизнестин санариптик трансформациясы<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><\/td>\n<td><strong>Бардыгы<\/strong><\/td>\n<td><strong>30<\/strong><\/td>\n<td><strong>30<\/strong><\/td>\n<td><strong>60<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Практикалык сабактар<\/strong>: ПС-1 «Азыркы бизнес-тренддер жана санариптик технологиялардын актуалдуулугу»; ПС-2 «ИТ-индустриянын эволюциясы»; ПС-3 «Корпоративдик маалыматтык системалар»; ПС-4 «Ишкананын архитектурасынын методологиясы»; ПС-5 «Буюмдар интернети»; ПС-6 «Чечим кабыл алууну колдоо жана маалыматтарды интеллектуалдык талдоо»; ПС-7 «Моделдөө жана мультиагенттик системалар»; ПС-8 «Машиналык окутуу» (8–9-сабактар); ПС-9 «VR/AR» (10–11-сабактар); ПС-10 «Санариптик маркетинг жана аналитика» (12–13-сабактар); ПС-11 «Бизнестин санариптик трансформациясы» (14–15-сабактар). 2–4, 6, 9 жана 10-темалар боюнча практикалык тапшырмалар тиешелүү лекциялардын аягында берилген; SQL-тренажёр — 4-лекцияда.<\/p>\n<h2>7. Баалоо системасы<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Текшерүүнүн түрү<\/th>\n<th>Формасы<\/th>\n<th>Баллдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1-модуль (1–7-лекциялар)<\/td>\n<td>Компьютердик тестирлөө<\/td>\n<td>20<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2-модуль (8–15-лекциялар)<\/td>\n<td>Көзөмөл суроолоруна жазуу / оозеки жооп<\/td>\n<td>20<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Учурдагы текшерүү (СӨИни кошкондо)<\/td>\n<td>Практикалык сабактар, СӨИ кейстери, активдүүлүк<\/td>\n<td>30<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Жыйынтыктоочу текшерүү (экзамен)<\/td>\n<td>Компьютердик тестирлөө<\/td>\n<td>30<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Бардыгы<\/strong><\/td>\n<td><\/td>\n<td><strong>100<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Жалпысынан 51 баллдан кем эмес топтогон студенттер оң баа алышат.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Баллдар<\/th>\n<th>Тамгалык баа<\/th>\n<th>Санариптик эквивалент<\/th>\n<th>Салттуу баа<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>85–100<\/td>\n<td>A<\/td>\n<td>4,0<\/td>\n<td>Эң жакшы<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>80–84<\/td>\n<td>B<\/td>\n<td>3,33<\/td>\n<td>Жакшы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>70–79<\/td>\n<td>C<\/td>\n<td>3,0<\/td>\n<td>Жакшы<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>61–69<\/td>\n<td>D<\/td>\n<td>2,33<\/td>\n<td>Канааттандырарлык<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>51–60<\/td>\n<td>E<\/td>\n<td>2,0<\/td>\n<td>Канааттандырарлык<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>31–50<\/td>\n<td>FX<\/td>\n<td>0<\/td>\n<td>Канааттандырарлык эмес<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>0–30<\/td>\n<td>F<\/td>\n<td>0<\/td>\n<td>Канааттандырарлык эмес<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>8. Дисциплинанын талаптары<\/h2>\n<ul>\n<li>Лекцияларга жана практикалык сабактарга үзгүлтүксүз катышуу, талкууларга катышуу.<\/li>\n<li>Практикалык иштерди жана СӨИ кейстерин мөөнөтүндө аткаруу; тапшырууну кечиктирүү баллдардын төмөндөшүнө алып келиши мүмкүн.<\/li>\n<li>Тапшырмаларды өз алдынча аткаруу: жооптор өз сөзүңүз менен терилет, плагиатка жана башкалардын иштерин көчүрүүгө жол берилбейт.<\/li>\n<li>Окуу китебиндеги тесттер жана көзөмөл суроолору боюнча модулдук текшерүүлөргө даярдануу.<\/li>\n<\/ul>\n<h2>9. Адабияттар<\/h2>\n<p><strong>Негизги<\/strong><\/p>\n<ol type=\"1\">\n<li>Фролов К. В., Иванов Д. Д., Фролов А. К. Цифровые технологии : учеб. пособие. — СПб., 2024. — 99 с.<\/li>\n<li>Информационные технологии. Курс лекций. — vshot.ru/it-ebook.<\/li>\n<li>Кыргыз Республикасынын 2024–2028-жылдарга Санариптик трансформациянын концепциясы. — cbd.minjust.gov.kg.<\/li>\n<\/ol>\n<p><strong>Кошумча<\/strong><\/p>\n<ol type=\"1\">\n<li>Прохоров А., Коник Л. Цифровая трансформация: анализ, тренды, мировой опыт. — 2021.<\/li>\n<li>Интернет вещей (IoT): современные технологии и приложения / под ред. И. В. Савельева. — 2022.<\/li>\n<li>Кузнецов Д. И. Основы анализа данных и машинного обучения. — М. : ДМК Пресс, 2020.<\/li>\n<li>Таненбаум Э. С. Компьютерные сети. — СПб. : Питер, 2020.<\/li>\n<li>Котлер Ф. Маркетинг 5.0: технологии для человечности. — М. : Альпина, 2021.<\/li>\n<\/ol>\n<p><strong>Интернет-ресурстар<\/strong><\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Ресурс<\/th>\n<th>Арналышы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Coursera — «Foundations of Data Science»<\/td>\n<td>Маалыматтарды талдоонун негиздери<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Kaggle (kaggle.com)<\/td>\n<td>Маалымат топтомдору жана машиналык окутуу практикасы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Microsoft Learn (learn.microsoft.com)<\/td>\n<td>Булуттук технологиялар, Azure<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Codecademy — «Introduction to Cybersecurity»<\/td>\n<td>Киберкоопсуздуктун негиздери<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DataCamp — «Introduction to Python»<\/td>\n<td>Маалыматтарды талдоо үчүн Python<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Google Digital Garage<\/td>\n<td>Санариптик маркетингдин негиздери<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>AWS Training (aws.training)<\/td>\n<td>Amazon булуттук кызматтары<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>W3Schools, MDN Web Docs<\/td>\n<td>HTML, CSS, JavaScript, SQL<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}, {"id": "lec-1", "kind": "lec", "num": 1, "title": "Санариптик технологияларга киришүү", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n1-модуль\n<\/p>\n<p>\nЖК-1, КК-1\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Студенттерди санариптик технологиялардын негизги түшүнүктөрү менен тааныштыруу, алардын азыркы экономикадагы, башкаруудагы жана күнүмдүк турмуштагы ордун көрсөтүү, ошондой эле санариптик формага келтирүү, санариптештирүү жана санариптик трансформациянын айырмачылыктарын түшүндүрүү.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Санариптик технологиялардын аныктамасы жана маңызы.<\/li>\n<li>Санариптик технологиялардын өнүгүү тарыхы жана баскычтары.<\/li>\n<li>Санариптештирүүнүн коомго жана экономикага таасири.<\/li>\n<li>Негизги технологиялар: сереп жана колдонулушу.<\/li>\n<li>Башкарууда жана бизнесте санариптик технологиялардын ролу.<\/li>\n<li>Санариптештирүүнүн азыркы тренддери.<\/li>\n<li>Практикадан мисал жана талкуу үчүн суроолор.<\/li>\n<\/ol>\n<h2>1. Санариптик технологиялардын аныктамасы жана маңызы<\/h2>\n<p><strong>Санариптик технологиялар<\/strong> — маалыматтарды чогултуу, иштетүү, сактоо жана берүү үчүн аларды санариптик (экилик) формада көрсөтүүнү колдонгон ыкмалардын, түзүлүштөрдүн жана программалык камсыздоонун жыйындысы.<\/p>\n<p>Санариптик системада ар кандай маалымат — текст, үн, сүрөт, датчиктин көрсөткүчү — нөлдөр менен бирдердин удаалаштыгына айланат. Дал ушул маалыматты универсалдуу кылат: аны жоготуусуз көчүрүүгө, тармак аркылуу каалаган аралыкка берүүгө, программалар менен иштетүүгө жана башка маалыматтар менен бириктирүүгө болот.<\/p>\n<p>Санариптик технологиялардын мисалдары: компьютердик системалар, интернет, мобилдик байланыш, маалымат базалары, булуттук кызматтар, жасалма интеллект.<\/p>\n<p><strong>Санариптик технологиялардын негизги мүнөздөмөлөрү<\/strong><\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Мүнөздөмө<\/th>\n<th>Мазмуну<\/th>\n<th>Мисал<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Иштетүү ылдамдыгы<\/td>\n<td>Чоң көлөмдөгү маалымат секунданын үлүштөрүндө иштетилет<\/td>\n<td>Миллиарддаган барактар боюнча интернеттен издөө<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Автоматташтыруу<\/td>\n<td>Күнүмдүк операциялар адамдын катышуусуз аткарылат<\/td>\n<td>Эмгек акыны автоматтык түрдө эсептөө<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Интеграция<\/td>\n<td>Ар кандай системалар жана түзүлүштөр маалымат алмашат<\/td>\n<td>Интернет-дүкөн буйрутманы кампага жана жеткирүү кызматына өткөрөт<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Масштабдалуучулук<\/td>\n<td>Чечим жаңы колдонуучуларга оңой жайылтылат<\/td>\n<td>Миллион кардар үчүн банктын мобилдик тиркемеси<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Тактык жана кайталануучулук<\/td>\n<td>Санариптик көчүрмө түп нускага окшош<\/td>\n<td>Санариптик кол тамгасы бар электрондук документ<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Айырмалоо зарыл болгон үч түшүнүк<\/strong><\/p>\n<ul>\n<li><strong>Санариптик формага келтирүү (оцифровка, digitization)<\/strong> — аналогдук маалыматты санариптик формага которуу: кагаз архивди сканерлөө, үндү файлга жазуу.<\/li>\n<li><strong>Санариптештирүү (digitalization)<\/strong> — айрым процесстерди өзгөртүү үчүн санариптик маалыматтарды жана технологияларды колдонуу: кагаз документ жүгүртүүнүн ордуна электрондук документ жүгүртүү, дарыгерге онлайн жазылуу.<\/li>\n<li><strong>Санариптик трансформация (digital transformation)<\/strong> — санариптик технологиялардын негизинде уюмдун бизнес-моделин, түзүмүн жана маданиятын терең өзгөртүү: финансылык кызматтардын мобилдик платформасына айланган банк.<\/li>\n<\/ul>\n<blockquote>\n<p>Санариптик формага келтирүү маалыматтын алып жүрүүчүсүн, санариптештирүү — процессти, санариптик трансформация — иш-аракеттин моделин өзү өзгөртөт.<\/p>\n<\/blockquote>\n<h2>2. Санариптик технологиялардын өнүгүү тарыхы жана баскычтары<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Мезгил<\/th>\n<th>Негизги окуялар жана технологиялар<\/th>\n<th>Мааниси<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1940–1960-жылдар<\/td>\n<td>Алгачкы электрондук эсептөө машиналары (ENIAC, UNIVAC), FORTRAN жана COBOL программалоо тилдери<\/td>\n<td>Компьютер илимий жана аскердик эсептөөлөрдүн куралы катары<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1970–1980-жылдар<\/td>\n<td>Микропроцессор, жеке компьютерлер (Apple II, IBM PC), жергиликтүү тармактар<\/td>\n<td>Компьютер кеңсеге жана үйгө келет<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1990-жылдар<\/td>\n<td>Бүткүл дүйнөлүк желе (WWW), браузерлер, электрондук почта, алгачкы интернет-дүкөндөр<\/td>\n<td>Маалыматтарды жана коммуникацияларды массалык санариптештирүү<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2000-жылдар<\/td>\n<td>Кең тилкелүү интернет, издөө системалары, социалдык тармактар, смартфондор<\/td>\n<td>Маалымат каалаган жерде жана каалаган убакта жеткиликтүү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>2010-жылдар – азыр<\/td>\n<td>Булуттук эсептөөлөр, чоң маалыматтар, буюмдар интернети, жасалма интеллект, блокчейн<\/td>\n<td>Санариптик технологиялар экономиканын негизине айланат<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Ар бир толкун эсептөөлөрдүн наркын төмөндөтүп, колдонуучулардын чөйрөсүн кеңейткен. <strong>Мур мыйзамы<\/strong> деп аталган байкоо боюнча, микросхема кристаллындагы транзисторлордун саны узак убакыт бою болжол менен ар бир эки жылда эки эсеге көбөйгөн, бул өндүрүмдүүлүктүн экспоненциалдык өсүшүн камсыз кылган.<\/p>\n<h2>3. Санариптештирүүнүн коомго жана экономикага таасири<\/h2>\n<p><strong>Оң өзгөрүүлөр<\/strong><\/p>\n<ol type=\"1\">\n<li><em>Экономика<\/em>: бизнес-процесстердин ылдамдашы, транзакциялык чыгымдардын азайышы, жаңы тармактардын пайда болушу — электрондук коммерция, финтех, санариптик платформалар.<\/li>\n<li><em>Коом<\/em>: маалыматка жана билимге жетүү, электрондук мамлекеттик кызматтар, алыстан иштөөнүн жана окуунун өнүгүшү.<\/li>\n<li><em>Мамлекеттик башкаруу<\/em>: жол-жоболордун ачык-айкындуулугу, кезектердин жана кагаз документ жүгүртүүнүн кыскарышы. Кыргыз Республикасында бул милдеттер 2024–2028-жылдарга Санариптик трансформациянын концепциясында бекитилген (мамлекеттик кызматтар порталы, «Түндүк» электрондук өз ара аракеттенүү системасы).<\/li>\n<\/ol>\n<p><strong>Терс жактары жана тобокелдиктер<\/strong><\/p>\n<ol type=\"1\">\n<li><em>Коопсуздук<\/em>: киберкоркунучтардын өсүшү, жеке маалыматтардын агып кетиши.<\/li>\n<li><em>Социалдык тобокелдиктер<\/em>: шаар менен айылдын, муундардын ортосундагы санариптик теңсиздик.<\/li>\n<li><em>Экономикалык тобокелдиктер<\/em>: технологиялардан жана жеткирүүчүлөрдөн көз карандылык, кээ бир кесиптердин жоголушу.<\/li>\n<\/ol>\n<h2>4. Негизги технологиялар: сереп жана колдонулушу<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Технология<\/th>\n<th>Маңызы<\/th>\n<th>Колдонуу мисалы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Big Data (чоң маалыматтар)<\/td>\n<td>Болжолдоо жана чечим кабыл алуу үчүн эбегейсиз маалымат массивдерин талдоо<\/td>\n<td>Издөө системалары миллиондогон колдонуучулардын жүрүм-туруму боюнча жыйынтыктарды иреттейт<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>IoT (буюмдар интернети)<\/td>\n<td>Физикалык түзүлүштөрдүн интернет аркылуу байланышы<\/td>\n<td>Акылдуу үй, өндүрүштөгү датчиктер<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>AI (жасалма интеллект)<\/td>\n<td>Интеллектти талап кылган милдеттерди аткарган системалар<\/td>\n<td>Чат-боттор, үн жардамчылары, жүздү таануу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Блокчейн<\/td>\n<td>Жазууларын байкалбай өзгөртүүгө мүмкүн болбогон бөлүштүрүлгөн реестр<\/td>\n<td>Криптовалюталар, акылдуу келишимдер<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Булуттук технологиялар<\/td>\n<td>Маалыматтарды сактоо жана тиркемелердин интернет аркылуу иштеши<\/td>\n<td>Google Drive, Microsoft 365<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>VR/AR<\/td>\n<td>Виртуалдык жана толукталган чындык<\/td>\n<td>Тренажёрлор, товарларды «кийгизип көрүү»<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Бул технологиялардын ар бири курстун кийинки лекцияларында толук каралат.<\/p>\n<h2>5. Башкарууда жана бизнесте санариптик технологиялардын ролу<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Чөйрө<\/th>\n<th>Санариптик куралдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Персоналды башкаруу<\/td>\n<td>Кызматкерлерди тандоо, эсепке алуу жана окутуу үчүн HRM-системалар<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Маркетинг<\/td>\n<td>Маалыматтарды талдоо жана таргеттелген жарнама<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Өндүрүш<\/td>\n<td>Өнөр жайлык буюмдар интернети, роботташтыруу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Финансы<\/td>\n<td>Насыя тобокелдигин баалоо үчүн ЖИ, онлайн-төлөмдөр<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Уюмду башкаруу<\/td>\n<td>ERP-системалар, электрондук документ жүгүртүү, жетекчинин дашборддору<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Бизнес үчүн артыкчылыктар<\/strong>: чыгымдардын азайышы, процесстердин ылдамдашы, маалыматтардын эсебинен чечимдердин сапатынын жогорулашы, сатуунун жаңы каналдары.<\/p>\n<h2>6. Санариптештирүүнүн азыркы тренддери<\/h2>\n<ol type=\"1\">\n<li><strong>Омниканалдуулук<\/strong> — онлайн жана офлайн каналдарда бирдиктүү кардар тажрыйбасы (интернет-дүкөн + алып кетүү пункттары + мобилдик тиркеме).<\/li>\n<li><strong>Киберкоопсуздук<\/strong> — маалыматтарды коргоого, шифрлөөгө, биометрикалык аутентификацияга инвестициялардын өсүшү.<\/li>\n<li><strong>Платформалык экономика<\/strong> — сатуучуларды жана сатып алуучуларды бириктирген кызматтар (маркетплейстер, такси-агрегаторлор).<\/li>\n<li><strong>Гиперавтоматташтыруу<\/strong> — татаал процесстерди автоматташтыруу үчүн ЖИ менен программалык роботторду (RPA) айкалыштыруу.<\/li>\n<li><strong>Туруктуу өнүгүү<\/strong> — энергия керектөөнү жана экологиялык көрсөткүчтөрдү санариптик мониторингдөө.<\/li>\n<\/ol>\n<h2>7. Практикадан мисал<\/h2>\n<p><strong>Кейс: Amazon жана санариптик технологиялар.<\/strong> Компания сатып алуучулардын жүрүм-турумун талдоо жана жекелештирилген сунуштар үчүн чоң маалыматтарды; кампаларды автоматташтыруу үчүн роботторду жана ЖИни; жеткирүүнү реалдуу убакытта көзөмөлдөө үчүн IoT жана GPSти колдонот. Маалыматтарга негизделген жекелештирүү сатуунун олуттуу бөлүгүн камсыз кылат, ал эми кампаларды автоматташтыруу буйрутмаларды иштетүүнүн чыгымдарын азайтат.<\/p>\n<p>Корутунду: натыйжаны өзүнчө технологиялар эмес, бизнес-максатка — кардардын ыңгайлуулугуна жана жеткирүүнүн ылдамдыгына баш ийдирилген алардын айкалышы берет.<\/p>\n<h2>8. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Бир күндүн ичинде колдонгон санариптик технологияларыңыздын тизмесин түзүп, ар бири кандай милдетти чечерин көрсөтүңүз.<\/li>\n<li>Санариптик кызматтарды киргизген Кыргызстандын уюмуна мисал келтириңиз. Бул эмне экенин аныктаңыз — санариптик формага келтирүүбү, санариптештирүүбү же санариптик трансформациябы.<\/li>\n<\/ol>\n<h2>9. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Санариптик технологияларга аныктама бериңиз.<\/li>\n<li>Санариптештирүү санариптик трансформациядан эмнеси менен айырмаланат?<\/li>\n<li>Санариптик технологиялардын өнүгүүсүнүн негизги баскычтарын атаңыз.<\/li>\n<li>Санариптештирүү коом үчүн кандай тобокелдиктерди жаратат?<\/li>\n<li>10 жылдан кийин санариптештирүү жумуш чөйрөсүн кантип өзгөртөт?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Санариптик технологиялар · санариптик формага келтирүү · санариптештирүү · санариптик трансформация · Мур мыйзамы · чоң маалыматтар · буюмдар интернети · жасалма интеллект · блокчейн · омниканалдуулук.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Фролов К. В., Иванов Д. Д., Фролов А. К. Цифровые технологии : учеб. пособие. — СПб., 2024.<\/li>\n<li>Кыргыз Республикасынын 2024–2028-жылдарга Санариптик трансформациянын концепциясы. — cbd.minjust.gov.kg.<\/li>\n<li>Прохоров А., Коник Л. Цифровая трансформация: анализ, тренды, мировой опыт. — 2021.<\/li>\n<\/ol>\n"}, {"id": "lec-2", "kind": "lec", "num": 2, "title": "Компьютердик технологиялардын негиздери", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n1-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Студенттерди компьютердин иштөө принциптери, анын негизги компоненттери, программалык камсыздоонун түрлөрү жана компьютердик тармактардын негиздери менен тааныштыруу; компьютердик технологиялардын башкаруудагы жана бизнестеги ролун көрсөтүү.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Компьютердик технологиялар түшүнүгү.<\/li>\n<li>Компьютердин архитектурасы: негизги компоненттер.<\/li>\n<li>Программалык камсыздоо: түрлөрү жана классификациясы.<\/li>\n<li>Операциялык системалар жана виртуалдаштыруу.<\/li>\n<li>Компьютердик тармактардын негиздери.<\/li>\n<li>Башкарууда жана бизнесте компьютердик технологиялардын ролу.<\/li>\n<li>Азыркы тренддер.<\/li>\n<\/ol>\n<h2>1. Компьютердик технологиялар түшүнүгү<\/h2>\n<p><strong>Компьютердик технологиялар<\/strong> — маалыматтарды чогултуу, иштетүү, сактоо жана берүү үчүн колдонулган аппараттык жана программалык каражаттардын жыйындысы.<\/p>\n<p>Негизги функциялары: маалыматты иштетүү; маалыматтарды сактоо; милдеттерди автоматташтыруу; системалар менен адамдардын өз ара аракеттенүүсүн камсыз кылуу.<\/p>\n<p>Ар кандай компьютердик система эки бөлүктөн турат: <strong>аппараттык камсыздоо<\/strong> (hardware — физикалык түзүлүштөр) жана <strong>программалык камсыздоо<\/strong> (software — түзүлүштөрдү башкарган жана колдонуучунун милдеттерин чечкен программалар).<\/p>\n<h2>2. Компьютердин архитектурасы: негизги компоненттер<\/h2>\n<p>Азыркы компьютерлердин көпчүлүгүнүн негизинде <strong>фон Нейман архитектурасы<\/strong> жатат: программа жана маалыматтар жалпы эс тутумда сакталат, ал эми процессор буйруктарды удаалаш тандап, аткарат.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Компонент<\/th>\n<th>Арналышы<\/th>\n<th>Негизги мүнөздөмөсү<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Борбордук процессор (CPU)<\/td>\n<td>Эсептөөлөрдү аткарат жана системанын ишин башкарат<\/td>\n<td>Такт жыштыгы (ГГц), ядролордун саны<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Оперативдик эс тутум (RAM)<\/td>\n<td>Учурда иштеп жаткан маалыматтарды жана программаларды убактылуу сактайт; өчүрүлгөндө тазаланат<\/td>\n<td>Көлөмү (ГБ), ылдамдыгы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>HDD топтоочусу<\/td>\n<td>Магниттик дисктерде чоң көлөмдөгү маалыматтарды туруктуу сактоо<\/td>\n<td>Сыйымдуулугу чоң, ылдамдыгы төмөн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>SSD топтоочусу<\/td>\n<td>Флеш-эс тутумда туруктуу сактоо<\/td>\n<td>Жогорку ылдамдык жана ишенимдүүлүк<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Энелик плата<\/td>\n<td>Бардык компоненттерди бириктирип, алардын өз ара аракеттенүүсүн камсыз кылат<\/td>\n<td>Туташтыргычтар, чипсет<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Графикалык процессор (GPU)<\/td>\n<td>Графиканы иштетүү жана параллелдүү эсептөөлөр (анын ичинде машиналык окутуу үчүн)<\/td>\n<td>Эсептөө блокторунун саны, видео эс тутум<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Киргизүү түзүлүштөрү<\/td>\n<td>Компьютерге маалыматтарды берет<\/td>\n<td>Клавиатура, чычкан, сканер, микрофон<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Чыгаруу түзүлүштөрү<\/td>\n<td>Жыйынтыктарды колдонуучуга көрсөтөт<\/td>\n<td>Монитор, принтер, колонкалар<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Эс тутумдун иерархиясы.<\/strong> Эс тутум процессорго канчалык жакын болсо, ошончолук тез жана кымбат: процессордун регистрлери → кэш → оперативдик эс тутум → SSD/HDD → тышкы жана булуттук сактагычтар. Ошондуктан оперативдик эс тутум учурдагы иш үчүн, ал эми топтоочулар туруктуу сактоо үчүн колдонулат.<\/p>\n<h2>3. Программалык камсыздоо: түрлөрү жана классификациясы<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>ПКнын түрү<\/th>\n<th>Арналышы<\/th>\n<th>Мисалдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Системалык<\/td>\n<td>Аппараттык ресурстарды башкарат жана башка программалардын иштешин камсыз кылат<\/td>\n<td>Windows, Linux, macOS операциялык системалары; драйверлер; утилиталар<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Колдонмо<\/td>\n<td>Колдонуучунун конкреттүү милдеттерин чечет<\/td>\n<td>Microsoft Office, 1С, Google Chrome браузери, Adobe Photoshop<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Инструменталдык<\/td>\n<td>Программаларды иштеп чыгуу үчүн колдонулат<\/td>\n<td>Python, Java тилдери; Visual Studio, PyCharm чөйрөлөрү<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Өзүнчө <strong>антивирустук жана кызматтык ПК<\/strong> (архиваторлор, камдык көчүрмө каражаттары) бөлүнөт. Таратуу ыкмасы боюнча ПК коммерциялык, акысыз (freeware) жана ачык коддуу эркин (open source, мисалы Linux, LibreOffice) болот.<\/p>\n<h2>4. Операциялык системалар жана виртуалдаштыруу<\/h2>\n<p><strong>Операциялык система (ОС)<\/strong> — компьютердин ресурстарын (процессорду, эс тутумду, түзүлүштөрдү, файлдарды) башкарган жана колдонмо программалардын иштешин, колдонуучу менен өз ара аракеттенүүнү камсыз кылган системалык программалардын комплекси.<\/p>\n<p>ОСтун негизги функциялары: файлдарды жана маалыматтарды башкаруу; тиркемелерди (процесстерди) ишке киргизүү жана башкаруу; эс тутумду бөлүштүрүү; драйверлер аркылуу түзүлүштөрдү башкаруу; коопсуздукту жана жетүү укуктарын камсыз кылуу; колдонуучу интерфейси (графикалык же буйрук сабы).<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>ОС<\/th>\n<th>Өзгөчөлүктөрү<\/th>\n<th>Мүнөздүү колдонулушу<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Windows<\/td>\n<td>Колдонмо программалар менен кеңири шайкештик<\/td>\n<td>Кеңсе, бизнес, үй компьютерлери<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Linux<\/td>\n<td>Ачык код, ишенимдүүлүк, ийкемдүү жөндөө<\/td>\n<td>Серверлер, иштеп чыгуу, булуттар<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>macOS<\/td>\n<td>Apple түзүлүштөрү менен интеграция<\/td>\n<td>Мультимедиа, дизайн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Android, iOS<\/td>\n<td>Мобилдик ОС<\/td>\n<td>Смартфондор жана планшеттер<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Виртуалдаштыруу<\/strong> — бир физикалык серверде ар биринин өз операциялык системасы бар бир нече <strong>виртуалдык машинаны<\/strong> ишке киргизүүгө мүмкүндүк берген технология. Гипервизор-программа (VMware, Hyper-V, VirtualBox) физикалык компьютердин ресурстарын виртуалдык машиналардын ортосунда бөлүштүрөт. Виртуалдаштыруу жабдууну жана электр энергиясын үнөмдөйт жана булуттук эсептөөлөрдүн негизинде жатат.<\/p>\n<h2>5. Компьютердик тармактардын негиздери<\/h2>\n<p><strong>Компьютердик тармак<\/strong> — компьютерлер менен башка түзүлүштөрдүн ортосунда маалымат алмашууну камсыз кылган система.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Тармактын түрү<\/th>\n<th>Камтуусу<\/th>\n<th>Мисал<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>LAN (жергиликтүү)<\/td>\n<td>Кеңсе, имарат, үй<\/td>\n<td>Коммутаторго туташтырылган бөлүмдүн компьютерлери<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>WAN (глобалдык)<\/td>\n<td>Шаарлар, өлкөлөр<\/td>\n<td>Интернет, банктын филиалдарынын тармагы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>WLAN / Wi-Fi<\/td>\n<td>Имараттын ичинде зымсыз жетүү<\/td>\n<td>Кафедеги же университеттеги жетүү чекити<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Тармактын негизги компоненттери<\/strong>: сервер (маалыматтарды сактайт жана кызмат көрсөтөт); кардарлар (колдонуучулардын түзүлүштөрү); коммутатор (жергиликтүү тармактын ичиндеги түзүлүштөрдү бириктирет); маршрутизатор (маалыматтарды тармактардын ортосунда багыттайт); кабелдер жана зымсыз жетүү чекиттери.<\/p>\n<p><strong>Протоколдор<\/strong> — маалымат алмашуунун эрежелери: TCP/IP — интернеттин базалык стеги; HTTP/HTTPS — веб-барактарды берүү; FTP — файлдарды берүү; SMTP — электрондук почтаны жөнөтүү.<\/p>\n<h2>6. Башкарууда жана бизнесте компьютердик технологиялардын ролу<\/h2>\n<ol type=\"1\">\n<li>Эсепти автоматташтыруу: 1С, SAP программалары.<\/li>\n<li>Персоналды башкаруу: HRM-системалар.<\/li>\n<li>Долбоорлорду башкаруу: Trello, Jira, Asana.<\/li>\n<li>Сатуу жана маркетинг: CRM-системалар (Bitrix24, Salesforce), кардарлар жөнүндө маалыматтарды талдоо.<\/li>\n<li>Коопсуздук: антивирустар, шифрлөө, камдык көчүрмө.<\/li>\n<\/ol>\n<h2>7. Азыркы тренддер<\/h2>\n<ul>\n<li>Автоматташтырууда, чат-боттордо, маалыматтарды талдоодо <strong>жасалма интеллект<\/strong>.<\/li>\n<li><strong>Булуттук эсептөөлөр<\/strong> — ресурстарга интернет аркылуу жетүү (Google Workspace, AWS, Azure).<\/li>\n<li><strong>Буюмдар интернети<\/strong> — тармак аркылуу өз ара аракеттенген түзүлүштөр.<\/li>\n<li><strong>Четки эсептөөлөр (edge computing)<\/strong> — маалыматтарды булагынын жанында иштетүү.<\/li>\n<li><strong>Кванттык эсептөөлөр<\/strong> — классикалык компьютерлер чече албаган милдеттер үчүн келечектүү технология.<\/li>\n<\/ul>\n<p><strong>Практикадан мисал.<\/strong> Компания кызматкерлердин ишин Google Workspace булуттук платформасына которду: документтер сакталат жана биргелешип түзөтүлөт, жыйындар Google Meetте өтөт. Натыйжа — өз серверлерине кеткен чыгымдардын азайышы жана биргелешкен иштин ылдамдашы.<\/p>\n<h2>8. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Өз компьютериңиздин же смартфонуңуздун мүнөздөмөлөрүнүн таблицасын түзүңүз: процессор, оперативдик эс тутумдун көлөмү, топтоочунун түрү жана көлөмү, операциялык система.<\/li>\n<li>Келечектеги кесибиңизде колдонулган колдонмо программалардын үч мисалын келтириңиз.<\/li>\n<li>Принтери жана интернетке чыгуусу бар 5 жумуш ордуна ылайыкталган чакан кеңсенин жергиликтүү тармагынын схемасын тартыңыз.<\/li>\n<\/ol>\n<h2>9. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Оперативдик эс тутум топтоочудан эмнеси менен айырмаланат?<\/li>\n<li>Системалык ПК колдонмо ПКдан эмнеси менен айырмаланат? Мисалдарды келтириңиз.<\/li>\n<li>Операциялык система кандай функцияларды аткарат?<\/li>\n<li>Виртуалдык машина деген эмне жана виртуалдаштыруу эмне үчүн керек?<\/li>\n<li>Маршрутизатор коммутатордон эмнеси менен айырмаланат?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Аппараттык камсыздоо · программалык камсыздоо · процессор · оперативдик эс тутум · SSD · операциялык система · виртуалдаштыруу · гипервизор · LAN · WAN · TCP/IP протоколу.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Таненбаум Э. С. Современные операционные системы. — СПб. : Питер, 2020.<\/li>\n<li>Таненбаум Э. С. Компьютерные сети. — СПб. : Питер, 2020.<\/li>\n<li>Петцольд Ч. Код. Тайный язык информатики. — М. : МИФ, 2021.<\/li>\n<\/ol>\n"}, {"id": "lec-3", "kind": "lec", "num": 3, "title": "Маалыматтар менен иштөөнүн негиздери", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n1-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Студенттерди маалыматтардын түрлөрү, аларды көрсөтүү форматтары, чогултуу, иштетүү жана сактоо ыкмалары, ошондой эле маалыматтарды талдоонун негизги түрлөрү жана алар менен иштөөнүн этикалык эрежелери менен тааныштыруу.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Маалыматтар түшүнүгү жана алардын азыркы экономикадагы ролу.<\/li>\n<li>Маалыматтардын түрлөрү жана классификациясы.<\/li>\n<li>Маалымат форматтары: CSV, JSON, XML.<\/li>\n<li>Маалыматтарды чогултуу ыкмалары.<\/li>\n<li>Маалыматтарды иштетүү жана даярдоо.<\/li>\n<li>Маалыматтарды сактоо.<\/li>\n<li>Маалыматтарды талдоонун негиздери.<\/li>\n<li>Маалыматтар менен иштөөнүн этикасы жана коопсуздугу.<\/li>\n<\/ol>\n<h2>1. Маалыматтар түшүнүгү жана алардын экономикадагы ролу<\/h2>\n<p><strong>Маалыматтар<\/strong> — сактоого, берүүгө жана иштетүүгө ылайыктуу формада бекитилген фактылар: сандар, тексттер, сүрөттөр, үндөр, датчиктердин көрсөткүчтөрү.<\/p>\n<p>Деңгээлдерди айырмалоо маанилүү: <em>маалыматтар<\/em> (чийки фактылар: «12 500», «Ош») → <em>маалымат<\/em> (контексттеги маалыматтар: «Оштогу филиалдын түшүмү — 12 500 сом») → <em>билим<\/em> (мыйзам ченемдүүлүктөрдү түшүнүү: «Оштогу түшүм жума күндөрү өсөт»). Маалыматтар менен иштөөнүн максаты — аларды чечим кабыл алууга негиз болгон билимге айландыруу.<\/p>\n<p>Санариптик экономикада маалыматтарды «жаңы мунай» деп аташат: алар стратегиялык ресурска айланат, компаниялар андан баалуулук алат — сунуштарды жекелештирет, суроо-талапты болжолдойт, чыгымдарды азайтат.<\/p>\n<h2>2. Маалыматтардын түрлөрү жана классификациясы<\/h2>\n<p><strong>Түзүмдөлүү даражасы боюнча<\/strong><\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Түрү<\/th>\n<th>Сыпаттамасы<\/th>\n<th>Мисалдар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Түзүмдөлгөн<\/td>\n<td>Так схемасы бар: саптар жана мамычалар<\/td>\n<td>Excel таблицалары, кардарлардын маалымат базалары<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Жарым-жартылай түзүмдөлгөн<\/td>\n<td>Белгилери жана уялашуусу бар, бирок катуу схемасы жок<\/td>\n<td>JSON, XML, электрондук каттар<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Түзүмдөлбөгөн<\/td>\n<td>Алдын ала берилген түзүмү жок<\/td>\n<td>Тексттер, сүрөттөр, видео, аудио, социалдык тармактардагы жарыялар<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Булагы боюнча<\/strong><\/p>\n<ul>\n<li><em>Баштапкы (first-party)<\/em> — уюмдун өзү чогулткан: сатып алуулардын тарыхы, кардарлардын арыздары.<\/li>\n<li><em>Өнөктөштүк (second-party)<\/em> — макулдашуу боюнча өнөктөштөн алынган.<\/li>\n<li><em>Тышкы (third-party)<\/em> — тышкы жеткирүүчүлөрдөн сатылып алынган, мамлекеттин ачык маалыматтары.<\/li>\n<\/ul>\n<p><strong>Маанилердин түрү боюнча<\/strong>: сандык (дискреттик жана үзгүлтүксүз) жана сапаттык (категориялык — жынысы, аймак, буйрутманын статусу).<\/p>\n<h2>3. Маалымат форматтары<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Формат<\/th>\n<th>Арналышы<\/th>\n<th>Үзүндү<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>CSV<\/td>\n<td>Текст файлындагы таблицалык маалыматтар; маанилер үтүр же үтүрлүү чекит менен бөлүнөт<\/td>\n<td><code>id;шаар;түшүм<\/code><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>JSON<\/td>\n<td>Программалардын ортосунда түзүмдөлгөн маалыматтар менен алмашуу, айрыкча веб-иштеп чыгууда<\/td>\n<td><code>{\"id\": 1, \"шаар\": \"Ош\"}<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>XML<\/td>\n<td>Маалыматтарды сактоо жана берүү үчүн тегдери бар текст форматы<\/td>\n<td><code>&lt;шаар&gt;Ош&lt;/шаар&gt;<\/code><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>XLSX<\/td>\n<td>Формулалары жана форматтоосу бар электрондук таблицалар<\/td>\n<td>Excel файлы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>CSV таблицаларды чыгарып алуу үчүн, JSON — веб-кызматтар жана API үчүн, XML — документтер жана корпоративдик системалардын ортосундагы алмашуу үчүн ыңгайлуу.<\/p>\n<h2>4. Маалыматтарды чогултуу ыкмалары<\/h2>\n<ol type=\"1\">\n<li><strong>Анкеталоо жана сурамжылоолор<\/strong> — Google Forms, SurveyMonkey.<\/li>\n<li><strong>Мониторинг жана сенсорлор<\/strong> — температура датчиктери, GPS-трекерлер, эсептегичтер.<\/li>\n<li><strong>Веб-аналитика<\/strong> — Google Analytics, Яндекс Метрика: сайтка кирүүлөр, басуулар, конверсиялар.<\/li>\n<li><strong>API жана интеграциялар<\/strong> — маалыматтарды башка системалардан автоматтык түрдө алуу (валюта курстары, аба ырайы, төлөм системаларынын маалыматтары).<\/li>\n<li><strong>Эсеп системалары<\/strong> — ERP, CRM, касса программаларынын иштешинде пайда болгон маалыматтар.<\/li>\n<\/ol>\n<h2>5. Маалыматтарды иштетүү жана даярдоо<\/h2>\n<p>Аналитиктин убактысынын көп бөлүгү маалыматтарды даярдоого кетет. Негизги операциялар:<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Операция<\/th>\n<th>Мазмуну<\/th>\n<th>Мисал<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Тазалоо<\/td>\n<td>Кайталанмаларды өчүрүү, каталарды оңдоо, боштуктарды иштетүү<\/td>\n<td>Бир кардар эки жолу жазылган: «Асанов» жана «Асанов »<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Трансформация<\/td>\n<td>Бирдиктүү форматтарга жана бирдиктерге келтирүү<\/td>\n<td>«12.03.24» жана «2024-03-12» даталары → бир формат<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Чыпкалоо<\/td>\n<td>Берилген шарттар боюнча маалыматтарды тандоо<\/td>\n<td>Март айындагы буйрутмалар гана<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Иреттөө<\/td>\n<td>Бир же бир нече критерий боюнча тартипке келтирүү<\/td>\n<td>Кардарлар сатып алуу суммасынын кемиши боюнча<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Агрегациялоо<\/td>\n<td>Жыйынтыктарды алуу үчүн маалыматтарды бириктирүү жана топтоо<\/td>\n<td>Ар бир филиал боюнча сатуунун суммасы<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Байытуу<\/td>\n<td>Башка булактардан маалыматтарды кошуу<\/td>\n<td>Кардардын дарегине шаардын районун кошуу<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>6. Маалыматтарды сактоо<\/h2>\n<ul>\n<li><strong>Реляциялык маалымат базалары (SQL)<\/strong>: MySQL, PostgreSQL, Microsoft SQL Server — байланыштары бар таблицалар (4-лекцияда толук).<\/li>\n<li><strong>Реляциялык эмес базалар (NoSQL)<\/strong>: MongoDB, Redis — документтер, «ачкыч–маани» жуптары, графтар.<\/li>\n<li><strong>Жергиликтүү сактоо<\/strong>: уюмдун компьютерлери жана серверлери.<\/li>\n<li><strong>Булуттук сактагычтар<\/strong>: Google Drive, Amazon S3, Microsoft Azure.<\/li>\n<li><strong>Маалымат кампалары (Data Warehouse)<\/strong> — талдоо үчүн ар кандай системалардын маалыматтарын бириктирген борборлоштурулган сактагычтар.<\/li>\n<\/ul>\n<h2>7. Маалыматтарды талдоонун негиздери<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Талдоонун түрү<\/th>\n<th>Суроо<\/th>\n<th>Мисал<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Сыпаттама (дескриптивдик)<\/td>\n<td>Эмне болду?<\/td>\n<td>Чейрек үчүн сатуу боюнча отчёт<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Диагностикалык<\/td>\n<td>Эмне үчүн болду?<\/td>\n<td>Сатуунун төмөндөшү атаандаштын бааларынын өсүшү менен байланыштуу<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Болжолдоочу (предиктивдик)<\/td>\n<td>Эмне болот?<\/td>\n<td>Кийинки айга суроо-талаптын болжолу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Сунуштоочу (прескриптивдик)<\/td>\n<td>Эмне кылуу керек?<\/td>\n<td>Канча товар сатып алуу керек деген сунуш<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Базалык статистикалык көрсөткүчтөр<\/strong>: арифметикалык орточо, медиана (иреттелген катардын борбордук мааниси), мода, минимум жана максимум, кулач, стандарттык четтөө (чачырандынын өлчөмү).<\/p>\n<p><em>Мисал.<\/em> Кафенин 5 күндүк күнүмдүк түшүмү: 10, 12, 11, 13, 54 миң сом. Орточо = 20 миң, медиана = 12 миң. Бир майрам күнү орточону кескин көтөрдү, ал эми медиана «кадимки» күндү жакшыраак сүрөттөйт. Ошондуктан чыгып калуучу маанилер болгондо медиана колдонулат.<\/p>\n<p><strong>Куралдар<\/strong>: Microsoft Excel, Google Sheets — базалык талдоо; Power BI, Tableau — визуалдаштыруу; Python жана R — программалык талдоо; Hadoop, Spark — чоң маалыматтарды иштетүү.<\/p>\n<h2>8. Маалыматтар менен иштөөнүн этикасы жана коопсуздугу<\/h2>\n<p>Принциптер: <strong>купуялуулук<\/strong> (жеке маалыматтарды коргоо); <strong>ачык-айкындуулук<\/strong> (адам өзү жөнүндө кандай маалыматтар эмне үчүн чогултулуп жатканын билет); <strong>минималдаштыруу<\/strong> (керектүүсүн гана чогултуу); <strong>мыйзамдуулук<\/strong> — Кыргыз Республикасынын «Жеке мүнөздөгү маалымат жөнүндө» мыйзамын, ЕБдеги кардарлар менен иштөөдө GDPR европалык регламентин сактоо.<\/p>\n<p>Тобокелдиктер: маалыматтардын агып кетиши, маалыматтарды макулдугусуз колдонуу, алгоритмдердин негизинде басмырлоо.<\/p>\n<p><strong>Практикадан мисал.<\/strong> Чекене тармак берилгендик программасынын чектерин талдайт: кайсы товарлар чогуу жана кайсы күндөрү сатылып алынат. Жыйынтыгы боюнча товарларды жайгаштыруу өзгөрөт жана жеке арзандатуулар түзүлөт. Чектердин түзүмдөлгөн маалыматтары сатып алуучулардын түзүмдөлбөгөн пикирлери менен толукталат.<\/p>\n<h2>9. Өз алдынча иш үчүн тапшырмалар<\/h2>\n<ol type=\"1\">\n<li>Сиздин университет чогулткан маалыматтардын мисалдарын келтириңиз. Аларды түзүмдөлгөн, жарым-жартылай түзүмдөлгөн жана түзүмдөлбөгөн деп бөлүңүз.<\/li>\n<li>Excel же Google Sheets программасында 10 саптан турган таблица түзүп (мисалы, бир жумалык чыгымдар), аны иреттеңиз, чыпкалаңыз жана орточону, медиананы эсептеңиз.<\/li>\n<\/ol>\n<h2>10. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Маалыматтар маалыматтан эмнеси менен айырмаланат?<\/li>\n<li>Түзүмдөлгөн жана түзүмдөлбөгөн маалыматтарга мисал келтириңиз.<\/li>\n<li>CSV жана JSON форматтары эмне үчүн колдонулат?<\/li>\n<li>Маалыматтарды тазалоого эмнелер кирет?<\/li>\n<li>Болжолдоочу талдоо сунуштоочу талдоодон эмнеси менен айырмаланат?<\/li>\n<li>Качан медиана маалыматтарды орточодон жакшыраак сүрөттөйт?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Маалыматтар · маалымат · түзүмдөлгөн маалыматтар · CSV · JSON · XML · маалыматтарды тазалоо · чыпкалоо · агрегациялоо · маалымат кампасы · медиана · жеке маалыматтар.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Фролов К. В. и др. Цифровые технологии : учеб. пособие. — СПб., 2024.<\/li>\n<li>Кузнецов Д. И. Основы анализа данных и машинного обучения. — М. : ДМК Пресс, 2020.<\/li>\n<\/ol>\n"}, {"id": "lec-4", "kind": "lec", "num": 4, "title": "Маалымат базалары жана SQL", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n1-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Маалымат базалары жана аларды башкаруу системалары жөнүндө түшүнүк калыптандыруу, реляциялык моделдин негизги түшүнүктөрүн жана таблицаларды түзүү, маалыматтарды кошуу, тандоо, өзгөртүү жана өчүрүү үчүн SQL тилинин базалык буйруктарын өздөштүрүү.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Маалымат базасы жана МББС түшүнүгү.<\/li>\n<li>Маалымат базаларынын түрлөрү.<\/li>\n<li>Реляциялык моделдин негизги түшүнүктөрү: таблица, жазуу, талаа, ачкычтар.<\/li>\n<li>SQL тили: буйруктардын топтору.<\/li>\n<li>SQL сурамдарынын мисалдары.<\/li>\n<li>Маалымат базаларынын бизнесте колдонулушу жана азыркы тренддер.<\/li>\n<li>SQL-тренажёр жана кроссворд.<\/li>\n<\/ol>\n<h2>1. Маалымат базасы жана МББС түшүнүгү<\/h2>\n<p><strong>Маалымат базасы (МБ)<\/strong> — белгилүү бир эрежелер боюнча сакталган жана жамааттык колдонууга арналган өз ара байланышкан маалыматтардын уюшулган жыйындысы.<\/p>\n<p><strong>Маалымат базаларын башкаруу системасы (МББС)<\/strong> — маалымат базаларын түзүү, маалыматтарды сактоо, издөө, өзгөртүү жана аларга жетүүнү башкаруу үчүн программалык камсыздоо. Мисалдар: MySQL, PostgreSQL, Microsoft SQL Server, Oracle, SQLite.<\/p>\n<p>Маалыматтык системалардагы МБнын функциялары: чоң көлөмдөгү маалыматты сактоо; тез издөө жана иштетүү; көптөгөн колдонуучулардын бир убакта иштеши; коргоо жана жетүүнү чектөө; бүтүндүктү колдоо (мисалы, жок кардарга буйрутма тариздөөгө болбойт).<\/p>\n<h2>2. Маалымат базаларынын түрлөрү<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Түрү<\/th>\n<th>Сактоо модели<\/th>\n<th>МББС мисалдары<\/th>\n<th>Качан колдонулат<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Реляциялык (SQL)<\/td>\n<td>Ачкычтар менен байланышкан таблицалар<\/td>\n<td>MySQL, PostgreSQL, SQL Server<\/td>\n<td>Эсеп, финансы, CRM — катуу түзүм жана бүтүндүк маанилүү болгон жерде<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Документтик (NoSQL)<\/td>\n<td>JSON документтери<\/td>\n<td>MongoDB<\/td>\n<td>Товарлардын каталогдору, түзүмү ар түрдүү колдонуучу профилдери<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>«Ачкыч–маани»<\/td>\n<td>Ачкыч–маани жуптары<\/td>\n<td>Redis<\/td>\n<td>Кэш, колдонуучулардын сессиялары<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Графтык<\/td>\n<td>Түйүндөр жана байланыштар<\/td>\n<td>Neo4j<\/td>\n<td>Социалдык тармактар, сунуштар<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Жайгашуусу боюнча базалар <strong>жергиликтүү<\/strong> (уюмдун серверинде) жана <strong>булуттук<\/strong> (Amazon RDS, Google Cloud SQL, Azure SQL) болот.<\/p>\n<h2>3. Реляциялык моделдин негизги түшүнүктөрү<\/h2>\n<p>Реляциялык моделди 1970-жылы Эдгар Кодд сунуштаган. Маалыматтар <strong>таблицаларда<\/strong> (катыштарда) сакталат.<\/p>\n<ul>\n<li><strong>Таблица<\/strong> — бир түрдөгү объекттер жөнүндө маалыматтардын жыйындысы (кызматкерлер, товарлар, буйрутмалар).<\/li>\n<li><strong>Жазуу (сап, кортеж)<\/strong> — бир объект жөнүндө маалыматтар.<\/li>\n<li><strong>Талаа (мамыча, атрибут)<\/strong> — объекттин бир мүнөздөмөсү; ар бир талаанын маалымат түрү бар.<\/li>\n<li><strong>Негизги ачкыч (PRIMARY KEY)<\/strong> — мааниси ар бир жазууну уникалдуу аныктаган талаа (мисалы, <code>id<\/code>).<\/li>\n<li><strong>Тышкы ачкыч (FOREIGN KEY)<\/strong> — башка таблицанын негизги ачкычына шилтеме кылган жана таблицалардын ортосундагы байланышты берген талаа.<\/li>\n<li><strong>Индекс<\/strong> — талаа боюнча издөөнү тездеткен көмөкчү түзүм (китептеги алфавиттик көрсөткүч сыяктуу).<\/li>\n<\/ul>\n<p><strong>Байланыштын мисалы.<\/strong> <code>departments<\/code> (бөлүмдөр) таблицасы жана <code>employees<\/code> (кызматкерлер) таблицасы. <code>employees<\/code> таблицасында <code>departments.id<\/code> талаасына тышкы ачкыч болгон <code>dept_id<\/code> талаасы бар. «Бирөө-көпкө» байланышы: бир бөлүмдө көп кызматкер.<\/p>\n<p><strong>SQLдин негизги маалымат түрлөрү<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Түрү<\/th>\n<th>Арналышы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>INT / INTEGER<\/td>\n<td>Бүтүн сандар<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>DECIMAL(10,2), FLOAT<\/td>\n<td>Бөлчөк сандар (суммалар, баалар)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>VARCHAR(n)<\/td>\n<td>n белгиге чейинки өзгөрүлмө узундуктагы сап<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TEXT<\/td>\n<td>Узун текст<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DATE, DATETIME<\/td>\n<td>Дата; дата жана убакыт<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>BOOLEAN<\/td>\n<td>Логикалык маани<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>NULL<\/strong> — маани жок экенин билдирген атайын белги (нөл да, бош сап да эмес).<\/p>\n<h2>4. SQL тили: буйруктардын топтору<\/h2>\n<p><strong>SQL (Structured Query Language)<\/strong> — реляциялык маалымат базалары менен иштөө үчүн түзүмдөлгөн сурамдар тили.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Топ<\/th>\n<th>Арналышы<\/th>\n<th>Буйруктар<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>DDL (Data Definition Language)<\/td>\n<td>Түзүмдү аныктоо<\/td>\n<td><code>CREATE<\/code>, <code>ALTER<\/code>, <code>DROP<\/code>, <code>TRUNCATE<\/code><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>DML (Data Manipulation Language)<\/td>\n<td>Маалыматтар менен иштөө<\/td>\n<td><code>SELECT<\/code>, <code>INSERT<\/code>, <code>UPDATE<\/code>, <code>DELETE<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DCL (Data Control Language)<\/td>\n<td>Жетүүнү башкаруу<\/td>\n<td><code>GRANT<\/code>, <code>REVOKE<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Айырмалаңыз: <code>DELETE<\/code> саптарды өчүрөт (шарт менен болушу мүмкүн), <code>TRUNCATE<\/code> таблицаны толугу менен тазалайт, <code>DROP<\/code> таблицанын өзүн түзүмү менен кошо өчүрөт.<\/p>\n<h2>5. SQL сурамдарынын мисалдары<\/h2>\n<p><strong>Таблица түзүү<\/strong><\/p>\n<pre><code>CREATE TABLE employees (\n  id      INT PRIMARY KEY,\n  name    VARCHAR(100) NOT NULL,\n  dept    VARCHAR(50),\n  salary  DECIMAL(10,2),\n  hired   DATE\n);<\/code><\/pre>\n<p><strong>Маалыматтарды кошуу<\/strong><\/p>\n<pre><code>INSERT INTO employees (id, name, dept, salary, hired)\nVALUES (1, &#39;Асанова Айгуль&#39;, &#39;IT&#39;, 65000, &#39;2022-09-01&#39;);<\/code><\/pre>\n<p><strong>Маалыматтарды тандоо<\/strong><\/p>\n<pre><code>SELECT name, salary FROM employees\nWHERE salary &gt; 50000\nORDER BY salary DESC;<\/code><\/pre>\n<p><strong>Жаңылоо жана өчүрүү<\/strong><\/p>\n<pre><code>UPDATE employees SET dept = &#39;Аналитика&#39; WHERE id = 1;\nDELETE FROM employees WHERE id = 7;<\/code><\/pre>\n<p><strong>Агрегаттык функциялар жана топтоо<\/strong><\/p>\n<pre><code>SELECT dept, COUNT(*) AS staff, AVG(salary) AS avg_salary\nFROM employees\nGROUP BY dept;<\/code><\/pre>\n<p>Агрегаттык функциялар: <code>COUNT<\/code> — саны, <code>SUM<\/code> — суммасы, <code>AVG<\/code> — орточосу, <code>MIN<\/code> жана <code>MAX<\/code> — эң кичине жана эң чоң маанилер.<\/p>\n<p><strong>Таблицаларды бириктирүү (JOIN)<\/strong><\/p>\n<pre><code>SELECT e.name, d.title\nFROM employees e\nJOIN departments d ON e.dept_id = d.id;<\/code><\/pre>\n<p><code>JOIN<\/code> эки таблицанын саптарын жалпы талаа боюнча бириктирет.<\/p>\n<blockquote>\n<p>Маанилүү: <code>WHERE<\/code> шартысыз <code>UPDATE<\/code> жана <code>DELETE<\/code> таблицанын <strong>бардык<\/strong> саптарын өзгөртөт же өчүрөт.<\/p>\n<\/blockquote>\n<h2>6. Маалымат базаларынын бизнесте колдонулушу жана тренддер<\/h2>\n<ul>\n<li><strong>CRM-системалар<\/strong> — кардарлар жана бүтүмдөр жөнүндө маалыматтар.<\/li>\n<li><strong>Запастарды эсепке алуу<\/strong> — товарлардын калдыктары, келип түшүүлөр, жөнөтүүлөр.<\/li>\n<li><strong>Финансылык системалар<\/strong> — төлөмдөр, проводкалар, отчёттуулук.<\/li>\n<li><strong>Веб-тиркемелер<\/strong> — колдонуучулар, буйрутмалар, жарыялар.<\/li>\n<\/ul>\n<p>Тренддер: кызмат катары булуттук МБ (DBaaS); бир түрдүү эмес маалыматтардын чоң көлөмү үчүн NoSQL; администрлөөнү автоматташтыруу; шифрлөө жана жетүүнүн аудити.<\/p>\n<h2>7. SQL-тренажёр<\/h2>\n<p>Тренажёрго <code>employees<\/code> окуу таблицасы (10 кызматкер) жүктөлгөн. Сурамды териңиз жана «Аткаруу» баскычын басыңыз. <code>SELECT … FROM employees<\/code>, <code>WHERE<\/code> (<code>=<\/code>, <code>&lt;&gt;<\/code>, <code>&gt;<\/code>, <code>&lt;<\/code>, <code>&gt;=<\/code>, <code>&lt;=<\/code>, <code>LIKE<\/code> шарттары, <code>AND<\/code>/<code>OR<\/code> байламталары), <code>GROUP BY<\/code>, <code>ORDER BY … ASC/DESC<\/code>, <code>LIMIT<\/code>, <code>COUNT<\/code>, <code>SUM<\/code>, <code>AVG<\/code>, <code>MIN<\/code>, <code>MAX<\/code> функциялары колдоого алынат.<\/p>\n<div class=\"widget\" data-w=\"sql\">\n\n<\/div>\n<p>Аракет кылып көрүңүз: IT бөлүмүнүн кызматкерлерин тандаңыз; 50 000ден жогору эмгек акыларды табыңыз; бөлүмдөр боюнча кызматкерлердин санын эсептеңиз; эң жогорку эмгек акыны табыңыз.<\/p>\n<h2>8. «Маалымат базаларынын негиздери жана SQL» кроссворду<\/h2>\n<p>Терминдерди жазыңыз. Тамгалар латын арибинде терилет; эки сөздөн турган жооптор үчүн боштук колдонуңуз.<\/p>\n<div class=\"widget\" data-w=\"xw\">\n\n<\/div>\n<h2>9. Өзүн-өзү текшерүү үчүн суроолор<\/h2>\n<ol type=\"1\">\n<li>Маалымат базасы МББСтен эмнеси менен айырмаланат?<\/li>\n<li>Негизги жана тышкы ачкычтар деген эмне?<\/li>\n<li><code>CREATE<\/code> жана <code>SELECT<\/code> буйруктары SQLдин кайсы тобуна кирет?<\/li>\n<li><code>DELETE<\/code> буйругу <code>DROP<\/code> буйругунан эмнеси менен айырмаланат?<\/li>\n<li><code>JOIN<\/code> эмне үчүн колдонулат?<\/li>\n<li>Реляциялык базалардын реляциялык эместерден жана тескерисинче артыкчылыктары кандай?<\/li>\n<\/ol>\n<h2>Негизги түшүнүктөр<\/h2>\n<p>Маалымат базасы · МББС · таблица · жазуу · талаа · негизги ачкыч · тышкы ачкыч · индекс · SQL · DDL · DML · JOIN · агрегаттык функция · NULL.<\/p>\n<h2>Адабияттар<\/h2>\n<ol type=\"1\">\n<li>Фролов К. В. и др. Цифровые технологии : учеб. пособие. — СПб., 2024.<\/li>\n<li>W3Schools SQL Tutorial. — w3schools.com/sql.<\/li>\n<li>MySQL документациясы. — dev.mysql.com/doc.<\/li>\n<\/ol>\n"}, {"id": "lec-5", "kind": "lec", "num": 5, "title": "Маалыматтарды талдоо жана визуалдаштыруу", "html": "<div class=\"meta\">\n<p>\n2 академиялык саат\n<\/p>\n<p>\n1-модуль\n<\/p>\n<p>\nКК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Лекциянын максаты<\/h2>\n<p>Студенттерди маалыматтарды талдоонун баскычтары жана түрлөрү, базалык статистикалык көрсөткүчтөр, графиктерди тандоонун принциптери жана визуалдаштыруу куралдары (Excel, Power BI, Tableau, Python) менен тааныштыруу.<\/p>\n<p><strong>Лекциянын планы<\/strong><\/p>\n<ol type=\"1\">\n<li>Маалыматтарды талдоого киришүү.<\/li>\n<li>Маалыматтарды талдоонун түрлөрү.<\/li>\n<li>Статистикалык көрсөткүчтөр жана корреляция.<\/li>\n<li>Визуалдаштыруунун негиздери: графиктердин түрлөрү.<\/li>\n<li>Натыйжалуу визуалдаштыруунун принциптери.<\/li>\n<li>Визуалдаштыруу куралдары.<\/li>\n<li>Башкарууда жана бизнесте колдонулушу, тренддер.<\/li>\n<\/ol>\n<h2>1. Маалыматтарды талдоого киришүү<\/h2>\n<p><strong>Маалыматтарды талдоо<\/strong> — чечим кабыл алуу үчүн пайдалуу маалыматты, мыйзам ченемдүүлүктөрдү жана тенденцияларды аныктоо максатында маалыматтарды изилдөө жана иштетүү.<\/p>\n<p>Талдоонун милдеттери: негизги корутундуларды (инсайттарды) алуу; негиздүү чечимдерди колдоо; мыйзам ченемдүүлүктөрдү, четтөөлөрдү жана тренддерди аныктоо.<\/p>\n<p><strong>Маалыматтарды талдоонун баскычтары<\/strong><\/p>\n<ol type=\"1\">\n<li><em>Суроону коюу<\/em> — эмнени так билүү керек.<\/li>\n<li><em>Маалыматтарды чогултуу<\/em> — маалымат базаларынан, файлдардан, веб-аналитикадан, сурамжылоолордон.<\/li>\n<li><em>Тазалоо<\/em> — каталарды, боштуктарды, кайталанмаларды жоюу.<\/li>\n<li><em>Талдоо<\/em> — статистикалык ыкмалар, топтоолор, моделдер.<\/li>\n<li><em>Визуалдаштыруу жана чечмелөө<\/em> — графиктер, дашборддор, корутундулар.<\/li>\n<li><em>Чечим жана көзөмөл<\/em> — иш-аракет жана анын жыйынтыгын текшерүү.<\/li>\n<\/ol>\n<h2>2. Маалыматтарды талдоонун түрлөрү<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Түрү<\/th>\n<th>Суроо<\/th>\n<th>Ыкмалар<\/th>\n<th>Мисал<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Сыпаттама<\/td>\n<td>Эмне болду?<\/td>\n<td>Жыйынтык таблицалар, орточолор, үлүштөр<\/td>\n<td>Айлар боюнча түшүм<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Диагностикалык<\/td>\n<td>Эмне үчүн?<\/td>\n<td>Топторду салыштыруу, корреляция, деталдаштыруу<\/td>\n<td>Бир аймакта сатуунун төмөндөшү<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Болжолдоочу<\/td>\n<td>Эмне болот?<\/td>\n<td>Регрессия, убакыт катарлары, машиналык окутуу<\/td>\n<td>Суроо-талаптын болжолу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Сунуштоочу<\/td>\n<td>Эмне кылуу керек?<\/td>\n<td>Оптималдаштыруу, сценарийлерди моделдөө<\/td>\n<td>Сатып алуунун оптималдуу планы<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Статистикалык көрсөткүчтөр жана корреляция<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Көрсөткүч<\/th>\n<th>Мааниси<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Арифметикалык орточо<\/td>\n<td>Маанилердин суммасы, алардын санына бөлүнгөн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Медиана<\/td>\n<td>Иреттелген катардын борбордук мааниси; чыгып калуучу маанилерге туруктуу<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Мода<\/td>\n<td>Эң көп кездешкен маани<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Кулач<\/td>\n<td>Максималдуу жана минималдуу маанилердин айырмасы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Стандарттык четтөө<\/td>\n<td>Маанилердин орточодон мүнөздүү четтөөсү (чачырандынын өлчөмү)<\/td>\n<\/tr>\n<\/tbody>\n<\/tabl
