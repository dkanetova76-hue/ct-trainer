ылдуу жарык", "html": "<div class=\"meta\">\n<p>\n12-лекцияга кейс\n<\/p>\n<p>\n5 балл\n<\/p>\n<\/div>\n<h2>Кырдаал<\/h2>\n<p>Бизнес-борбор (4 кабат, 160 чырак) электр энергиясына чыгымдарды азайткысы келет. Жарык бүт жумуш күнү, ал эми коридорлордо жана жыйын бөлмөлөрүндө түнкүсүн да тез-тез күйүп турат.<\/p>\n<h2>Тапшырмалар<\/h2>\n<p><strong>1.<\/strong> Жарыкты башкаруунун IoT-системасынын концепциясын иштеп чыгыңыз.<\/p>\n<div class=\"answer\" data-key=\"srs-5-a1\" data-label=\"IoT-системанын концепциясы\">\n\n<\/div>\n<p><strong>2.<\/strong> Кандай датчиктер жана байланыш протоколдору колдонуларын (кыймыл жана жарыктык датчиктери, Zigbee, Z-Wave, Wi-Fi) көрсөтүп, тандооңузду негиздеңиз.<\/p>\n<div class=\"answer\" data-key=\"srs-5-a2\" data-label=\"Датчиктер жана байланыш протоколдору\">\n\n<\/div>\n<p><strong>3.<\/strong> Маалыматтар кантип берилерин, иштетилерин жана автоматташтыруу үчүн колдонуларын (сценарийлер, графиктер, отчёттор) сүрөттөңүз.<\/p>\n<div class=\"answer\" data-key=\"srs-5-a3\" data-label=\"Маалыматтарды берүү, иштетүү жана автоматташтыруу сценарийлери\">\n\n<\/div>\n<p><strong>4.<\/strong> Бизнес-борбордун маалыматтарын коюп, калькулятордо болжолдуу үнөмдөөнү жана өзүн актоо мөөнөтүн эсептеңиз.<\/p>\n<div class=\"widget\" data-w=\"iot-srs\">\n\n<\/div>\n<div class=\"answer\" data-key=\"srs-5-a4\" data-label=\"Үнөмдөөнү эсептөө жана корутунду\">\n\n<\/div>\n"}, {"id": "srs-6", "kind": "srs", "num": 6, "lec": 13, "title": "Чекене соодада ARди колдонуу", "html": "<div class=\"meta\">\n<p>\n13-лекцияга кейс\n<\/p>\n<p>\n5 балл\n<\/p>\n<\/div>\n<h2>Кырдаал<\/h2>\n<p>Эмерек дүкөндөрүнүн тармагы кардарлар эмеректи өз үйлөрүндө «кийгизип көрө» алышы үчүн AR-тиркемени киргизгиси келет. Азыр сатып алуулардын болжол менен 12 % кайтарылат: эмерек өлчөмү же түсү боюнча туура келген жок.<\/p>\n<h2>Тапшырмалар<\/h2>\n<p><strong>1.<\/strong> Тиркеменин концепциясын иштеп чыгыңыз: функциялар, интерфейс, колдонуучунун жолу.<\/p>\n<div class=\"answer\" data-key=\"srs-6-a1\" data-label=\"Тиркеменин концепциясы\">\n\n<\/div>\n<p><strong>2.<\/strong> Технологияларды жана жабдууну аныктаңыз (ARKit, ARCore, Unity, 3D-моделдер, смартфондорго талаптар).<\/p>\n<div class=\"answer\" data-key=\"srs-6-a2\" data-label=\"Технологиялар жана жабдуу\">\n\n<\/div>\n<p><strong>3.<\/strong> Кардарлар жана компания үчүн артыкчылыктарды жана ийгилик бааланган көрсөткүчтөрдү сүрөттөңүз.<\/p>\n<div class=\"answer\" data-key=\"srs-6-a3\" data-label=\"Артыкчылыктар жана ийгиликтин көрсөткүчтөрү\">\n\n<\/div>\n<p><strong>4.<\/strong> Тобокелдиктерди (наркы, кошуунун тактыгы, шайкештик, каталогдун 3D-моделдерин түзүү) жана аларды азайтуу чараларын карап чыгыңыз.<\/p>\n<div class=\"answer\" data-key=\"srs-6-a4\" data-label=\"Тобокелдиктер жана чаралар\">\n\n<\/div>\n"}, {"id": "srs-7", "kind": "srs", "num": 7, "lec": 14, "title": "Кафе үчүн маркетингдик стратегия", "html": "<div class=\"meta\">\n<p>\n14-лекцияга кейс\n<\/p>\n<p>\n5 балл\n<\/p>\n<\/div>\n<h2>Кырдаал<\/h2>\n<p>Жалал-Абаддагы чакан кафе социалдык тармактар жана онлайн-жарнама аркылуу конокторунун агымын көбөйткүсү келет. Кафенин 600 жазылуучусу бар Instagram барагы бар, жарыялар үзгүлтүктүү, жарнама эч качан ишке киргизилген эмес.<\/p>\n<h2>Тапшырмалар<\/h2>\n<p><strong>1.<\/strong> Кафенин максаттуу аудиториясын аныктаңыз (сегменттер, коноктун портрети).<\/p>\n<div class=\"answer\" data-key=\"srs-7-a1\" data-label=\"Максаттуу аудитория\">\n\n<\/div>\n<p><strong>2.<\/strong> Илгерилетүү стратегиясын иштеп чыгыңыз: каналдар, контент, жарнама, акциялар.<\/p>\n<div class=\"answer\" data-key=\"srs-7-a2\" data-label=\"Илгерилетүү стратегиясы\">\n\n<\/div>\n<p><strong>3.<\/strong> Аналитика куралдарын (Google Analytics, Meta Business Suite, UTM-белгилер) жана так эмне өлчөнөрүн көрсөтүңүз.<\/p>\n<div class=\"answer\" data-key=\"srs-7-a3\" data-label=\"Аналитика куралдары\">\n\n<\/div>\n<p><strong>4.<\/strong> Максаттуу маанилери менен KPI сунуштаңыз (CTR, CPA, тартылгандык, жазылуучулардын өсүшү, буйрутмалардын саны) жана аларды калькулятордо шарттуу бюджет үчүн эсептеңиз.<\/p>\n<div class=\"widget\" data-w=\"mkt-srs\">\n\n<\/div>\n<div class=\"answer\" data-key=\"srs-7-a4\" data-label=\"KPI жана эсептөө боюнча корутундулар\">\n\n<\/div>\n"}, {"id": "srs-8", "kind": "srs", "num": 8, "lec": 15, "title": "Логистикалык компаниянын санариптик трансформациясы", "html": "<div class=\"meta\">\n<p>\n15-лекцияга кейс\n<\/p>\n<p>\n5 балл\n<\/p>\n<\/div>\n<h2>Кырдаал<\/h2>\n<p>Логистикалык компания (80 жүк ташуучу унаа) Бишкек, Ош жана Жалал-Абаддын ортосунда жүк ташыйт. Маршруттарды диспетчер кол менен эсептейт, кардарлар жүгү кайда экенин билүү үчүн чалышат, күйүүчү майдын сарпы өсүп жатат, рейстердин бир бөлүгү толук эмес жүктөлүп жүрөт.<\/p>\n<h2>Тапшырмалар<\/h2>\n<p><strong>1.<\/strong> Компаниянын учурдагы көйгөйлөрүн жана алардын чыгымдарга жана кардарларга таасирин талдаңыз.<\/p>\n<div class=\"answer\" data-key=\"srs-8-a1\" data-label=\"Көйгөйлөрдү талдоо\">\n\n<\/div>\n<p><strong>2.<\/strong> Санариптик чечимдерди сунуштаңыз (IoT-датчиктер жана GPS, маршруттарды ML менен болжолдоо жана оптималдаштыруу, кардарлар үчүн көзөмөлдөө порталы, электрондук документтер).<\/p>\n<div class=\"answer\" data-key=\"srs-8-a2\" data-label=\"Санариптик чечимдер\">\n\n<\/div>\n<p><strong>3.<\/strong> Технологияларды киргизүүнүн баскычтарын мөөнөттөрү жана жооптуу адамдары менен иштеп чыгыңыз.<\/p>\n<div class=\"answer\" data-key=\"srs-8-a3\" data-label=\"Киргизүүнүн баскычтары\">\n\n<\/div>\n<p><strong>4.<\/strong> Күтүлгөн жыйынтыктарды сандар менен (жеткирүү убактысы, күйүүчү май сарпы, унаалардын жүктөлүшү, кардарлардын канааттануусу) жана аларды өлчөө ыкмасын сүрөттөңүз.<\/p>\n<div class=\"answer\" data-key=\"srs-8-a4\" data-label=\"Күтүлгөн жыйынтыктар жана аларды өлчөө\">\n\n<\/div>\n"}], "tests": {"levels": {"1": "Эстеп калуу", "2": "Түшүнүү", "3": "Колдонуу", "4": "Талдоо", "5": "Баалоо"}, "qs": [{"n": 1, "m": "М1", "lvl": 1, "lec": 1, "q": "Санариптештирүү деген эмне?", "opts": ["Маалыматты санариптик форматка айландыруу", "Аналогдук маалыматтарды гана колдонуу", "Документтерди санариптик формага келтирүү", "Жаңы түзүлүштөрдү түзүү"], "key": 0, "why": "Санариптештирүү — маалыматты санариптик формага которуу жана аны процесстерде колдонуу."}, {"n": 2, "m": "М1", "lvl": 2, "lec": 1, "q": "Азыркы бизнесте санариптештирүү кандай ролду аткарат?", "opts": ["Маалыматтарга жетүүнү жеңилдетет", "Атаандаштыкка жөндөмдүүлүктү төмөндөтөт", "Аналогдук маалыматка муктаждыкты көбөйтөт", "Жаңы технологиялардын зарылдыгын жокко чыгарат"], "key": 0, "why": "Санариптик маалыматтар тезирээк табылат, берилет жана иштетилет."}, {"n": 3, "m": "М1", "lvl": 1, "lec": 1, "q": "Индустрия 4.0 деген эмне?", "opts": ["Аналогдук түзүлүштөрдү массалык өндүрүү", "Өнөр жайда санариптик технологияларга өтүү", "Физикалык продуктыларды гана түзүү", "Кагаз документтерди колдонуу"], "key": 1, "why": "Индустрия 4.0 — өнөр жайдын санариптик технологиялардын негизинде «акылдуу» өндүрүшкө өтүшү."}, {"n": 4, "m": "М1", "lvl": 2, "lec": 1, "q": "Төмөнкү тренддердин кайсынысы санариптештирүүгө тиешелүү?", "opts": ["Басылма документтерди колдонуу", "Виртуалдык чындык", "Телеберүүлөр", "Радиосигналдар"], "key": 1, "why": "Виртуалдык чындык — санариптик технология; басма, телевидение жана радио — аналогдук каналдар."}, {"n": 5, "m": "М1", "lvl": 2, "lec": 1, "q": "Санариптештирүүнүн негизги артыкчылыгы:", "opts": ["Өндүрүшкө чыгымдардын көбөйүшү", "Маалыматтарга жетүүнүн жана аларды иштетүүнүн жеңилдеши", "Маалыматка жетүүнү чектөө", "Өндүрүмдүүлүктүн төмөндөшү"], "key": 1, "why": "Негизги утуш — маалыматтарга жетүүнүн жана аларды иштетүүнүн жеңилдеши."}, {"n": 6, "m": "М1", "lvl": 1, "lec": 1, "q": "Компаниянын толук санариптик трансформациясын сүрөттөө үчүн кайсы термин колдонулат?", "opts": ["Санариптик формага келтирүү", "Санариптештирүү", "Санариптик трансформация", "Диджиталдаштыруу"], "key": 2, "why": "Санариптик технологиялардын негизинде иш-аракет моделин толу   if (!silent){ ST._ts = Date.now(); if (typeof syncMark === 'function') syncMark(); }
  clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch(e) {} }, 250);

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200); }

function groupOf(h){
  if (/^lec-/.test(h)) return 1; if (/^pz-|^practice/.test(h)) return 2; if (/^srs-/.test(h)) return 3;
  if (/^test|^bloom/.test(h)) return 4; if (/^exam|^ticket/.test(h)) return 5; if (/^report/.test(h)) return 6; return 0;
}
const LANG = D.lang || 'ru';
function langLink(){ const el = $('#lang'); if (!el) return; const other = LANG === 'ky' ? ['index.html', 'Русский'] : ['ky.html', 'Кыргызча']; el.href = other[0] + location.hash; el.textContent = other[1]; }
window.addEventListener('hashchange', langLink);
function buildNav(){
  $('#tabs').innerHTML = GROUPS.map((g,i) => `<a href="#${g.h}" data-g="${i}">${g.tab}</a>`).join('');
  $('#side').innerHTML = GROUPS.map(g => `<h6>${g.tab}</h6>` + g.items.map(it =>
    `<a href="#${it.h}" data-h="${it.h}" class="${ST.done[it.h]?'done':''}"><span class="n">${it.n}</span><span>${esc(it.t)}</span><span class="dot"></span></a>`).join('')).join('');
}
function markNav(h){
  const g = groupOf(h);
  $$('#tabs a').forEach(a => a.classList.toggle('on', +a.dataset.g === g));
  $$('#side a').forEach(a => { a.classList.toggle('on', a.dataset.h === h || (h.startsWith('ticket-') && a.dataset.h==='exam') || (h.startsWith('test-') && a.dataset.h==='tests')); a.classList.toggle('done', !!ST.done[a.dataset.h]); });
  const on = $('#side a.on'); if (on && on.scrollIntoViewIfNeeded) on.scrollIntoViewIfNeeded(false);
}


function route(){
  const h = (location.hash || '#title').slice(1) || 'title';
  document.body.classList.remove('nav-open');
  const main = $('#main'); let html = '';
  let toc = true;
  if (byId[h]) html = renderSection(byId[h]);
  else if (h === 'practice') html = renderPracticeIntro();
  else if (h === 'glossary') { html = renderGlossary(); toc = false; }
  else if (h === 'tests') { html = renderTests(); toc = false; }
  else if (h.startsWith('test-')) { html = '<div class="page" id="quiz"></div>'; toc = false; }
  else if (h === 'bloom') { html = renderBloom(); toc=false; }
  else if (h === 'exam') html = renderExam();
  else if (h.startsWith('ticket-')) html = renderTicket(+h.slice(7));
  else if (h === 'report') { html = renderReport(); toc=false; }
  else html = renderTitle();
  main.innerHTML = html;
  markNav(h);
  window.scrollTo(0, 0);
  if (byId[h]) wireSection(byId[h]);
  if (h === 'glossary') wireGlossary();
  if (h.startsWith('test-')) startQuiz(h.slice(5));
  if (h.startsWith('ticket-')) wireTicket(+h.slice(7));
  if (h === 'report') wireReport();
  buildToc(toc);
  cloudRoute(h);
}
function buildToc(on){
  const hs = on ? $$('#main .doc h2, #main h2.sec') : [];
  hs.forEach((x,i) => x.id = 'p' + (i+1));
  $('#toc').innerHTML = hs.length > 2 ? '<b>Бул бетте</b>' + hs.map(x => `<a href="javascript:void 0" data-to="${x.id}">${esc(x.textContent.replace(/^\d+\.\s*/,''))}</a>`).join('') : '';
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-to]');
  if (a) { e.preventDefault(); const t = document.getElementById(a.dataset.to); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); }
});


function neighbours(s){ const i = S.indexOf(s); return [S[i-1], S[i+1]]; }
function renderSection(s){
  const [p, n] = neighbours(s);
  const eyebrow = s.kind==='lec' ? `Теория · № ${s.num} лекция · ${s.num<=7?1:2}-модуль` : s.kind==='pz' ? `Практика · ${pzName(s)}` : s.kind==='srs' ? (s.num? `Студенттин № ${s.num} өз алдынча иши` : 'Студенттердин өз алдынча иши · 60 саат') : 'Дисциплина · Бакалавриат 710500';
  const done = !!ST.done[s.id];
  let extra = '';
  if (s.kind==='lec') {
    extra = pzOfLec(s.num).map(x => `<a class="pill" href="#${x.id}">→ ${short(x)}</a>`).join('') + srsOfLec(s.num).map(x => `<a class="pill" href="#${x.id}">→ ${short(x)}</a>`).join('');
    extra += `<a class="pill" href="#test-lec${s.num}">Лекция боюнча тест</a>`;
  }
  if (s.kind==='pz') extra = `<a class="pill" href="#lec-${s.lec}">№ ${s.lec} лекция</a><a class="pill" href="#report" data-rep="${s.id}">Иш боюнча отчёт</a>`;
  if (s.kind==='srs' && s.num) extra = `<a class="pill" href="#lec-${s.lec}">№ ${s.lec} лекция</a><a class="pill" href="#report" data-rep="${s.id}">СӨИ боюнча отчёт</a>`;
  const nm = x => x.kind==='pz' ? `№ ${x.num} ПС` : x.kind==='program' ? KIND.program : (x.num? '№ '+x.num+' ':'') + KIND[x.kind].toLowerCase();
  return `<div class="page">
    <p class="eyebrow">${eyebrow}</p>
    <h1 class="ttl">${esc(s.title)}</h1>
    <div class="head-row">${s.kind!=='program' ? `<label class="pill done-toggle ${done?'is-done':''}"><input type="checkbox" id="done-${s.id}" ${done?'checked':''}> ${s.kind==='lec'?'Окулду':'Аткарылды'}</label>`:''}${extra}</div>
    <article class="doc">${s.html}</article>
    ${s.kind==='lec' ? `<div class="row" style="margin-top:28px"><a class="btn pri" href="#test-lec${s.num}">Өзүңүздү текшериңиз: № ${s.num} лекция боюнча тест</a><a class="btn" href="#tests">Бардык тесттер</a></div>` : ''}
    <nav class="pager">${p ? `<a href="#${p.id}"><small>← ${nm(p)}</small>${esc(p.title)}</a>`:'<span></span>'}${n ? `<a href="#${n.id}"><small>${nm(n)} →</small>${esc(n.title)}</a>`:''}</nav>
  </div>`;
}
function wireSection(s){
  const dt = $('#done-'+s.id);
  if (dt) dt.addEventListener('change', () => { ST.done[s.id] = dt.checked; if(!dt.checked) delete ST.done[s.id]; dt.parentElement.classList.toggle('is-done', dt.checked); save(); markNav(s.id); cloudDone(s, dt.checked); });
  $$('[data-rep]').forEach(a => a.addEventListener('click', () => { ST.me.sel = a.dataset.rep; save(); }));
  const root = $('#main .doc');
  $$('.answer', root).forEach(d => {
    const k = d.dataset.key;
    d.innerHTML = `<label for="${k}">Жооп · <span>${esc(d.dataset.label)}</span></label><textarea id="${k}" placeholder="Жоопту өз сөзүңүз менен териңиз. Текст сакталат жана отчётко кошулат."></textarea><div class="saved"></div>`;
    const ta = $('textarea', d); ta.value = ST.f[k] || '';
    ta.addEventListener('input', () => { ST.f[k] = ta.value; save(); d.querySelector('.saved').textContent = 'Сакталды'; });
  });
  $$('textarea.fld[data-save]', root).forEach(ta => {
    ta.value = ST.f[ta.id] || ''; ta.placeholder = 'Студент толтурат';
    ta.addEventListener('input', () => { ST.f[ta.id] = ta.value; save(); });
  });
  $$('.widget', root).forEach(mountWidget);
}

const ECOLS = ['id','name','dept','position','salary','hired','city'];
function sqlRun(src){
  let q = src.trim().replace(/;\s*$/,'').replace(/\s+/g,' ');
  const m = /^select (.+?) from (\w+)(?: where (.+?))?(?: group by (\w+))?(?: order by (\w+)(?: (asc|desc))?)?(?: limit (\d+))?$/i.exec(q);
  if (!m) throw new Error('Сурамды талдоо мүмкүн болбоду. Бөлүктөрдүн тартиби: SELECT … FROM employees [WHERE …] [GROUP BY …] [ORDER BY … ASC|DESC] [LIMIT n]. INSERT, UPDATE, DELETE буйруктары тренажёрдо аткарылбайт.');
  const [, sel, tbl, where, grp, ord, dir, lim] = m;
  if (tbl.toLowerCase() !== 'employees') throw new Error(`«${tbl}» таблицасы табылган жок. Жалгыз employees жеткиликтүү.`);
  const ci = c => { const i = ECOLS.indexOf(c.toLowerCase()); if (i < 0) throw new Error(`«${c}» мамычасы жок. Мамычалар: ${ECOLS.join(', ')}.`); return i; };
  let rows = EMP.slice();
  if (where){
    const lit = v => { v = v.trim(); if (/^'.*'$/.test(v)) return v.slice(1,-1); if (!isNaN(+v)) return +v; throw new Error(`${v} мааниси: саптар жалгыз тырмакчага алынып жазылат.`); };
    const cond = c => { const k = /^(\w+)\s*(<>|!=|>=|<=|=|>|<|like)\s*(.+)$/i.exec(c.trim()); if (!k) throw new Error(`«${c.trim()}» шарты таанылган жок.`);
      const i = ci(k[1]), op = k[2].toLowerCase(), v = lit(k[3]);

    const K = st.r.map(([n,c,i,cl,cv,rv]) => ({n, ctr: i? cl/i*100 : 0, cpc: cl? c/cl : 0, cpm: i? c/i*1000 : 0, cr: cl? cv/cl*100 : 0, cpa: cv? c/cv : Infinity, roi: c? (rv-c)/c*100 : 0}));
    const bestRoi = Math.max(...K.map(k=>k.roi)), bestCpa = Math.min(...K.map(k=>k.cpa));
    $(`#${id}-kpi`, body).innerHTML = K.map(k=>`<tr><td>${esc(k.n)}</td><td>${fmt(k.ctr,2)}%</td><td>${fmt(k.cpc,1)}</td><td>${fmt(k.cpm,0)}</td><td>${fmt(k.cr,2)}%</td><td${K.length>1&&k.cpa===bestCpa?' style="font-weight:600;color:var(--ok)"':''}>${isFinite(k.cpa)?fmt(k.cpa,0):'—'}</td><td style="${k.roi<0?'color:var(--stamp);':''}${K.length>1&&k.roi===bestRoi?'font-weight:600;color:var(--ok)':''}">${fmt(k.roi,0)}%</td></tr>`).join('');
    const neg = K.filter(k=>k.roi<0).map(k=>k.n);
    $('.w-msg', body).className = 'w-msg ' + (neg.length?'bad':'good');
    $('.w-msg', body).textContent = neg.length ? `Терс ROI: ${neg.join(', ')} — кампания чыгымдарды актабайт.` : (K.length>1 ? `Эң жакшы ROI: ${K.find(k=>k.roi===bestRoi).n}; эң арзан конверсия: ${K.find(k=>k.cpa===bestCpa).n}.` : 'Кампания өзүн актайт: киреше чыгымдардан ашат.');
    SUMMARY[id] = () => `${cfg.title}: ${K.map((k,j)=>`${k.n} — чыгымдар ${fmt0(st.r[j][1])}, киреше ${fmt0(st.r[j][5])}; CTR ${fmt(k.ctr,2)}%, CPC ${fmt(k.cpc,1)}, CR ${fmt(k.cr,2)}%, CPA ${isFinite(k.cpa)?fmt(k.cpa,0):'—'}, ROI ${fmt(k.roi,0)}%`).join('; ')}.`;
  };
  $$('input', body).forEach(i => i.addEventListener('input', calc)); calc(); footer(body, () => reset(id, el));
}

  el.innerHTML = `<div class="w-head"><b>«Маалымат базаларынын негиздери жана SQL» кроссворду</b><small>Жооптор «Текшерүү» баскычы менен текшерилет.</small></div><div class="w-body">${block(XWH, XW.h)}${block('Тигинен', XW.v)}<div class="row" style="margin-top:12px"><button class="btn pri sm" type="button" id="xw-chk">Текшерүү</button><button class="btn sm" type="button" id="xw-clr">Тазалоо</button></div><div class="w-msg" id="xw-msg"></div></div>`;
  const norm = s => s.trim().toUpperCase().replace(/\s+/g,' ');

  $$('input', el).forEach(i => i.addEventListener('input', () => { st[i.dataset.k] = i.value; ST.w.xw = st; save(); i.classList.remove('ok','no'); }));
  $('#xw-chk', el).addEventListener('click', () => { let ok = 0, n = 0; $$('input', el).forEach(i => { n++; const g = norm(i.value) === ans[i.dataset.k]; if (g) ok++; i.classList.toggle('ok', g); i.classList.toggle('no', !g && !!i.value.trim()); });
    const m = $('#xw-msg', el); m.className = 'w-msg ' + (ok===n?'good':''); m.textContent = ok===n ? `Эң сонун: бардык ${n} сөз табылды.` : `Туура: ${ok} / ${n}. Туура эмес жооптор кызыл менен белгиленди.`; });

function wNpv5(id, cfg, body, el){
  const st = wstate(id, cfg.def);
  body.innerHTML = `<div class="w-grid">${numIn(id+'-I','Баштапкы инвестициялар, сом',st.I,10000,0)}${numIn(id+'-B','Жылдык акчалай пайда, сом',st.B,10000,0)}${numIn(id+'-C','Жыл сайынкы эксплуатациялык чыгымдар, сом',st.C,10000,0)}${numIn(id+'-r','Дисконттоо ставкасы, %',st.r,0.5,0)}</div><div class="w-res"></div><div class="w-msg"></div>`;
  const calc = (ev) => {
    ['I','B','C','r'].forEach(k => st[k] = +$('#'+id+'-'+k).value || 0); commit(id, st, ev);
    const cf = st.B - st.C, r = st.r/100; let pv = 0; for (let t=1; t<=st.n; t++) pv += cf/Math.pow(1+r, t);
    const npv = pv - st.I;
    $('.w-res', body).innerHTML = `<div class="w-kpi"><span>Жылдык таза агым</span><b>${fmt0(cf)}</b> сом</div><div class="w-kpi ${npv>=0?'good':'bad'}"><span>NPV, ${st.n} жыл</span><b>${fmt0(npv)}</b> сом</div>`;
    const m = $('.w-msg', body); m.className = 'w-msg ' + (npv>=0?'good':'bad');
    m.textContent = npv >= 0 ? 'NPV оң: берилген агымдар боюнча долбоор оң келтирилген наркты түзөт.' : 'NPV терс: келтирилген түшүүлөр баштапкы инвестицияларды жаппайт.';
    SUMMARY[id] = () => `${cfg.title}: инвестициялар ${fmt0(st.I)} сом; пайда ${fmt0(st.B)} сом/жыл; чыгымдар ${fmt0(st.C)} сом/жыл; ставка ${st.r}%. Жылдык таза агым ${fmt0(cf)} сом; NPV, ${st.n} жыл = ${fmt0(npv)} сом.`;
  };
  $$('input', body).forEach(i => i.addEventListener('input', calc)); calc(); footer(body, () => reset(id, el));
}

function wMca(id, cfg, body, el){
  const st = wstate(id, {w: cfg.crit.map(c => c[1]), s: cfg.alts.map(a => a[1].slice())});
  let h = '';
  if (cfg.editW) h += `<div class="w-grid">${cfg.crit.map((c,i) => `<div class="w-row"><label for="${id}-w${i}">${esc(c[0])}</label><output id="${id}-wo${i}"></output><input type="range" id="${id}-w${i}" min="0" max="60" step="1" value="${st.w[i]}"></div>`).join('')}</div><small id="${id}-ws" style="color:var(--muted)"></small>`;
  h += `<div class="w-grid">${cfg.alts.map((a,j) => `<div class="alt" id="${id}-a${j}"><h5><span>${esc(a[0])}</span><span class="num" id="${id}-r${j}"></span></h5>${cfg.crit.map((c,i) => `<div class="sc"><span>${esc(c[0])} <small style="color:var(--muted)" class="wl${i}"></small></span>${cfg.editS ? `<select id="${id}-s${j}-${i}" aria-label="${esc(a[0]+': '+c[0])}">${[1,2,3,4,5].map(v=>`<option ${v===st.s[j][i]?'selected':''}>${v}</option>`).join('')}</select>` : `<span class="num">${st.s[j][i]}</span>`}</div>`).join('')}</div>`).join('')}</div>`;
  h += `<div class="bars" id="${id}-bars"></div><div class="w-msg" id="${id}-msg"></div>`;
  body.innerHTML = h;
  const calc = (ev) => {
    if (cfg.editW) cfg.crit.forEach((c,i) => st.w[i] = +$(`#${id}-w${i}`).value);
    if (cfg.editS) cfg.alts.forEach((a,j) => cfg.crit.forEach((c,i) => st.s[j][i] = +$(`#${id}-s${j}-${i}`).value));
    commit(id, st, ev);
    const sw = st.w.reduce((x,y)=>x+y,0) || 1, wn = st.w.map(w => w/sw);
    cfg.crit.forEach((c,i) => { $$('.wl'+i, body).forEach(x => x.textContent = `(${Math.round(wn[i]*100)}%)`); if (cfg.editW) $(`#${id}-wo${i}`).textContent = Math.round(wn[i]*100)+'%'; });
    if (cfg.editW) $(`#${id}-ws`).textContent = `Берилген салмактардын суммасы: ${sw}. Эсептөөдө салмактар 100%га чейин нормаланат.`;
    const res = st.s.map(sc => sc.reduce((acc,v,i) => acc + v*wn[i], 0));
    const best = Math.max(...res), winners = cfg.alts.filter((a,j) => Math.abs(res[j]-best) < 1e-9).map(a => a[0].replace(/^Альтернатива \w · /,''));
    cfg.alts.forEach((a,j) => { $(`#${id}-r${j}`).textContent = fmt(res[j]) + ' / 5'; $(`#${id}-a${j}`).classList.toggle('win', Math.abs(res[j]-best)<1e-9); });
    $(`#${id}-bars`).innerHTML = cfg.alts.map((a,j) => `<div class="bar ${Math.abs(res[j]-best)<1e-9?'win':''}"><span>${esc(a[0].replace(/^Альтернатива \w · /,''))}</span><span class="trk"><i style="width:${res[j]/5*100}%"></i></span><b>${fmt(res[j])}</b></div>`).join('');
    $(`#${id}-msg`).innerHTML = `${winners.length>1?'Эң жогорку баа алгандар':'Эң жогорку баа алган'}: <b>${esc(winners.join(' / '))}</b>. Корутунду тандалган критерийлерден, салмактардан жана эксперттик баалардан көз каранды.`;
    SUMMARY[id] = () => `${cfg.title}. Салмактар: ${cfg.crit.map((c,i)=>`${c[0]} ${Math.round(wn[i]*100)}%`).join('; ')}. Жыйынтык баалар: ${cfg.alts.map((a,j)=>`${a[0]} — ${fmt(res[j])} (${st.s[j].join(', ')})`).join('; ')}. Эң жакшысы: ${winners.join(' / ')}.`;
  };
  $$('input,select', body).forEach(i => i.addEventListener('input', calc)); calc(); footer(body, () => reset(id, el));
}

  };
  $$('input', body).forEach(i => i.addEventListener('input', calc)); calc(); footer(body, () => reset(id, el));
}

function wireGlossary(){
  const G = D.glossary.slice().sort((a,b) => a.t.localeCompare(b.t, 'en'));

  $('#gl-q').addEventListener('input', draw); draw();
}

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function finalSet(){ const per = {1:10,2:8,3:6,4:4,5:2}; let r = []; for (const l in per) r = r.concat(shuffle(QS.filter(q=>q.lvl===+l)).slice(0, per[l])); return shuffle(r); }
let QZ = null;
function startQuiz(id){
  const set = testSets().find(s => s.id===id); if (!set) { location.hash = '#tests'; return; }
  if (SB && !ME){ $('#quiz').innerHTML = `<div class="w-msg">Тесттин жыйынтыгын окутуучу алышы үчүн эсептик жазууга кириңиз.</div><div class="row" style="margin-top:12px"><button class="btn pri" type="button" data-auth="login">Кирүү</button><button class="btn" type="button" id="q-anon">Кирбей өтүү</button><a class="btn" href="#tests">Артка</a></div>`;
    authOpen('login', 'Тесттин жыйынтыгын окутуучу алышы үчүн кириңиз.', () => startQuiz(id));
    $('#q-anon').onclick = () => { try { $('#auth-dlg').close(); } catch(e){} runQuiz(set); }; return; }
  runQuiz(set);
}
function runQuiz(set){
  cloudTestStart(set.id);
  const base = set.qs ? shuffle(set.qs) : set.pool ? shuffle(set.pool).slice(0, set.cnt) : finalSet();
  const qs = base.map(q => ({q, order: shuffle([0,1,2,3])}));
  QZ = {set, qs, i:0, picks:[], answered:false, start:Date.now()};
  drawQ();
}
function drawQ(){
  const z = QZ, it = z.qs[z.i], q = it.q, box = $('#quiz');
  box.innerHTML = `<div class="quiz"><p class="eyebrow">${esc(z.set.t)}</p>
  <div class="q-top"><span>Суроо ${z.i+1} / ${z.qs.length}</span><span><span class="tag">B${q.lvl} · ${BLOOM[q.lvl]}</span> <span class="tag">Л-${q.lec}</span></span></div>
  <div class="q-prog"><i style="width:${(z.i)/z.qs.length*100}%"></i></div>
  <p class="q-text">${esc(q.q)}</p>
  <div class="opts">${it.order.map((o,k)=>`<button type="button" class="opt" data-o="${o}"><span class="l">${'АБВГ'[k]}</span><span>${esc(q.opts[o])}</span></button>`).join('')}</div>
  <div id="fb"></div>
  <div class="row"><button class="btn pri" id="q-next" type="button" disabled>${z.set.fb?'Жооп берүү':'Кийинки'}</button><a class="btn" href="#tests">Чыгуу</a></div></div>`;
  let sel = null;
  $$('.opt', box).forEach(b => b.addEventListener('click', () => { if (z.answered) return; sel = +b.dataset.o; $$('.opt', box).forEach(x=>x.classList.toggle('sel', x===b)); $('#q-next').disabled = false; }));
  $('#q-next').addEventListener('click', () => {
    if (z.set.fb && !z.answered) {
      z.answered = true; z.picks[z.i] = sel; const ok = sel === q.key;
      $$('.opt', box).forEach(x => { x.disabled = true; const o = +x.dataset.o; if (o===q.key) x.classList.add('right'); else if (o===sel) x.classList.add('wrong'); });
      $('#fb').innerHTML = `<div class="fb ${ok?'good':'bad'}"><b>${ok?'Туура.':'Туура эмес.'}</b> ${esc(q.why)}</div>`;
      $('#q-next').textContent = z.i < z.qs.length-1 ? 'Кийинки суроо' : 'Жыйынтык';
      return;
    }
    if (!z.set.fb) z.picks[z.i] = sel;
    z.answered = false; z.i++;
    if (z.i < z.qs.length) drawQ(); else finishQuiz();
  });
}
function finishQuiz(){
  const z = QZ, box = $('#quiz');
  const res = z.qs.map((it,k) => ({q:it.q, pick:z.picks[k], ok:z.picks[k]===it.q.key}));
  const ok = res.filter(r=>r.ok).length, n = res.length;
  res.forEach(r => ST.t.ans[r.q.n] = r.ok);
  const run = {set:z.set.id, t:z.set.t, ok, n, at:new Date().toISOString(), wrong:res.filter(r=>!r.ok).map(r=>r.q.n)};
  ST.t.runs.push(run); if (ST.t.runs.length > 80) ST.t.runs.shift(); save();
  const sent = cloudTestSubmit(z, res, Math.round((Date.now() - z.start) / 1000));
  const lv = [1,2,3,4,5].map(l => { const x = res.filter(r=>r.q.lvl===l); return x.length ? [l, x.filter(r=>r.ok).length, x.length] : null; }).filter(Boolean);
  const wrong = res.filter(r=>!r.ok);
  box.innerHTML = `<div class="quiz"><p class="eyebrow">${esc(z.set.t)} · жыйынтык</p>
  <div class="row" style="gap:18px;align-items:flex-end;margin-bottom:18px"><span class="score-big">${ok}/${n}</span><span style="font-size:18px;color:var(--muted)">${Math.round(ok/n*100)}% туура жооп</span></div>
  <div class="bars">${lv.map(([l,a,b])=>`<div class="bar ${a/b<0.6?'low':''}"><span>B${l} · ${BLOOM[l]}</span><span class="trk"><i style="width:${a/b*100}%"></i></span><b>${a}/${b}</b></div>`).join('')}</div>
  ${sent ? `<div class="w-msg good" style="margin-top:16px">Жыйынтык окутуучуга жөнөтүлдү (${esc(ME.fio)}, ${esc(ME.grp || '')}).</div>` : (CLOUD ? '<div class="w-msg bad" style="margin-top:16px">Сиз кирген жоксуз: жыйынтык ушул түзмөктө гана калды. Аны .docx форматында жүктөп алыңыз же кирип, тестти кайра өтүңүз.</div>' : '')}
  <div class="row" style="margin:20px 0"><button class="btn pri" id="q-again" type="button">Кайра өтүү</button><button class="btn" id="q-doc" type="button">Жыйынтыкты жүктөп алуу (.docx)</button><a class="btn" href="#bloom">Блум боюнча профиль</a><a class="btn" href="#tests">Бардык тесттер</a></div>
  <h2 class="sec">Каталарды талдоо${wrong.length?` · ${wrong.length}`:''}</h2>
  ${wrong.length ? `<div class="review">${wrong.map(r=>`<div><p><span class="tag">B${r.q.lvl}</span> <span class="tag">Л-${r.q.lec}</span> <b>${esc(r.q.q)}</b></p><p>Сиздин жообуңуз: ${r.pick==null?'жооп жок':esc(r.q.opts[r.pick])}</p><p>Туура жооп: <b>${esc(r.q.opts[r.q.key])}</b></p><p style="color:var(--muted)">${esc(r.q.why)} <a href="#lec-${r.q.lec}">№ ${r.q.lec} лекцияны кайталоо</a></p></div>`).join('')}</div>` : '<p>Ката жок.</p>'}</div>`;
  $('#q-again').addEventListener('click', () => startQuiz(z.set.id));
  $('#q-doc').addEventListener('click', () => {
    const me = ST.me;
    const P = [['t','Тестирлөөнүн жыйынтыгы'],['c',`«${COURSE_NAME}» дисциплинасы`],['p',`Студент: ${me.fio||'—'}   Топ: ${me.group||'—'}`],['p',`Тест: ${z.set.t}`],['p',`Күнү: ${new Date().toLocaleString('ru-RU')}`],['p',`Жыйынтык: ${ok} / ${n} (${Math.round(ok/n*100)}%)`],['h','Блумдун деңгээлдери боюнча жыйынтыктар']]
      .concat(lv.map(([l,a,b])=>['p',`B${l} ${BLOOM[l]}: ${a} / ${b}`]))
      .concat([['h','Катасы бар тапшырмалар']]).concat(wrong.length? wrong.flatMap((r,k)=>[['p',`${k+1}. [B${r.q.lvl}, ${r.q.lec}-лекция] ${r.q.q}`],['p',`Студенттин жообу: ${r.pick==null?'жооп жок':r.q.opts[r.pick]}. Туура жооп: ${r.q.opts[r.q.key]}.`]]) : [['p','Ката жок.']]);
    downloadDocx(P, `Тест_${z.set.id}_${(me.fio||'студент').replace(/\s+/g,'_')}.docx`);
  });
}
function renderBloom(){
  const st = [1,2,3,4,5].map(l => { const qs = QS.filter(q=>q.lvl===l); const seen = qs.filter(q => q.n in ST.t.ans); const ok = seen.filter(q => ST.t.ans[q.n]).length; return {l, total:qs.length, seen:seen.length, ok}; });
  const any = st.some(x=>x.seen);
  const weakest = any ? st.filter(x=>x.seen).reduce((a,b)=> b.ok/b.seen < a.ok/a.seen ? b : a) : null;
  return `<div class="page"><p class="eyebrow">Текшерүү</p><h1 class="ttl">Блум боюнча менин профилим</h1>
  <p style="color:var(--muted)">Өтүлгөн бардык тесттердеги банктын ар бир тапшырмасына берилген акыркы жооп эсепке алынат.</p>
  ${any ? `<div class="bars" style="margin:18px 0">${st.map(x=>`<div class="bar ${x.seen && x.ok/x.seen<0.6?'low':''}"><span>B${x.l} · ${BLOOM[x.l]}</span><span class="trk"><i style="width:${x.seen?x.ok/x.seen*100:0}%"></i></span><b>${x.seen?Math.round(x.ok/x.seen*100)+'%':'—'}</b></div>`).join('')}</div>
  <div class="tbl doc"><table><thead><tr><th>Деңгээл</th><th>Банктан чечилди</th><th>Туура</th></tr></thead><tbody>${st.map(x=>`<tr><td>B${x.l} ${BLOOM[x.l]}</td><td>${x.seen} / ${x.total}</td><td>${x.ok}</td></tr>`).join('')}</tbody></table></div>
  <p>Азыр эң алсыз деңгээл <b>B${weakest.l} · ${BLOOM[weakest.l]}</b>. <a href="#test-l${weakest.l}">Бул деңгээлдин тестин өтүү</a>.</p>

  : `<div class="w-msg" style="margin:18px 0">Профиль биринчи тесттен кийин пайда болот. Лекция боюнча же 1-деңгээлдеги тесттен баштаңыз.</div><div class="row"><a class="btn pri" href="#test-l1">1-деңгээл · Эстеп калуу</a><a class="btn" href="#test-m1">1-модуль</a></div>`}
  </div>`;
}

const DKEY = 'ct-state';
const SYN = {dirty:false, busy:false, ready:false, off:false, t:null};
function syncMark(){ if (!ME || !SYN.ready) return; SYN.dirty = true; clearTimeout(SYN.t); SYN.t = setTimeout(syncPush, 4000); }
async function syncPull(){
  SYN.ready = false;
  try { const prev = localStorage.getItem('ct-sync-uid'); if (prev && prev !== ME.id) resetState(); localStorage.setItem('ct-sync-uid', ME.id); } catch(e){}
  const {data, error} = await SB.from('drafts').select('key,data,updated_at').eq('key', DKEY);
  if (error){ SYN.off = true; SYN.ready = true; return; }
  const row = (data || [])[0];
  const ct = row ? (Date.parse(row.updated_at) || 0) : 0, lt = ST._ts || 0;
  if (row && ct > lt && row.data && typeof row.data === 'object'){
    const keep = ST.me; Object.keys(ST).forEach(k => delete ST[k]); Object.assign(ST, {done:{}, f:{}, w:{}, t:{ans:{}, runs:[]}, me:{}, typed:{}, paste:{}}, row.data);
    ST.me = Object.assign({}, row.data.me || {}, {fio: keep.fio, group: keep.group}); ST._ts = ct; save(true);
    buildNav();
  } else if (lt > ct) SYN.dirty = true;
  SYN.ready = true; if (SYN.dirty) syncPush();
}
async function syncPush(now){
  if (now) clearTimeout(SYN.t);
  if (!SB || !ME || !SYN.ready || SYN.off || !SYN.dirty) return true;
  if (SYN.busy){ syncMark(); return false; }
  SYN.busy = true; SYN.dirty = false; let ok = true;
  try { const {error} = await SB.from('drafts').upsert({user_id: ME.id, key: DKEY, data: ST, updated_at: new Date(ST._ts || Date.now()).toISOString()}, {onConflict:'user_id,key'}); if (error) throw error; }
  catch(e){ ok = false; SYN.dirty = true; if (/drafts|relation|schema cache/i.test((e && e.message) || '')) SYN.off = true; }
  SYN.busy = false; return ok;
}
setInterval(() => { if (SYN.dirty) syncPush(); }, 30000);

    till: d => `${d} чейин`, done: (d, n) => `${n} ичинен ${d} аткарылды`, debt: n => `Мөөнөтү өттү: ${n} иш тапшырыла элек. Мүмкүн болушунча тезирээк тапшырыңыз.`,
    allok: 'Баары тапшырылды ✓', left: n => `${n} күн калды`, behind: (e, d) => `Графикти кармоо үчүн ушул жумага чейин ${e} иш болушу керек, сизде ${d}.`,
    ontrack: 'Графикти кармап жатасыз.', future: d => `${d} башталат`, notdone: n => `Тапшырыла элек (${n})`,
    tests: a => `Тесттердин орточо жыйынтыгы: ${a} %`, reps: (c, n, g) => `Текшерилген отчёттор: ${n} ичинен ${c}${g ? ` · орточо баа ${g}` : ''}`,
    more: 'Толугураак', toastDebt: (m, n) => `${m}: мөөнөтү өттү, ${n} иш тапшырыла элек.`, toastSoon: (m, n, d) => `${m}: ${d} күн калды, дагы ${n} иш тапшыруу керек.`, toastBehind: (m) => `${m}: графиктен артта калып жатасыз.`,
    hint: 'Тест — жок дегенде бир жолу тапшырылса, отчёт — жөнөтүлсө эсептелет.'
  } : {
    title: 'Мой прогресс', week: n => `Неделя ${n} семестра`, st: {'1': 'Модуль 1', '2': 'Модуль 2', F: 'Итоговый контроль'},
    till: d => `до ${d}`, done: (d, n) => `сделано ${d} из ${n}`, debt: n => `Срок прошёл: не сдано ${n}. Сдайте как можно скорее.`,
    allok: 'Всё сдано ✓', left: n => `осталось ${n} ${n % 10 === 1 && n % 100 !== 11 ? 'день' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'дня' : 'дней'}`,
    behind: (e, d) => `Чтобы идти по графику, к этой неделе нужно сделать ${e}, у вас ${d}.`, ontrack: 'Вы идёте по графику.', future: d => `начнётся ${d}`,
    notdone: n => `Не сдано (${n})`, tests: a => `Средний результат тестов: ${a} %`, reps: (c, n, g) => `Проверено отчётов: ${c} из ${n}${g ? ` · средняя оценка ${g}` : ''}`,
    more: 'Подробнее', toastDebt: (m, n) => `${m}: срок прошёл, не сдано работ — ${n}.`, toastSoon: (m, n, d) => `${m}: ${d}, осталось сдать ${n}.`, toastBehind: m => `${m}: вы отстаёте от графика.`,
    hint: 'Тест засчитывается после первой попытки, отчёт — после отправки.'
  };
  const mon = s => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; };
  const W0 = mon(P.start), wStart = w => new Date(+W0 + (w - 1) * 7 * DAY), wEnd = w => new Date(+W0 + w * 7 * DAY - 1);
  const fd = d => KY ? d.toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'}) : d.toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'});
  const e = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const css = document.createElement('style');
  css.textContent = `.pg{border:1px solid rgba(127,127,127,.35);border-radius:8px;padding:12px 14px;margin:0 0 16px}.pg h3{margin:0 0 2px}
.pg-sub{font-size:13px;opacity:.75;margin:0 0 6px}.pg-row{margin:12px 0 0}.pg-hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.pg-bar{height:8px;background:rgba(127,127,127,.22);border-radius:4px;overflow:hidden;margin:5px 0 3px}.pg-bar span{display:block;height:100%;background:#2f6fd6;border-radius:4px}
.pg-st{font-size:13.5px}.pg-red{color:#c0392b;font-weight:600}.pg-amb{color:#b7791f;font-weight:600}.pg-ok{color:#2e8b57}.pg-mut{opacity:.7}
.pg details{font-size:13px;margin-top:3px}.pg ul{margin:4px 0;padding-left:20px}.pg-foot{font-size:13px;opacity:.8;margin-top:10px}
.pg-toast{position:fixed;right:16px;bottom:16px;max-width:380px;z-index:60;background:#fff;color:#16202b;border:1px solid #d8dee5;border-left:5px solid #b7791f;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:12px 36px 12px 14px;font-size:14px;line-height:1.45}
.pg-toast.red{border-left-color:#c0392b}.pg-toast b{display:block;margin-bottom:2px}.pg-toast p{margin:0 0 4px}.pg-toast button{font:inherit;cursor:pointer}
.pg-toast .pg-x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:18px;color:inherit;opacity:.6}.pg-toast .pg-go{margin-top:6px;border:1px solid #2f6fd6;background:#2f6fd6;color:#fff;border-radius:5px;padding:5px 10px}
@media (prefers-color-scheme: dark){.pg-toast{background:#18202a;color:#e6ebf0;border-color:#2c3743}}`;
  document.head.appendChild(css);

  async function mySubs(){
    const {data, error} = await SB.from('submissions').select('kind,ref,score,teacher_grade,created_at,user_id,course:data->>course').eq('user_id', ME.id).limit(2000);
    if (error) throw error; return (data || []).filter(s => (s.course || 'isu') === ID);
  }
  function calc(subs){
    const now = Date.now(), w = Math.floor((now - W0) / (7 * DAY)) + 1, has = new Set(subs.map(s => s.kind + ':' + s.ref));
    const S = [['1', P.w1, 1], ['2', P.w2, P.w1 + 1], ['F', P.wf, P.w2 + 1]].map(([m, wd, ws]) => {
      const it = P.items.filter(x => x.m === m), left = it.filter(x => !has.has(x.kind + ':' + x.id)), n = it.length, d = n - left.length;
      const exp = m === '1' ? (w >= P.w1 ? n : Math.round(n * Math.max(0, w) / P.w1)) : m === '2' ? (w <= P.w1 ? 0 : w >= P.w2 ? n : Math.round(n * (w - P.w1) / (P.w2 - P.w1))) : (w >= P.wf ? n : 0);
      const end = wEnd(wd), days = Math.ceil((end - now) / DAY), phase = w > wd ? 'past' : w >= ws ? 'now' : 'future';
      let cls = 'pg-ok', msg = T.allok, alert = null;
      if (!left.length) {}
      else if (phase === 'past'){ cls = 'pg-red'; msg = T.debt(left.length); alert = {lvl: 2, txt: T.toastDebt(T.st[m], left.length)}; }
      else if (phase === 'future'){ cls = 'pg-mut'; msg = T.future(fd(wStart(ws))); }
      else {
        const soon = days <= 14, beh = d < exp;
        cls = days <= 7 ? 'pg-red' : soon || beh ? 'pg-amb' : 'pg-ok';
        msg = T.left(days) + '. ' + (beh ? T.behind(exp, d) : T.ontrack);
        if (soon) alert = {lvl: days <= 7 ? 2 : 1, txt: T.toastSoon(T.st[m], left.length, T.left(days))};
        else if (beh && exp - d >= 2) alert = {lvl: 1, txt: T.toastBehind(T.st[m])};
      }
      return {m, n, d, left, end, phase, cls, msg, alert};
    });
    const tb = {}; subs.filter(s => s.kind === 'test').forEach(s => { tb[s.ref] = Math.max(tb[s.ref] ?? 0, +s.score || 0); });
    const tv = Object.values(tb), reps = {}; subs.filter(s => s.kind === 'report').sort((a, b) => a.created_at < b.created_at ? -1 : 1).forEach(s => { reps[s.ref] = s.teacher_grade || reps[s.ref] || null; });
    const rv = Object.values(reps), rg = rv.filter(Boolean);
    return {w, S, tavg: tv.length ? Math.round(tv.reduce((a, x) => a + x, 0) / tv.length) : null, rn: rv.length, rc: rg.length, rgav: rg.length ? (rg.reduce((a, x) => a + +x, 0) / rg.length).toFixed(1).replace('.', ',') : null};
  }
  function html(R){
    return `<div class="pg"><h3>${T.title} · ${e((KY && P.nameKy) || P.name)}</h3><p class="pg-sub">${T.week(R.w)} · ${fd(new Date())}</p>
      ${R.S.map(s => `<div class="pg-row"><div class="pg-hd"><b>${T.st[s.m]} · ${T.till(fd(s.end))}</b><span>${T.done(s.d, s.n)}</span></div>
        <div class="pg-bar"><span style="width:${s.n ? Math.round(s.d / s.n * 100) : 0}%"></span></div>
        <div class="pg-st ${s.cls}">${e(s.msg)}</div>
        ${s.left.length && s.phase !== 'future' ? `<details${s.phase === 'past' ? ' open' : ''}><summary>${T.notdone(s.left.length)}</summary><ul>${s.left.map(x => `<li>${e((KY && x.ky) || x.t)}</li>`).join('')}</ul></details>` : ''}</div>`).join('')}
      <p class="pg-foot">${R.tavg != null ? T.tests(R.tavg) + ' · ' : ''}${T.reps(R.rc, R.rn, R.rgav)}<br><span class="pg-mut">${T.hint}</span></p></div>`;
  }
  /* блок в «Мои работы» */
  const _lm = loadMine;
  loadMine = async function(){
    await _lm.apply(this, arguments);
    const box = document.getElementById('au-mine'); if (!box || !ME || ME.role === 'teacher') return;
    try { box.insertAdjacentHTML('afterbegin', html(calc(await mySubs()))); } catch(err){}
  };
  /* напоминание: не чаще раза в день на дисциплину, если есть долги, срок ≤ 14 дней или отставание */
  let shownFor = null;
  async function toast(){
    if (!ME || ME.role === 'teacher' || shownFor === ME.id) return; shownFor = ME.id;
    const key = 'pg-toast-' + ID + '-' + ME.id, today = new Date().toDateString();
    try { if (localStorage.getItem(key) === today) return; } catch(err){}
    let R; try { R = calc(await mySubs()); } catch(err){ return; }
    const A = R.S.map(s => s.alert).filter(Boolean).sort((a, b) => b.lvl - a.lvl); if (!A.length) return;
    const el = document.createElement('div'); el.className = 'pg-toast' + (A[0].lvl > 1 ? ' red' : ''); el.setAttribute('role', 'status');
    el.innerHTML = `<button class="pg-x" aria-label="×">×</button><b>${T.title}</b>${A.slice(0, 2).map(a => `<p>${e(a.txt)}</p>`).join('')}<button class="pg-go">${T.more}</button>`;
    const close = () => { el.remove(); try { localStorage.setItem(key, today); } catch(err){} };
    el.querySelector('.pg-x').onclick = close;
    el.querySelector('.pg-go').onclick = () => { close(); authOpen('mine'); };
    document.body.appendChild(el);
  }
  /* выбор дисциплины: после входа (раз за сеанс) и по кнопке «Дисциплины» в панели */
  const BASE = 'https://dkanetova76-hue.github.io/';
  const ALL = [
    {id: 'isu', name: 'Интеллектуальные системы управления', ky: 'Интеллектуалдык башкаруу системалары', url: BASE + 'isu-trainer/' + (KY ? 'ky.html' : '')},
    {id: 'ct', name: 'Цифровые технологии', ky: 'Санариптик технологиялар', url: BASE + 'ct-trainer/' + (KY ? 'ky.html' : '')},
    {id: 'kuod', name: 'Корпоративное управление и организационный дизайн', ky: 'Корпоративдик башкаруу жана уюштуруучулук дизайн', url: BASE + 'kuod-trainer/' + (KY ? 'ky.html' : '')}];
  const C = KY ? {h: 'Дисциплинаны тандаңыз', p: f => `Сиз ${f} катары кирдиңиз. Бир эсептик жазуу бардык дисциплиналарыңызга ылайыктуу.`, here: 'Ушул жерде улантуу', go: 'Ачуу', cnt: n => `тапшырылган иштер: ${n}`, cur: 'сиз ушул жердесиз', btn: 'Дисциплиналар'}
    : {h: 'Выберите дисциплину', p: f => `Вы вошли как ${f}. Одна учётная запись подходит для всех ваших дисциплин.`, here: 'Продолжить здесь', go: 'Открыть', cnt: n => `сдано работ: ${n}`, cur: 'вы здесь', btn: 'Дисциплины'};
  css.textContent += `.pg-ov{position:fixed;inset:0;z-index:70;background:rgba(10,20,40,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.pg-ch{position:relative;background:#fff;color:#16202b;border-radius:10px;max-width:540px;width:100%;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.25);font-size:14.5px;line-height:1.45}
.pg-ch h3{margin:0 0 4px;font-size:20px}.pg-ch>p{margin:0 0 12px;opacity:.8;font-size:13.5px}.pg-ch .pg-x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:20px;color:inherit;opacity:.6;cursor:pointer}
.pg-cc{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #d8dee5;border-radius:8px;padding:10px 12px;margin:8px 0}.pg-cc.cur{border-color:#2f6fd6;background:rgba(47,111,214,.07)}
.pg-cc b{display:block}.pg-cc small{opacity:.7}.pg-cc a,.pg-cc button{font:600 13.5px inherit;white-space:nowrap;border:1px solid #2f6fd6;border-radius:6px;padding:7px 12px;text-decoration:none;cursor:pointer;background:#2f6fd6;color:#fff}.pg-cc.cur button{background:transparent;color:#2f6fd6}
@media (prefers-color-scheme: dark){.pg-ch{background:#18202a;color:#e6ebf0}.pg-cc{border-color:#2c3743}}`;
  async function myCourses(){
    const ids = new Set([ID]), cnt = {}; let grpKnown = false;
    try { const {data} = await SB.from('groups').select('course').eq('name', ME.grp); (data || []).forEach(g => { ids.add(g.course || 'isu'); grpKnown = true; }); } catch(err){}
    try { const {data} = await SB.from('submissions').select('user_id,course:data->>course').eq('user_id', ME.id).limit(3000); (data || []).forEach(x => { const c = x.course || 'isu'; ids.add(c); cnt[c] = (cnt[c] || 0) + 1; }); } catch(err){}
    if (!grpKnown && (ID === 'isu' || ID === 'ct')){ ids.add('isu'); ids.add('ct'); } /* группы не видны студенту — бакалаврские учебники 710500 */
    return {list: ALL.filter(c => ids.has(c.id)), cnt};
  }
  function chooser(R, after){
    const ov = document.createElement('div'); ov.className = 'pg-ov';
    ov.innerHTML = `<div class="pg-ch" role="dialog" aria-modal="true"><button class="pg-x" aria-label="×">×</button><h3>${C.h}</h3><p>${e(C.p(ME.fio || ''))}</p>
      ${R.list.map(c => `<div class="pg-cc ${c.id === ID ? 'cur' : ''}"><span><b>${e(KY ? c.ky : c.name)}</b><small>${C.cnt(R.cnt[c.id] || 0)}${c.id === ID ? ' · ' + C.cur : ''}</small></span>${c.id === ID ? `<button data-here>${C.here}</button>` : `<a href="${e(c.url)}">${C.go}</a>`}</div>`).join('')}</div>`;
    const close = () => { ov.remove(); document.removeEventListener('keydown', esc); if (after) after(); };
    const esc = ev => { if (ev.key === 'Escape') close(); };
    ov.onclick = ev => { if (ev.target === ov || ev.target.closest('.pg-x,[data-here]')) close(); };
    document.addEventListener('keydown', esc); document.body.appendChild(ov);
  }
  let chFor = null;
  async function afterLogin(){
    if (!ME || ME.role === 'teacher' || chFor === ME.id) return; chFor = ME.id;
    const key = 'pg-ch-' + ME.id; let seen = false; try { seen = sessionStorage.getItem(key) === '1'; sessionStorage.setItem(key, '1'); } catch(err){}
    if (seen){ toast(); return; }
    const R = await myCourses(); if (R.list.length < 2){ toast(); return; }
    chooser(R, toast);
  }
  if (typeof acctRender === 'function'){ const _ar = acctRender; acctRender = function(){
    const r = _ar.apply(this, arguments);
    if (ME && SB && ME.role !== 'teacher'){
      const el = document.getElementById('acct'), mine = el && el.querySelector('[data-auth="mine"]');
      if (mine && !el.querySelector('[data-pg-ch]')){ const b = document.createElement('button'); b.type = 'button'; b.className = mine.className; b.dataset.pgCh = '1'; b.textContent = C.btn;
        b.onclick = async () => chooser(await myCourses()); mine.parentNode.insertBefore(b, mine); }
      setTimeout(afterLogin, 800);
    }
    return r; }; }
})();
})();
</script>
