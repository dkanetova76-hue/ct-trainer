рмации?", "opts": ["Обеспечивает только развлечения", "Собирает данные и позволяет автоматизировать процессы", "Используется для создания текстов", "Служит для печати документов"], "key": 1, "why": "IoT собирает данные о физических объектах и позволяет автоматизировать процессы."}, {"n": 143, "m": "М2", "lvl": 2, "lec": 15, "q": "Какой этап является первым в цифровой трансформации бизнеса?", "opts": ["Внедрение новых технологий", "Оценка текущего состояния и постановка целей", "Распределение ресурсов", "Нанимание новых сотрудников"], "key": 1, "why": "Трансформация начинается с оценки текущего состояния и постановки целей."}, {"n": 144, "m": "М2", "lvl": 2, "lec": 15, "q": "Какую роль в трансформации играет облачная инфраструктура?", "opts": ["Упрощает только хранение данных", "Увеличивает зависимость от серверов", "Обеспечивает масштабируемость и доступ к данным", "Заменяет ИТ-отдел Глоссарий по дисциплине \"Цифровые технологии\" A - Agile: гибкая методология управления проектами, основанная на итеративном процессе разработки и постоянной обратной связи. - AI (Artificial Intelligence, Искусственный интеллект): технология, позволяющая компьютерам выполнять задачи, требующие интеллекта, такие как анализ данных, принятие решений и распознавание образов. - API (Application Programming Interface, Программный интерфейс приложения): набор инструментов и правил, позволяющих различным программам взаимодействовать между собой. - AR (Augmented Reality, Дополненная реальность): технология, которая накладывает цифровые объекты на изображение реального мира через устройства, такие как смартфоны или очки. B - Big Data (Большие данные): большие объемы структурированных и неструктурированных данных, которые анализируются для выявления закономерностей и трендов. - BI (Business Intelligence, Бизнес-аналитика): технологии и инструменты для анализа данных, используемые для поддержки принятия бизнес-решений. - Blockchain (Блокчейн): децентрализованная система хранения данных, в которой записи объединены в цепочку блоков, обеспечивающих прозрачность и безопасность. - Bot (Бот): автоматизированная программа, выполняющая задачи, такие как чат с пользователями или обработка данных. C - Chatbot (Чат-бот): программа, которая имитирует общение с человеком, часто используемая для автоматизации клиентского сервиса. - Cloud Computing (Облачные вычисления): предоставление вычислительных ресурсов, таких как серверы, базы данных, через интернет. - CRM (Customer Relationship Management, Система управления взаимоотношениями с клиентами): программное обеспечение для управления клиентскими данными, улучшения продаж и сервиса. - Cybersecurity (Кибербезопасность): защита систем, сетей и данных от киберугроз и несанкционированного доступа. D - Data Mining (Интеллектуальный анализ данных): процесс поиска скрытых закономерностей и взаимосвязей в больших объемах данных. - DNS (Domain Name System, Система доменных имен): технология, преобразующая доменные имена (например, google.com) в IP-адреса. - Digital Twin (Цифровой двойник): виртуальная копия физического объекта или процесса, которая используется для моделирования и анализа. E - Edge AI (Периферийный искусственный интеллект): обработка данных AI на устройствах ближе к источнику, а не на централизованных серверах. - E-commerce (Электронная коммерция): продажа товаров и услуг через интернет. - ERP (Enterprise Resource Planning, Система управления ресурсами предприятия): программное обеспечение для интеграции и управления всеми основными бизнес-процессами. F - Firewall (Брандмауэр): система, обеспечивающая защиту сети от несанкционированного доступа. - FinTech (Финансовые технологии): технологии, использующиеся для оптимизации и автоматизации финансовых услуг. - Fog Computing (Туманные вычисления): вычислительная архитектура, размещающая обработку данных ближе к периферийным устройствам для снижения задержек. - Freemium: бизнес-модель, предоставляющая базовый продукт бесплатно с возможностью платного доступа к дополнительным функциям. G - Gamification (Геймификация): применение игровых элементов в неигровых контекстах, таких как обучение или маркетинг, для повышения вовлеченности. - GPU (Graphics Processing Unit, Графический процессор): устройство для обработки графики, также используемое в задачах машинного обучения. - Green IT (Зеленые ИТ): практики, направленные на снижение воздействия информационных технологий на окружающую среду. H - Hadoop: платформа для хранения и обработки больших данных в распределенной среде. - HTTP/HTTPS (HyperText Transfer Protocol/Secure): протоколы передачи данных для вебстраниц; HTTPS обеспечивает шифрование. - Hyperautomation (Гиперавтоматизация): использование передовых технологий, таких как AI и RPA, для автоматизации сложных процессов. I - IoT (Internet of Things, Интернет вещей): сеть устройств, подключенных к интернету, которые собирают и обмениваются данными. - IPv6: новая версия протокола интернет-адресов, предлагающая большее количество уникальных адресов. - Industrial IoT (IIoT, Промышленный интернет вещей): использование IoT-устройств и сенсоров в промышленности для мониторинга, анализа и оптимизации процессов. J - JavaScript: язык программирования для создания интерактивных элементов на веб-страницах. - JSON (JavaScript Object Notation): легкий формат передачи данных, часто используемый в вебприложениях для обмена данными. - JIRA: инструмент для управления проектами и задачами, популярный среди команд, использующих методологии Agile. K - Kafka (Apache Kafka): платформа для потоковой обработки данных в реальном времени. - Kubernetes: платформа для управления контейнеризированными приложениями, упрощающая их развертывание и масштабирование. L - LAN (Local Area Network, Локальная сеть): сеть, соединяющая устройства в пределах ограниченной области, например, офиса. - Linux: открытая операционная система, используемая для серверов, компьютеров и встроенных устройств. - Low-Code/No-Code Platforms: платформы для разработки программного обеспечения с минимальным или нулевым кодированием. M - Machine Learning (Машинное обучение): технология, позволяющая компьютерам обучаться и улучшать свои функции без явного программирования. - Metaverse (Метавселенная): виртуальная среда, объединяющая элементы дополненной и виртуальной реальности для взаимодействия пользователей. - Microservices (Микросервисы): архитектурный подход, при котором приложение делится на набор независимых сервисов. N - Nanotechnology (Нанотехнологии): технологии, работающие на уровне атомов и молекул для создания новых материалов и устройств. - NLP (Natural Language Processing, Обработка естественного языка): технология, позволяющая компьютерам анализировать и понимать человеческий язык. O - OCR (Optical Character Recognition, Оптическое распознавание символов): технология, позволяющая преобразовывать изображения текста в редактируемые данные. - Open Data (Открытые данные): данные, доступные для свободного использования и распространения. P - P2P (Peer-to-Peer, Равноправные сети): сеть, где устройства напрямую обмениваются данными без центрального сервера. - Predictive Analytics (Прогностическая аналитика): использование данных и алгоритмов для прогнозирования будущих событий. Q - Quantum Computing (Квантовые вычисления): новая парадигма вычислений, использующая принципы квантовой механики для решения сложных задач. - Quantum Cryptography (Квантовая криптография): использование квантовых механизмов для обеспечения сверхнадежного шифрования данных. R - RPA (Robotic Process Automation, Роботизированная автоматизация процессов): технология, позволяющая автоматизировать рутинные задачи с помощью программных роботов. - REST API (Representational State Transfer): архитектурный стиль для создания взаимодействующих веб-сервисов. S - SaaS (Software as a Service, Программное обеспечение как услуга): модель предоставления ПО через интернет (например, Google Workspace). - Smart Contracts (Умные контракты): автоматизированные контракты на основе блокчейна, которые исполняются при выполнении определенных условий. T - Tokenization (Токенизация): замена конфиденциальных данных на токены для повышения безопасности. - Telemetry (Телеметрия): процесс автоматического сбора данных с удаленных устройств. U - UI/UX (User Interface/User Experience): интерфейс пользователя и пользовательский опыт; аспекты, направленные на создание удобных и привлекательных приложений. - Ubiquitous Computing (Повсеместные вычисления): концепция, при которой вычислительные технологии интегрированы во все аспекты повседневной жизни. V - Virtual Reality (VR, Виртуальная реальность): технология, создающая иммерсивную цифровую среду. - VPN (Virtual Private Network, Виртуальная частная сеть): технология, обеспечивающая безопасное соединение через интернет. W - Web Scraping (Сбор данных из интернета): процесс автоматизированного извлечения данных с веб-страниц. - Wi-Fi 6: последняя версия стандарта беспроводной связи, обеспечивающая более высокую скорость Приложение КЕЙСЫ ДЛЯ ПРАКТИЧЕСКИХ ЗАНЯТИЙ ПО ЛЕКЦИЯМ 8–15"], "key": 2, "why": "Облако даёт масштабируемость и доступ к данным из любого места."}, {"n": 145, "m": "М1", "lvl": 2, "lec": 7, "q": "Чем платформенная бизнес-модель отличается от традиционной?", "opts": ["Компания отказывается от интернета", "Компания связывает продавцов и покупателей и зарабатывает на их взаимодействии", "Компания работает только с государством", "Компания производит товар и продаёт его через магазины"], "key": 1, "why": "Платформа (Uber, маркетплейс) создаёт ценность, соединяя участников рынка."}, {"n": 146, "m": "М1", "lvl": 1, "lec": 7, "q": "Что означает подход data-driven?", "opts": ["Отказ от планирования", "Решения только по интуиции руководителя", "Принятие решений на основе анализа данных", "Ведение учёта на бумаге"], "key": 2, "why": "Data-driven — управление на основе данных."}, {"n": 147, "m": "М1", "lvl": 3, "lec": 7, "q": "Кафе вводит заказ через приложение с получением в зале и доставкой. Какой тренд реализу function groupOf(h){
  if (/^lec-/.test(h)) return 1; if (/^pz-|^practice/.test(h)) return 2; if (/^srs-/.test(h)) return 3;
  if (/^test|^bloom/.test(h)) return 4; if (/^exam|^ticket/.test(h)) return 5; if (/^report/.test(h)) return 6; return 0;
}
const LANG = D.lang || 'ru';
function langLink(){ const el = $('#lang'); if (!el) return; el.hidden = true; }
function buildNav(){
  $('#tabs').innerHTML = GROUPS.map((g,i) => `<a href="#${g.h}" data-g="${i}">${g.tab}</a>`).join('');
  $('#side').innerHTML = GROUPS.map(g => `<h6>${g.tab}</h6>` + g.items.map(it =>

}
function markNav(h){
  const g = groupOf(h);
  $$('#tabs a').forEach(a => a.classList.toggle('on', +a.dataset.g === g));
  $$('#side a').forEach(a => { a.classList.toggle('on', a.dataset.h === h || (h.startsWith('ticket-') && a.dataset.h==='exam') || (h.startsWith('test-') && a.dataset.h==='tests')); a.classList.toggle('done', !!ST.done[a.dataset.h]); });

}

/* ---------------- router ---------------- */
function route(){
  const h = (location.hash || '#title').slice(1) || 'title';
  document.body.classList.remove('nav-open');
  const main = $('#main'); let html = '';
  let toc = true;
  if (byId[h]) html = renderSection(byId[h]);
  else if (h === 'practice') html = renderPracticeIntro();
  else if (h === 'glossary') { html = renderGlossary(); toc = false; }
  else if (h === 'tests') { html = renderTests(); toc = false; }
  else if (h.startsWith('test-')) { html = '<div class="page" id="quiz"></div>'; toc = false; }
  else if (h === 'bloom') { html = renderBloom(); toc=false; }
  else if (h === 'exam') html = renderExam();
  else if (h.startsWith('ticket-')) html = renderTicket(+h.slice(7));
  else if (h === 'report') { html = renderReport(); toc=false; }
  else html = renderTitle();
  main.innerHTML = html;
  markNav(h);
  window.scrollTo(0, 0);
  if (byId[h]) wireSection(byId[h]);
  if (h === 'glossary') wireGlossary();
  if (h.startsWith('test-')) startQuiz(h.slice(5));
  if (h.startsWith('ticket-')) wireTicket(+h.slice(7));
  if (h === 'report') wireReport();
  buildToc(toc);
  cloudRoute(h);
}
function buildToc(on){
  const hs = on ? $$('#main .doc h2, #main h2.sec') : [];
  hs.forEach((x,i) => x.id = 'p' + (i+1));
  $('#toc').innerHTML = hs.length > 2 ? '<b>На странице</b>' + hs.map(x => `<a href="javascript:void 0" data-to="${x.id}">${esc(x.textContent.replace(/^\d+\.\s*/,''))}</a>`).join('') : '';
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-to]');
  if (a) { e.preventDefault(); const t = document.getElementById(a.dataset.to); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); }
});

function neighbours(s){ const i = S.indexOf(s); return [S[i-1], S[i+1]]; }
function renderSection(s){
  const [p, n] = neighbours(s);
  const eyebrow = s.kind==='lec' ? `Теория · Лекция № ${s.num} · Модуль ${s.num<=7?1:2}` : s.kind==='pz' ? `Практика · ${pzName(s)}` : s.kind==='srs' ? (s.num? `Самостоятельная работа студента № ${s.num}` : 'Самостоятельная работа студентов · 60 часов') : 'Дисциплина · Бакалавриат 710500';
  const done = !!ST.done[s.id];
  let extra = '';
  if (s.kind==='lec') {
    extra = pzOfLec(s.num).map(x => `<a class="pill" href="#${x.id}">→ ${short(x)}</a>`).join('') + srsOfLec(s.num).map(x => `<a class="pill" href="#${x.id}">→ ${short(x)}</a>`).join('');
    extra += `<a class="pill" href="#test-lec${s.num}">Тест по лекции</a>`;
  }
  if (s.kind==='pz') extra = `<a class="pill" href="#lec-${s.lec}">Лекция № ${s.lec}</a><a class="pill" href="#report" data-rep="${s.id}">Отчёт по работе</a>`;
  if (s.kind==='srs' && s.num) extra = `<a class="pill" href="#lec-${s.lec}">Лекция № ${s.lec}</a><a class="pill" href="#report" data-rep="${s.id}">Отчёт по СРС</a>`;
  const nm = x => x.kind==='pz' ? `ПЗ № ${x.num}` : KIND[x.kind] + (x.num? ' № '+x.num:'');
  return `<div class="page">
    <p class="eyebrow">${eyebrow}</p>
    <h1 class="ttl">${esc(s.title)}</h1>
    <div class="head-row">${s.kind!=='program' ? `<label class="pill done-toggle ${done?'is-done':''}"><input type="checkbox" id="done-${s.id}" ${done?'checked':''}> ${s.kind==='lec'?'Изучено':'Выполнено'}</label>`:''}${extra}</div>
    <article class="doc">${s.html}</article>
    ${s.kind==='lec' ? `<div class="row" style="margin-top:28px"><a class="btn pri" href="#test-lec${s.num}">Проверить себя: тест по лекции № ${s.num}</a><a class="btn" href="#tests">Все тесты</a></div>` : ''}
    <nav class="pager">${p ? `<a href="#${p.id}"><small>← ${nm(p)}</small>${esc(p.title)}</a>`:'<span></span>'}${n ? `<a href="#${n.id}"><small>${nm(n)} →</small>${esc(n.title)}</a>`:''}</nav>
  </div>`;
}
function wireSection(s){
  const dt = $('#done-'+s.id);
  if (dt) dt.addEventListener('change', () => { ST.done[s.id] = dt.checked; if(!dt.checked) delete ST.done[s.id]; dt.parentElement.classList.toggle('is-done', dt.checked); save(); markNav(s.id); cloudDone(s, dt.checked); });
  $$('[data-rep]').forEach(a => a.addEventListener('click', () => { ST.me.sel = a.dataset.rep; save(); }));
  const root = $('#main .doc');
  $$('.answer', root).forEach(d => {
    const k = d.dataset.key;
    d.innerHTML = `<label for="${k}">Ответ · <span>${esc(d.dataset.label)}</span></label><textarea id="${k}" placeholder="Наберите ответ своими словами. Текст сохраняется и попадает в отчёт."></textarea><div class="saved"></div>`;
    const ta = $('textarea', d); ta.value = ST.f[k] || '';
    ta.addEventListener('input', () => { ST.f[k] = ta.value; save(); d.querySelector('.saved').textContent = 'Сохранено'; });
  });
  $$('textarea.fld[data-save]', root).forEach(ta => {
    ta.value = ST.f[ta.id] || ''; ta.placeholder = 'Заполняется студентом';
    ta.addEventListener('input', () => { ST.f[ta.id] = ta.value; save(); });
  });
  $$('.widget', root).forEach(mountWidget);
}

  [5,'Садыкова Нургуль','Маркетинг','SMM-специалист',42000,'2024-02-05','Бишкек'],
  [6,'Ким Александр','IT','Аналитик данных',72000,'2019-06-10','Бишкек'],
  [7,'Жумабаева Асель','Продажи','Старший менеджер',61000,'2018-08-27','Ош'],
  [8,'Орозов Нурлан','Финансы','Финансовый аналитик',57000,'2022-04-11','Джалал-Абад'],
  [9,'Петров Дмитрий','Маркетинг','Маркетолог',50000,'2023-07-03','Бишкек'],
  [10,'Абдыкадырова Жылдыз','HR','HR-менеджер',46000,'2021-10-18','Ош']
];
const ECOLS = ['id','name','dept','position','salary','hired','city'];
function sqlRun(src){
  let q = src.trim().replace(/;\s*$/,'').replace(/\s+/g,' ');
  const m = /^select (.+?) from (\w+)(?: where (.+?))?(?: group by (\w+))?(?: order by (\w+)(?: (asc|desc))?)?(?: limit (\d+))?$/i.exec(q);
  if (!m) throw new Error('Не удалось разобрать запрос. Порядок частей: SELECT … FROM employees [WHERE …] [GROUP BY …] [ORDER BY … ASC|DESC] [LIMIT n]. Команды INSERT, UPDATE, DELETE в тренажёре не выполняются.');
  const [, sel, tbl, where, grp, ord, dir, lim] = m;
  if (tbl.toLowerCase() !== 'employees') throw new Error(`Таблица «${tbl}» не найдена. Доступна только employees.`);
  const ci = c => { const i = ECOLS.indexOf(c.toLowerCase()); if (i < 0) throw new Error(`Нет столбца «${c}». Столбцы: ${ECOLS.join(', ')}.`); return i; };
  let rows = EMP.slice();
  if (where){
    const lit = v => { v = v.trim(); if (/^'.*'$/.test(v)) return v.slice(1,-1); if (!isNaN(+v)) return +v; throw new Error(`Значение ${v}: строки пишутся в одинарных кавычках.`); };
    const cond = c => { const k = /^(\w+)\s*(<>|!=|>=|<=|=|>|<|like)\s*(.+)$/i.exec(c.trim()); if (!k) throw new Error(`Условие «${c.trim()}» не распознано.`);
      const i = ci(k[1]), op = k[2].toLowerCase(), v = lit(k[3]);
      return r => { const x = r[i]; if (op==='like'){ const re = new RegExp('^' + String(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*').replace(/_/g,'.') + '$','i'); return re.test(String(x)); }
        return op==='=' ? x==v : op==='<>'||op==='!=' ? x!=v : op==='>' ? x>v : op==='<' ? x<v : op==='>=' ? x>=v : x<=v; }; };
    const ors = where.split(/ or /i).map(p => p.split(/ and /i).map(cond));
    rows = rows.filter(r => ors.some(a => a.every(f => f(r))));
  }
  const items = sel.split(',').map(x => x.trim());
  const agg = /^(count|sum|avg|min|max)\((\*|\w+)\)(?: as (\w+))?$/i;
  const isAgg = items.some(x => agg.test(x));
  let head, out;
  const one = (it, rs) => { const a = agg.exec(it); if (a){ const f = a[1].toLowerCase(); if (f==='count') return a[2]==='*' ? rs.length : rs.filter(r => r[ci(a[2])]!=null).length;
      const vs = rs.map(r => +r[ci(a[2])]); if (!vs.length) return null; return f==='sum' ? vs.reduce((x,y)=>x+y,0) : f==='avg' ? Math.round(vs.reduce((x,y)=>x+y,0)/vs.length*100)/100 : f==='min' ? Math.min(...vs) : Math.max(...vs); }
    const c = it.split(/ as /i)[0]; return rs[0] ? rs[0][ci(c)] : null; };
  const label = it => { const a = / as (\w+)$/i.exec(it); return a ? a[1] : it; };
  if (grp){
    const gi = ci(grp), groups = {};
    rows.forEach(r => (groups[r[gi]] = groups[r[gi]] || []).push(r));
    head = items.map(label); out = Object.values(groups).map(rs => items.map(it => one(it, rs)));
  } else if (isAgg){ head = items.map(label); out = [items.map(it => one(it, rows))]; }
  else {
    const cols = items.length===1 && items[0]==='*' ? ECOLS : items.map(x => x.split(/ as /i)[0]);
    const idx = cols.map(ci); head = items[0]==='*' ? ECOLS : items.map(label); out = rows.map(r => idx.map(i => r[i]));
    if (ord){ const oi = ci(ord); const pos = cols.map(c=>c.toLowerCase()).indexOf(ord.toLowerCase()); const srt = rows.map((r,k)=>[r[oi], out[k]]); srt.sort((a,b)=> (a[0]>b[0]?1:a[0]<b[0]?-1:0) * (dir && dir.toLowerCase()==='desc' ? -1 : 1)); out = srt.map(x=>x[1]); void pos; }
  }

  $('#xw-chk', el).addEventListener('click', () => { let ok = 0, n = 0; $$('input', el).forEach(i => { n++; const g = norm(i.value) === ans[i.dataset.k]; if (g) ok++; i.classList.toggle('ok', g); i.classList.toggle('no', !g && !!i.value.trim()); });
    const m = $('#xw-msg', el); m.className = 'w-msg ' + (ok===n?'good':''); m.textContent = ok===n ? `Отлично: все ${n} слов отгаданы.` : `Верно ${ok} из ${n}. Неверные ответы отмечены красным.`; });
  $('#xw-clr', el).addEventListener('click', () => { ST.w.xw = {}; save(); wXw(el); });

function wNpv5(id, cfg, body, el){
  const st = wstate(id, cfg.def);
  body.innerHTML = `<div class="w-grid">${numIn(id+'-I','Первоначальные инвестиции, сом',st.I,10000,0)}${numIn(id+'-B','Годовые денежные выгоды, сом',st.B,10000,0)}${numIn(id+'-C','Ежегодные эксплуатационные затраты, сом',st.C,10000,0)}${numIn(id+'-r','Ставка дисконтирования, %',st.r,0.5,0)}</div><div class="w-res"></div><div class="w-msg"></div>`;
  const calc = (ev) => {
    ['I','B','C','r'].forEach(k => st[k] = +$('#'+id+'-'+k).value || 0); commit(id, st, ev);
    const cf = st.B - st.C, r = st.r/100; let pv = 0; for (let t=1; t<=st.n; t++) pv += cf/Math.pow(1+r, t);
    const npv = pv - st.I;
    $('.w-res', body).innerHTML = `<div class="w-kpi"><span>Годовой чистый поток</span><b>${fmt0(cf)}</b> сом</div><div class="w-kpi ${npv>=0?'good':'bad'}"><span>NPV за ${st.n} лет</span><b>${fmt0(npv)}</b> сом</div>`;
    const m = $('.w-msg', body); m.className = 'w-msg ' + (npv>=0?'good':'bad');
    m.textContent = npv >= 0 ? 'NPV положительный: по заданным потокам проект создаёт положительную приведённую стоимость.' : 'NPV отрицательный: приведённые поступления не покрывают первоначальные инвестиции.';
    SUMMARY[id] = () => `${cfg.title}: инвестиции ${fmt0(st.I)} сом; выгоды ${fmt0(st.B)} сом/год; затраты ${fmt0(st.C)} сом/год; ставка ${st.r}%. Годовой чистый поток ${fmt0(cf)} сом; NPV за ${st.n} лет = ${fmt0(npv)} сом.`;
  };
  $$('input', body).forEach(i => i.addEventListener('input', calc)); calc(); footer(body, () => reset(id, el));
}

function wMca(id, cfg, body, el){
  const st = wstate(id, {w: cfg.crit.map(c => c[1]), s: cfg.alts.map(a => a[1].slice())});
  let h = '';
  if (cfg.editW) h += `<div class="w-grid">${cfg.crit.map((c,i) => `<div class="w-row"><label for="${id}-w${i}">${esc(c[0])}</label><output id="${id}-wo${i}"></output><input type="range" id="${id}-w${i}" min="0" max="60" step="1" value="${st.w[i]}"></div>`).join('')}</div><small id="${id}-ws" style="color:var(--muted)"></small>`;
  h += `<div class="w-grid">${cfg.alts.map((a,j) => `<div class="alt" id="${id}-a${j}"><h5><span>${esc(a[0])}</span><span class="num" id="${id}-r${j}"></span></h5>${cfg.crit.map((c,i) => `<div class="sc"><span>${esc(c[0])} <small style="color:var(--muted)" class="wl${i}"></small></span>${cfg.editS ? `<select id="${id}-s${j}-${i}" aria-label="${esc(a[0]+': '+c[0])}">${[1,2,3,4,5].map(v=>`<option ${v===st.s[j][i]?'selected':''}>${v}</option>`).join('')}</select>` : `<span class="num">${st.s[j][i]}</span>`}</div>`).join('')}</div>`).join('')}</div>`;
  h += `<div class="bars" id="${id}-bars"></div><div class="w-msg" id="${id}-msg"></div>`;
  body.innerHTML = h;
  const calc = (ev) => {
    if (cfg.editW) cfg.crit.forEach((c,i) => st.w[i] = +$(`#${id}-w${i}`).value);
    if (cfg.editS) cfg.alts.forEach((a,j) => cfg.crit.forEach((c,i) => st.s[j][i] = +$(`#${id}-s${j}-${i}`).value));
    commit(id, st, ev);
    const sw = st.w.reduce((x,y)=>x+y,0) || 1, wn = st.w.map(w => w/sw);
    cfg.crit.forEach((c,i) => { $$('.wl'+i, body).forEach(x => x.textContent = `(${Math.round(wn[i]*100)}%)`); if (cfg.editW) $(`#${id}-wo${i}`).textContent = Math.round(wn[i]*100)+'%'; });
    if (cfg.editW) $(`#${id}-ws`).textContent = `Сумма заданных весов: ${sw}. При расчёте веса нормируются до 100%.`;
    const res = st.s.map(sc => sc.reduce((acc,v,i) => acc + v*wn[i], 0));
    const best = Math.max(...res), winners = cfg.alts.filter((a,j) => Math.abs(res[j]-best) < 1e-9).map(a => a[0].replace(/^Альтернатива \w · /,''));
    cfg.alts.forEach((a,j) => { $(`#${id}-r${j}`).textContent = fmt(res[j]) + ' / 5'; $(`#${id}-a${j}`).classList.toggle('win', Math.abs(res[j]-best)<1e-9); });
    $(`#${id}-bars`).innerHTML = cfg.alts.map((a,j) => `<div class="bar ${Math.abs(res[j]-best)<1e-9?'win':''}"><span>${esc(a[0].replace(/^Альтернатива \w · /,''))}</span><span class="trk"><i style="width:${res[j]/5*100}%"></i></span><b>${fmt(res[j])}</b></div>`).join('');
    $(`#${id}-msg`).innerHTML = `${winners.length>1?'Наибольшую оценку получили':'Наибольшую оценку получила'}: <b>${esc(winners.join(' / '))}</b>. Вывод зависит от выбранных критериев, весов и экспертных оценок.`;
    SUMMARY[id] = () => `${cfg.title}. Веса: ${cfg.crit.map((c,i)=>`${c[0]} ${Math.round(wn[i]*100)}%`).join('; ')}. Итоговые оценки: ${cfg.alts.map((a,j)=>`${a[0]} — ${fmt(res[j])} (${st.s[j].join(', ')})`).join('; ')}. Лучшая: ${winners.join(' / ')}.`;
  };
  $$('input,select', body).forEach(i => i.addEventListener('input', calc)); calc(); footer(body, () => reset(id, el));
}

  };
  $$('input', body).forEach(i => i.addEventListener('input', calc)); calc(); footer(body, () => reset(id, el));
}

  const set = testSets().find(s => s.id===id); if (!set) { location.hash = '#tests'; return; }
  if (SB && !ME){ $('#quiz').innerHTML = `<div class="w-msg">Войдите в учётную запись, чтобы результат теста получил преподаватель.</div><div class="row" style="margin-top:12px"><button class="btn pri" type="button" data-auth="login">Войти</button><button class="btn" type="button" id="q-anon">Пройти без входа</button><a class="btn" href="#tests">Назад</a></div>`;
    authOpen('login', 'Войдите, чтобы результат теста получил преподаватель.', () => startQuiz(id));
    $('#q-anon').onclick = () => { try { $('#auth-dlg').close(); } catch(e){} runQuiz(set); }; return; }
  runQuiz(set);
}
function runQuiz(set){
  cloudTestStart(set.id);
  const base = set.qs ? shuffle(set.qs) : set.pool ? shuffle(set.pool).slice(0, set.cnt) : finalSet();
  const qs = base.map(q => ({q, order: shuffle([0,1,2,3])}));
  QZ = {set, qs, i:0, picks:[], answered:false, start:Date.now()};
  drawQ();
}
function drawQ(){
  const z = QZ, it = z.qs[z.i], q = it.q, box = $('#quiz');
  box.innerHTML = `<div class="quiz"><p class="eyebrow">${esc(z.set.t)}</p>
  <div class="q-top"><span>Вопрос ${z.i+1} из ${z.qs.length}</span><span><span class="tag">B${q.lvl} · ${BLOOM[q.lvl]}</span> <span class="tag">Л-${q.lec}</span></span></div>
  <div class="q-prog"><i style="width:${(z.i)/z.qs.length*100}%"></i></div>
  <p class="q-text">${esc(q.q)}</p>
  <div class="opts">${it.order.map((o,k)=>`<button type="button" class="opt" data-o="${o}"><span class="l">${'АБВГ'[k]}</span><span>${esc(q.opts[o])}</span></button>`).join('')}</div>
  <div id="fb"></div>
  <div class="row"><button class="btn pri" id="q-next" type="button" disabled>${z.set.fb?'Ответить':'Далее'}</button><a class="btn" href="#tests">Выйти</a></div></div>`;
  let sel = null;
  $$('.opt', box).forEach(b => b.addEventListener('click', () => { if (z.answered) return; sel = +b.dataset.o; $$('.opt', box).forEach(x=>x.classList.toggle('sel', x===b)); $('#q-next').disabled = false; }));
  $('#q-next').addEventListener('click', () => {
    if (z.set.fb && !z.answered) {
      z.answered = true; z.picks[z.i] = sel; const ok = sel === q.key;
      $$('.opt', box).forEach(x => { x.disabled = true; const o = +x.dataset.o; if (o===q.key) x.classList.add('right'); else if (o===sel) x.classList.add('wrong'); });
      $('#fb').innerHTML = `<div class="fb ${ok?'good':'bad'}"><b>${ok?'Верно.':'Неверно.'}</b> ${esc(q.why)}</div>`;
      $('#q-next').textContent = z.i < z.qs.length-1 ? 'Следующий вопрос' : 'Результат';
      return;
    }
    if (!z.set.fb) z.picks[z.i] = sel;
    z.answered = false; z.i++;
    if (z.i < z.qs.length) drawQ(); else finishQuiz();
  });
}
function finishQuiz(){
  const z = QZ, box = $('#quiz');
  const res = z.qs.map((it,k) => ({q:it.q, pick:z.picks[k], ok:z.picks[k]===it.q.key}));
  const ok = res.filter(r=>r.ok).length, n = res.length;
  res.forEach(r => ST.t.ans[r.q.n] = r.ok);
  const run = {set:z.set.id, t:z.set.t, ok, n, at:new Date().toISOString(), wrong:res.filter(r=>!r.ok).map(r=>r.q.n)};
  ST.t.runs.push(run); if (ST.t.runs.length > 80) ST.t.runs.shift(); save();
  const sent = cloudTestSubmit(z, res, Math.round((Date.now() - z.start) / 1000));
  const lv = [1,2,3,4,5].map(l => { const x = res.filter(r=>r.q.lvl===l); return x.length ? [l, x.filter(r=>r.ok).length, x.length] : null; }).filter(Boolean);
  const wrong = res.filter(r=>!r.ok);
  box.innerHTML = `<div class="quiz"><p class="eyebrow">${esc(z.set.t)} · результат</p>
  <div class="row" style="gap:18px;align-items:flex-end;margin-bottom:18px"><span class="score-big">${ok}/${n}</span><span style="font-size:18px;color:var(--muted)">${Math.round(ok/n*100)}% правильных ответов</span></div>
  <div class="bars">${lv.map(([l,a,b])=>`<div class="bar ${a/b<0.6?'low':''}"><span>B${l} · ${BLOOM[l]}</span><span class="trk"><i style="width:${a/b*100}%"></i></span><b>${a}/${b}</b></div>`).join('')}</div>
  ${sent ? `<div class="w-msg good" style="margin-top:16px">Результат отправлен преподавателю (${esc(ME.fio)}, ${esc(ME.grp || '')}).</div>` : (CLOUD ? '<div class="w-msg bad" style="margin-top:16px">Вы не вошли: результат остался только на этом устройстве. Скачайте его в .docx или войдите и пройдите тест снова.</div>' : '')}
  <div class="row" style="margin:20px 0"><button class="btn pri" id="q-again" type="button">Пройти снова</button><button class="btn" id="q-doc" type="button">Скачать результат (.docx)</button><a class="btn" href="#bloom">Профиль по Блуму</a><a class="btn" href="#tests">Все тесты</a></div>
  <h2 class="sec">Разбор ошибок${wrong.length?` · ${wrong.length}`:''}</h2>
  ${wrong.length ? `<div class="review">${wrong.map(r=>`<div><p><span class="tag">B${r.q.lvl}</span> <span class="tag">Л-${r.q.lec}</span> <b>${esc(r.q.q)}</b></p><p>Ваш ответ: ${r.pick==null?'нет ответа':esc(r.q.opts[r.pick])}</p><p>Правильный ответ: <b>${esc(r.q.opts[r.q.key])}</b></p><p style="color:var(--muted)">${esc(r.q.why)} <a href="#lec-${r.q.lec}">Повторить лекцию № ${r.q.lec}</a></p></div>`).join('')}</div>` : '<p>Ошибок нет.</p>'}</div>`;
  $('#q-again').addEventListener('click', () => startQuiz(z.set.id));
  $('#q-doc').addEventListener('click', () => {
    const me = ST.me;
    const P = [['t','Результат тестирования'],['c',`Дисциплина «${COURSE_NAME}»`],['p',`Студент: ${me.fio||'—'}   Группа: ${me.group||'—'}`],['p',`Тест: ${z.set.t}`],['p',`Дата: ${new Date().toLocaleString('ru-RU')}`],['p',`Результат: ${ok} из ${n} (${Math.round(ok/n*100)}%)`],['h','Результаты по уровням Блума']]
      .concat(lv.map(([l,a,b])=>['p',`B${l} ${BLOOM[l]}: ${a} из ${b}`]))
      .concat([['h','Задания с ошибками']]).concat(wrong.length? wrong.flatMap((r,k)=>[['p',`${k+1}. [B${r.q.lvl}, лекция ${r.q.lec}] ${r.q.q}`],['p',`Ответ студента: ${r.pick==null?'нет ответа':r.q.opts[r.pick]}. Правильный ответ: ${r.q.opts[r.q.key]}.`]]) : [['p','Ошибок нет.']]);
    downloadDocx(P, `Тест_${z.set.id}_${(me.fio||'студент').replace(/\s+/g,'_')}.docx`);

function renderBloom(){

  const any = st.some(x=>x.seen);

  </div>`;

/* ---------------- report ---------------- */
const parser = new DOMParser();
function fieldsOf(s){
  const doc = parser.parseFromString(`<div>${s.html}</div>`, 'text/html');
  const out = [];
  let lastH = '';
  doc.body.firstChild.querySelectorAll('h2, h4, .answer, textarea.fld, input.chk, .widget').forEach(el => {
    if (el.matches('h2')) { lastH = el.textContent.trim(); return; }
    if (el.matches('h4')) { if (doc.body.firstChild.querySelector('textarea.fld')) lastH = el.textContent.trim(); return; }
    if (el.matches('.answer')) out.push({type:'a', key:el.dataset.key, label:el.dataset.label});
    else if (el.matches('textarea.fld')) { const p = el.closest('p'); let prev = p ? p.previousElementSibling : null; out.push({type:'f', key:el.id, label:(lastH? lastH.replace(/^\d+\.\s*/,'')+' — ':'') + (prev? prev.textContent.trim() : 'Поле')}); }
    else if (el.matches('input.chk')) out.push({type:'c', key:el.id, label:(el.parentElement.textContent||'').trim()});
    else if (el.matches('.widget')) out.push({type:'w', key:el.dataset.w, label:W[el.dataset.w] ? W[el.dataset.w].title : el.dataset.w});
  });
  return out;
}
function widgetText(id){
  // build a detached widget to compute its summary from saved state
  if (!SUMMARY[id]) { const tmp = document.createElement('div'); tmp.className = 'widget'; tmp.dataset.w = id; $('#scratch').appendChild(tmp); mountWidget(tmp); tmp.remove(); }
  return SUMMARY[id] ? SUMMARY[id]() : '';
}

  const cb = F.filter(f=>f.type==='c'); if (cb.length) { P.push(['h','Выбранные меры']); const on = cb.filter(f=>ST.f[f.key]); P.push(['p', on.length ? on.map(f=>'• '+f.label).join('\n') : '[не выбрано]', !on.length]); if(!on.length) empty.push('Выбор мер'); }
  const ws = F.filter(f=>f.type==='w'); if (ws.length) { P.push(['h','Результаты расчётных моделей']); ws.forEach(f => P.push(['p', widgetText(f.key)])); }

/* ---------------- minimal DOCX writer (stored ZIP, no libraries) ---------------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for (let i=0;i<b.length;i++) c = CRC[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zip(files){
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const u16 = v => [v&255, (v>>8)&255], u32 = v => [v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for (const [name, text] of files) {
    const nb = enc.encode(name), data = enc.encode(text), c = crc32(data);
    const head = new Uint8Array([0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0)]);
    parts.push(head, nb, data);
    cen.push(new Uint8Array([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c), ...u32(data.length), ...u32(data.length), ...u16(nb.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nb);
    off += head.length + nb.length + data.length;
  }
  const cs = cen.reduce((a,b)=>a+b.length,0);
  const end = new Uint8Array([0x50,0x4b,5,6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cs), ...u32(off), ...u16(0)]);
  return new Blob([...parts, ...cen, end], {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
const xe = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function para(kind, text, empty){
  const lines = String(text).split('\n');
  const runs = lines.map((l,i) => `${i?'<w:r><w:br/></w:r>':''}<w:r>${kind==='t'||kind==='h'||kind==='l'?'<w:rPr><w:b/></w:rPr>':empty?'<w:rPr><w:i/><w:color w:val="A5372A"/></w:rPr>':''}<w:t xml:space="preserve">${xe(l)}</w:t></w:r>`).join('');
  const ppr = kind==='t' ? '<w:pPr><w:jc w:val="center"/><w:spacing w:after="120"/></w:pPr>' : kind==='c' ? '<w:pPr><w:jc w:val="center"/></w:pPr>' : kind==='h' ? '<w:pPr><w:keepNext/><w:spacing w:before="240" w:after="60"/></w:pPr>' : kind==='l' ? '<w:pPr><w:keepNext/><w:spacing w:before="120"/></w:pPr>' : '<w:pPr><w:jc w:val="both"/><w:ind w:firstLine="709"/></w:pPr>';
  return `<w:p>${ppr}${runs}</w:p>`;
}
function downloadDocx(P, name){ return saveBlob(docxBlob(P), name); }
function docxBlob(P){
  const body = P.map(([k,v,e]) => para(k, v, e)).join('');
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="851" w:bottom="1134" w:left="1701" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman" w:eastAsia="Times New Roman"/><w:sz w:val="28"/><w:szCs w:val="28"/><w:lang w:val="ru-RU"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="360" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;
  const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const drels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  return zip([['[Content_Types].xml', ct], ['_rels/.rels', rels], ['word/document.xml', doc], ['word/_rels/document.xml.rels', drels], ['word/styles.xml', styles]]);
}
function saveBlob(blob, name){
  const fname = name.replace(/[\\/:*?"<>|]/g, '_');
  window.__lastDocx = blob;
  const plain = () => { const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Файл .docx сформирован'); };
  if (DL) DL.save({filename: fname, data: blob}).then(() => toast('Файл .docx сохранён'), err => {
    if (err && err.code === 'declined') toast('Сохранение отменено');
    else if (err && err.code === 'rate_limited') toast('Окно сохранения уже открыто');
    else toast('Скачивание здесь недоступно — используйте «Скопировать текст»');
  });
  else plain();
}

try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { DL = d; }, () => {}); } catch(e) {}

/* ============ Облако: вход, активность, сдача тестов и отчётов (общий Supabase с isu-trainer) ============
   Настройки — cloud-config.js рядом с index.html (window.ISU_CLOUD). Нет файла — учебник работает только в браузере. */
const CLOUD = (window.ISU_CLOUD && ISU_CLOUD.url && ISU_CLOUD.key) ? ISU_CLOUD : null;
const TEACHER_URL = (window.ISU_CLOUD && ISU_CLOUD.teacher) || 'https://dkanetova76-hue.github.io/isu-trainer/teacher.html';
const SB_URLS = ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js', 'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'];
let SB = null, ME = null, SB_FAIL = false;
const QKEY = 'ct-cloud-q';
const CQ = {get(){ try { return JSON.parse(localStorage.getItem(QKEY)) || []; } catch(e){ return []; } }, set(q){ try { localStorage.setItem(QKEY, JSON.stringify(q.slice(-2000))); } catch(e){} }};
const qid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const sessOnce = k => { try { if (sessionStorage.getItem(k)) return false; sessionStorage.setItem(k, '1'); } catch(e){} return true; };
const TEST_REF = Object.assign({l1:'B1', l2:'B2', l3:'B3', l4:'B4', l5:'B5', m1:'M1', m2:'M2', final:'FIN', all:'ALL'}, Object.fromEntries(Array.from({length:15}, (x, i) => ['lec' + (i+1), 'L' + (i+1)])));
const gradeOf = p => p >= 85 ? 5 : p >= 70 ? 4 : p >= 55 ? 3 : 2;

function cloudLib(){
  if (window.__SB_MOCK) return Promise.resolve(window.__SB_MOCK);
  if (window.supabase && window.supabase.createClient) return Promise.resolve(window.supabase);
  return new Promise((res, rej) => { let i = 0; const next = () => { if (i >= SB_URLS.length) return rej(new Error('lib'));
    const s = document.createElement('script'); s.src = SB_URLS[i++]; s.onload = () => window.supabase && window.supabase.createClient ? res(window.supabase) : next(); s.onerror = next; document.head.appendChild(s); }; next(); });
}
async function cloudInit(){
  if (!CLOUD) return;
  $('#acct').hidden = false; acctRender();
  try { const lib = await cloudLib(); SB = lib.createClient(CLOUD.url, CLOUD.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}); }
  catch(e){ SB_FAIL = true; acctRender(); return; }
  SB.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') setTimeout(() => authOpen('newpass'), 50); if (ev === 'SIGNED_OUT'){ ME = null; acctRender(); } });
  const {data} = await SB.auth.getSession();
  if (data && data.session) await cloudLoadMe(data.session.user); else acctRender();
}
async function cloudLoadMe(user){
  const {data, error} = await SB.from('profiles').select('id,fio,grp,role,email').eq('id', user.id).single();
  if (error || !data){ ME = null; acctRender(); return false; }
  ME = data; ST.me.fio = ME.fio; ST.me.group = ME.grp; save(true);
  await syncPull();
  acctRender(); cloudFlush();
  if (sessOnce('ct-login-' + ME.id)) cloudEv('login', 'ct', null, {ua: navigator.userAgent.slice(0, 120), w: window.innerWidth});
  route();
  return true;

/* очередь: события и результаты не теряются при плохой связи */
function cloudEv(kind, ref = null, val = null, data = null){
  if (!CLOUD || !ME) return;
  const q = CQ.get(); q.push({qid:qid(), t:'events', uid:ME.id, row:{kind, ref: ref == null ? null : String(ref), val, data: {...(data || {}), course:'ct'}, at: new Date().toISOString()}}); CQ.set(q); cloudFlushSoon();
}
let cfT = null, cfBusy = false;
const cloudFlushSoon = () => { clearTimeout(cfT); cfT = setTimeout(cloudFlush, 3000); };
async function cloudFlush(){
  if (!SB || !ME || cfBusy) return; cfBusy = true;
  try {
    const ev = CQ.get().filter(x => x.uid === ME.id && x.t === 'events').slice(0, 500);
    if (ev.length){ const {error} = await SB.from('events').insert(ev.map(x => x.row)); if (!error){ const ids = new Set(ev.map(x => x.qid)); CQ.set(CQ.get().filter(x => !ids.has(x.qid))); } }
    for (const s of CQ.get().filter(x => x.uid === ME.id && x.t === 'submissions')){
      const {error} = await SB.from('submissions').insert(s.row);
      if (!error) CQ.set(CQ.get().filter(x => x.qid !== s.qid));
    }
  } catch(e){}
  cfBusy = false; acctRender();
}
/* активное время по разделам */
let lastAct = Date.now(); const tBuck = {};
['mousemove', 'keydown', 'scroll', 'touchstart', 'click'].forEach(e => addEventListener(e, () => { lastAct = Date.now(); }, {passive:true, capture:true}));
const secOf = h => /^lec-/.test(h) ? 'theory' : /^pz-|^practice/.test(h) ? 'practice' : /^srs-/.test(h) ? 'srs' : /^test|^bloom/.test(h) ? 'tests' : /^exam|^ticket/.test(h) ? 'exam' : /^report/.test(h) ? 'report' : 'home';
setInterval(() => { if (!ME || document.visibilityState !== 'visible' || Date.now() - lastAct > 120000) return; const g = secOf((location.hash || '#title').slice(1)); tBuck[g] = (tBuck[g] || 0) + 15; }, 15000);
function timeFlush(){ Object.keys(tBuck).forEach(g => { if (tBuck[g] > 0){ cloudEv('time', g, tBuck[g]); tBuck[g] = 0; } }); }
setInterval(timeFlush, 120000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden'){ timeFlush(); cloudFlush(); syncPush(true); } });
addEventListener('online', () => { cloudFlush(); syncPush(); });

/* хуки учебника */
function cloudRoute(h){
  if (!ME) return;
  let m;
  if ((m = /^lec-(\d+)$/.exec(h)) && sessOnce('ct-lec-' + m[1])) cloudEv('lecture', m[1]);
  if ((m = /^pz-(\d+)$/.exec(h)) && sessOnce('ct-pz-' + m[1])) cloudEv('practice', m[1]);
}
function cloudDone(s, on){ if (on && s.kind === 'lec') cloudEv('lecture_done', s.num); }
function cloudTestStart(setId){ cloudEv('test_start', TEST_REF[setId] || setId); }
function cloudTestSubmit(z, res, sec){
  if (!CLOUD || !ME) return false;
  const ok = res.filter(r => r.ok).length, n = res.length, pct = Math.round(ok / n * 100), lv = {};
  res.forEach(r => { const l = r.q.lvl; lv[l] = lv[l] || [0, 0]; lv[l][1]++; if (r.ok) lv[l][0]++; });
  const row = {kind:'test', ref: TEST_REF[z.set.id] || z.set.id, title: z.set.t, score: pct, grade: gradeOf(pct),
    data:{course:'ct', lv, sec, typed:0, paste:0, got:ok, auto:n, open:[],
      items: res.map(r => ({k:r.q.n, lv:r.q.lvl, t:'single', s: r.ok ? 1 : 0, q:r.q.q.slice(0, 160), a: r.pick == null ? '' : r.q.opts[r.pick].slice(0, 300)}))}};
  const q = CQ.get(); q.push({qid:qid(), t:'submissions', uid:ME.id, row}); CQ.set(q); cloudFlush();
  return true;
}
async function cloudSendReport(sid, model, blob, st){
  const s = byId[sid];
  const ref = (s.kind === 'pz' ? 'PZ' : 'SRS') + s.num;
  const path = `${ME.id}/CT_${ref}_${new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)}.docx`;
  const up = await SB.storage.from('works').upload(path, blob, {contentType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', upsert:false});
  if (up.error) throw up.error;
  const keys = fieldsOf(s).filter(f => f.type === 'a' || f.type === 'f').map(f => f.key);
  const chars = keys.reduce((a, k) => a + (ST.f[k] || '').length, 0);
  const {error} = await SB.from('submissions').insert({kind:'report', ref, title: s.title, score: model.total ? Math.round(100 * (model.total - model.miss) / model.total) : 100, file_path: path,
    data:{course:'ct', typed: (ST.typed || {})[sid] || 0, paste: (ST.paste || {})[sid] || 0, chars}});
  if (error) throw error;
}

  dl.classList.toggle('wide', mode === 'mine');
  if (!dl.open){ try { dl.showModal(); } catch(e){ dl.setAttribute('open', ''); } }
  const f = dl.querySelector('input'); if (f) f.focus();
  if (mode === 'mine') loadMine();
  const code = $('#au-code'); if (code) code.addEventListener('change', async () => { const r = await SB.rpc('check_group_code', {p_code: code.value.trim()}); $('#au-grp').innerHTML = r.data ? `Группа: <b>${esc(r.data)}</b>` : '<span class="err">Код не найден</span>'; });
}
const auMsg = (t, ok) => { const m = $('#au-msg'); m.className = 'au-msg ' + (ok ? 'ok' : 'err'); m.textContent = t; };
const AUERR = e => { const m = (e && e.message) || ''; if (/Invalid login/i.test(m)) return 'Неверная почта или пароль.'; if (/not confirmed/i.test(m)) return 'Почта не подтверждена: откройте ссылку из письма.';
  if (/already registered/i.test(m)) return 'Эта почта уже зарегистрирована — войдите.'; if (/at least 6/i.test(m)) return 'Пароль слишком короткий: нужно не меньше 6 знаков.';
  if (/Database error/i.test(m)) return 'Регистрация отклонена: проверьте код группы и ФИО.'; if (/valid email|invalid format/i.test(m)) return 'Проверьте адрес почты.';
  if (/rate limit|too many/i.test(m)) return 'Слишком много попыток. Подождите минуту.'; return m || 'Нет связи с сервером.'; };
async function loadMine(){
  const {data, error} = await SB.from('submissions').select('id,kind,ref,title,score,grade,teacher_grade,teacher_comment,created_at,data').order('created_at', {ascending:false}).limit(300);
  const box = $('#au-mine'); if (!box) return;
  if (error){ box.innerHTML = `<p class="err">${esc(AUERR(error))}</p>`; return; }
  const mine = (data || []).filter(s => (s.data && s.data.course === 'ct'));
  if (!mine.length){ box.innerHTML = '<p class="small">По этой дисциплине пока ничего не сдано.</p>'; return; }
  box.innerHTML = `<div class="tbl"><table><thead><tr><th>Дата</th><th>Работа</th><th>Результат</th><th>Оценка преподавателя</th></tr></thead><tbody>${mine.map(s => `<tr><td>${new Date(s.created_at).toLocaleString('ru-RU', {dateStyle:'short', timeStyle:'short'})}</td><td>${s.kind === 'test' ? 'Тест: ' : 'Отчёт: '}${esc(s.title || s.ref)}</td><td>${s.kind === 'test' ? s.score + ' %' : 'заполнено ' + s.score + ' %'}</td><td>${s.teacher_grade ? `<b>${s.teacher_grade}</b>` : '<span class="small">не проверено</span>'}${s.teacher_comment ? `<br><span class="small">${esc(s.teacher_comment)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
document.addEventListener('click', async e => {
  if (e.target.closest('[data-au-close]')){ $('#auth-dlg').close(); return; }
  const a = e.target.closest('[data-auth]'); if (a){ e.preventDefault(); const m = a.dataset.auth;
    if (m === 'logout'){ timeFlush(); await cloudFlush(); await syncPush(true); await SB.auth.signOut(); ME = null; wipeLocal(); return; }
    authOpen(m); return; }
  const b = e.target.closest('[data-au]'); if (!b) return; e.preventDefault(); const v = id => ($('#' + id) || {}).value || '';
  b.disabled = true;
  try {
    if (b.dataset.au === 'do-login'){
      const {data, error} = await SB.auth.signInWithPassword({email: v('au-email').trim(), password: v('au-pass')});
      if (error) auMsg(AUERR(error)); else if (await cloudLoadMe(data.user)){ $('#auth-dlg').close(); const f = authAfter; authAfter = null; if (f) f(); } else auMsg('Профиль не найден. Обратитесь к преподавателю.');
    }
    if (b.dataset.au === 'do-signup'){
      const fio = v('au-fio').trim().replace(/\s+/g, ' '), code = v('au-code').trim();
      if (fio.split(' ').length < 2) auMsg('Укажите фамилию и имя полностью.');
      else { const g = await SB.rpc('check_group_code', {p_code: code});
        if (!g.data) auMsg('Неверный код группы. Уточните его у преподавателя.');
        else { const {data, error} = await SB.auth.signUp({email: v('au-email').trim(), password: v('au-pass'), options:{data:{fio, code}, emailRedirectTo: location.href.split('#')[0]}});
          if (error) auMsg(AUERR(error));
          else if (data.session){ await cloudLoadMe(data.user); $('#auth-dlg').close(); const f = authAfter; authAfter = null; if (f) f(); }
          else auMsg('Готово! На почту отправлено письмо: откройте ссылку, чтобы подтвердить адрес, затем войдите.', true); } }
    }
    if (b.dataset.au === 'do-reset'){ const {error} = await SB.auth.resetPasswordForEmail(v('au-email').trim(), {redirectTo: location.href.split('#')[0]}); if (error) auMsg(AUERR(error)); else auMsg('Ссылка отправлена. Проверьте почту (и папку «Спам»).', true); }
    if (b.dataset.au === 'do-newpass'){ const {error} = await SB.auth.updateUser({password: v('au-pass')}); if (error) auMsg(AUERR(error)); else { auMsg('Пароль изменён.', true); const {data} = await SB.auth.getSession(); if (data.session) await cloudLoadMe(data.session.user); } }
  } catch(err){ auMsg(AUERR(err)); }
  b.disabled = false;
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest && e.target.closest('#auth-dlg input')){ const b = $('#auth-dlg [data-au]'); if (b){ e.preventDefault(); b.click(); } } });

/* черновики в учётной записи: ответы, модели и результаты тестов доступны на любом устройстве */
const DKEY = 'ct-state';
const SYN = {dirty:false, busy:false, ready:false, off:false, t:null};
function syncMark(){ if (!ME || !SYN.ready) return; SYN.dirty = true; clearTimeout(SYN.t); SYN.t = setTimeout(syncPush, 4000); }
async function syncPull(){
  SYN.ready = false;
  try { const prev = localStorage.getItem('ct-sync-uid'); if (prev && prev !== ME.id) resetState(); localStorage.setItem('ct-sync-uid', ME.id); } catch(e){}
  const {data, error} = await SB.from('drafts').select('key,data,updated_at').eq('key', DKEY);
  if (error){ SYN.off = true; SYN.ready = true; return; }
  const row = (data || [])[0];
  const ct = row ? (Date.parse(row.updated_at) || 0) : 0, lt = ST._ts || 0;
  if (row && ct > lt && row.data && typeof row.data === 'object'){
    const keep = ST.me; Object.keys(ST).forEach(k => delete ST[k]); Object.assign(ST, {done:{}, f:{}, w:{}, t:{ans:{}, runs:[]}, me:{}, typed:{}, paste:{}}, row.data);
    ST.me = Object.assign({}, row.data.me || {}, {fio: keep.fio, group: keep.group}); ST._ts = ct; save(true);
    buildNav();
  } else if (lt > ct) SYN.dirty = true;
  SYN.ready = true; if (SYN.dirty) syncPush();
}
async function syncPush(now){
  if (now) clearTimeout(SYN.t);
  if (!SB || !ME || !SYN.ready || SYN.off || !SYN.dirty) return true;
  if (SYN.busy){ syncMark(); return false; }
  SYN.busy = true; SYN.dirty = false; let ok = true;
  try { const {error} = await SB.from('drafts').upsert({user_id: ME.id, key: DKEY, data: ST, updated_at: new Date(ST._ts || Date.now()).toISOString()}, {onConflict:'user_id,key'}); if (error) throw error; }
  catch(e){ ok = false; SYN.dirty = true; if (/drafts|relation|schema cache/i.test((e && e.message) || '')) SYN.off = true; }
  SYN.busy = false; return ok;
}
setInterval(() => { if (SYN.dirty) syncPush(); }, 30000);
function wipeLocal(){
  try { localStorage.removeItem('ct-sync-uid'); } catch(e){}
  resetState(); save(true); buildNav(); acctRender(); if (/^(test-|report)/.test(location.hash.slice(1))) location.hash = '#title'; else route(); toast('Вы вышли. Ответы сохранены в учётной записи.');
}

/* ---------------- ответы набираются вручную: вставка отключена, набор считается ---------------- */
const isAns = t => t && t.matches && t.matches('.answer textarea, textarea.fld');
const secKey = t => { const k = t.id || ''; const m = /^(lec-\d+|pz-\d+|srs-\d+)/.exec(k); return m ? m[1] : (/^tk\d+/.test(k) ? 'exam' : 'other'); };
function pasteBlocked(t){
  const k = secKey(t); ST.paste[k] = (ST.paste[k] || 0) + 1; save(); if (typeof cloudEv === 'function') cloudEv('paste', k, 1);
  let n = t.parentElement.querySelector('.nopaste'); if (!n){ n = document.createElement('div'); n.className = 'nopaste'; t.insertAdjacentElement('afterend', n); }
  n.textContent = 'Вставка отключена: наберите ответ сами, своими словами. Попытки вставки видит преподаватель.';
  clearTimeout(n._t); n._t = setTimeout(() => n.remove(), 4000);
}
['paste', 'drop'].forEach(ev => document.addEventListener(ev, e => { if (!isAns(e.target)) return; e.preventDefault(); pasteBlocked(e.target); }, true));
document.addEventListener('dragover', e => { if (isAns(e.target)) e.preventDefault(); }, true);
document.addEventListener('beforeinput', e => {
  const t = e.target; if (!isAns(t)) return;
  const big = e.data && e.data.length > 40;
  if (['insertFromPaste','insertFromPasteAsQuotation','insertFromDrop','insertFromYank'].includes(e.inputType) || big){ e.preventDefault(); pasteBlocked(t); return; }
  if (e.inputType === 'insertText' && e.data){ const k = secKey(t); ST.typed[k] = (ST.typed[k] || 0) + e.data.length; }
}, true);

/* ---------------- boot ---------------- */
buildNav(); langLink();
$('#menu-btn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
window.addEventListener('hashchange', route);
route();
cloudInit();
/* --- панель «Мой прогресс» (тот же код, что в progress.js) --- */
/* «Мой прогресс» для студента: сколько сделано из положенного по модулям, сроки, долги.
   Подключается после основного скрипта учебника; берёт план из plan.js (window.PLANS[COURSE_ID]).
   Показывает блок в окне «Мои работы» и всплывающее напоминание, если срок близко или есть долги. */
(() => {
  const ID = window.COURSE_ID, P = (window.PLANS || {})[ID];
  if (!P || typeof loadMine !== 'function') return;
  const KY = (document.documentElement.lang || '').startsWith('ky'), DAY = 864e5;
  const T = KY ? {
    title: 'Менин прогрессим', week: n => `Семестрдин ${n}-жумасы`, st: {'1': '1-модуль', '2': '2-модуль', F: 'Жыйынтыктоочу көзөмөл'},
    till: d => `${d} чейин`, done: (d, n) => `${n} ичинен ${d} аткарылды`, debt: n => `Мөөнөтү өттү: ${n} иш тапшырыла элек. Мүмкүн болушунча тезирээк тапшырыңыз.`,
    allok: 'Баары тапшырылды ✓', left: n => `${n} күн калды`, behind: (e, d) => `Графикти кармоо үчүн ушул жумага чейин ${e} иш болушу керек, сизде ${d}.`,
    ontrack: 'Графикти кармап жатасыз.', future: d => `${d} башталат`, notdone: n => `Тапшырыла элек (${n})`,
    tests: a => `Тесттердин орточо жыйынтыгы: ${a} %`, reps: (c, n, g) => `Текшерилген отчёттор: ${n} ичинен ${c}${g ? ` · орточо баа ${g}` : ''}`,
    more: 'Толугураак', toastDebt: (m, n) => `${m}: мөөнөтү өттү, ${n} иш тапшырыла элек.`, toastSoon: (m, n, d) => `${m}: ${d} күн калды, дагы ${n} иш тапшыруу керек.`, toastBehind: (m) => `${m}: графиктен артта калып жатасыз.`,
    hint: 'Тест — жок дегенде бир жолу тапшырылса, отчёт — жөнөтүлсө эсептелет.'
  } : {
    title: 'Мой прогресс', week: n => `Неделя ${n} семестра`, st: {'1': 'Модуль 1', '2': 'Модуль 2', F: 'Итоговый контроль'},
    till: d => `до ${d}`, done: (d, n) => `сделано ${d} из ${n}`, debt: n => `Срок прошёл: не сдано ${n}. Сдайте как можно скорее.`,
    allok: 'Всё сдано ✓', left: n => `осталось ${n} ${n % 10 === 1 && n % 100 !== 11 ? 'день' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'дня' : 'дней'}`,
    behind: (e, d) => `Чтобы идти по графику, к этой неделе нужно сделать ${e}, у вас ${d}.`, ontrack: 'Вы идёте по графику.', future: d => `начнётся ${d}`,
    notdone: n => `Не сдано (${n})`, tests: a => `Средний результат тестов: ${a} %`, reps: (c, n, g) => `Проверено отчётов: ${c} из ${n}${g ? ` · средняя оценка ${g}` : ''}`,
    more: 'Подробнее', toastDebt: (m, n) => `${m}: срок прошёл, не сдано работ — ${n}.`, toastSoon: (m, n, d) => `${m}: ${d}, осталось сдать ${n}.`, toastBehind: m => `${m}: вы отстаёте от графика.`,
    hint: 'Тест засчитывается после первой попытки, отчёт — после отправки.'
  };
  const mon = s => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; };
  const W0 = mon(P.start), wStart = w => new Date(+W0 + (w - 1) * 7 * DAY), wEnd = w => new Date(+W0 + w * 7 * DAY - 1);
  const fd = d => KY ? d.toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit'}) : d.toLocaleDateString('ru-RU', {day: 'numeric', month: 'long'});
  const e = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const css = document.createElement('style');
  css.textContent = `.pg{border:1px solid rgba(127,127,127,.35);border-radius:8px;padding:12px 14px;margin:0 0 16px}.pg h3{margin:0 0 2px}
.pg-sub{font-size:13px;opacity:.75;margin:0 0 6px}.pg-row{margin:12px 0 0}.pg-hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.pg-bar{height:8px;background:rgba(127,127,127,.22);border-radius:4px;overflow:hidden;margin:5px 0 3px}.pg-bar span{display:block;height:100%;background:#2f6fd6;border-radius:4px}
.pg-st{font-size:13.5px}.pg-red{color:#c0392b;font-weight:600}.pg-amb{color:#b7791f;font-weight:600}.pg-ok{color:#2e8b57}.pg-mut{opacity:.7}
.pg details{font-size:13px;margin-top:3px}.pg ul{margin:4px 0;padding-left:20px}.pg-foot{font-size:13px;opacity:.8;margin-top:10px}
.pg-toast{position:fixed;right:16px;bottom:16px;max-width:380px;z-index:60;background:#fff;color:#16202b;border:1px solid #d8dee5;border-left:5px solid #b7791f;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.2);padding:12px 36px 12px 14px;font-size:14px;line-height:1.45}
.pg-toast.red{border-left-color:#c0392b}.pg-toast b{display:block;margin-bottom:2px}.pg-toast p{margin:0 0 4px}.pg-toast button{font:inherit;cursor:pointer}
.pg-toast .pg-x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:18px;color:inherit;opacity:.6}.pg-toast .pg-go{margin-top:6px;border:1px solid #2f6fd6;background:#2f6fd6;color:#fff;border-radius:5px;padding:5px 10px}
@media (prefers-color-scheme: dark){.pg-toast{background:#18202a;color:#e6ebf0;border-color:#2c3743}}`;
  document.head.appendChild(css);

  async function mySubs(){
    const {data, error} = await SB.from('submissions').select('kind,ref,score,teacher_grade,created_at,user_id,course:data->>course').eq('user_id', ME.id).limit(2000);
    if (error) throw error; return (data || []).filter(s => (s.course || 'isu') === ID);
  }
  function calc(subs){
    const now = Date.now(), w = Math.floor((now - W0) / (7 * DAY)) + 1, has = new Set(subs.map(s => s.kind + ':' + s.ref));
    const S = [['1', P.w1, 1], ['2', P.w2, P.w1 + 1], ['F', P.wf, P.w2 + 1]].map(([m, wd, ws]) => {
      const it = P.items.filter(x => x.m === m), left = it.filter(x => !has.has(x.kind + ':' + x.id)), n = it.length, d = n - left.length;
      const exp = m === '1' ? (w >= P.w1 ? n : Math.round(n * Math.max(0, w) / P.w1)) : m === '2' ? (w <= P.w1 ? 0 : w >= P.w2 ? n : Math.round(n * (w - P.w1) / (P.w2 - P.w1))) : (w >= P.wf ? n : 0);
      const end = wEnd(wd), days = Math.ceil((end - now) / DAY), phase = w > wd ? 'past' : w >= ws ? 'now' : 'future';
      let cls = 'pg-ok', msg = T.allok, alert = null;
      if (!left.length) {}
      else if (phase === 'past'){ cls = 'pg-red'; msg = T.debt(left.length); alert = {lvl: 2, txt: T.toastDebt(T.st[m], left.length)}; }
      else if (phase === 'future'){ cls = 'pg-mut'; msg = T.future(fd(wStart(ws))); }
      else {
        const soon = days <= 14, beh = d < exp;
        cls = days <= 7 ? 'pg-red' : soon || beh ? 'pg-amb' : 'pg-ok';
        msg = T.left(days) + '. ' + (beh ? T.behind(exp, d) : T.ontrack);
        if (soon) alert = {lvl: days <= 7 ? 2 : 1, txt: T.toastSoon(T.st[m], left.length, T.left(days))};
        else if (beh && exp - d >= 2) alert = {lvl: 1, txt: T.toastBehind(T.st[m])};
      }
      return {m, n, d, left, end, phase, cls, msg, alert};
    });
    const tb = {}; subs.filter(s => s.kind === 'test').forEach(s => { tb[s.ref] = Math.max(tb[s.ref] ?? 0, +s.score || 0); });
    const tv = Object.values(tb), reps = {}; subs.filter(s => s.kind === 'report').sort((a, b) => a.created_at < b.created_at ? -1 : 1).forEach(s => { reps[s.ref] = s.teacher_grade || reps[s.ref] || null; });
    const rv = Object.values(reps), rg = rv.filter(Boolean);
    return {w, S, tavg: tv.length ? Math.round(tv.reduce((a, x) => a + x, 0) / tv.length) : null, rn: rv.length, rc: rg.length, rgav: rg.length ? (rg.reduce((a, x) => a + +x, 0) / rg.length).toFixed(1).replace('.', ',') : null};
  }
  function html(R){
    return `<div class="pg"><h3>${T.title} · ${e(P.name)}</h3><p class="pg-sub">${T.week(R.w)} · ${fd(new Date())}</p>
      ${R.S.map(s => `<div class="pg-row"><div class="pg-hd"><b>${T.st[s.m]} · ${T.till(fd(s.end))}</b><span>${T.done(s.d, s.n)}</span></div>
        <div class="pg-bar"><span style="width:${s.n ? Math.round(s.d / s.n * 100) : 0}%"></span></div>
        <div class="pg-st ${s.cls}">${e(s.msg)}</div>
        ${s.left.length && s.phase !== 'future' ? `<details${s.phase === 'past' ? ' open' : ''}><summary>${T.notdone(s.left.length)}</summary><ul>${s.left.map(x => `<li>${e(x.t)}</li>`).join('')}</ul></details>` : ''}</div>`).join('')}
      <p class="pg-foot">${R.tavg != null ? T.tests(R.tavg) + ' · ' : ''}${T.reps(R.rc, R.rn, R.rgav)}<br><span class="pg-mut">${T.hint}</span></p></div>`;
  }
  /* блок в «Мои работы» */
  const _lm = loadMine;
  loadMine = async function(){
    await _lm.apply(this, arguments);
    const box = document.getElementById('au-mine'); if (!box || !ME || ME.role === 'teacher') return;
    try { box.insertAdjacentHTML('afterbegin', html(calc(await mySubs()))); } catch(err){}
  };
  /* напоминание: не чаще раза в день на дисциплину, если есть долги, срок ≤ 14 дней или отставание */
  let shownFor = null;
  async function toast(){
    if (!ME || ME.role === 'teacher' || shownFor === ME.id) return; shownFor = ME.id;
    const key = 'pg-toast-' + ID + '-' + ME.id, today = new Date().toDateString();
    try { if (localStorage.getItem(key) === today) return; } catch(err){}
    let R; try { R = calc(await mySubs()); } catch(err){ return; }
    const A = R.S.map(s => s.alert).filter(Boolean).sort((a, b) => b.lvl - a.lvl); if (!A.length) return;
    const el = document.createElement('div'); el.className = 'pg-toast' + (A[0].lvl > 1 ? ' red' : ''); el.setAttribute('role', 'status');
    el.innerHTML = `<button class="pg-x" aria-label="×">×</button><b>${T.title}</b>${A.slice(0, 2).map(a => `<p>${e(a.txt)}</p>`).join('')}<button class="pg-go">${T.more}</button>`;
    const close = () => { el.remove(); try { localStorage.setItem(key, today); } catch(err){} };
    el.querySelector('.pg-x').onclick = close;
    el.querySelector('.pg-go').onclick = () => { close(); authOpen('mine'); };
    document.body.appendChild(el);
  }
  if (typeof acctRender === 'function'){ const _ar = acctRender; acctRender = function(){ const r = _ar.apply(this, arguments); if (ME && SB) setTimeout(toast, 1500); return r; }; }
})();
})();
