"odd\">\n<td>ROMI / ROAS<\/td>\n<td>Доход от рекламы / Затраты на рекламу<\/td>\n<td>Возврат на маркетинговые вложения<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>LTV (ценность клиента)<\/td>\n<td>Средний чек × частота покупок × срок жизни клиента<\/td>\n<td>Сколько приносит клиент за всё время<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CAC (стоимость привлечения)<\/td>\n<td>Затраты на маркетинг / Новые клиенты<\/td>\n<td>Затраты на одного нового клиента<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Пример.<\/em> Кафе потратило на рекламу 10 000 сомов: 50 000 показов, 1 000 кликов, 40 заказов, выручка 32 000 сомов. CTR = 2 %, CPC = 10 сомов, CR = 4 %, CPA = 250 сомов, ROI = (32 000 − 10 000) / 10 000 = 220 %.<\/p>\n<p>Рассчитайте показатели своей кампании в калькуляторе:<\/p>\n<div class=\"widget\" data-w=\"mkt\">\n\n<\/div>\n<h2>5. Инструменты аналитики<\/h2>\n<ul>\n<li><strong>Google Analytics 4<\/strong>, <strong>Яндекс Метрика<\/strong> — посещаемость сайта, источники трафика, поведение пользователей, конверсии; Метрика также записывает сеансы (Вебвизор) и строит карты кликов.<\/li>\n<li><strong>Meta Business Suite<\/strong>, статистика TikTok и Telegram — охват, вовлечённость, демография аудитории.<\/li>\n<li><strong>Google Tag Manager<\/strong> — настройка отслеживания событий без программирования.<\/li>\n<li><strong>UTM-метки<\/strong> — параметры в ссылке (<code>?utm_source=instagram&amp;utm_campaign=autumn<\/code>), позволяющие определить источник перехода.<\/li>\n<li><strong>A/B-тестирование<\/strong> — сравнение двух вариантов объявления или страницы на разных группах пользователей для выбора лучшего.<\/li>\n<li><strong>CRM<\/strong> — связывает рекламные заявки с реальными продажами.<\/li>\n<\/ul>\n<h2>6. Стратегия и тренды<\/h2>\n<p><strong>Шаги построения стратегии<\/strong>: определить цели (по SMART); описать целевую аудиторию (портрет клиента — персону); выбрать каналы; создать контент-план; определить бюджет; задать KPI; запустить, измерить, оптимизировать.<\/p>\n<p><strong>Тренды<\/strong>: персонализация на основе данных и ИИ; генеративный ИИ для создания контента; короткие вертикальные видео; продажи прямо в соцсетях (social commerce); голосовой поиск; защита приватности и отказ от сторонних cookie; омниканальная аналитика.<\/p>\n<h2>7. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Выберите местный бизнес и определите, какие каналы цифрового маркетинга он использует. Предложите один новый канал и обоснуйте выбор.<\/li>\n<li>Рассчитайте CTR, CPC, CR, CPA и ROI для условной кампании и сделайте вывод о её эффективности.<\/li>\n<\/ol>\n<h2>8. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Чем цифровой маркетинг отличается от традиционного?<\/li>\n<li>Чем SEO отличается от контекстной рекламы?<\/li>\n<li>Опишите этапы воронки продаж.<\/li>\n<li>Как рассчитываются CTR, CPA и ROI?<\/li>\n<li>Для чего нужны UTM-метки и A/B-тесты?<\/li>\n<li>Что такое таргетинг?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Цифровой маркетинг · таргетинг · SEO · контекстная реклама · SMM · контент-маркетинг · воронка продаж · AIDA · CTR · CPC · CPM · CR · CPA · ROI · LTV · Google Analytics · UTM · A/B-тест.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Котлер Ф. Маркетинг 5.0: технологии для человечности. — М. : Альпина, 2021.<\/li>\n<li>Google Digital Garage: Основы цифрового маркетинга. — learndigital.withgoogle.com.<\/li>\n<li>Справка Google Analytics. — support.google.com/analytics.<\/li>\n<\/ol>\n"}, {"id": "lec-15", "kind": "lec", "num": 15, "title": "Цифровая трансформация бизнеса", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 2\n<\/p>\n<p>\nОК-1, ПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Обобщить материал курса и показать цифровую трансформацию как комплексное изменение бизнес-модели, процессов и культуры организации: её этапы, ключевые технологии, оценку цифровой зрелости, показатели эффекта, барьеры и примеры успешных трансформаций.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Понятие цифровой трансформации.<\/li>\n<li>Движущие силы трансформации.<\/li>\n<li>Этапы цифровой трансформации.<\/li>\n<li>Ключевые технологии.<\/li>\n<li>Цифровая зрелость организации.<\/li>\n<li>Оценка эффекта.<\/li>\n<li>Барьеры и факторы успеха.<\/li>\n<li>Примеры трансформации; цифровая трансформация в Кыргызстане.<\/li>\n<\/ol>\n<h2>1. Понятие цифровой трансформации<\/h2>\n<p><strong>Цифровая трансформация бизнеса<\/strong> — глубокое изменение бизнес-модели, процессов, продуктов, организационной структуры и корпоративной культуры на основе цифровых технологий и данных с целью создания новой ценности для клиентов и повышения конкурентоспособности.<\/p>\n<p>Трансформация — не покупка программ, а изменение <strong>того, как компания создаёт и доставляет ценность<\/strong>. Её четыре измерения: <em>клиенты<\/em> (новый клиентский опыт), <em>процессы<\/em> (автоматизация и интеграция), <em>бизнес-модель<\/em> (новые продукты и источники дохода), <em>люди и культура<\/em> (навыки, ценности, гибкие команды).<\/p>\n<h2>2. Движущие силы трансформации<\/h2>\n<ul>\n<li>Изменение ожиданий клиентов: мгновенность, персонализация, мобильность.<\/li>\n<li>Конкуренция со стороны цифровых компаний и платформ.<\/li>\n<li>Снижение стоимости технологий: облака, датчики, вычисления.<\/li>\n<li>Рост объёмов данных.<\/li>\n<li>Государственная политика цифровизации.<\/li>\n<li>Кризисы, ускоряющие переход в онлайн (пандемия COVID-19).<\/li>\n<\/ul>\n<h2>3. Этапы цифровой трансформации<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Этап<\/th>\n<th>Содержание<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Оценка текущего состояния и постановка целей<\/td>\n<td>Аудит процессов, систем, данных, компетенций; оценка цифровой зрелости; определение целей и KPI<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2. Разработка стратегии и дорожной карты<\/td>\n<td>Приоритетные направления, проекты, бюджет, сроки, ответственные<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3. Пилотные проекты<\/td>\n<td>Проверка решений на ограниченном участке, быстрые результаты<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4. Масштабирование<\/td>\n<td>Распространение успешных решений на всю организацию, интеграция систем<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5. Развитие людей и культуры<\/td>\n<td>Обучение, новые роли (владелец продукта, аналитик данных), управление изменениями<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>6. Мониторинг и непрерывное улучшение<\/td>\n<td>Контроль KPI, корректировка стратегии<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>4. Ключевые технологии трансформации<\/h2>\n<p>Обобщение курса:<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Технология<\/th>\n<th>Вклад в трансформацию<\/th>\n<th>Лекция<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Данные и аналитика, BI<\/td>\n<td>Решения на основе данных<\/td>\n<td>3–5<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Облачные технологии<\/td>\n<td>Масштабируемость, доступ из любого места, снижение затрат<\/td>\n<td>10<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Искусственный интеллект и ML<\/td>\n<td>Прогнозы, автоматизация решений, персонализация<\/td>\n<td>11<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Интернет вещей<\/td>\n<td>Данные о физических объектах, автоматизация операций<\/td>\n<td>12<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>VR/AR<\/td>\n<td>Новый клиентский опыт и обучение<\/td>\n<td>13<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Цифровой маркетинг<\/td>\n<td>Привлечение и удержание клиентов в цифровых каналах<\/td>\n<td>14<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>КИС (ERP, CRM) и BPM<\/td>\n<td>Интеграция и оптимизация процессов<\/td>\n<td>8<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Кибербезопасность<\/td>\n<td>Доверие и непрерывность бизнеса<\/td>\n<td>9<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Блокчейн, RPA, low-code<\/td>\n<td>Прозрачность сделок, автоматизация рутины, быстрая разработка<\/td>\n<td>1, 7<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. Цифровая зрелость организации<\/h2>\n<p><strong>Цифровая зрелость<\/strong> — степень готовности организации использовать цифровые технологии для достижения своих целей. Обычно её оценивают по нескольким измерениям: стратегия, клиенты, процессы, данные, технологии, персонал и культура, управление и безопасность — по шкале от 1 до 5.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Уровень<\/th>\n<th>Характеристика<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Начальный<\/td>\n<td>Отдельные цифровые инструменты, бумажные процессы, нет стратегии<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2. Развивающийся<\/td>\n<td>Автоматизированы отдельные функции, данные разрознены<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3. Управляемый<\/td>\n<td>Есть стратегия, ключевые системы интегрированы<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4. Интегрированный<\/td>\n<td>Сквозные цифровые процессы, решения на основе данных<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5. Трансформационный<\/td>\n<td>Цифровая бизнес-модель, постоянные инновации<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>6. Оценка эффекта<\/h2>\n<p>Показатели: рост выручки и доли онлайн-продаж; снижение операционных затрат; сокращение времени процессов (например, обработки заказа); удовлетворённость клиентов (NPS); производительность труда; окупаемость инвестиций (ROI, NPV, срок окупаемости).<\/p>\n<p><strong>Чистая приведённая стоимость<\/strong> NPV = Σ CFₜ / (1 + r)ᵗ − I₀, где CFₜ — денежный поток года <em>t<\/em>, <em>r<\/em> — ставка дисконтирования, I₀ — первоначальные инвестиции. Проект выгоден, если NPV &gt; 0.<\/p>\n<h2>7. Барьеры и факторы успеха<\/h2>\n<p><strong>Барьеры<\/strong>: сопротивление изменениям; недостаток компетенций; устаревшие системы, которые трудно интегрировать; ограниченный бюджет; отсутствие поддержки руководства; разрозненные данные; риски безопасности.<\/p>\n<p><strong>Факторы успеха<\/strong>: поддержка первого руководителя; ясная стратегия, связанная с бизнес-целями; ориентация на клиента; быстрые пилоты и измеримые результаты; инвестиции в людей; качественные данные; партнёрства с технологическими компаниями.<\/p>\n<blockquote>\n<p>По оценкам консалтинговых компаний, значительная доля программ трансформации не достигает целей. Главные причины — организационные и культурные, а не технические.<\/p>\n<\/blockquote>\n<h2>8. Примеры трансформации<\/h2>\n<ol type=\"1\">\n<li><strong>Netflix<\/strong> — от проката DVD к стриминговой платформе и собственному производству контента на основе данных о зрителях.<\/li>\n<li><strong>DBS Bank (Сингапур)<\/strong> — перестроил работу «как технологическая компания»: облака, микросервисы, гибкие команды; стал одним из лучших цифровых банков мира.<\/li>\n<li><strong>Domino’s Pizza<\/strong> — заказ через любые каналы (приложение, мессенджеры, умные колонки), отслеживание заказа в реальном времени.<\/li>\n<li><strong>Logistics-компании<\/strong> — IoT-датчики на транспорте и ML-оптимизация маршрутов сокращают время доставки и расход топлива.<\/li>\n<\/ol>\n<p><strong>Цифровая трансформация в Кыргызстане.<\/strong> Концепция цифровой трансформации КР на 2024–2028 годы определяет направления: цифровое государство (электронные услуги, система межведомственного взаимодействия «Түндүк»), цифровая экономика, развитие инфраструктуры и цифровых навыков. В бизнесе — мобильный банкинг и QR-платежи, электронные счета-фактуры, онлайн-торговля, цифровые сервисы операторов связи.<\/p>\n<h2>9. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Оцените цифровую зрелость знакомой организации по шести измерениям (1–5) и определите приоритеты развития.<\/li>\n<li>Подготовьте дорожную карту цифровой трансформации для малой компании: цели, 3–4 проекта, технологии, сроки, KPI, риски.<\/li>\n<\/ol>\n<h2>10. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Чем цифровая трансформация отличается от цифровизации?<\/li>\n<li>Назовите этапы цифровой трансформации.<\/li>\n<li>Какие технологии являются ключевыми для трансформации?<\/li>\n<li>Что такое цифровая зрелость и как её оценивают?<\/li>\n<li>Какие показатели используют для оценки эффекта трансформации?<\/li>\n<li>Почему многие трансформации не достигают целей?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Цифровая трансформация · бизнес-модель · дорожная карта · пилотный проект · масштабирование · цифровая зрелость · управление изменениями · NPS · NPV · ROI · факторы успеха.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Концепция цифровой трансформации Кыргызской Республики на 2024–2028 годы. — cbd.minjust.gov.kg.<\/li>\n<li>Прохоров А., Коник Л. Цифровая трансформация: анализ, тренды, мировой опыт. — 2021.<\/li>\n<li>Фролов К. В. и др. Цифровые технологии : учеб. пособие. — СПб., 2024.<\/li>\n<\/ol>\n"}, {"id": "pz-1", "kind": "pz", "num": 1, "lec": 7, "title": "Современные бизнес-тренды и актуальность цифровых технологий", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nКейс-метод, групповая работа\n<\/p>\n<p>\nОК-1, ПК-1\n<\/p>\n<\/div>\n<h2>1. Цель занятия<\/h2>\n<p>Закрепить знания о современных бизнес-трендах и роли цифровых технологий; научиться анализировать проблемы компании и предлагать обоснованные цифровые решения.<\/p>\n<p><strong>После занятия студент умеет<\/strong>: называть ключевые бизнес-тренды и технологии; связывать проблему бизнеса с подходящей технологией; сравнивать альтернативные решения по критериям; формулировать риски внедрения.<\/p>\n<h2>2. План занятия<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Этап<\/th>\n<th>Содержание<\/th>\n<th>Время<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Повторение: тренды и технологии (ИИ, большие данные, IoT, облака, кибербезопасность, удалённая работа, персонализация, электронная коммерция)<\/td>\n<td>15 мин<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Анализ кейса «Буква» в группах<\/td>\n<td>45 мин<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Презентация решений и дискуссия<\/td>\n<td>30 мин<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Задание № 1. Тренды и технологии<\/h2>\n<p>Для каждого тренда приведите пример компании (мировой или кыргызстанской) и технологию, на которой он основан.<\/p>\n<div class=\"answer\" data-key=\"pz-1-a1\" data-label=\"Тренды: персонализация, омниканальность, платформы, удалённая работа, устойчивое развитие — пример и технология для каждого\">\n\n<\/div>\n<h2>4. Задание № 2. Кейс «Буква»<\/h2>\n<blockquote>\n<p>Сеть книжных магазинов «Буква» (5 магазинов в Бишкеке и Оше) сталкивается с падением продаж на 18 % за два года из-за роста онлайн-магазинов и электронных книг. Покупатели — в основном студенты и родители школьников. Сайта с онлайн-заказом нет, программа лояльности — бумажные карты. Бюджет на цифровизацию ограничен.<\/p>\n<\/blockquote>\n<p><strong>2.1. Диагностика.<\/strong> Определите три главные причины падения продаж и то, какие данные нужны компании, чтобы подтвердить эти причины.<\/p>\n<div class=\"answer\" data-key=\"pz-1-a2\" data-label=\"Причины падения продаж и необходимые данные\">\n\n<\/div>\n<p><strong>2.2. Варианты решений.<\/strong> Возможные направления: мобильное приложение с рекомендациями, программой лояльности и онлайн-заказом; онлайн-платформа электронных и аудиокниг по подписке; онлайн-мероприятия (встречи с авторами, литературные клубы); продвижение в социальных сетях и таргетированная реклама; дополненная реальность в магазинах (сканируешь обложку — видишь отзывы и отрывок).<\/p>\n<p>Оцените варианты в модели многокритериальной оценки. Измените веса критериев и оценки так, как считает ваша группа.<\/p>\n<div class=\"widget\" data-w=\"mca-pz1\">\n\n<\/div>\n<p><strong>2.3. Решение.<\/strong> Выберите 2–3 решения, обоснуйте выбор, опишите порядок внедрения и ожидаемые результаты (показатели).<\/p>\n<div class=\"answer\" data-key=\"pz-1-a3\" data-label=\"Выбранные решения, порядок внедрения, ожидаемые KPI\">\n\n<\/div>\n<p><strong>2.4. Риски.<\/strong> Какие риски связаны с выбранными решениями и как их снизить?<\/p>\n<div class=\"answer\" data-key=\"pz-1-a4\" data-label=\"Риски внедрения и меры по их снижению\">\n\n<\/div>\n<h2>5. Дискуссия<\/h2>\n<ol type=\"1\">\n<li>Какие решения дают быстрый эффект, а какие — долгосрочный?<\/li>\n<li>Может ли небольшая компания конкурировать с крупными онлайн-платформами? За счёт чего?<\/li>\n<li>Почему важно адаптировать бизнес к трендам, а не следовать им буквально?<\/li>\n<\/ol>\n<div class=\"answer\" data-key=\"pz-1-a5\" data-label=\"Выводы по итогам дискуссии\">\n\n<\/div>\n<h2>6. Дополнительные задания<\/h2>\n<ul>\n<li><strong>Эссе<\/strong> «Цифровая трансформация в моей сфере деятельности» (1–2 страницы).<\/li>\n<li><strong>Исследование<\/strong>: проанализировать опыт конкретной компании, успешно внедрившей цифровые технологии.<\/li>\n<\/ul>\n<h2>7. Критерии оценки<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Критерий<\/th>\n<th>Баллы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Точность понятий и примеров (задание 1)<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Обоснованная диагностика (2.1)<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Корректная многокритериальная оценка (2.2)<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Аргументированное решение с KPI (2.3)<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Анализ рисков (2.4)<\/td>\n<td>1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}, {"id": "pz-2", "kind": "pz", "num": 2, "lec": 1, "title": "Эволюция ИТ-индустрии", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nГрупповая работа, элементы игры\n<\/p>\n<p>\nОК-1, ПК-1\n<\/p>\n<\/div>\n<h2>1. Цель занятия<\/h2>\n<p>Изучить основные этапы развития ИТ-индустрии, понять влияние технологических изменений на бизнес и общество, развить навыки анализа и прогнозирования.<\/p>\n<h2>2. План занятия<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Этап<\/th>\n<th>Содержание<\/th>\n<th>Время<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Мозговой штурм: какие технологии приходят на ум, когда вы думаете об ИТ?<\/td>\n<td>15 мин<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>«Путешествие во времени»: группы готовят мини-презентацию о своём периоде<\/td>\n<td>45 мин<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Дискуссия и «взгляд в будущее»<\/td>\n<td>30 мин<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Задание № 1. Мозговой штурм<\/h2>\n<p>Перечислите 10 технологий, которые, по вашему мнению, определили развитие ИТ, и расположите их в хронологическом порядке.<\/p>\n<div class=\"answer\" data-key=\"pz-2-a1\" data-label=\"10 ключевых технологий в хронологическом порядке\">\n\n<\/div>\n<h2>4. Задание № 2. Путешествие во времени<\/h2>\n<p>Заполните таблицу по каждому периоду: ключевые технологии, события и люди, влияние на бизнес и общество.<\/p>\n<h4>1. 1950–1960-е годы<\/h4>\n<p>\nКлючевые технологии и события (ЭВМ, языки программирования)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nВлияние на бизнес и общество\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>2. 1970–1980-е годы<\/h4>\n<p>\nКлючевые технологии и события (микропроцессор, ПК, ARPANET)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nВлияние на бизнес и общество\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>3. 1990-е годы<\/h4>\n<p>\nКлючевые технологии и события (WWW, браузеры, мобильные телефоны)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nВлияние на бизнес и общество\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f6\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>4. 2000-е годы<\/h4>\n<p>\nКлючевые технологии и события (поисковики, соцсети, смартфоны)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f7\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nВлияние на бизнес и общество\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f8\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>5. 2010-е – настоящее время<\/h4>\n<p>\nКлючевые технологии и события (облака, большие данные, ИИ, IoT)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f9\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nВлияние на бизнес и общество\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-2-f10\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>5. Задание № 3. Тенденции<\/h2>\n<p>Какие сквозные тенденции прослеживаются в развитии ИТ (стоимость вычислений, размер устройств, число пользователей, скорость связи)? Приведите доказательства из таблицы.<\/p>\n<div class=\"answer\" data-key=\"pz-2-a2\" data-label=\"Сквозные тенденции развития ИТ с примерами\">\n\n<\/div>\n<h2>6. Задание № 4. Взгляд в будущее<\/h2>\n<p>Какие три технологии будут определять развитие ИТ в ближайшие 10–20 лет? Как они изменят вашу будущую профессию?<\/p>\n<div class=\"answer\" data-key=\"pz-2-a3\" data-label=\"Прогноз: три технологии будущего и их влияние на профессию\">\n\n<\/div>\n<h2>7. Дополнительные задания<\/h2>\n<ul>\n<li><strong>Эссе<\/strong> «Влияние ИТ на мою профессию».<\/li>\n<li><strong>Инфографика<\/strong> по истории одной технологии (интернет, мобильная связь, искусственный интеллект).<\/li>\n<\/ul>\n<h2>8. Критерии оценки<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Критерий<\/th>\n<th>Баллы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Полнота и точность таблицы периодов<\/td>\n<td>4<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Анализ тенденций<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Обоснованный прогноз<\/td>\n<td>3<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}, {"id": "pz-3", "kind": "pz", "num": 3, "lec": 8, "title": "Корпоративные информационные системы", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nКейсы, групповая работа\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Цель занятия<\/h2>\n<p>Познакомиться с видами корпоративных информационных систем (КИС), их функциями и преимуществами; научиться анализировать потребности бизнеса и выбирать подходящую систему.<\/p>\n<h2>2. Краткая теория<\/h2>\n<p><strong>КИС<\/strong> — интегрированная информационная система, автоматизирующая управление ресурсами и процессами предприятия.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Класс<\/th>\n<th>Функции<\/th>\n<th>Примеры<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>ERP<\/td>\n<td>Финансы, закупки, склад, производство, продажи, персонал в единой базе<\/td>\n<td>SAP, Oracle, Microsoft Dynamics, 1С:ERP, Odoo<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CRM<\/td>\n<td>Сбор и анализ информации о клиентах, автоматизация продаж и маркетинга, поддержка клиентов<\/td>\n<td>Salesforce, Bitrix24, amoCRM<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SCM<\/td>\n<td>Планирование, закупки, производство, дистрибуция, возвраты<\/td>\n<td>SAP SCM, Oracle SCM Cloud<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>HRM<\/td>\n<td>Подбор, учёт, обучение, оценка персонала<\/td>\n<td>SAP SuccessFactors, 1С:ЗУП<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>BI<\/td>\n<td>Отчётность и аналитика<\/td>\n<td>Power BI, Tableau<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Преимущества КИС: единая база данных вместо разрозненных таблиц; автоматизация; прозрачность; сокращение издержек; обоснованные решения.<\/p>\n<h2>3. Задание № 1. Классификация<\/h2>\n<p>Определите, какой класс КИС решает каждую задачу: (а) менеджер не знает, когда клиент звонил последний раз; (б) бухгалтерия и склад ведут разные данные об остатках; (в) поставки сырья приходят с опозданием; (г) руководитель не видит продажи по филиалам в реальном времени; (д) кадровый учёт ведётся в Excel.<\/p>\n<div class=\"answer\" data-key=\"pz-3-a1\" data-label=\"Класс КИС для задач а–д с пояснением\">\n\n<\/div>\n<h2>4. Задание № 2. Кейсы компаний<\/h2>\n<p>Каждая группа получает одну компанию.<\/p>\n<blockquote>\n<p><strong>Компания А.<\/strong> Мебельная фабрика (120 сотрудников): заказы принимаются по телефону, наличие материалов проверяется вручную, сроки изготовления срываются.<\/p>\n<p><strong>Компания Б.<\/strong> Сеть аптек (15 точек): частые дефициты и излишки препаратов, просроченные остатки.<\/p>\n<p><strong>Компания В.<\/strong> Частная языковая школа (800 студентов): нет единой базы клиентов, повторные продажи курсов низкие, заявки с сайта теряются.<\/p>\n<\/blockquote>\n<p><strong>2.1.<\/strong> Проанализируйте ситуацию вашей компании: проблемы, их причины, затрагиваемые процессы.<\/p>\n<div class=\"answer\" data-key=\"pz-3-a2\" data-label=\"Анализ проблем компании\">\n\n<\/div>\n<p><strong>2.2.<\/strong> Определите, какой класс КИС нужен, и обоснуйте выбор. Какие модули потребуются в первую очередь?<\/p>\n<div class=\"answer\" data-key=\"pz-3-a3\" data-label=\"Выбор класса КИС и модулей с обоснованием\">\n\n<\/div>\n<p><strong>2.3.<\/strong> Сравните три конкретные системы по критериям. Измените веса и оценки в модели.<\/p>\n<div class=\"widget\" data-w=\"mca-pz3\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-3-a4\" data-label=\"Итоговый выбор системы и аргументы\">\n\n<\/div>\n<h2>5. Задание № 3. Внедрение<\/h2>\n<p>Опишите этапы внедрения выбранной системы (обследование, настройка, миграция данных, обучение, запуск, поддержка) и три главные сложности.<\/p>\n<div class=\"answer\" data-key=\"pz-3-a5\" data-label=\"Этапы внедрения и сложности\">\n\n<\/div>\n<h2>6. Вопросы для обсуждения<\/h2>\n<ol type=\"1\">\n<li>Какие факторы влияют на выбор КИС (размер, отрасль, бюджет, потребности)?<\/li>\n<li>В чём преимущества облачных КИС для малого бизнеса?<\/li>\n<li>Как ИИ и большие данные меняют КИС?<\/li>\n<\/ol>\n<h2>7. Дополнительные задания<\/h2>\n<ul>\n<li>Подготовить краткий доклад об одной из КИС (ERP, CRM или SCM).<\/li>\n<li>Проанализировать рынок КИС в одной отрасли Кыргызстана.<\/li>\n<\/ul>\n"}, {"id": "pz-4", "kind": "pz", "num": 4, "lec": 8, "title": "Методология архитектуры предприятия", "html": "<div class=\"meta\">\n<p>\n4 академических часа (2 занятия)\n<\/p>\n<p>\nМоделирование, групповая работа\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Цель занятия<\/h2>\n<p>Освоить понятие архитектуры предприятия, её уровни и методологии (TOGAF, Zachman); научиться строить упрощённую архитектурную модель компании — от бизнес-целей до технологий.<\/p>\n<p><strong>Программное обеспечение<\/strong>: draw.io (diagrams.net), Archi (ArchiMate), Bizagi Modeler или Microsoft Visio.<\/p>\n<h2>2. Занятие 1. Теоретическая основа<\/h2>\n<p><strong>Уровни архитектуры<\/strong>: бизнес-архитектура (цели, процессы, структура, правила) → архитектура данных → архитектура приложений → технологическая архитектура (оборудование, сети, облака, безопасность).<\/p>\n<p><strong>TOGAF ADM<\/strong>: предварительная фаза → A. Видение → B. Бизнес-архитектура → C. Архитектура информационных систем → D. Технологическая архитектура → E. Возможности и решения → F. Планирование миграции → G. Управление внедрением → H. Управление изменениями; в центре — управление требованиями.<\/p>\n<p><strong>Задание № 1.<\/strong> Объясните своими словами, зачем компании архитектура предприятия и какие проблемы возникают без неё.<\/p>\n<div class=\"answer\" data-key=\"pz-4-a1\" data-label=\"Назначение архитектуры предприятия и проблемы её отсутствия\">\n\n<\/div>\n<p><strong>Задание № 2.<\/strong> Сравните TOGAF и Zachman Framework: что это — процесс или классификация, сильные стороны, когда применять.<\/p>\n<div class=\"answer\" data-key=\"pz-4-a2\" data-label=\"Сравнение TOGAF и Zachman\">\n\n<\/div>\n<h2>3. Занятие 2. Кейс: архитектура интернет-магазина<\/h2>\n<blockquote>\n<p>Интернет-магазин бытовой техники «ТехноДом» (Бишкек) продаёт через сайт и Instagram, имеет склад и курьерскую службу. Заказы из Instagram оформляются вручную, остатки на сайте не совпадают со складом, клиенты жалуются на отсутствие информации о доставке. Цель — за год увеличить онлайн-продажи на 40 % и сократить время доставки до 1 дня.<\/p>\n<\/blockquote>\n<p>Заполните архитектурное описание по этапам ADM.<\/p>\n<h4>A. Видение архитектуры<\/h4>\n<p>\nБизнес-цели и измеримые показатели\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nЗаинтересованные стороны и их требования\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>B. Бизнес-архитектура<\/h4>\n<p>\nОсновные бизнес-процессы (приём заказа, оплата, комплектация, доставка, возврат)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nОрганизационная структура и роли\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>C. Архитектура данных и приложений<\/h4>\n<p>\nКлючевые данные (клиенты, товары, заказы, остатки) и где они хранятся\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nПриложения и их интеграция (сайт, CRM, складская система, платёжный сервис)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f6\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>D. Технологическая архитектура<\/h4>\n<p>\nИнфраструктура: хостинг или облако, сети, безопасность\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f7\" rows=\"3\"><\/textarea>\n<\/p>\n<h4>E–F. Решения и план миграции<\/h4>\n<p>\nРазрыв между AS-IS и TO-BE и проекты для его устранения\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f8\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nПлан перехода по этапам и срокам\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-4-f9\" rows=\"3\"><\/textarea>\n<\/p>\n<p><strong>Задание № 3.<\/strong> Постройте в draw.io или Archi схему из четырёх уровней архитектуры «ТехноДома» и опишите связи между уровнями.<\/p>\n<div class=\"answer\" data-key=\"pz-4-a3\" data-label=\"Описание схемы архитектуры и связей между уровнями\">\n\n<\/div>\n<h2>4. Обсуждение<\/h2>\n<ol type=\"1\">\n<li>Какие сложности возникают при разработке архитектуры предприятия?<\/li>\n<li>Какова роль архитектора предприятия?<\/li>\n<li>Как микросервисы и облака влияют на архитектуру?<\/li>\n<\/ol>\n<h2>5. Дополнительные задания<\/h2>\n<ul>\n<li>Презентация о выбранной методологии архитектуры предприятия (TOGAF, Zachman, FEA).<\/li>\n<li>Анализ архитектуры реального предприятия по открытым источникам.<\/li>\n<\/ul>\n"}, {"id": "pz-5", "kind": "pz", "num": 5, "lec": 12, "title": "Интернет вещей (IoT)", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nАнализ и проектирование\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Цель занятия<\/h2>\n<p>Закрепить знания об архитектуре и компонентах интернета вещей; научиться анализировать готовые IoT-решения и проектировать простую IoT-систему с расчётом экономического эффекта.<\/p>\n<h2>2. План занятия<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Этап<\/th>\n<th>Содержание<\/th>\n<th>Время<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Повторение: компоненты, уровни архитектуры, протоколы<\/td>\n<td>20 мин<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Анализ готового IoT-решения<\/td>\n<td>25 мин<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Проектирование IoT-системы и расчёт эффекта<\/td>\n<td>45 мин<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Задание № 1. Анализ IoT-решения<\/h2>\n<p>Выберите одно решение: умный дом, трекер для домашних животных, фитнес-браслет, умный счётчик электроэнергии, система полива теплицы. Опишите его по уровням архитектуры.<\/p>\n<h4>Выбранное решение<\/h4>\n<p>\nНазвание решения и назначение\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-5-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nУровень устройств: датчики и исполнительные устройства\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-5-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nСетевой уровень: технология связи и протокол\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-5-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nУровень обработки: платформа, где хранятся и анализируются данные\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-5-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nУровень приложений: что видит и может сделать пользователь\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-5-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<div class=\"answer\" data-key=\"pz-5-a1\" data-label=\"Преимущества и недостатки решения, риски безопасности\">\n\n<\/div>\n<h2>4. Задание № 2. Проект: мониторинг температуры и влажности<\/h2>\n<blockquote>\n<p>В серверной комнате университета и в двух учебных лабораториях нужно контролировать температуру (норма 18–24 °C) и влажность (40–60 %). При выходе за пределы ответственный должен получать сообщение в Telegram, а кондиционер — включаться автоматически.<\/p>\n<\/blockquote>\n<p><strong>2.1.<\/strong> Выберите компоненты: датчики (например, DHT22, BME280), микроконтроллер (ESP32, Arduino + Wi-Fi), технология связи, платформа (ThingSpeak, Blynk, Home Assistant), исполнительное устройство.<\/p>\n<div class=\"answer\" data-key=\"pz-5-a2\" data-label=\"Состав компонентов с обоснованием выбора\">\n\n<\/div>\n<p><strong>2.2.<\/strong> Опишите алгоритм работы системы по шагам (измерение → передача → проверка условия → действие → журнал).<\/p>\n<div class=\"answer\" data-key=\"pz-5-a3\" data-label=\"Алгоритм работы системы\">\n\n<\/div>\n<p><strong>2.3.<\/strong> Какие меры безопасности нужны (пароли, шифрование, обновления, изолированная сеть)?<\/p>\n<div class=\"answer\" data-key=\"pz-5-a4\" data-label=\"Меры безопасности IoT-системы\">\n\n<\/div>\n<h2>5. Задание № 3. Экономический эффект умного освещения<\/h2>\n<p>Компания планирует установить датчики движения и освещённости в офисе. Оцените экономию электроэнергии и срок окупаемости. Подставьте данные своего варианта.<\/p>\n<div class=\"widget\" data-w=\"iot\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-5-a5\" data-label=\"Вывод: выгодно ли внедрение, при каких условиях оно окупается быстрее\">\n\n<\/div>\n<h2>6. Дополнительные задания<\/h2>\n<ul>\n<li>Доклад о перспективах IoT в одной отрасли Кыргызстана (сельское хозяйство, энергетика, ЖКХ).<\/li>\n<li>Концепция нового IoT-устройства или сервиса.<\/li>\n<\/ul>\n"}, {"id": "pz-6", "kind": "pz", "num": 6, "lec": 5, "title": "Поддержка принятия решений и интеллектуальный анализ данных", "html": "<div class=\"meta\">\n<p>\n4 академических часа (2 занятия)\n<\/p>\n<p>\nРабота с моделями и данными\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Цель занятия<\/h2>\n<p>Познакомиться с системами поддержки принятия решений (СППР) и методами интеллектуального анализа данных (Data Mining); научиться применять многокритериальную оценку и оценивать качество классификационной модели.<\/p>\n<h2>2. Краткая теория<\/h2>\n<p><strong>СППР<\/strong> — компьютерная система, которая помогает лицу, принимающему решение, анализировать данные, моделировать сценарии и сравнивать альтернативы. Типы: управляемые данными (BI, OLAP), управляемые моделями (оптимизация, многокритериальный анализ), управляемые знаниями (экспертные системы).<\/p>\n<p><strong>Этапы принятия решения (по Г. Саймону)<\/strong>: осознание проблемы → проектирование альтернатив → выбор → реализация и контроль.<\/p>\n<p><strong>Data Mining<\/strong> — поиск скрытых закономерностей в больших объёмах данных. Методы: классификация (деревья решений, логистическая регрессия, SVM); регрессия; кластеризация (k-means, иерархическая); поиск ассоциаций (Apriori). Стандарт процесса — <strong>CRISP-DM<\/strong>: понимание бизнеса → понимание данных → подготовка → моделирование → оценка → внедрение.<\/p>\n<h2>3. Занятие 1. Многокритериальный выбор<\/h2>\n<blockquote>\n<p>Сеть супермаркетов выбирает поставщика системы аналитики. Альтернативы: Power BI (облако), Tableau, собственная разработка на Python. Критерии: стоимость владения, функциональность, простота для сотрудников, скорость внедрения, безопасность данных.<\/p>\n<\/blockquote>\n<p><strong>Задание № 1.<\/strong> Определите веса критериев от имени директора по финансам и от имени ИТ-директора. Сравните результат.<\/p>\n<div class=\"widget\" data-w=\"mca-pz6\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-6-a1\" data-label=\"Как меняется решение при разных весах; какой вариант устойчиво лучший\">\n\n<\/div>\n<p><strong>Задание № 2.<\/strong> Объясните, почему СППР не заменяет руководителя и какие ограничения есть у метода взвешенной суммы.<\/p>\n<div class=\"answer\" data-key=\"pz-6-a2\" data-label=\"Роль человека в СППР и ограничения метода\">\n\n<\/div>\n<h2>4. Занятие 2. Кейс: прогноз оттока клиентов<\/h2>\n<blockquote>\n<p>Интернет-провайдер построил модель классификации «уйдёт клиент в следующем месяце / не уйдёт». На тестовой выборке из 1000 клиентов модель дала результаты, показанные в матрице ошибок ниже.<\/p>\n<\/blockquote>\n<p><strong>Задание № 3.<\/strong> Рассчитайте метрики качества и интерпретируйте их. Поменяйте значения матрицы и посмотрите, как меняются метрики.<\/p>\n<div class=\"widget\" data-w=\"cm\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-6-a3\" data-label=\"Интерпретация accuracy, precision, recall, F1; достаточно ли качество модели для бизнеса\">\n\n<\/div>\n<p><strong>Задание № 4.<\/strong> Отделу удержания дешевле позвонить лишнему клиенту, чем потерять уходящего. Какую метрику важнее повышать — precision или recall? Почему?<\/p>\n<div class=\"answer\" data-key=\"pz-6-a4\" data-label=\"Выбор приоритетной метрики с обоснованием\">\n\n<\/div>\n<p><strong>Задание № 5.<\/strong> Сформулируйте рекомендации менеджменту: какие действия предпринять для клиентов из группы риска, как измерить эффект.<\/p>\n<div class=\"answer\" data-key=\"pz-6-a5\" data-label=\"Рекомендации для принятия решений\">\n\n<\/div>\n<p><strong>Задание № 6.<\/strong> Для каждой задачи укажите метод Data Mining: сегментация клиентов для таргетированной рекламы; анализ рыночной корзины; оценка кредитного риска; прогноз объёма продаж.<\/p>\n<div class=\"answer\" data-key=\"pz-6-a6\" data-label=\"Соответствие задач и методов Data Mining\">\n\n<\/div>\n<h2>5. Обсуждение<\/h2>\n<ol type=\"1\">\n<li>Этические аспекты Data Mining: персональные данные, дискриминация.<\/li>\n<li>Тренды СППР: большие данные, ИИ, облака.<\/li>\n<\/ol>\n<h2>6. Дополнительные задания<\/h2>\n<ul>\n<li>Найти пример применения Data Mining в реальной компании.<\/li>\n<li>Сравнить два метода Data Mining для одной задачи.<\/li>\n<\/ul>\n"}, {"id": "pz-7", "kind": "pz", "num": 7, "lec": 11, "title": "Моделирование и мультиагентные системы", "html": "<div class=\"meta\">\n<p>\n4 академических часа (2 занятия)\n<\/p>\n<p>\nМоделирование, групповая работа\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Цель занятия<\/h2>\n<p>Познакомиться с концепцией мультиагентных систем (МАС), их принципами, архитектурой и областями применения; научиться описывать агентов, их цели и взаимодействие и оценивать преимущества и ограничения МАС.<\/p>\n<h2>2. Краткая теория<\/h2>\n<p><strong>Моделирование<\/strong> — исследование объекта на его модели. Виды имитационного моделирования: системная динамика (потоки и накопители), дискретно-событийное (очереди, процессы), <strong>агентное<\/strong> (поведение множества самостоятельных участников).<\/p>\n<p><strong>Агент<\/strong> — программная (или физическая) сущность, которая воспринимает среду, действует самостоятельно и стремится к своей цели. Свойства агента: <em>автономность<\/em> (действует без постоянного управления), <em>реактивность<\/em> (реагирует на изменения среды), <em>проактивность<\/em> (сам проявляет инициативу ради цели), <em>социальность<\/em> (взаимодействует с другими агентами).<\/p>\n<p><strong>Мультиагентная система (МАС)<\/strong> — система из множества взаимодействующих агентов, решающих задачу, которую трудно решить одному агенту или централизованной программе.<\/p>\n<p>Типы агентов: реактивные (правило «условие → действие»), обучающиеся, целенаправленные (BDI — убеждения, желания, намерения). Формы взаимодействия: кооперация, конкуренция, переговоры (аукционы, протокол Contract Net).<\/p>\n<p>Инструменты: AnyLogic, NetLogo, Mesa (Python), JADE (Java).<\/p>\n<h2>3. Занятие 1. Агенты вокруг нас<\/h2>\n<p><strong>Задание № 1.<\/strong> Приведите три примера МАС из жизни и техники (рой дронов, роботы на складе, торговые роботы на бирже, управление светофорами, беспилотные автомобили). Для каждого укажите агентов, их цели и способ взаимодействия.<\/p>\n<div class=\"answer\" data-key=\"pz-7-a1\" data-label=\"Три примера МАС: агенты, цели, взаимодействие\">\n\n<\/div>\n<p><strong>Задание № 2.<\/strong> Сравните централизованное управление и МАС на примере диспетчеризации такси: надёжность, масштабируемость, скорость реакции, сложность.<\/p>\n<div class=\"answer\" data-key=\"pz-7-a2\" data-label=\"Сравнение централизованного подхода и МАС\">\n\n<\/div>\n<h2>4. Занятие 2. Проект модели: склад интернет-магазина<\/h2>\n<blockquote>\n<p>На складе работают 20 роботов-сборщиков. Заказы поступают неравномерно; роботы должны распределять задания, объезжать друг друга, вовремя заряжаться. Цель — собрать заказ за 15 минут.<\/p>\n<\/blockquote>\n<h4>Описание агентов<\/h4>\n<p>\nТипы агентов (робот, заказ, зарядная станция, диспетчер) и их цели\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-7-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nЧто воспринимает каждый агент (датчики, сообщения)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-7-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nДействия агентов и правила поведения\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-7-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nПротокол взаимодействия: как распределяются заказы (например, аукцион)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-7-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p><strong>Задание № 3.<\/strong> Какие показатели вы будете измерять в модели (среднее время сборки, загрузка роботов, очередь к зарядке) и какие эксперименты проведёте («что если роботов 15, а не 20?»)?<\/p>\n<div class=\"answer\" data-key=\"pz-7-a3\" data-label=\"Показатели модели и план экспериментов\">\n\n<\/div>\n<p><strong>Задание № 4.<\/strong> Оцените преимущества и ограничения МАС для этого склада.<\/p>\n<div class=\"answer\" data-key=\"pz-7-a4\" data-label=\"Преимущества и ограничения МАС\">\n\n<\/div>\n<h2>5. Обсуждение<\/h2>\n<ol type=\"1\">\n<li>Где МАС уже применяются в Кыргызстане или могут применяться?<\/li>\n<li>Как МАС связаны с ИИ и интернетом вещей?<\/li>\n<\/ol>\n<h2>6. Дополнительные задания<\/h2>\n<ul>\n<li>Запустить готовую модель в NetLogo (например, «Wolf Sheep Predation») и описать агентов и правила.<\/li>\n<li>Реферат о применении МАС в логистике или энергетике.<\/li>\n<\/ul>\n"}, {"id": "pz-8", "kind": "pz", "num": 8, "lec": 11, "title": "Машинное обучение", "html": "<div class=\"meta\">\n<p>\n4 академических часа (занятия 8–9)\n<\/p>\n<p>\nРасчётная работа, кейс\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Цель занятия<\/h2>\n<p>Закрепить основные понятия машинного обучения; научиться ставить задачу ML, выбирать вид обучения и алгоритм, строить простую регрессионную модель прогноза и оценивать её качество.<\/p>\n<h2>2. План занятий<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Этап<\/th>\n<th>Содержание<\/th>\n<th>Время<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Повторение: виды обучения, задачи, алгоритмы, метрики<\/td>\n<td>20 мин<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Постановка задач ML для бизнес-ситуаций<\/td>\n<td>25 мин<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Модель прогноза продаж: линейная регрессия<\/td>\n<td>60 мин<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>Кейс: прогноз спроса в интернет-магазине<\/td>\n<td>45 мин<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5<\/td>\n<td>Подведение итогов<\/td>\n<td>30 мин<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Задание № 1. Постановка задач<\/h2>\n<p>Для каждой ситуации определите вид обучения (с учителем / без учителя / с подкреплением), тип задачи (регрессия / классификация / кластеризация) и возможный алгоритм:<\/p>\n<p>(а) банк решает, выдать ли кредит; (б) магазин делит покупателей на группы; (в) такси-сервис прогнозирует время поездки; (г) почта отделяет спам; (д) программа учится играть в шахматы; (е) завод выявляет нетипичную вибрацию станка.<\/p>\n<div class=\"answer\" data-key=\"pz-8-a1\" data-label=\"Вид обучения, тип задачи и алгоритм для ситуаций а–е\">\n\n<\/div>\n<h2>4. Задание № 2. Модель прогноза продаж<\/h2>\n<p>Магазин записывал расходы на рекламу (<em>x<\/em>, тыс. сомов) и продажи (<em>y<\/em>, тыс. сомов) за 8 месяцев. Модель строит линейную регрессию <em>y = a + b·x<\/em> методом наименьших квадратов.<\/p>\n<div class=\"widget\" data-w=\"linreg\">\n\n<\/div>\n<p><strong>2.1.<\/strong> Запишите полученное уравнение и объясните смысл коэффициентов <em>a<\/em> и <em>b<\/em>.<\/p>\n<div class=\"answer\" data-key=\"pz-8-a2\" data-label=\"Уравнение регрессии и смысл коэффициентов\">\n\n<\/div>\n<p><strong>2.2.<\/strong> Оцените качество модели по R², MAE и RMSE. Можно ли доверять прогнозу?<\/p>\n<div class=\"answer\" data-key=\"pz-8-a3\" data-label=\"Оценка качества модели\">\n\n<\/div>\n<p><strong>2.3.<\/strong> Добавьте в данные «выброс» (например, месяц с праздником: реклама 20, продажи 400). Как изменились коэффициенты и метрики? Что это говорит о подготовке данных?<\/p>\n<div class=\"answer\" data-key=\"pz-8-a4\" data-label=\"Влияние выброса на модель\">\n\n<\/div>\n<p><strong>2.4.<\/strong> Сделайте прогноз продаж при расходах на рекламу 45 тыс. сомов. Почему опасно прогнозировать далеко за пределами имеющихся данных (например, при 200 тыс.)?<\/p>\n<div class=\"answer\" data-key=\"pz-8-a5\" data-label=\"Прогноз и ограничения экстраполяции\">\n\n<\/div>\n<h2>5. Задание № 3. Кейс: прогноз спроса<\/h2>\n<blockquote>\n<p>Интернет-магазин хочет прогнозировать спрос на товары в следующем месяце, чтобы не допускать дефицита и излишков на складе.<\/p>\n<\/blockquote>\n<p>\nКакие данные нужны (история продаж, сезонность, цены, скидки, праздники, погода)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-8-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nВид обучения и тип задачи\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-8-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nАлгоритмы-кандидаты (линейная регрессия, дерево решений, градиентный бустинг)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-8-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nКак разделить данные и оценить точность (MAE, RMSE)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-8-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nКак модель будет использоваться в бизнесе и кто отвечает за её обновление\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-8-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>6. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Что такое обучающая и тестовая выборки и зачем их разделять?<\/li>\n<li>Что такое переобучение и как его обнаружить?<\/li>\n<li>Чем MAE отличается от RMSE?<\/li>\n<\/ol>\n<h2>7. Дополнительные задания<\/h2>\n<ul>\n<li>Повторить расчёт регрессии в Excel (функции НАКЛОН, ОТРЕЗОК, КВПИРСОН) или в Python (scikit-learn) и сравнить результаты.<\/li>\n<li>Пройти бесплатный курс Kaggle Learn «Intro to Machine Learning».<\/li>\n<\/ul>\n", "label": "8–9"}, {"id": "pz-9", "kind": "pz", "num": 9, "lec": 13, "title": "Виртуальная и дополненная реальность (VR/AR)", "html": "<div class=\"meta\">\n<p>\n4 академических часа (занятия 10–11)\n<\/p>\n<p>\nПроектирование решения\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Цель занятия<\/h2>\n<p>Закрепить знания о технологиях VR, AR и MR; научиться выбирать технологию под задачу, проектировать концепцию XR-приложения и оценивать его выгоды и риски.<\/p>\n<h2>2. План занятий<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Этап<\/th>\n<th>Содержание<\/th>\n<th>Время<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Демонстрация и опыт: AR-приложения на смартфоне, VR-видео 360°<\/td>\n<td>30 мин<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Сравнение технологий и областей применения<\/td>\n<td>30 мин<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Проект AR-приложения для мебельного магазина<\/td>\n<td>75 мин<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>Презентация проектов<\/td>\n<td>45 мин<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Задание № 1. Опыт пользователя<\/h2>\n<p>Попробуйте одно AR-приложение (примерка мебели, переводчик через камеру, AR-фильтр) и одно VR-видео 360°. Опишите впечатления: удобство, реалистичность, ограничения.<\/p>\n<div class=\"answer\" data-key=\"pz-9-a1\" data-label=\"Описание опыта использования AR и VR\">\n\n<\/div>\n<h2>4. Задание № 2. Выбор технологии<\/h2>\n<p>Для каждой задачи выберите VR, AR или MR и обоснуйте: (а) обучение пожарных действиям в задымлённом здании; (б) инструкция по ремонту станка поверх оборудования; (в) экскурсия по историческому Узгену для иностранных туристов; (г) примерка очков в интернет-магазине; (д) совместная работа инженеров с 3D-моделью ГЭС.<\/p>\n<div class=\"answer\" data-key=\"pz-9-a2\" data-label=\"Выбор технологии для задач а–д с обоснованием\">\n\n<\/div>\n<h2>5. Задание № 3. Проект: AR-приложение для мебельного магазина<\/h2>\n<blockquote>\n<p>Сеть мебельных магазинов хочет, чтобы клиенты «примеряли» мебель у себя дома через смартфон и сразу оформляли заказ.<\/p>\n<\/blockquote>\n<p><strong>3.1.<\/strong> Сравните варианты реализации по критериям.<\/p>\n<div class=\"widget\" data-w=\"mca-pz9\">\n\n<\/div>\n<p><strong>3.2.<\/strong> Разработайте концепцию приложения.<\/p>\n<p>\nЦелевая аудитория и сценарий использования (шаги пользователя)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-9-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nФункции приложения (каталог 3D-моделей, размещение в масштабе, смена цвета, корзина)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-9-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nТехнологии и оборудование (ARKit, ARCore, Unity, 3D-моделирование)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-9-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nПреимущества для клиентов и компании; показатели успеха\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-9-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nРиски (стоимость, точность наложения, совместимость смартфонов) и меры\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-9-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>6. Задание № 4. VR в образовании<\/h2>\n<p>Предложите VR-лабораторию для одной дисциплины вашего направления: что будет моделироваться, какое оборудование нужно, чем это лучше обычного занятия.<\/p>\n<div class=\"answer\" data-key=\"pz-9-a3\" data-label=\"Концепция VR-лаборатории\">\n\n<\/div>\n<h2>7. Вопросы для обсуждения<\/h2>\n<ol type=\"1\">\n<li>Какие вызовы сдерживают массовое распространение VR?<\/li>\n<li>Заменят ли AR-очки смартфоны?<\/li>\n<li>Какие риски приватности несут AR-устройства?<\/li>\n<\/ol>\n", "label": "10–11"}, {"id": "pz-10", "kind": "pz", "num": 10, "lec": 14, "title": "Цифровой маркетинг и аналитика", "html": "<div class=\"meta\">\n<p>\n4 академических часа (занятия 12–13)\n<\/p>\n<p>\nРасчётная работа, разработка стратегии\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Цель занятия<\/h2>\n<p>Научиться анализировать эффективность цифровых рекламных каналов по ключевым показателям, разрабатывать стратегию продвижения для малого бизнеса и выбирать инструменты аналитики.<\/p>\n<h2>2. План занятий<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Этап<\/th>\n<th>Содержание<\/th>\n<th>Время<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Повторение: каналы, воронка, KPI<\/td>\n<td>20 мин<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Анализ эффективности трёх каналов<\/td>\n<td>50 мин<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Стратегия продвижения для кафе<\/td>\n<td>70 мин<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>Защита стратегий<\/td>\n<td>40 мин<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Задание № 1. Сравнение рекламных каналов<\/h2>\n<p>Магазин спортивной одежды провёл месячную кампанию в трёх каналах. Модель рассчитывает CTR, CPC, CR, CPA и ROI для каждого канала. Данные можно изменить.<\/p>\n<div class=\"widget\" data-w=\"mkt-pz10\">\n\n<\/div>\n<p><strong>1.1.<\/strong> Какой канал наиболее эффективен по ROI, а какой — по стоимости привлечения клиента (CPA)? Совпадают ли выводы?<\/p>\n<div class=\"answer\" data-key=\"pz-10-a1\" data-label=\"Сравнение каналов по ROI и CPA\">\n\n<\/div>\n<p><strong>1.2.<\/strong> Как перераспределить бюджет 60 000 сомов на следующий месяц? Обоснуйте.<\/p>\n<div class=\"answer\" data-key=\"pz-10-a2\" data-label=\"Перераспределение бюджета с обоснованием\">\n\n<\/div>\n<p><strong>1.3.<\/strong> Почему высокий CTR ещё не означает эффективную рекламу?<\/p>\n<div class=\"answer\" data-key=\"pz-10-a3\" data-label=\"Связь CTR и конечного результата\">\n\n<\/div>\n<h2>4. Задание № 2. Стратегия продвижения кафе<\/h2>\n<blockquote>\n<p>Небольшое кафе рядом с университетом хочет увеличить число посетителей через социальные сети и онлайн-рекламу. Бюджет — 25 000 сомов в месяц.<\/p>\n<\/blockquote>\n<p>\nЦели по SMART (что, сколько, к какому сроку)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nЦелевая аудитория (портрет клиента)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nКаналы продвижения и их роль\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nКонтент-план на неделю (форматы и темы публикаций)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nИнструменты аналитики (Google Analytics, Meta Business Suite, UTM-метки)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nKPI и их целевые значения (CTR, CPA, вовлечённость, число заказов)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-10-f6\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>5. Задание № 3. A/B-тест<\/h2>\n<p>Предложите A/B-тест для рекламного объявления кафе: что будет различаться в вариантах, на какой метрике принимается решение, сколько времени длится тест.<\/p>\n<div class=\"answer\" data-key=\"pz-10-a4\" data-label=\"План A/B-теста\">\n\n<\/div>\n<h2>6. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Как связаны CPC, CR и CPA?<\/li>\n<li>Чем ROI отличается от ROAS?<\/li>\n<li>Зачем нужны UTM-метки?<\/li>\n<\/ol>\n", "label": "12–13"}, {"id": "pz-11", "kind": "pz", "num": 11, "lec": 15, "title": "Цифровая трансформация бизнеса", "html": "<div class=\"meta\">\n<p>\n4 академических часа (занятия 14–15)\n<\/p>\n<p>\nИтоговый групповой проект\n<\/p>\n<p>\nОК-1, ПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>1. Цель занятия<\/h2>\n<p>Обобщить знания курса: оценить цифровую зрелость организации, разработать стратегию и дорожную карту её цифровой трансформации, оценить экономический эффект и риски.<\/p>\n<h2>2. Порядок работы<\/h2>\n<ol type=\"1\">\n<li>Группа выбирает организацию: реальную (магазин, банк, вуз, аптека, логистическая компания) или условную.<\/li>\n<li>Оценивает её цифровую зрелость.<\/li>\n<li>Определяет цели и выбирает технологии.<\/li>\n<li>Разрабатывает дорожную карту и оценивает эффект.<\/li>\n<li>Представляет стратегию и отвечает на вопросы (защита — 10 минут на группу).<\/li>\n<\/ol>\n<h2>3. Задание № 1. Организация<\/h2>\n<p>\nНазвание и сфера деятельности организации, масштаб\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f1\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nКлючевые проблемы и вызовы рынка\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f2\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>4. Задание № 2. Оценка цифровой зрелости<\/h2>\n<p>Оцените организацию по шести измерениям (1 — начальный, 5 — трансформационный уровень).<\/p>\n<div class=\"widget\" data-w=\"maturity\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-11-a1\" data-label=\"Интерпретация: сильные стороны и приоритетные зоны развития\">\n\n<\/div>\n<h2>5. Задание № 3. Стратегия и дорожная карта<\/h2>\n<p>\nЦели трансформации и KPI (на 1–2 года)\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f3\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nВыбранные технологии и проекты (не менее трёх) с привязкой к проблемам\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f4\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nЭтапы: оценка, пилот, масштабирование, обучение персонала — со сроками\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f5\" rows=\"3\"><\/textarea>\n<\/p>\n<p>\nНеобходимые ресурсы: бюджет, специалисты, партнёры\n<\/p>\n<p>\n<textarea class=\"fld\" data-save=\"1\" id=\"pz-11-f6\" rows=\"3\"><\/textarea>\n<\/p>\n<h2>6. Задание № 4. Экономический эффект<\/h2>\n<p>Оцените ключевой проект по чистой приведённой стоимости (NPV). Подставьте свои оценки инвестиций, выгод и затрат.<\/p>\n<div class=\"widget\" data-w=\"npv5\">\n\n<\/div>\n<div class=\"answer\" data-key=\"pz-11-a2\" data-label=\"Вывод об экономической целесообразности проекта\">\n\n<\/div>\n<h2>7. Задание № 5. Риски и управление изменениями<\/h2>\n<p>Определите не менее четырёх рисков (технологические, финансовые, кадровые, безопасность) и меры по их снижению. Как вы будете преодолевать сопротивление сотрудников?<\/p>\n<div class=\"answer\" data-key=\"pz-11-a3\" data-label=\"Риски, меры, управление изменениями\">\n\n<\/div>\n<h2>8. Критерии оценки проекта<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Критерий<\/th>\n<th>Баллы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Обоснованная оценка цифровой зрелости<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Связь целей, проблем и технологий<\/td>\n<td>3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Реалистичная дорожная карта<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Расчёт эффекта<\/td>\n<td>2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Анализ рисков и защита<\/td>\n<td>1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n", "label": "14–15"}, {"id": "srs-0", "kind": "srs", "num": 0, "lec": 0, "title": "Самостоятельная работа студентов: общие положения", "html": "<div class=\"meta\">\n<p>\n60 часов СРС\n<\/p>\n<p>\nВходит в текущий контроль — 30 баллов\n<\/p>\n<\/div>\n<h2>1. Назначение<\/h2>\n<p>Самостоятельная работа студентов (СРС) закрепляет материал лекций и практических занятий, развивает навыки анализа, поиска информации и выработки решений. В учебнике СРС построена на <strong>восьми прикладных кейсах<\/strong> по темам второго модуля (лекции 8–15). Каждый кейс — ситуация из практики организации и четыре задания.<\/p>\n<h2>2. Виды самостоятельной работы по дисциплине<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Вид<\/th>\n<th>Содержание<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Изучение теории<\/td>\n<td>Конспект лекций, литература, онлайн-курсы (Coursera, Microsoft Learn, Google Digital Garage, Kaggle Learn)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Задания к лекциям<\/td>\n<td>Раздел «Задания для самостоятельной работы» в конце каждой лекции<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Кейсы СРС<\/td>\n<td>Восемь кейсов этого раздела с отчётом<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Самопроверка<\/td>\n<td>Тесты по уровням Блума в разделе «Контроль»<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Подготовка к модулям<\/td>\n<td>Тест модуля 1 и контрольные вопросы модуля 2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Требования к выполнению кейса<\/h2>\n<ol type=\"1\">\n<li>Прочитайте связанную лекцию (ссылка в шапке кейса).<\/li>\n<li>Ответ на каждое задание набирайте сами, своими словами. Вставка текста в поля отключена.<\/li>\n<li>Ответ должен содержать: анализ ситуации, конкретное решение (технологии, шаги, сроки), обоснование, ожидаемые показатели.<\/li>\n<li>Объём ответа на одно задание — не менее 5–7 предложений.<\/li>\n<li>Отметьте «Выполнено» и сдайте отчёт в разделе «Сдача».<\/li>\n<\/ol>\n<h2>4. Критерии оценки кейса<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Критерий<\/th>\n<th>Баллы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Анализ ситуации и причин проблемы<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Конкретность и реализуемость решения<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Обоснованный выбор технологий<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Измеримые результаты (KPI, расчёт)<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Самостоятельность и грамотность изложения<\/td>\n<td>1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>Итого за кейс<\/strong><\/td>\n<td><strong>5<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. График<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Кейс<\/th>\n<th>Тема<\/th>\n<th>Срок сдачи<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>СРС-1<\/td>\n<td>Оптимизация бизнес-процесса<\/td>\n<td>неделя 9<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>СРС-2<\/td>\n<td>Утечка данных<\/td>\n<td>неделя 10<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>СРС-3<\/td>\n<td>Переход в облако<\/td>\n<td>неделя 11<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>СРС-4<\/td>\n<td>Прогноз продаж<\/td>\n<td>неделя 12<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>СРС-5<\/td>\n<td>Умное освещение<\/td>\n<td>неделя 13<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>СРС-6<\/td>\n<td>AR в рознице<\/td>\n<td>неделя 14<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>СРС-7<\/td>\n<td>Маркетинг кафе<\/td>\n<td>неделя 15<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>СРС-8<\/td>\n<td>Трансформация логистики<\/td>\n<td>неделя 16<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Конкретные сроки уточняет преподаватель.<\/p>\n"}, {"id": "srs-1", "kind": "srs", "num": 1, "lec": 8, "title": "Оптимизация бизнес-процесса в компании-производителе", "html": "<div class=\"meta\">\n<p>\nКейс к лекции 8\n<\/p>\n<p>\n5 баллов\n<\/p>\n<\/div>\n<h2>Ситуация<\/h2>\n<p>Компания выпускает бытовую технику (300 сотрудников). Заказы дилеров поступают по электронной почте и телефону, менеджер вручную проверяет наличие комплектующих на складе и уточняет сроки у производства. Средний срок обработки заявки — 4 рабочих дня, у конкурентов — 1 день. Компания теряет заказы.<\/p>\n<h2>Задания<\/h2>\n<p><strong>1.<\/strong> Составьте карту текущего бизнес-процесса обработки заказа (AS-IS): участники, шаги, документы.<\/p>\n<div class=\"answer\" data-key=\"srs-1-a1\" data-label=\"Карта текущего процесса AS-IS\">\n\n<\/div>\n<p><strong>2.<\/strong> Определите «узкие места» процесса и их причины.<\/p>\n<div class=\"answer\" data-key=\"srs-1-a2\" data-label=\"Узкие места и их причины\">\n\n<\/div>\n<p><strong>3.<\/strong> Предложите целевой процесс (TO-BE) и цифровую стратегию оптимизации; опишите его в терминах BPMN (события, задачи, шлюзы, дорожки).<\/p>\n<div class=\"answer\" data-key=\"srs-1-a3\" data-label=\"Целевой процесс TO-BE в терминах BPMN\">\n\n<\/div>\n<p><strong>4.<\/strong> Выберите технологии (ERP, CRM, дилерский портал) и обоснуйте выбор. Какой срок обработки заявки будет целевым?<\/p>\n<div class=\"answer\" data-key=\"srs-1-a4\" data-label=\"Выбор технологий и целевые показатели\">\n\n<\/div>\n"}, {"id": "srs-2", "kind": "srs", "num": 2, "lec": 9, "title": "Утечка данных в розничной сети", "html": "<div class=\"meta\">\n<p>\nКейс к лекции 9\n<\/p>\n<p>\n5 баллов\n<\/p>\n<\/div>\n<h2>Ситуация<\/h2>\n<p>В розничной сети (40 магазинов) произошла утечка персональных данных 60 000 участников программы лояльности: имена, телефоны, история покупок. Данные появились в продаже в интернете. Известно, что у сотрудников общие пароли к базе, данные не шифруются, а один из менеджеров накануне получил письмо «от ИТ-отдела» с просьбой подтвердить пароль.<\/p>\n<h2>Задания<\/h2>\n<p><strong>1.<\/strong> Проанализируйте возможные причины утечки: человеческий фактор, технические и организационные недостатки.<\/p>\n<div class=\"answer\" data-key=\"srs-2-a1\" data-label=\"Анализ причин утечки\">\n\n<\/div>\n<p><strong>2.<\/strong> Предложите план реагирования и восстановления безопасности (первые 72 часа и следующие 3 месяца).<\/p>\n<div class=\"answer\" data-key=\"srs-2-a2\" data-label=\"План реагирования и восстановления\">\n\n<\/div>\n<p><strong>3.<\/strong> Разработайте технические меры предотвращения (шифрование, MFA, разграничение доступа, журналирование, резервирование).<\/p>\n<div class=\"answer\" data-key=\"srs-2-a3\" data-label=\"Технические меры защиты\">\n\n<\/div>\n<p><strong>4.<\/strong> Определите организационные и правовые меры (политика безопасности, обучение, ответственный за защиту данных, уведомление клиентов и уполномоченного органа).<\/p>\n<div class=\"answer\" data-key=\"srs-2-a4\" data-label=\"Организационные и правовые меры\">\n\n<\/div>\n"}, {"id": "srs-3", "kind": "srs", "num": 3, "lec": 10, "title": "Переход компании на облачные технологии", "html": "<div class=\"meta\">\n<p>\nКейс к лекции 10\n<\/p>\n<p>\n5 баллов\n<\/p>\n<\/div>\n<h2>Ситуация<\/h2>\n<p>Туристическое агентство (25 сотрудников, 3 офиса) хранит документы на одном офисном компьютере, клиентскую базу — в Excel, бухгалтерию — в локальной программе. Компания переходит на гибридный режим работы, сотрудникам нужен доступ к данным из дома и в поездках.<\/p>\n<h2>Задания<\/h2>\n<p><strong>1.<\/strong> Определите, какие данные и процессы можно перенести в облако, а какие лучше оставить локально. Обоснуйте.<\/p>\n<div class=\"answer\" data-key=\"srs-3-a1\" data-label=\"Данные и процессы для переноса в облако\">\n\n<\/div>\n<p><strong>2.<\/strong> Выберите облачные сервисы и модели (SaaS, PaaS, IaaS) — например, Google Workspace, Microsoft 365, облачная CRM, облачная бухгалтерия.<\/p>\n<div class=\"answer\" data-key=\"srs-3-a2\" data-label=\"Выбор сервисов и моделей с обоснованием\">\n\n<\/div>\n<p><strong>3.<\/strong> Разработайте поэтапный план перехода (сроки, ответственные, обучение).<\/p>\n<div class=\"answer\" data-key=\"srs-3-a3\" data-label=\"План поэтапного перехода\">\n\n<\/div>\n<p><strong>4.<\/strong> Укажите меры безопасности и оцените ежемесячные затраты на облачные сервисы.<\/p>\n<div class=\"answer\" data-key=\"srs-3-a4\" data-label=\"Меры безопасности и оценка затрат\">\n\n<\/div>\n"}, {"id": "srs-4", "kind": "srs", "num": 4, "lec": 11, "title": "Прогнозирование продаж в интернет-магазине", "html": "<div class=\"meta\">\n<p>\nКейс к лекции 11\n<\/p>\n<p>\n5 баллов\n<\/p>\n<\/div>\n<h2>Ситуация<\/h2>\n<p>Интернет-магазин детских товаров хочет прогнозировать спрос на каждый товар на следующий месяц. Сейчас закупки делаются «на глаз»: часть товаров заканчивается к праздникам, другие лежат на складе по полгода. Есть история продаж за три года.<\/p>\n<h2>Задания<\/h2>\n<p><strong>1.<\/strong> Определите, какие данные нужны для модели (история продаж, сезонность, праздники, цены и скидки, реклама, остатки).<\/p>\n<div class=\"answer\" data-key=\"srs-4-a1\" data-label=\"Необходимые данные и их источники\">\n\n<\/div>\n<p><strong>2.<\/strong> Определите вид обучения и тип задачи; объясните выбор.<\/p>\n<div class=\"answer\" data-key=\"srs-4-a2\" data-label=\"Вид обучения и тип задачи\">\n\n<\/div>\n<p><strong>3.<\/strong> Предложите алгоритмы (линейная регрессия, дерево решений, градиентный бустинг) и порядок построения модели.<\/p>\n<div class=\"answer\" data-key=\"srs-4-a3\" data-label=\"Алгоритмы и этапы построения модели\">\n\n<\/div>\n<p><strong>4.<\/strong> Опишите, как вы будете оценивать точность модели (MAE, RMSE, проверка на последних месяцах) и как прогноз будет использоваться при закупках.<\/p>\n<div class=\"answer\" data-key=\"srs-4-a4\" data-label=\"Оценка точности и использование прогноза\">\n\n<\/div>\n"}, {"id": "srs-5", "kind": "srs", "num": 5, "lec": 12, "title": "Умное освещение в офисе", "html": "<div class=\"meta\">\n<p>\nКейс к лекции 12\n<\/p>\n<p>\n5 баллов\n<\/p>\n<\/div>\n<h2>Ситуация<\/h2>\n<p>Бизнес-центр (4 этажа, 160 светильников) хочет снизить расходы на электроэнергию. Освещение горит весь рабочий день, а в коридорах и переговорных — часто и ночью.<\/p>\n<h2>Задания<\/h2>\n<p><strong>1.<\/strong> Разработайте концепцию IoT-системы управления освещением.<\/p>\n<div class=\"answer\" data-key=\"srs-5-a1\" data-label=\"Концепция IoT-системы\">\n\n<\/div>\n<p><strong>2.<\/strong> Укажите, какие датчики и протоколы связи будут использоваться (датчики движения и освещённости, Zigbee, Z-Wave, Wi-Fi), и обоснуйте выбор.<\/p>\n<div class=\"answer\" data-key=\"srs-5-a2\" data-label=\"Датчики и протоколы связи\">\n\n<\/div>\n<p><strong>3.<\/strong> Опишите, как данные будут передаваться, обрабатываться и использоваться для автоматизации (сценарии, расписания, отчёты).<\/p>\n<div class=\"answer\" data-key=\"srs-5-a3\" data-label=\"Передача, обработка данных и сценарии автоматизации\">\n\n<\/div>\n<p><strong>4.<\/strong> Рассчитайте предполагаемую экономию и срок окупаемости в калькуляторе, подставив данные бизнес-центра.<\/p>\n<div class=\"widget\" data-w=\"iot-srs\">\n\n<\/div>\n<div class=\"answer\" data-key=\"srs-5-a4\" data-label=\"Расчёт экономии и вывод\">\n\n<\/div>\n"}, {"id": "srs-6", "kind": "srs", "num": 6, "lec": 13, "title": "Использование AR в розничной торговле", "html": "<div class=\"meta\">\n<p>\nКейс к лекции 13\n<\/p>\n<p>\n5 баллов\n<\/p>\n<\/div>\n<h2>Ситуация<\/h2>\n<p>Сеть магазинов мебели хочет внедрить AR-приложение, чтобы клиенты могли «примерять» мебель в своих домах. Сейчас около 12 % покупок возвращается: мебель не подошла по размеру или цвету.<\/p>\n<h2>Задания<\/h2>\n<p><strong>1.<\/strong> Разработайте концепцию приложения: функции, интерфейс, путь пользователя.<\/p>\n<div class=\"answer\" data-key=\"srs-6-a1\" data-label=\"Концепция приложения\">\n\n<\/div>\n<p><strong>2.<\/strong> Определите технологии и оборудование (ARKit, ARCore, Unity, 3D-модели, требования к смартфонам).<\/p>\n<div class=\"answer\" data-key=\"srs-6-a2\" data-label=\"Технологии и оборудование\">\n\n<\/div>\n<p><strong>3.<\/strong> Опишите преимущества для клиентов и компании и показатели, по которым будет оцениваться успех.<\/p>\n<div class=\"answer\" data-key=\"srs-6-a3\" data-label=\"Преимущества и показатели успеха\">\n\n<\/div>\n<p><strong>4.<\/strong> Рассмотрите риски (стоимость, точность наложения, совместимость, создание 3D-моделей каталога) и меры по их снижению.<\/p>\n<div class=\"answer\" data-key=\"srs-6-a4\" data-label=\"Риски и меры\">\n\n<\/div>\n"}, {"id": "srs-7", "kind": "srs", "num": 7, "lec": 14, "title": "Маркетинговая стратегия для кафе", "html": "<div class=\"meta\">\n<p>\nКейс к лекции 14\n<\/p>\n<p>\n5 баллов\n<\/p>\n<\/div>\n<h2>Ситуация<\/h2>\n<p>Небольшое кафе в Джалал-Абаде хочет увеличить поток гостей через социальные сети и онлайн-рекламу. У кафе есть страница в Instagram с 600 подписчиками, публикации нерегулярные, рекламу никогда не запускали.<\/p>\n<h2>Задания<\/h2>\n<p><strong>1.<\/strong> Определите целевую аудиторию кафе (сегменты, портрет гостя).<\/p>\n<div class=\"answer\" data-key=\"srs-7-a1\" data-label=\"Целевая аудитория\">\n\n<\/div>\n<p><strong>2.<\/strong> Разработайте стратегию продвижения: каналы, контент, реклама, акции.<\/p>\n<div class=\"answer\" data-key=\"srs-7-a2\" data-label=\"Стратегия продвижения\">\n\n<\/div>\n<p><strong>3.<\/strong> Укажите инструменты аналитики (Google Analytics, Meta Business Suite, UTM-метки) и что именно будет измеряться.<\/p>\n<div class=\"answer\" data-key=\"srs-7-a3\" data-label=\"Инструменты аналитики\">\n\n<\/div>\n<p><strong>4.<\/strong> Предложите KPI с целевыми значениями (CTR, CPA, вовлечённость, рост подписчиков, число заказов) и рассчитайте их для условного бюджета в калькуляторе.<\/p>\n<div class=\"widget\" data-w=\"mkt-srs\">\n\n<\/div>\n<div class=\"answer\" data-key=\"srs-7-a4\" data-label=\"KPI и выводы по расчёту\">\n\n<\/div>\n"}, {"id": "srs-8", "kind": "srs", "num": 8, "lec": 15, "title": "Цифровая трансформация логистической компании", "html": "<div class=\"meta\">\n<p>\nКейс к лекции 15\n<\/p>\n<p>\n5 баллов\n<\/p>\n<\/div>\n<h2>Ситуация<\/h2>\n<p>Логистическая компания (80 грузовиков) перевозит грузы между Бишкеком, Ошем и Джалал-Абадом. Маршруты рассчитываются диспетчером вручную, клиенты звонят, чтобы узнать, где груз, расход топлива растёт, часть рейсов идёт с неполной загрузкой.<\/p>\n<h2>Задания<\/h2>\n<p><strong>1.<\/strong> Проанализируйте текущие проблемы компании и их влияние на затраты и клиентов.<\/p>\n<div class=\"answer\" data-key=\"srs-8-a1\" data-label=\"Анализ проблем\">\n\n<\/div>\n<p><strong>2.<\/strong> Предложите цифровые решения (IoT-датчики и GPS, ML-прогноз и оптимизация маршрутов, клиентский портал отслеживания, электронные документы).<\/p>\n<div class=\"answer\" data-key=\"srs-8-a2\" data-label=\"Цифровые решения\">\n\n<\/div>\n<p><strong>3.<\/strong> Разработайте этапы внедрения технологий со сроками и ответственными.<\/p>\n<div class=\"answer\" data-key=\"srs-8-a3\" data-label=\"Этапы внедрения\">\n\n<\/div>\n<p><strong>4.<\/strong> Опишите ожидаемые результаты в цифрах (время доставки, расход топлива, загрузка машин, удовлетворённость клиентов) и способ их измерения.<\/p>\n<div class=\"answer\" data-key=\"srs-8-a4\" data-label=\"Ожидаемые результаты и их измерение\">\n\n<\/div>\n"}], "tests": {"levels": {"1": "Запоминание", "2": "Понимание", "3": "Применение", "4": "Анализ", "5": "Оценка"}, "qs": [{"n": 1, "m": "М1", "lvl": 1, "lec": 1, "q": "Что такое цифровизация?", "opts": ["Превращение информации в цифровой формат", "Использование только аналоговых данных", "Оцифровка документов", "Создание новых устройств"], "key": 0, "why": "Цифровизация — перевод информации в цифровую форму и её использование в процессах."}, {"n": 2, "m": "М1", "lvl": 2, "lec": 1, "q": "Какую роль выполняет цифровизация в современном бизнесе?", "opts": ["Упрощает доступ к данным", "Снижает конкурентоспособность", "Увеличивает потребность в аналоговой информации", "Исключает необходимость в новых технологиях"], "key": 0, "why": "Цифровые данные быстрее находятся, передаются и обрабатываются."}, {"n": 3, "m": "М1", "lvl": 1, "lec": 1, "q": "Что такое Индустрия 4.0?", "opts": ["Массовое производство аналоговых устройств", "Переход к цифровым технологиям в промышленности", "Создание только физических продуктов", "Использование бумажных документов"], "key": 1, "why": "Индустрия 4.0 — переход промышленности к «умному» производству на основе цифровых технологий."}, {"n": 4, "m": "М1", "lvl": 2, "lec": 1, "q": "Какой из следующих трендов относится к цифровизации?", "opts": ["Использование печатных документов", "Виртуальная реальность", "Телевизионные передачи", "Радиосигналы"], "key": 1, "why": "Виртуальная реальность — цифровая технология; печать, телевидение и радио — аналоговые каналы."}, {"n": 5, "m": "М1", "lvl": 2, "lec": 1, "q": "Основное преимущество цифровизации заключается в:", "opts": ["Увеличении затрат на производство", "Упрощении доступа к данным и их обработке", "Ограничении доступа к информации", "Снижении производительности"], "key": 1, "why": "Главный выигрыш — упрощение доступа к данным и их обработки."}, {"n": 6, "m": "М1", "lvl": 1, "lec": 1, "q": "Какой термин используется для описания полной цифровой трансформации компании?", "opts": ["Оцифровка", "Цифровизация", "Цифровая трансформация", "Диджитализация"], "key": 2, "why": "Полное изменение модели деятельности на основе цифровых технологий называют цифровой трансформацией."}, {"n": 7, "m": "М1", "lvl": 2, "lec": 1, "q": "Что делает цифровизация с бизнес-моделями?", "opts": ["Упрощает производство аналоговых товаров", "Приводит к созданию новых цифровых бизнес-моделей", "Увеличивает число сотрудников на производстве", "Снижает количество услуг"], "key": 1, "why": "Цифровизация порождает новые модели: платформы, подписку, freemium."}, {"n": 8, "m": "М1", "lvl": 2, "lec": 1, "q": "Какой из приведенных ниже примеров является примером цифрового продукта?", "opts": ["Электронная книга", "Брошюра", "Печатная книга", "Газета"], "key": 0, "why": "Электронная книга существует только в цифровом виде; остальные — печатные продукты."}, {"n": 9, "m": "М1", "lvl": 2, "lec": 1, "q": "Какой эффект оказывает цифровизация на конкурентоспособность компании?", "opts": ["Увеличивает количество сотрудников", "Повышает конкурентоспособность", "Снижает эффективность работы", "Увеличивает стоимость ресурсов"], "key": 1, "why": "Скорость, данные и автоматизация повышают конкурентоспособность."}, {"n": 10, "m": "М1", "lvl": 3, "lec": 1, "q": "Какая технология способствует улучшению клиентского опыта в цифровом бизнесе?", "opts": ["Графический интерфейс", "Большие данные", "Бумажные документы", "Аудиокассеты"], "key": 1, "why": "Большие данные позволяют персонализировать предложения и улучшать клиентский опыт."}, {"n": 11, "m": "М1", "lvl": 1, "lec": 2, "q": "Что такое центральный процессор (ЦП)?", "opts": ["Оперативная память", "Основной вычислительный блок компьютера", "Устройство вывода", "Графический процессор"], "key": 1, "why": "ЦП — основной вычислительный блок, выполняющий команды программ."}, {"n": 12, "m": "М1", "lvl": 1, "lec": 2, "q": "Какой из приведенных компонентов хранит данные на постоянной основе?", "opts": ["Оперативная память", "ЦП", "Жесткий диск", "Материнская плата"], "key": 2, "why": "Жёсткий диск хранит данные постоянно; оперативная память очищается при выключении."}, {"n": 13, "m": "М1", "lvl": 2, "lec": 2, "q": "Что относится
