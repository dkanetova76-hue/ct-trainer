2>7. Применение и тренды<\/h2>\n<ul>\n<li><strong>Продажи<\/strong> — дашборд выручки по регионам и менеджерам.<\/li>\n<li><strong>Маркетинг<\/strong> — визуализация воронки и эффективности каналов.<\/li>\n<li><strong>Финансы<\/strong> — динамика доходов и расходов, план-факт.<\/li>\n<li><strong>Производство<\/strong> — мониторинг загрузки оборудования и брака.<\/li>\n<\/ul>\n<p>Тренды: интерактивные и мобильные дашборды; аналитика на естественном языке (вопрос «какие продажи в марте?» — ответ графиком); расширенная аналитика с ИИ; аналитика в реальном времени.<\/p>\n<h2>8. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Найдите открытый набор данных (stat.gov.kg, Kaggle) и постройте в Excel три графика разных типов. Обоснуйте выбор каждого.<\/li>\n<li>Найдите пример неудачной визуализации в СМИ и объясните, какой принцип нарушен.<\/li>\n<\/ol>\n<h2>9. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Перечислите этапы анализа данных.<\/li>\n<li>Какой график выбрать для отображения долей, а какой — для динамики?<\/li>\n<li>Что показывает коэффициент корреляции?<\/li>\n<li>Почему ось столбчатой диаграммы должна начинаться с нуля?<\/li>\n<li>Чем Power BI отличается от Excel при работе с данными?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Анализ данных · описательный анализ · прогнозный анализ · среднее · медиана · стандартное отклонение · корреляция · гистограмма · диаграмма рассеяния · дашборд · Power BI · Tableau.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Кузнецов Д. И. Основы анализа данных и машинного обучения. — М. : ДМК Пресс, 2020.<\/li>\n<li>Официальный сайт Power BI. — powerbi.microsoft.com.<\/li>\n<li>Tableau Public. — public.tableau.com.<\/li>\n<\/ol>\n"}, {"id": "lec-6", "kind": "lec", "num": 6, "title": "Введение в интернет-технологии", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 1\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Сформировать представление об устройстве интернета, адресации и доменной системе, основных протоколах, принципах работы веб-приложений и базовых веб-технологиях — HTML, CSS и JavaScript.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Понятие интернет-технологий и их значение.<\/li>\n<li>Основные компоненты интернета: IP-адрес, DNS, URL.<\/li>\n<li>Клиент-серверная модель и работа браузера.<\/li>\n<li>Интернет-протоколы.<\/li>\n<li>Веб-технологии: HTML, CSS, JavaScript.<\/li>\n<li>Применение интернет-технологий в бизнесе, тренды.<\/li>\n<\/ol>\n<h2>1. Понятие интернет-технологий<\/h2>\n<p><strong>Интернет<\/strong> — глобальная сеть, объединяющая компьютерные сети по всему миру на основе единого стека протоколов TCP/IP.<\/p>\n<p><strong>Интернет-технологии<\/strong> — совокупность средств и протоколов, обеспечивающих передачу данных, работу веб-сайтов, сервисов и приложений в сети.<\/p>\n<p>Значение: коммуникации (почта, мессенджеры, видеосвязь); бизнес (электронная коммерция, цифровые платформы); информация (поиск, хранение, обмен); управление (облачные системы, удалённая работа, электронное правительство).<\/p>\n<h2>2. Основные компоненты интернета<\/h2>\n<p><strong>IP-адрес<\/strong> — уникальный числовой адрес устройства в сети. IPv4 записывается четырьмя числами от 0 до 255 (<code>192.168.1.10<\/code>) и даёт около 4,3 млрд адресов. IPv6 (<code>2001:0db8::1<\/code>) использует 128 бит и снимает проблему нехватки адресов.<\/p>\n<p><strong>DNS (Domain Name System)<\/strong> — система доменных имён, которая преобразует понятные человеку имена (<code>mnu.kg<\/code>) в IP-адреса. Домены образуют иерархию: корневой домен → домен верхнего уровня (<code>.kg<\/code>, <code>.com<\/code>) → домен второго уровня (<code>mnu.kg<\/code>) → поддомены.<\/p>\n<p><strong>URL (Uniform Resource Locator)<\/strong> — адрес ресурса в интернете.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Часть URL<\/th>\n<th>Пример<\/th>\n<th>Значение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Протокол (схема)<\/td>\n<td><code>https://<\/code><\/td>\n<td>Как передавать данные<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Доменное имя<\/td>\n<td><code>www.example.kg<\/code><\/td>\n<td>На каком сервере находится ресурс<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Порт (обычно не указывается)<\/td>\n<td><code>:443<\/code><\/td>\n<td>«Дверь» сервера для данного протокола<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Путь<\/td>\n<td><code>/catalog/books<\/code><\/td>\n<td>Где ресурс на сервере<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Параметры запроса<\/td>\n<td><code>?q=sql&amp;page=2<\/code><\/td>\n<td>Дополнительные данные<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Якорь<\/td>\n<td><code>#reviews<\/code><\/td>\n<td>Место на странице<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Другие компоненты<\/strong>: серверы (хранят сайты и предоставляют сервисы), клиенты (браузеры, приложения), маршрутизаторы и шлюзы (направляют данные между сетями), провайдеры (предоставляют доступ в интернет).<\/p>\n<h2>3. Клиент-серверная модель и работа браузера<\/h2>\n<p><strong>Клиент-серверная модель<\/strong> — архитектура, в которой сервер предоставляет ресурсы и услуги, а клиенты обращаются к нему с запросами. Альтернатива — одноранговые сети (P2P), где все участники равноправны.<\/p>\n<p><strong>Что происходит, когда вы вводите адрес сайта<\/strong><\/p>\n<ol type=\"1\">\n<li>Браузер разбирает URL и обращается к DNS, чтобы получить IP-адрес сервера.<\/li>\n<li>Устанавливается соединение TCP (для HTTPS — ещё и защищённое соединение TLS).<\/li>\n<li>Браузер отправляет HTTP-запрос (<code>GET /catalog<\/code>).<\/li>\n<li>Сервер обрабатывает запрос — часто обращаясь к базе данных — и возвращает ответ: код состояния (200 — успешно, 404 — не найдено, 500 — ошибка сервера) и содержимое — HTML, CSS, JavaScript, изображения.<\/li>\n<li>Браузер строит страницу и выполняет скрипты.<\/li>\n<\/ol>\n<p>Типичная схема веб-приложения: <strong>клиент (браузер) → веб-сервер → сервер приложений → база данных<\/strong>.<\/p>\n<h2>4. Интернет-протоколы<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Протокол<\/th>\n<th>Назначение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>IP<\/td>\n<td>Адресация и доставка пакетов между сетями<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TCP<\/td>\n<td>Надёжная передача с подтверждением и восстановлением потерь<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>UDP<\/td>\n<td>Быстрая передача без гарантий (видеозвонки, онлайн-игры)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>HTTP<\/td>\n<td>Передача гипертекста (веб-страниц)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>HTTPS<\/td>\n<td>HTTP с шифрованием TLS: защищает пароли и платёжные данные<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>FTP / SFTP<\/td>\n<td>Передача файлов<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SMTP<\/td>\n<td>Отправка электронной почты<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>POP3 / IMAP<\/td>\n<td>Получение электронной почты<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DNS<\/td>\n<td>Преобразование доменных имён в IP-адреса<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. Веб-технологии: HTML, CSS, JavaScript<\/h2>\n<p>Веб-страница строится из трёх слоёв: <strong>HTML<\/strong> — структура и содержание, <strong>CSS<\/strong> — внешний вид, <strong>JavaScript<\/strong> — поведение и интерактивность.<\/p>\n<p><strong>HTML (HyperText Markup Language)<\/strong> — язык разметки веб-страниц. Элементы задаются тегами.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Тег<\/th>\n<th>Назначение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>&lt;h1&gt;<\/code> … <code>&lt;h6&gt;<\/code><\/td>\n<td>Заголовки разных уровней<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>&lt;p&gt;<\/code><\/td>\n<td>Абзац<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><code>&lt;a href=\"…\"&gt;<\/code><\/td>\n<td>Гиперссылка<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>&lt;img src=\"…\" alt=\"…\"&gt;<\/code><\/td>\n<td>Изображение<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><code>&lt;ul&gt;<\/code>, <code>&lt;ol&gt;<\/code>, <code>&lt;li&gt;<\/code><\/td>\n<td>Маркированный и нумерованный списки, пункт списка<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>&lt;table&gt;<\/code>, <code>&lt;tr&gt;<\/code>, <code>&lt;td&gt;<\/code><\/td>\n<td>Таблица, строка, ячейка<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><code>&lt;div&gt;<\/code><\/td>\n<td>Блок-контейнер<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><code>&lt;form&gt;<\/code>, <code>&lt;input&gt;<\/code>, <code>&lt;button&gt;<\/code><\/td>\n<td>Форма, поле ввода, кнопка<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<pre><code>&lt;h1&gt;Кафе «Ала-Тоо»&lt;/h1&gt;\n&lt;p&gt;Работаем ежедневно с 9:00.&lt;/p&gt;\n&lt;a href=&quot;menu.html&quot;&gt;Меню&lt;/a&gt;<\/code><\/pre>\n<p><strong>CSS (Cascading Style Sheets)<\/strong> — язык описания стилей. Правило состоит из селектора и набора свойств.<\/p>\n<pre><code>h1 { color: #2a4a7a; text-align: center; }\np  { font-size: 16px; margin: 0 0 12px; }<\/code><\/pre>\n<p>Часто используемые свойства: <code>color<\/code> — цвет текста; <code>background<\/code> — фон; <code>font-size<\/code> — размер шрифта; <code>text-align<\/code> — выравнивание текста; <code>margin<\/code> и <code>padding<\/code> — внешние и внутренние отступы; <code>border<\/code> — рамка.<\/p>\n<p><strong>JavaScript<\/strong> — язык программирования, который выполняется в браузере и делает страницы интерактивными: проверяет формы, меняет содержимое без перезагрузки, обменивается данными с сервером.<\/p>\n<pre><code>let price = 250;\nprice += 50;                       // теперь 300\nconst title = document.getElementById(&#39;title&#39;);\ntitle.textContent = &#39;Цена: &#39; + price;\nconsole.log(price === 300);        // true<\/code><\/pre>\n<p>Базовые понятия JavaScript: переменные (<code>let<\/code>, <code>const<\/code>); функции (<code>function<\/code>); условия (<code>if<\/code>); циклы (<code>for<\/code>, <code>while<\/code>); строгое сравнение <code>===<\/code> (по значению и типу); <strong>DOM (Document Object Model)<\/strong> — объектная модель страницы, через которую скрипт находит элементы (<code>getElementById<\/code>, <code>querySelector<\/code>) и изменяет их.<\/p>\n<h2>6. Применение интернет-технологий в бизнесе и тренды<\/h2>\n<ul>\n<li><strong>Электронная коммерция<\/strong> — интернет-магазины и маркетплейсы.<\/li>\n<li><strong>Веб-аналитика<\/strong> — Google Analytics, Яндекс Метрика.<\/li>\n<li><strong>Управление бизнесом<\/strong> — облачные CRM и ERP, доступ из браузера.<\/li>\n<li><strong>Маркетинг<\/strong> — сайты, социальные сети, контекстная реклама.<\/li>\n<\/ul>\n<p>Тренды: интернет вещей; облачные сервисы; ИИ в веб-сервисах (чат-боты, рекомендации); сети 5G; повсеместный переход на HTTPS; прогрессивные веб-приложения (PWA), работающие как мобильные.<\/p>\n<h2>7. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Разберите на части URL любого сайта Кыргызстана: протокол, домен, путь, параметры.<\/li>\n<li>Нарисуйте схему «клиент — веб-сервер — база данных» для интернет-магазина и подпишите, какие данные передаются на каждом шаге.<\/li>\n<li>Создайте в текстовом редакторе файл <code>index.html<\/code> со страницей-визиткой: заголовок, абзац, список, ссылка, изображение. Добавьте стили CSS для заголовка.<\/li>\n<\/ol>\n<h2>8. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Что такое IP-адрес и чем IPv6 отличается от IPv4?<\/li>\n<li>Какую задачу решает DNS?<\/li>\n<li>Опишите шаги загрузки веб-страницы.<\/li>\n<li>Чем HTTP отличается от HTTPS?<\/li>\n<li>За что отвечают HTML, CSS и JavaScript?<\/li>\n<li>Что такое DOM?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Интернет · TCP/IP · IP-адрес · DNS · URL · клиент-серверная модель · HTTP · HTTPS · SMTP · FTP · HTML · CSS · JavaScript · DOM.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Таненбаум Э. С. Компьютерные сети. — СПб. : Питер, 2020.<\/li>\n<li>Документация W3C. — w3.org.<\/li>\n<li>MDN Web Docs. — developer.mozilla.org/ru.<\/li>\n<\/ol>\n"}, {"id": "lec-7", "kind": "lec", "num": 7, "title": "Современные бизнес-тренды и цифровизация", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 1\n<\/p>\n<p>\nОК-1, ПК-1\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Показать, как цифровизация меняет бизнес-модели, управление и корпоративную культуру; рассмотреть ключевые бизнес-тренды, примеры успешной цифровизации, а также трудности, с которыми сталкиваются компании.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Что такое цифровизация бизнеса. Индустрия 4.0.<\/li>\n<li>Основные бизнес-тренды в эпоху цифровизации.<\/li>\n<li>Цифровые бизнес-модели.<\/li>\n<li>Роль цифровых технологий в функциях бизнеса.<\/li>\n<li>Примеры успешных кейсов.<\/li>\n<li>Влияние цифровизации на управление и корпоративную культуру.<\/li>\n<li>Трудности и вызовы цифровизации.<\/li>\n<\/ol>\n<h2>1. Что такое цифровизация бизнеса<\/h2>\n<p><strong>Цифровизация бизнеса<\/strong> — внедрение цифровых технологий в процессы компании для повышения эффективности, качества обслуживания и конкурентоспособности.<\/p>\n<p>Примеры: переход на электронные платежи и QR-оплату вместо наличных; внедрение CRM для работы с клиентами; персонализация предложений с помощью ИИ; электронный документооборот и электронная подпись.<\/p>\n<p><strong>Индустрия 4.0<\/strong> (четвёртая промышленная революция) — переход промышленности к «умному» производству на основе киберфизических систем, интернета вещей, больших данных, облачных вычислений и искусственного интеллекта. Если третья революция автоматизировала отдельные операции компьютерами, то четвёртая объединяет оборудование, продукты и людей в единую сеть, где решения принимаются на основе данных в реальном времени.<\/p>\n<h2>2. Основные бизнес-тренды<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Тренд<\/th>\n<th>Содержание<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Данные как стратегический актив<\/td>\n<td>Решения принимаются на основе анализа данных (data-driven)<\/td>\n<td>Ретейлер планирует ассортимент по данным чеков<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Автоматизация процессов<\/td>\n<td>RPA-роботы и ИИ выполняют рутинные операции<\/td>\n<td>Автоматическая сверка счетов<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Омниканальность<\/td>\n<td>Единый клиентский опыт во всех каналах<\/td>\n<td>Заказ онлайн — получение в магазине<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ИИ и машинное обучение<\/td>\n<td>Прогнозы, рекомендации, чат-боты<\/td>\n<td>Персональные рекомендации в онлайн-кинотеатре<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Платформы и экосистемы<\/td>\n<td>Бизнес соединяет участников рынка и строит связанный набор сервисов<\/td>\n<td>Маркетплейсы, «суперприложения» банков<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Удалённая и гибридная работа<\/td>\n<td>Сотрудники работают из любого места<\/td>\n<td>Облачные офисные пакеты, видеосвязь<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Устойчивое развитие и «зелёные» ИТ<\/td>\n<td>Снижение энергопотребления и экологического следа<\/td>\n<td>Энергоэффективные центры обработки данных<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Персонализация<\/td>\n<td>Предложение под конкретного клиента<\/td>\n<td>Индивидуальные скидки в приложении магазина<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Цифровые бизнес-модели<\/h2>\n<ul>\n<li><strong>Электронная коммерция<\/strong> — продажа товаров и услуг через интернет.<\/li>\n<li><strong>Платформенная модель<\/strong> — компания не производит товар, а связывает продавцов и покупателей и зарабатывает на комиссии (Uber, Airbnb, маркетплейсы).<\/li>\n<li><strong>Подписка (subscription)<\/strong> — регулярная оплата доступа к сервису (Netflix, Spotify, облачные программы).<\/li>\n<li><strong>Freemium<\/strong> — базовые функции бесплатно, расширенные — за плату.<\/li>\n<li><strong>Экономика совместного потребления<\/strong> — аренда вместо владения (каршеринг, самокаты).<\/li>\n<li><strong>Цифровые продукты<\/strong> — электронные книги, программы, онлайн-курсы: копируются без затрат и продаются без склада.<\/li>\n<\/ul>\n<h2>4. Роль цифровых технологий в функциях бизнеса<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Функция<\/th>\n<th>Цифровые решения<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Управление<\/td>\n<td>ERP, BI-дашборды, электронный документооборот<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Маркетинг<\/td>\n<td>Аналитика, социальные сети, таргетированная реклама, CRM<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Производство<\/td>\n<td>Промышленный IoT, роботизация, цифровые двойники<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Логистика<\/td>\n<td>GPS-трекинг, оптимизация маршрутов, складская автоматизация<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Финансы<\/td>\n<td>Онлайн-банкинг, автоматизированная отчётность, ИИ-скоринг<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Персонал<\/td>\n<td>HRM, онлайн-обучение, удалённая работа<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. Примеры успешных кейсов цифровизации<\/h2>\n<ol type=\"1\">\n<li><strong>Amazon<\/strong> — большие данные для рекомендаций, роботизированные склады, облачная платформа AWS, ставшая самостоятельным бизнесом.<\/li>\n<li><strong>Netflix<\/strong> — переход от проката DVD по почте к потоковому видео и производству собственного контента на основе анализа предпочтений зрителей.<\/li>\n<li><strong>Tesla<\/strong> — автомобиль как программно-управляемое устройство: обновления «по воздуху», сбор данных для систем помощи водителю.<\/li>\n<li><strong>Starbucks<\/strong> — мобильное приложение с предзаказом, оплатой и программой лояльности; персональные предложения на основе истории покупок.<\/li>\n<\/ol>\n<p>Местный контекст: в Кыргызстане распространились мобильные кошельки и QR-платежи, онлайн-банкинг, сервисы доставки и такси-агрегаторы, электронные государственные услуги.<\/p>\n<h2>6. Влияние на управление и корпоративную культуру<\/h2>\n<p><strong>Изменения в управлении<\/strong>: переход от жёсткой вертикальной иерархии к гибким командам; прозрачность процессов благодаря дашбордам; управление на основе данных; ускорение цикла принятия решений.<\/p>\n<p><strong>Изменения в культуре<\/strong>: цифровая грамотность становится обязательной для всех сотрудников; ценятся навыки работы с ИТ-инструментами и данными; распространяются гибридные команды; поощряются эксперименты и быстрые проверки идей.<\/p>\n<h2>7. Трудности и вызовы цифровизации<\/h2>\n<ol type=\"1\">\n<li><strong>Финансовые затраты<\/strong> — оборудование, лицензии, интеграция, обучение.<\/li>\n<li><strong>Сопротивление изменениям<\/strong> — страх потерять работу, привычка к старым процессам.<\/li>\n<li><strong>Риски безопасности<\/strong> — утечки данных, кибератаки.<\/li>\n<li><strong>Нехватка квалифицированных кадров<\/strong> — аналитиков, разработчиков, специалистов по безопасности.<\/li>\n<li><strong>Цифровизация ради цифровизации<\/strong> — внедрение технологий без бизнес-цели, когда автоматизируется неэффективный процесс.<\/li>\n<\/ol>\n<blockquote>\n<p>Хорошее правило: сначала улучшить процесс, затем автоматизировать его.<\/p>\n<\/blockquote>\n<h2>8. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Выберите компанию (Amazon, Netflix, Tesla или местную) и опишите: какие технологии она использует, какую проблему каждая решает и какой эффект получен.<\/li>\n<li>Подготовьте краткую стратегию цифровизации для малого бизнеса (кафе, магазин, салон): 3–5 шагов, необходимые инструменты, ожидаемые результаты.<\/li>\n<\/ol>\n<h2>9. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Что такое Индустрия 4.0?<\/li>\n<li>Назовите пять основных бизнес-трендов эпохи цифровизации.<\/li>\n<li>Чем платформенная бизнес-модель отличается от традиционной?<\/li>\n<li>Как цифровизация меняет роль менеджера?<\/li>\n<li>Почему опасно автоматизировать неэффективный процесс?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Цифровизация бизнеса · Индустрия 4.0 · data-driven · омниканальность · платформа · экосистема · подписка · freemium · RPA · цифровая культура · сопротивление изменениям.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Котлер Ф. Маркетинг 5.0: технологии для человечности. — М. : Альпина, 2021.<\/li>\n<li>Прохоров А., Коник Л. Цифровая трансформация: анализ, тренды, мировой опыт. — 2021.<\/li>\n<\/ol>\n"}, {"id": "lec-8", "kind": "lec", "num": 8, "title": "Методология проектирования предприятий для цифровизации", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 2\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Познакомить студентов с подходами к проектированию предприятия в условиях цифровизации: этапами проектирования, методологиями (системный и процессный подходы, Agile, Lean, дизайн-мышление), архитектурой предприятия и инструментами моделирования бизнес-процессов.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Понятие и сущность проектирования предприятий.<\/li>\n<li>Цифровизация как фактор трансформации предприятия.<\/li>\n<li>Основные этапы проектирования для цифровизации.<\/li>\n<li>Методологии цифрового проектирования.<\/li>\n<li>Архитектура предприятия: TOGAF, Zachman.<\/li>\n<li>Моделирование бизнес-процессов: BPMN.<\/li>\n<li>Корпоративные информационные системы.<\/li>\n<li>Кейсы, риски и вызовы.<\/li>\n<\/ol>\n<h2>1. Понятие проектирования предприятий<\/h2>\n<p><strong>Проектирование предприятия<\/strong> — процесс создания или изменения структуры, бизнес-процессов, информационных систем и технологий организации для достижения её стратегических целей.<\/p>\n<p>Принципы:<\/p>\n<ul>\n<li><strong>системный подход<\/strong> — предприятие рассматривается как целостная система взаимосвязанных элементов: изменение одного (например, ИТ-системы) затрагивает другие (процессы, людей, структуру);<\/li>\n<li><strong>ориентация на цели<\/strong> — каждое проектное решение должно вести к измеримой цели бизнеса;<\/li>\n<li><strong>гибкость и адаптивность<\/strong> — учёт быстрых изменений рынка и технологий.<\/li>\n<\/ul>\n<h2>2. Цифровизация как фактор трансформации<\/h2>\n<p>Цифровизация позволяет создавать новые цифровые бизнес-модели, повышать эффективность процессов за счёт автоматизации, ускорять принятие решений благодаря данным в реальном времени, интегрировать подразделения и партнёров в единую информационную среду.<\/p>\n<h2>3. Этапы проектирования для цифровизации<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Этап<\/th>\n<th>Содержание<\/th>\n<th>Результат<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Анализ текущего состояния (AS-IS)<\/td>\n<td>Описание процессов, систем, данных; поиск «узких мест»; оценка цифровой зрелости<\/td>\n<td>Карта процессов и список проблем<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2. Разработка цифровой стратегии<\/td>\n<td>Цели, приоритеты, бюджет, ключевые показатели<\/td>\n<td>Дорожная карта цифровизации<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3. Проектирование процессов (TO-BE)<\/td>\n<td>Новые процессы с учётом возможностей технологий<\/td>\n<td>Модели целевых процессов<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4. Внедрение технологий<\/td>\n<td>Выбор и настройка систем, интеграция, миграция данных, обучение<\/td>\n<td>Работающие системы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5. Мониторинг и адаптация<\/td>\n<td>Контроль KPI, сбор обратной связи, улучшения<\/td>\n<td>Отчёты, план улучшений<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>4. Методологии цифрового проектирования<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Методология<\/th>\n<th>Ключевая идея<\/th>\n<th>Когда применять<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Системный подход<\/td>\n<td>Предприятие как система взаимосвязанных элементов<\/td>\n<td>Всегда — как общая рамка<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Процессный подход (BPM)<\/td>\n<td>Управление сквозными бизнес-процессами, а не отдельными функциями<\/td>\n<td>Оптимизация операций, внедрение ERP<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Реинжиниринг (BPR)<\/td>\n<td>Радикальное перепроектирование процессов (М. Хаммер, Дж. Чампи)<\/td>\n<td>Когда постепенные улучшения не дают эффекта<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Agile (Scrum, Kanban)<\/td>\n<td>Короткие итерации, частая обратная связь, гибкие команды<\/td>\n<td>Разработка цифровых продуктов в неопределённости<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lean (бережливое управление)<\/td>\n<td>Устранение потерь: ожиданий, лишних операций, переделок<\/td>\n<td>Производство, сервисные процессы<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Design Thinking<\/td>\n<td>Проектирование от потребностей человека: эмпатия → определение проблемы → идеи → прототип → тест<\/td>\n<td>Новые сервисы и клиентский опыт<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. Архитектура предприятия<\/h2>\n<p><strong>Архитектура предприятия (Enterprise Architecture, EA)<\/strong> — целостное описание организации, показывающее связь стратегии, бизнес-процессов, данных, приложений и технологий. Она помогает согласовать ИТ с целями бизнеса и управлять изменениями.<\/p>\n<p><strong>Уровни (домены) архитектуры<\/strong><\/p>\n<ol type=\"1\">\n<li><em>Бизнес-архитектура<\/em> — цели, бизнес-функции, процессы, организационная структура.<\/li>\n<li><em>Архитектура данных<\/em> — какие данные существуют, где хранятся, кто ими владеет.<\/li>\n<li><em>Архитектура приложений<\/em> — информационные системы и их взаимодействие.<\/li>\n<li><em>Технологическая архитектура<\/em> — серверы, сети, облака, средства безопасности.<\/li>\n<\/ol>\n<p><strong>TOGAF<\/strong> (The Open Group Architecture Framework) — наиболее распространённая методология. Её основа — цикл <strong>ADM<\/strong> (Architecture Development Method): предварительная фаза → A. Видение архитектуры → B. Бизнес-архитектура → C. Архитектура информационных систем (данные и приложения) → D. Технологическая архитектура → E. Возможности и решения → F. Планирование миграции → G. Управление внедрением → H. Управление изменениями архитектуры. В центре цикла — управление требованиями.<\/p>\n<p><strong>Zachman Framework<\/strong> — матрица 6×6: вопросы «Что? Как? Где? Кто? Когда? Почему?» на пересечении с точками зрения (от руководителя до исполнителя). Помогает классифицировать архитектурные описания.<\/p>\n<h2>6. Моделирование бизнес-процессов: BPMN<\/h2>\n<p><strong>BPMN (Business Process Model and Notation)<\/strong> — международная графическая нотация описания бизнес-процессов, понятная и бизнесу, и ИТ-специалистам.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Элемент BPMN<\/th>\n<th>Обозначение<\/th>\n<th>Смысл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Событие<\/td>\n<td>Круг<\/td>\n<td>Начало, промежуточное событие, завершение<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Задача (действие)<\/td>\n<td>Прямоугольник со скруглёнными углами<\/td>\n<td>Работа, которую выполняет участник<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Шлюз<\/td>\n<td>Ромб<\/td>\n<td>Ветвление или слияние потоков (условие «да/нет»)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Поток управления<\/td>\n<td>Сплошная стрелка<\/td>\n<td>Порядок выполнения<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Пул и дорожки<\/td>\n<td>Горизонтальные полосы<\/td>\n<td>Участники и их зоны ответственности<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Объект данных<\/td>\n<td>Лист с загнутым углом<\/td>\n<td>Документ или данные<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Пример процесса «Обработка заказа»<\/em>: заказ получен → проверить наличие товара → шлюз «товар есть?» → да: выставить счёт → получить оплату → отгрузить; нет: сообщить клиенту о сроках поставки.<\/p>\n<p><strong>Инструменты моделирования<\/strong>: Bizagi Modeler, Camunda Modeler, draw.io, Microsoft Visio, ARIS; для архитектуры — Archi (язык ArchiMate).<\/p>\n<h2>7. Корпоративные информационные системы<\/h2>\n<p><strong>Корпоративная информационная система (КИС)<\/strong> — интегрированная система, автоматизирующая управление ресурсами и процессами предприятия.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Класс КИС<\/th>\n<th>Назначение<\/th>\n<th>Примеры<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>ERP<\/td>\n<td>Планирование ресурсов предприятия: финансы, закупки, склад, производство, персонал<\/td>\n<td>SAP S/4HANA, Oracle NetSuite, Microsoft Dynamics, 1С:ERP<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CRM<\/td>\n<td>Управление взаимоотношениями с клиентами: продажи, маркетинг, сервис<\/td>\n<td>Salesforce, Bitrix24, amoCRM<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SCM<\/td>\n<td>Управление цепочками поставок<\/td>\n<td>SAP SCM, Oracle SCM Cloud<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>HRM<\/td>\n<td>Управление персоналом<\/td>\n<td>SAP SuccessFactors, 1С:ЗУП<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>BI<\/td>\n<td>Бизнес-аналитика и отчётность<\/td>\n<td>Power BI, Tableau<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ECM / СЭД<\/td>\n<td>Электронный документооборот<\/td>\n<td>Directum, «Дело»<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>8. Кейсы, риски и вызовы<\/h2>\n<ul>\n<li><strong>Siemens<\/strong> — «цифровая фабрика» в Амберге: продукция и оборудование связаны в единую систему, большая часть операций автоматизирована, уровень брака крайне низкий.<\/li>\n<li><strong>Uber<\/strong> — платформа, построенная на геолокации, алгоритмах подбора и динамического ценообразования.<\/li>\n<li><strong>Zara<\/strong> — данные продаж из магазинов ежедневно поступают в центр и определяют, какие модели производить: цикл «от эскиза до полки» — несколько недель.<\/li>\n<\/ul>\n<p><strong>Риски<\/strong>: технические сложности интеграции старых систем; превышение бюджета; кибератаки; человеческий фактор — сопротивление и нехватка навыков.<\/p>\n<h2>9. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Опишите в BPMN процесс «Запись студента на факультативный курс» (участники: студент, деканат, преподаватель).<\/li>\n<li>Для гипотетического предприятия предложите три этапа цифровизации и укажите, какая КИС нужна на каждом этапе.<\/li>\n<\/ol>\n<h2>10. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Какие этапы включает проектирование предприятия для цифровизации?<\/li>\n<li>Чем процессный подход отличается от функционального?<\/li>\n<li>Назовите уровни архитектуры предприятия.<\/li>\n<li>Что такое цикл ADM в TOGAF?<\/li>\n<li>Какие элементы BPMN вы знаете?<\/li>\n<li>Чем ERP отличается от CRM?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Проектирование предприятия · AS-IS / TO-BE · процессный подход · BPR · Agile · Lean · Design Thinking · архитектура предприятия · TOGAF · ADM · Zachman · BPMN · КИС · ERP · CRM · SCM.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Хаммер М., Чампи Дж. Реинжиниринг корпорации: манифест революции в бизнесе. — М. : Манн, Иванов и Фербер, 2020.<\/li>\n<li>Спецификация BPMN. — omg.org/bpmn.<\/li>\n<li>The Open Group. TOGAF Standard. — opengroup.org.<\/li>\n<\/ol>\n"}, {"id": "lec-9", "kind": "lec", "num": 9, "title": "Цифровая безопасность и защита информации", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 2\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Сформировать понимание основных угроз цифровой безопасности, принципов и методов защиты информации, роли стандартов и законодательства, а также базовых правил безопасной работы в цифровой среде.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Понятие цифровой безопасности и её значение.<\/li>\n<li>Основные угрозы.<\/li>\n<li>Принципы защиты информации (триада CIA).<\/li>\n<li>Методы защиты: организационные, технические, правовые.<\/li>\n<li>Цифровая безопасность в управлении и бизнесе.<\/li>\n<li>Стандарты и законодательство.<\/li>\n<li>Тренды и вызовы.<\/li>\n<\/ol>\n<h2>1. Понятие цифровой безопасности<\/h2>\n<p><strong>Кибербезопасность (цифровая безопасность)<\/strong> — защита информационных систем, сетей, программ и данных от атак, несанкционированного доступа, повреждения и утраты.<\/p>\n<p>Значение: защита персональных и коммерческих данных; непрерывность бизнес-процессов; доверие клиентов и партнёров; соблюдение закона и избежание штрафов.<\/p>\n<p><strong>Киберустойчивость<\/strong> — способность организации продолжать работу во время атаки и быстро восстанавливаться после неё. Она обеспечивается резервным копированием, планами восстановления и дублированием систем.<\/p>\n<h2>2. Основные угрозы<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Угроза<\/th>\n<th>Суть<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Вредоносное ПО (malware)<\/td>\n<td>Программы, наносящие вред: вирусы, черви, трояны, шпионские программы<\/td>\n<td>Троян крадёт пароли из браузера<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Программы-вымогатели (ransomware)<\/td>\n<td>Шифруют файлы и требуют выкуп<\/td>\n<td>Атаки на больницы и муниципалитеты<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Фишинг<\/td>\n<td>Поддельные письма и сайты, выманивающие пароли и данные карт<\/td>\n<td>Письмо «от банка» со ссылкой на фальшивую страницу входа<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Социальная инженерия<\/td>\n<td>Манипуляция людьми, а не взлом техники<\/td>\n<td>Звонок «из службы безопасности банка» с просьбой назвать код из SMS<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DDoS-атака<\/td>\n<td>Перегрузка сервера огромным количеством запросов с множества устройств<\/td>\n<td>Сайт магазина недоступен в день распродажи<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>SQL-инъекция<\/td>\n<td>Внедрение вредоносного SQL-кода через поля ввода сайта<\/td>\n<td>Получение доступа к базе клиентов<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Инсайдерские угрозы<\/td>\n<td>Действия сотрудников — умышленные или по неосторожности<\/td>\n<td>Сотрудник выносит базу клиентов на флешке<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Утечка данных<\/td>\n<td>Несанкционированное раскрытие информации<\/td>\n<td>Публикация персональных данных миллионов пользователей<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>Большая часть успешных атак начинается с человеческого фактора: слабого пароля, перехода по ссылке, сообщения кода посторонним.<\/p>\n<\/blockquote>\n<h2>3. Принципы защиты информации<\/h2>\n<p>Основа — <strong>триада CIA<\/strong>:<\/p>\n<ul>\n<li><strong>Конфиденциальность (Confidentiality)<\/strong> — доступ к информации имеют только уполномоченные лица.<\/li>\n<li><strong>Целостность (Integrity)<\/strong> — информация не изменена незаконно и остаётся точной.<\/li>\n<li><strong>Доступность (Availability)<\/strong> — информация и системы доступны тогда, когда нужны.<\/li>\n<\/ul>\n<p>Дополнительные принципы: <strong>аутентификация<\/strong> (подтверждение личности пользователя), <strong>авторизация<\/strong> (предоставление прав), <strong>неотказуемость<\/strong> (невозможность отрицать совершённое действие — обеспечивается электронной подписью), <strong>минимальные привилегии<\/strong> (каждый получает только необходимые права).<\/p>\n<h2>4. Методы защиты информации<\/h2>\n<p><strong>Организационные меры<\/strong>: политика информационной безопасности; разграничение прав доступа; обучение сотрудников; инструкции по работе с паролями и носителями; назначение ответственного (CISO — руководитель службы ИБ); регламент реагирования на инциденты.<\/p>\n<p><strong>Технические меры<\/strong><\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Средство<\/th>\n<th>Назначение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Шифрование<\/td>\n<td>Преобразование данных в вид, недоступный без ключа. Симметричное (один ключ, AES) и асимметричное (пара открытый/закрытый ключ, RSA)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TLS/SSL, HTTPS<\/td>\n<td>Шифрование данных при передаче по сети<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Многофакторная аутентификация (MFA, 2FA)<\/td>\n<td>Вход с двумя и более факторами: знание (пароль), владение (телефон, токен), биометрия<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Брандмауэр (файрвол)<\/td>\n<td>Фильтрация и контроль трафика между сетями по правилам<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Антивирусы и EDR<\/td>\n<td>Обнаружение и блокировка вредоносных программ<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>VPN<\/td>\n<td>Защищённый канал через интернет для удалённой работы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Резервное копирование<\/td>\n<td>Восстановление данных после сбоя или атаки (правило 3-2-1: три копии, два вида носителей, одна копия вне офиса)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Обновления ПО<\/td>\n<td>Устранение известных уязвимостей<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Системы мониторинга (SIEM)<\/td>\n<td>Сбор и анализ событий безопасности<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Правовые меры<\/strong>: договоры о неразглашении (NDA); соблюдение законодательства о персональных данных; ответственность за нарушения.<\/p>\n<p><strong>Признаки надёжного пароля<\/strong>: не менее 12 символов; сочетание букв разного регистра, цифр и знаков; не словарное слово и не личные данные; свой пароль для каждого сервиса; хранение в менеджере паролей.<\/p>\n<h2>5. Цифровая безопасность в управлении и бизнесе<\/h2>\n<ol type=\"1\">\n<li><strong>Управление рисками<\/strong> — оценка вероятности и ущерба угроз, выбор мер защиты.<\/li>\n<li><strong>Соответствие законодательству<\/strong> — защита персональных данных клиентов и сотрудников.<\/li>\n<li><strong>Защита интеллектуальной собственности<\/strong> — коммерческая тайна, исходный код, разработки.<\/li>\n<li><strong>Непрерывность бизнеса<\/strong> — планы восстановления после инцидентов.<\/li>\n<li><strong>Киберстрахование<\/strong> — страхование ущерба от кибератак.<\/li>\n<\/ol>\n<h2>6. Стандарты и законодательство<\/h2>\n<ul>\n<li><strong>ISO/IEC 27001<\/strong> — международный стандарт системы управления информационной безопасностью (СУИБ).<\/li>\n<li><strong>ISO/IEC 27002<\/strong> — свод практик и мер защиты.<\/li>\n<li><strong>NIST Cybersecurity Framework<\/strong> — функции: идентифицировать, защищать, обнаруживать, реагировать, восстанавливать.<\/li>\n<li><strong>PCI DSS<\/strong> — стандарт безопасности данных платёжных карт.<\/li>\n<li><strong>GDPR<\/strong> — регламент Европейского союза о защите персональных данных.<\/li>\n<li><strong>Закон Кыргызской Республики «Об информации персонального характера»<\/strong> — правила сбора, обработки и защиты персональных данных; контроль осуществляет уполномоченный государственный орган по защите персональных данных.<\/li>\n<\/ul>\n<h2>7. Тренды и вызовы<\/h2>\n<ul>\n<li>ИИ в кибербезопасности — обнаружение аномалий; одновременно ИИ используют злоумышленники (поддельные голоса и видео — дипфейки).<\/li>\n<li>Защита облачных систем и модель «нулевого доверия» (Zero Trust): проверять каждого пользователя и устройство при каждом доступе.<\/li>\n<li>Атаки на устройства интернета вещей.<\/li>\n<li>Квантовая криптография и постквантовые алгоритмы.<\/li>\n<li>«Киберпреступность как услуга» — готовые наборы для атак продаются в даркнете.<\/li>\n<\/ul>\n<h2>8. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Изучите один крупный инцидент утечки данных (Facebook 2019, Equifax 2017 или другой): причина, ущерб, принятые меры.<\/li>\n<li>Разработайте краткую политику безопасности для небольшого офиса: пароли, доступ, резервное копирование, обучение, действия при инциденте.<\/li>\n<\/ol>\n<h2>9. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Что входит в триаду CIA?<\/li>\n<li>Чем фишинг отличается от DDoS-атаки?<\/li>\n<li>Почему двухфакторная аутентификация надёжнее пароля?<\/li>\n<li>Чем организационные меры защиты отличаются от технических?<\/li>\n<li>Какие стандарты информационной безопасности вы знаете?<\/li>\n<li>Что такое киберустойчивость?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Кибербезопасность · киберустойчивость · вредоносное ПО · фишинг · социальная инженерия · DDoS · триада CIA · шифрование · MFA · брандмауэр · VPN · ISO/IEC 27001 · персональные данные · Zero Trust.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>ISO/IEC 27001. Information security management systems.<\/li>\n<li>NIST Cybersecurity Framework. — nist.gov/cyberframework.<\/li>\n<li>Закон Кыргызской Республики «Об информации персонального характера». — cbd.minjust.gov.kg.<\/li>\n<\/ol>\n"}, {"id": "lec-10", "kind": "lec", "num": 10, "title": "Облачные технологии", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 2\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Раскрыть понятие облачных вычислений, их принципы, модели развёртывания и обслуживания (IaaS, PaaS, SaaS), преимущества и риски, а также подходы к переходу организации в облако.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Понятие облачных технологий.<\/li>\n<li>Принципы работы облака.<\/li>\n<li>Модели развёртывания: публичное, частное, гибридное облако.<\/li>\n<li>Модели обслуживания: IaaS, PaaS, SaaS.<\/li>\n<li>Преимущества и вызовы.<\/li>\n<li>Примеры в бизнесе и управлении; переход в облако.<\/li>\n<li>Тренды.<\/li>\n<\/ol>\n<h2>1. Понятие облачных технологий<\/h2>\n<p><strong>Облачные вычисления (cloud computing)<\/strong> — модель предоставления по сети вычислительных ресурсов (серверов, хранилищ, баз данных, программ) по требованию, с оплатой по факту использования.<\/p>\n<p>Облако позволяет хранить и обрабатывать данные, запускать приложения и наращивать вычислительные мощности без покупки собственного оборудования. Технической основой облака является <strong>виртуализация<\/strong>: физические серверы в центрах обработки данных (ЦОД) делятся на множество виртуальных машин и контейнеров.<\/p>\n<h2>2. Принципы работы облака<\/h2>\n<p>По определению NIST облако имеет пять характеристик:<\/p>\n<ol type=\"1\">\n<li><strong>Самообслуживание по требованию<\/strong> — пользователь сам заказывает ресурсы через веб-консоль.<\/li>\n<li><strong>Широкий сетевой доступ<\/strong> — работа с любого устройства через интернет.<\/li>\n<li><strong>Объединение ресурсов<\/strong> — одни и те же серверы обслуживают многих клиентов (многопользовательская модель), при этом данные клиентов изолированы.<\/li>\n<li><strong>Эластичность<\/strong> — ресурсы быстро увеличиваются при росте нагрузки и уменьшаются при спаде.<\/li>\n<li><strong>Измеряемый сервис<\/strong> — оплата только за фактическое потребление (pay-as-you-go).<\/li>\n<\/ol>\n<h2>3. Модели развёртывания<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Модель<\/th>\n<th>Описание<\/th>\n<th>Плюсы<\/th>\n<th>Минусы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Публичное облако<\/td>\n<td>Ресурсы провайдера доступны многим клиентам (AWS, Microsoft Azure, Google Cloud)<\/td>\n<td>Низкий порог входа, масштабируемость<\/td>\n<td>Меньше контроля, зависимость от провайдера<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Частное облако<\/td>\n<td>Облачная инфраструктура для одной организации — в собственном или арендованном ЦОД<\/td>\n<td>Контроль, безопасность<\/td>\n<td>Высокие затраты<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Гибридное облако<\/td>\n<td>Сочетание частного и публичного облаков<\/td>\n<td>Гибкость: критичные данные — внутри, остальное — в публичном<\/td>\n<td>Сложность интеграции<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Общественное облако<\/td>\n<td>Облако для группы организаций с общими задачами (например, госорганов)<\/td>\n<td>Разделение затрат<\/td>\n<td>Нужны общие правила<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>4. Модели обслуживания<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Модель<\/th>\n<th>Что предоставляет провайдер<\/th>\n<th>Что делает клиент<\/th>\n<th>Примеры<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>IaaS (инфраструктура как услуга)<\/td>\n<td>Виртуальные серверы, сети, хранилища<\/td>\n<td>Устанавливает ОС, программы, управляет ими<\/td>\n<td>Amazon EC2, Azure Virtual Machines, Google Compute Engine<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>PaaS (платформа как услуга)<\/td>\n<td>Платформу для разработки и запуска приложений: ОС, среды выполнения, базы данных<\/td>\n<td>Пишет и разворачивает своё приложение<\/td>\n<td>Google App Engine, Heroku, Azure App Service<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SaaS (программа как услуга)<\/td>\n<td>Готовое приложение, доступное через браузер<\/td>\n<td>Только пользуется<\/td>\n<td>Google Workspace, Microsoft 365, Zoom, Bitrix24<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Аналогия «пицца как услуга»: IaaS — вам дают кухню и печь, готовите сами; PaaS — дают тесто и печь, вы добавляете начинку; SaaS — пиццу привозят готовой.<\/p>\n<p>Дополнительные модели: <strong>DBaaS<\/strong> (база данных как услуга), <strong>FaaS / бессерверные вычисления<\/strong> (запуск отдельных функций по событию — AWS Lambda), <strong>STaaS<\/strong> (хранилище как услуга — Amazon S3, Google Drive).<\/p>\n<h2>5. Преимущества и вызовы<\/h2>\n<p><strong>Преимущества<\/strong>: нет капитальных затрат на оборудование (CAPEX → OPEX); быстрое масштабирование; доступ из любого места; автоматические обновления; высокая надёжность и резервирование у крупных провайдеров; быстрый запуск новых проектов.<\/p>\n<p><strong>Вызовы и риски<\/strong>: безопасность и конфиденциальность данных; зависимость от интернет-соединения; зависимость от провайдера (vendor lock-in); требования закона к месту хранения персональных данных; неконтролируемый рост расходов при неправильной настройке.<\/p>\n<p><strong>Модель разделённой ответственности<\/strong>: провайдер отвечает за безопасность <em>облака<\/em> (ЦОД, оборудование, гипервизор), клиент — за безопасность <em>в облаке<\/em> (свои данные, учётные записи, настройки доступа). Чем выше модель (IaaS → SaaS), тем больше берёт на себя провайдер.<\/p>\n<h2>6. Примеры в бизнесе и управлении<\/h2>\n<ul>\n<li><strong>Малый бизнес<\/strong> — облачная бухгалтерия, CRM и офисный пакет без собственного сервера.<\/li>\n<li><strong>Ретейл<\/strong> — интернет-магазин масштабируется в «чёрную пятницу».<\/li>\n<li><strong>Образование<\/strong> — Google Classroom, Moodle в облаке, видеолекции.<\/li>\n<li><strong>Медиа<\/strong> — Netflix работает на инфраструктуре AWS.<\/li>\n<li><strong>Государство<\/strong> — облачные платформы электронных услуг.<\/li>\n<\/ul>\n<p><strong>Этапы перехода в облако<\/strong><\/p>\n<ol type=\"1\">\n<li>Аудит: какие данные и процессы можно перенести (документооборот, почта, учёт продаж, аналитика).<\/li>\n<li>Выбор модели (SaaS / PaaS / IaaS) и провайдера по стоимости, надёжности, требованиям закона.<\/li>\n<li>Пилотный проект на одном процессе.<\/li>\n<li>Поэтапная миграция данных и обучение сотрудников.<\/li>\n<li>Настройка безопасности: роли и права, MFA, шифрование, резервные копии.<\/li>\n<li>Мониторинг затрат и производительности.<\/li>\n<\/ol>\n<h2>7. Тренды<\/h2>\n<ul>\n<li><strong>Мультиоблако<\/strong> — использование нескольких провайдеров одновременно.<\/li>\n<li><strong>Контейнеры и Kubernetes<\/strong> — переносимые приложения.<\/li>\n<li><strong>Периферийные (edge) и туманные (fog) вычисления<\/strong> — обработка данных ближе к устройствам IoT.<\/li>\n<li><strong>Облачный ИИ<\/strong> — готовые сервисы распознавания речи, перевода, генеративные модели по API.<\/li>\n<li><strong>«Зелёные» облака<\/strong> — ЦОД на возобновляемой энергии.<\/li>\n<\/ul>\n<h2>8. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Классифицируйте 10 сервисов, которыми вы пользуетесь (почта, хранилище, видеосвязь, онлайн-редакторы и т. п.), по моделям IaaS, PaaS, SaaS.<\/li>\n<li>Сравните тарифы двух облачных хранилищ для малой компании на 10 сотрудников и обоснуйте выбор.<\/li>\n<\/ol>\n<h2>9. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Назовите пять характеристик облачных вычислений.<\/li>\n<li>Чем частное облако отличается от публичного и гибридного?<\/li>\n<li>Чем IaaS отличается от PaaS и SaaS? Приведите примеры.<\/li>\n<li>Какие риски связаны с облачными технологиями?<\/li>\n<li>Что такое модель разделённой ответственности?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Облачные вычисления · виртуализация · ЦОД · эластичность · pay-as-you-go · публичное / частное / гибридное облако · IaaS · PaaS · SaaS · vendor lock-in · мультиоблако · Kubernetes.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>NIST SP 800-145. The NIST Definition of Cloud Computing.<\/li>\n<li>Microsoft Learn: основы облачных вычислений. — learn.microsoft.com.<\/li>\n<li>AWS Training and Certification. — aws.training.<\/li>\n<\/ol>\n"}, {"id": "lec-11", "kind": "lec", "num": 11, "title": "Машинное обучение", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 2\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Познакомить студентов с основами машинного обучения: видами обучения, типовыми задачами и алгоритмами, этапами разработки модели и метриками её качества, а также с примерами применения и ограничениями.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Искусственный интеллект и машинное обучение.<\/li>\n<li>Виды машинного обучения.<\/li>\n<li>Типовые задачи и алгоритмы.<\/li>\n<li>Этапы разработки модели.<\/li>\n<li>Оценка качества моделей.<\/li>\n<li>Инструменты.<\/li>\n<li>Применение, этика и ограничения.<\/li>\n<\/ol>\n<h2>1. Искусственный интеллект и машинное обучение<\/h2>\n<p><strong>Искусственный интеллект (ИИ)<\/strong> — область информатики, создающая системы, способные выполнять задачи, требующие человеческого интеллекта: распознавание образов и речи, понимание языка, принятие решений.<\/p>\n<p><strong>Машинное обучение (Machine Learning, ML)<\/strong> — раздел ИИ, в котором компьютер не программируют явными правилами, а <strong>обучают на данных<\/strong>: алгоритм находит закономерности в примерах и затем применяет их к новым данным.<\/p>\n<p><strong>Глубокое обучение (Deep Learning)<\/strong> — раздел машинного обучения на основе многослойных нейронных сетей; применяется для изображений, речи, текста.<\/p>\n<p>ИИ ⊃ машинное обучение ⊃ глубокое обучение.<\/p>\n<p>Отличие от традиционного программирования: в традиционной программе <em>данные + правила → ответ<\/em>; в машинном обучении <em>данные + ответы → правила (модель)<\/em>.<\/p>\n<h2>2. Виды машинного обучения<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Вид<\/th>\n<th>Данные<\/th>\n<th>Задача<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Обучение с учителем (supervised)<\/td>\n<td>Примеры с известными ответами (метками)<\/td>\n<td>Предсказать ответ для нового объекта<\/td>\n<td>По истории заявок предсказать, вернёт ли клиент кредит<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Обучение без учителя (unsupervised)<\/td>\n<td>Данные без меток<\/td>\n<td>Найти структуру: группы, аномалии<\/td>\n<td>Сегментация покупателей по поведению<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Обучение с подкреплением (reinforcement)<\/td>\n<td>Агент действует в среде и получает награды и штрафы<\/td>\n<td>Выработать стратегию, максимизирующую награду<\/td>\n<td>Обучение робота ходьбе, игровые ИИ, управление светофорами<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Типовые задачи и алгоритмы<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Задача<\/th>\n<th>Что предсказывается<\/th>\n<th>Алгоритмы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Регрессия<\/td>\n<td>Число (цена, спрос, температура)<\/td>\n<td>Линейная регрессия, деревья решений, градиентный бустинг<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Классификация<\/td>\n<td>Класс (спам / не спам, уйдёт / останется)<\/td>\n<td>Логистическая регрессия, дерево решений, случайный лес, метод опорных векторов (SVM), k ближайших соседей<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Кластеризация<\/td>\n<td>Группы похожих объектов<\/td>\n<td>k-средних (k-means), иерархическая кластеризация, DBSCAN<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Поиск ассоциаций<\/td>\n<td>Совместно встречающиеся элементы<\/td>\n<td>Apriori (анализ рыночной корзины)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Обнаружение аномалий<\/td>\n<td>Нетипичные объекты<\/td>\n<td>Isolation Forest, статистические методы<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Снижение размерности<\/td>\n<td>Сжатое представление данных<\/td>\n<td>Метод главных компонент (PCA)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Линейная регрессия<\/strong> строит прямую <em>y = a + b·x<\/em>, наилучшим образом проходящую через точки данных (метод наименьших квадратов). Например, <em>x<\/em> — расходы на рекламу, <em>y<\/em> — продажи.<\/p>\n<p><strong>Дерево решений<\/strong> задаёт последовательность вопросов («доход &gt; 30 000?», «есть просрочки?») и приводит к ответу в листе дерева; легко интерпретируется.<\/p>\n<p><strong>Нейронная сеть<\/strong> состоит из слоёв искусственных нейронов; каждый нейрон взвешенно суммирует входы и применяет функцию активации. Обучение — подбор весов.<\/p>\n<h2>4. Этапы разработки модели<\/h2>\n<ol type=\"1\">\n<li><strong>Постановка задачи<\/strong> — какой бизнес-вопрос решаем, какая метрика успеха.<\/li>\n<li><strong>Сбор данных<\/strong> — история продаж, данные клиентов, внешние факторы.<\/li>\n<li><strong>Подготовка данных<\/strong> — очистка, заполнение пропусков, кодирование категорий, нормализация, создание признаков.<\/li>\n<li><strong>Разделение выборки<\/strong> — обучающая (обычно 70–80 %) и тестовая (20–30 %) части.<\/li>\n<li><strong>Обучение модели<\/strong> — подбор параметров алгоритма на обучающей выборке.<\/li>\n<li><strong>Оценка<\/strong> — проверка на тестовых данных, которые модель не видела.<\/li>\n<li><strong>Внедрение<\/strong> — интеграция в систему (сайт, CRM, приложение).<\/li>\n<li><strong>Мониторинг<\/strong> — контроль качества: со временем данные меняются, модель приходится переобучать.<\/li>\n<\/ol>\n<p><strong>Переобучение (overfitting)<\/strong> — модель «запомнила» обучающие примеры вместе с шумом и плохо работает на новых данных. <strong>Недообучение<\/strong> — модель слишком простая и не улавливает закономерности.<\/p>\n<h2>5. Оценка качества моделей<\/h2>\n<p><strong>Для регрессии<\/strong>: MAE — средняя абсолютная ошибка; RMSE — корень из средней квадратичной ошибки (сильнее штрафует большие ошибки); R² — доля объяснённой дисперсии (чем ближе к 1, тем лучше).<\/p>\n<p><strong>Для классификации<\/strong> используется <strong>матрица ошибок<\/strong>:<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Предсказано «да»<\/th>\n<th>Предсказано «нет»<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Фактически «да»<\/td>\n<td>TP — истинно положительные<\/td>\n<td>FN — ложно отрицательные<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Фактически «нет»<\/td>\n<td>FP — ложно положительные<\/td>\n<td>TN — истинно отрицательные<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><em>Accuracy (точность в целом)<\/em> = (TP + TN) / все объекты;<\/li>\n<li><em>Precision (точность)<\/em> = TP / (TP + FP) — доля верных среди предсказанных «да»;<\/li>\n<li><em>Recall (полнота)<\/em> = TP / (TP + FN) — доля найденных среди всех фактических «да»;<\/li>\n<li><em>F1-мера<\/em> — среднее гармоническое precision и recall.<\/li>\n<\/ul>\n<blockquote>\n<p>При редком классе (мошеннические операции — 1 %) модель, которая всегда отвечает «не мошенничество», имеет accuracy 99 %, но бесполезна. Поэтому смотрят на precision и recall.<\/p>\n<\/blockquote>\n<h2>6. Инструменты<\/h2>\n<p>Язык <strong>Python<\/strong> и библиотеки: pandas (таблицы данных), NumPy (вычисления), scikit-learn (классические алгоритмы ML), matplotlib и seaborn (графики), TensorFlow и PyTorch (нейронные сети). Среды: Jupyter Notebook, Google Colab. Платформа <strong>Kaggle<\/strong> — наборы данных и соревнования. Облачные сервисы: Google Vertex AI, Azure Machine Learning, Amazon SageMaker. Без программирования: AutoML, Orange.<\/p>\n<h2>7. Применение, этика и ограничения<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Отрасль<\/th>\n<th>Применение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Финансы<\/td>\n<td>Кредитный скоринг, выявление мошенничества<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ретейл<\/td>\n<td>Прогноз спроса, рекомендации, динамические цены<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Медицина<\/td>\n<td>Анализ снимков, прогноз рисков<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Производство<\/td>\n<td>Предиктивное обслуживание оборудования, контроль качества<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Маркетинг<\/td>\n<td>Прогноз оттока клиентов, сегментация<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Транспорт<\/td>\n<td>Оптимизация маршрутов, беспилотные автомобили<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Этика и ограничения<\/strong>: модель воспроизводит предвзятость обучающих данных; сложные модели трудно объяснить («чёрный ящик»); нужна защита персональных данных; качество модели не выше качества данных («мусор на входе — мусор на выходе»).<\/p>\n<h2>8. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Для трёх бизнес-задач (прогноз выручки, выявление спама, группировка клиентов) определите вид обучения и тип задачи.<\/li>\n<li>На платформе Kaggle найдите учебный набор данных (например, Titanic) и опишите: целевая переменная, признаки, тип задачи.<\/li>\n<\/ol>\n<h2>9. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Чем машинное обучение отличается от традиционного программирования?<\/li>\n<li>Чем обучение с учителем отличается от обучения без учителя и с подкреплением?<\/li>\n<li>Для каких задач применяют регрессию, классификацию, кластеризацию?<\/li>\n<li>Перечислите этапы разработки модели.<\/li>\n<li>Что такое переобучение?<\/li>\n<li>Почему accuracy не всегда подходит для оценки классификатора?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Искусственный интеллект · машинное обучение · глубокое обучение · обучение с учителем · без учителя · с подкреплением · регрессия · классификация · кластеризация · дерево решений · нейронная сеть · переобучение · MAE · матрица ошибок · precision · recall.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Кузнецов Д. И. Основы анализа данных и машинного обучения. — М. : ДМК Пресс, 2020.<\/li>\n<li>Документация scikit-learn. — scikit-learn.org.<\/li>\n<li>Kaggle Learn. — kaggle.com/learn.<\/li>\n<\/ol>\n"}, {"id": "lec-12", "kind": "lec", "num": 12, "title": "Интернет вещей (IoT)", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 2\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Познакомить студентов с концепцией интернета вещей, его архитектурой, устройствами, протоколами связи и платформами, областями применения, а также с преимуществами и рисками IoT.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Понятие интернета вещей.<\/li>\n<li>Архитектура IoT.<\/li>\n<li>Компоненты: датчики, исполнительные устройства, контроллеры, шлюзы.<\/li>\n<li>Протоколы и технологии связи.<\/li>\n<li>Платформы IoT.<\/li>\n<li>Области применения.<\/li>\n<li>Преимущества, вызовы, тренды.<\/li>\n<\/ol>\n<h2>1. Понятие интернета вещей<\/h2>\n<p><strong>Интернет вещей (Internet of Things, IoT)<\/strong> — сеть физических устройств, оснащённых датчиками, программами и средствами связи, которые собирают данные и обмениваются ими через интернет без постоянного участия человека.<\/p>\n<p>Ключевые характеристики: подключённость; сбор данных в реальном времени; автоматическое реагирование; удалённое управление; масштаб — миллиарды устройств.<\/p>\n<p><strong>Промышленный интернет вещей (IIoT)<\/strong> — применение IoT в промышленности, энергетике, транспорте: мониторинг оборудования, предиктивное обслуживание, учёт ресурсов.<\/p>\n<h2>2. Архитектура IoT<\/h2>\n<p>Классическая четырёхуровневая модель:<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Уровень<\/th>\n<th>Функция<\/th>\n<th>Примеры<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1. Уровень восприятия (устройства)<\/td>\n<td>Сбор данных о физическом мире и воздействие на него<\/td>\n<td>Датчики температуры, влажности, движения; реле, клапаны<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2. Сетевой уровень (передача)<\/td>\n<td>Передача данных от устройств<\/td>\n<td>Wi-Fi, Bluetooth, Zigbee, LoRaWAN, NB-IoT, 4G/5G; шлюзы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3. Уровень обработки (платформа)<\/td>\n<td>Хранение, обработка, анализ данных<\/td>\n<td>Облачные платформы, периферийные (edge) вычисления<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4. Уровень приложений<\/td>\n<td>Представление результатов и управление<\/td>\n<td>Мобильное приложение, дашборд, автоматические сценарии<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Как работает IoT-система — цикл<\/strong>: датчик измеряет параметр → контроллер оцифровывает и отправляет данные → шлюз передаёт их в облако → платформа хранит и анализирует → правило или модель принимает решение → команда уходит на исполнительное устройство → пользователь видит результат в приложении.<\/p>\n<h2>3. Компоненты IoT<\/h2>\n<ul>\n<li><strong>Датчики (сенсоры)<\/strong> — измеряют температуру, влажность, освещённость, давление, движение, уровень, газ, местоположение (GPS).<\/li>\n<li><strong>Исполнительные устройства (актуаторы)<\/strong> — выполняют действие: реле включает свет, клапан перекрывает воду, двигатель открывает шторы.<\/li>\n<li><strong>Микроконтроллеры и одноплатные компьютеры<\/strong> — «мозг» устройства: Arduino (прототипирование), ESP32 и ESP8266 (со встроенным Wi-Fi), Raspberry Pi (полноценный мини-компьютер).<\/li>\n<li><strong>Шлюзы (gateways)<\/strong> — подключают устройства с локальными протоколами (Zigbee, Bluetooth) к интернету и выполняют первичную обработку.<\/li>\n<li><strong>Облачная платформа и приложения<\/strong> — хранение, аналитика, визуализация, управление.<\/li>\n<\/ul>\n<h2>4. Протоколы и технологии связи<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Технология<\/th>\n<th>Дальность<\/th>\n<th>Скорость<\/th>\n<th>Энергопотребление<\/th>\n<th>Применение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Wi-Fi<\/td>\n<td>До 50–100 м<\/td>\n<td>Высокая<\/td>\n<td>Высокое<\/td>\n<td>Умный дом, камеры<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bluetooth / BLE<\/td>\n<td>До 10–50 м<\/td>\n<td>Средняя<\/td>\n<td>Низкое (BLE)<\/td>\n<td>Носимые устройства, метки<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Zigbee, Z-Wave<\/td>\n<td>10–100 м, ячеистая сеть<\/td>\n<td>Низкая<\/td>\n<td>Очень низкое<\/td>\n<td>Умный дом, освещение, датчики<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>LoRaWAN<\/td>\n<td>До 10–15 км<\/td>\n<td>Очень низкая<\/td>\n<td>Очень низкое<\/td>\n<td>Сельское хозяйство, учёт воды и газа<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>NB-IoT, LTE-M<\/td>\n<td>Сотовая сеть<\/td>\n<td>Низкая<\/td>\n<td>Низкое<\/td>\n<td>Счётчики, трекеры<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4G / 5G<\/td>\n<td>Сотовая сеть<\/td>\n<td>Высокая<\/td>\n<td>Высокое<\/td>\n<td>Транспорт, видеонаблюдение<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Протоколы обмена сообщениями<\/strong>: <strong>MQTT<\/strong> — лёгкий протокол «издатель–подписчик» через брокера, стандарт де-факто для IoT; <strong>CoAP<\/strong> — облегчённый аналог HTTP для слабых устройств; <strong>HTTP/REST<\/strong> — для устройств с достаточными ресурсами.<\/p>\n<h2>5. Платформы IoT<\/h2>\n<p>AWS IoT Core, Microsoft Azure IoT Hub, Google Cloud IoT-решения партнёров, ThingSpeak (учебные проекты), Blynk (мобильное управление), Home Assistant (умный дом с открытым кодом). Платформы обеспечивают подключение устройств, хранение телеметрии, правила автоматизации, дашборды и безопасность.<\/p>\n<h2>6. Области применения<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Область<\/th>\n<th>Примеры<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Умный дом<\/td>\n<td>Освещение, отопление, охранная сигнализация, протечки воды<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Носимые устройства<\/td>\n<td>Фитнес-браслеты, умные часы, медицинские мониторы<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Умный город<\/td>\n<td>Управление светофорами, парковки, уличное освещение, мониторинг качества воздуха<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Промышленность (IIoT)<\/td>\n<td>Мониторинг вибрации и температуры станков, предиктивное обслуживание<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Сельское хозяйство<\/td>\n<td>Датчики влажности почвы, автоматический полив, мониторинг теплиц и скота<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Логистика<\/td>\n<td>Трекинг грузов и транспорта, контроль температуры в рефрижераторах<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Энергетика<\/td>\n<td>Умные счётчики, учёт потребления, управление сетями<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Геоэкология<\/td>\n<td>Мониторинг склонов, оползней, уровня воды в реках<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Цифровой двойник<\/strong> — виртуальная модель физического объекта, которая обновляется по данным датчиков и позволяет прогнозировать его поведение.<\/p>\n<h2>7. Преимущества, вызовы и тренды<\/h2>\n<p><strong>Преимущества<\/strong>: автоматизация; экономия ресурсов (энергии, воды, топлива); принятие решений по данным в реальном времени; предотвращение аварий; новые сервисы.<\/p>\n<p><strong>Вызовы<\/strong>: безопасность — слабые пароли по умолчанию делают устройства мишенью ботнетов; совместимость разных стандартов; приватность данных; энергопитание удалённых датчиков; стоимость масштабирования.<\/p>\n<p><strong>Тренды<\/strong>: периферийный ИИ (Edge AI) — анализ прямо на устройстве; сети 5G и NB-IoT; стандарт Matter для умного дома; цифровые двойники предприятий и городов.<\/p>\n<h2>8. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Опишите систему мониторинга температуры и влажности в учебной аудитории: датчики, контроллер, протокол связи, платформа, правила оповещения.<\/li>\n<li>Найдите пример применения IoT в Кыргызстане (учёт электроэнергии, умные остановки, мониторинг воздуха) и опишите его архитектуру по четырём уровням.<\/li>\n<\/ol>\n<h2>9. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Дайте определение интернета вещей.<\/li>\n<li>Назовите уровни архитектуры IoT и их функции.<\/li>\n<li>Чем датчик отличается от исполнительного устройства?<\/li>\n<li>Какую роль выполняет шлюз?<\/li>\n<li>Для чего используется протокол MQTT?<\/li>\n<li>Почему безопасность — главный вызов IoT?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Интернет вещей · IIoT · датчик · актуатор · микроконтроллер · Arduino · шлюз · Zigbee · LoRaWAN · MQTT · платформа IoT · телеметрия · цифровой двойник · Edge AI.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Интернет вещей (IoT): современные технологии и приложения / под ред. И. В. Савельева. — 2022.<\/li>\n<li>Документация MQTT. — mqtt.org.<\/li>\n<li>Arduino Documentation. — docs.arduino.cc.<\/li>\n<\/ol>\n"}, {"id": "lec-13", "kind": "lec", "num": 13, "title": "Виртуальная и дополненная реальность (VR/AR)", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 2\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Познакомить студентов с технологиями виртуальной, дополненной и смешанной реальности, принципами их работы, оборудованием и средствами разработки, областями применения и перспективами.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Понятия VR, AR, MR и XR.<\/li>\n<li>Принципы работы технологий.<\/li>\n<li>Оборудование.<\/li>\n<li>Средства разработки.<\/li>\n<li>Применение в отраслях.<\/li>\n<li>Вызовы и перспективы.<\/li>\n<\/ol>\n<h2>1. Понятия VR, AR, MR и XR<\/h2>\n<p><strong>Виртуальная реальность (Virtual Reality, VR)<\/strong> — полностью искусственная трёхмерная среда, созданная компьютером, в которую пользователь погружается с помощью шлема и взаимодействует с ней.<\/p>\n<p><strong>Дополненная реальность (Augmented Reality, AR)<\/strong> — технология, накладывающая цифровые объекты (изображения, подписи, 3D-модели) на изображение реального мира в реальном времени через смартфон, планшет или очки.<\/p>\n<p><strong>Смешанная реальность (Mixed Reality, MR)<\/strong> — объединение реального и виртуального миров, при котором цифровые объекты «привязаны» к реальному пространству и с ними можно взаимодействовать как с физическими.<\/p>\n<p><strong>Расширенная реальность (Extended Reality, XR)<\/strong> — общий термин для VR, AR и MR.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Признак<\/th>\n<th>VR<\/th>\n<th>AR<\/th>\n<th>MR<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Связь с реальным миром<\/td>\n<td>Реальный мир полностью заменён<\/td>\n<td>Реальный мир дополнен цифровыми слоями<\/td>\n<td>Реальное и цифровое взаимодействуют<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Устройство<\/td>\n<td>VR-шлем<\/td>\n<td>Смартфон, планшет, AR-очки<\/td>\n<td>MR-гарнитура<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Пример<\/td>\n<td>Тренажёр пилота<\/td>\n<td>Примерка мебели через камеру смартфона<\/td>\n<td>Инженер работает с голограммой двигателя<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Метавселенная<\/strong> — концепция постоянных общих виртуальных пространств, где люди общаются, работают и совершают покупки с использованием XR.<\/p>\n<h2>2. Принципы работы<\/h2>\n<p><strong>VR<\/strong>: компьютер формирует два изображения — для каждого глаза — со смещением, создавая стереоэффект; датчики (гироскоп, акселерометр, камеры) отслеживают поворот головы и положение тела, и изображение мгновенно перестраивается. Для комфорта нужна высокая частота кадров (90 Гц и выше) и малая задержка, иначе возникает «укачивание» (киберболезнь).<\/p>\n<p><strong>AR<\/strong>: камера получает изображение; программа распознаёт плоскости, маркеры или объекты (компьютерное зрение, технология SLAM — одновременная локализация и построение карты); цифровой объект размещается в нужном месте и сохраняет положение при движении камеры.<\/p>\n<p>Типы AR: <em>маркерная<\/em> (распознаёт метку или QR-код); <em>безмаркерная<\/em> (распознаёт поверхности и пространство); <em>геолокационная<\/em> (по GPS — Pokémon GO); <em>проекционная<\/em> (изображение проецируется на реальные поверхности).<\/p>\n<h2>3. Оборудование<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Класс<\/th>\n<th>Примеры<\/th>\n<th>Особенности<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Автономные VR-шлемы<\/td>\n<td>Meta Quest<\/td>\n<td>Не нужен компьютер, доступная цена<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>VR-шлемы для ПК<\/td>\n<td>HTC Vive, Valve Index<\/td>\n<td>Высокое качество графики<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Шлемы смешанной реальности<\/td>\n<td>Apple Vision Pro, Microsoft HoloLens<\/td>\n<td>Видят реальное окружение, жесты, отслеживание взгляда<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Мобильная AR<\/td>\n<td>Смартфоны и планшеты<\/td>\n<td>Самая массовая платформа<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Аксессуары<\/td>\n<td>Контроллеры, перчатки с обратной связью, трекеры тела, 360°-камеры<\/td>\n<td>Повышают погружение<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>4. Средства разработки<\/h2>\n<ul>\n<li><strong>Unity<\/strong> и <strong>Unreal Engine<\/strong> — игровые движки, основные платформы для VR/AR-приложений.<\/li>\n<li><strong>ARKit<\/strong> (Apple, iOS) и <strong>ARCore<\/strong> (Google, Android) — наборы инструментов для мобильной AR.<\/li>\n<li><strong>Vuforia<\/strong> — распознавание изображений и объектов.<\/li>\n<li><strong>WebXR<\/strong> — VR/AR прямо в браузере.<\/li>\n<li>Инструменты 3D-моделирования: Blender, 3ds Max.<\/li>\n<\/ul>\n<h2>5. Применение в отраслях<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Отрасль<\/th>\n<th>VR<\/th>\n<th>AR<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Образование<\/td>\n<td>Виртуальные лаборатории, экскурсии, исторические реконструкции<\/td>\n<td>Оживающие учебники, 3D-модели органов и механизмов<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Медицина<\/td>\n<td>Хирургические тренажёры, терапия фобий, реабилитация<\/td>\n<td>Наложение снимков на тело пациента во время операции<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Промышленность<\/td>\n<td>Обучение персонала опасным операциям<\/td>\n<td>Инструкции по ремонту поверх оборудования, удалённый эксперт<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ретейл<\/td>\n<td>Виртуальные шоурумы<\/td>\n<td>Виртуальная примерка одежды, очков, мебели (IKEA Place)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Недвижимость и архитектура<\/td>\n<td>Виртуальные туры по объектам до постройки<\/td>\n<td>Визуализация здания на участке<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Туризм<\/td>\n<td>Виртуальные путешествия<\/td>\n<td>Информация о достопримечательностях через камеру<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Развлечения<\/td>\n<td>Игры, концерты<\/td>\n<td>Мобильные игры, фильтры в соцсетях<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>6. Вызовы и перспективы<\/h2>\n<p><strong>Вызовы<\/strong>: стоимость оборудования и разработки контента; ограничения по точности наложения и времени работы батареи; укачивание и усталость; конфиденциальность (камеры постоянно сканируют окружение); недостаток качественного контента на местных языках.<\/p>\n<p><strong>Перспективы<\/strong>: лёгкие AR-очки вместо смартфона; интеграция с ИИ (голосовые ассистенты, распознавание объектов); «цифровые двойники» предприятий для обучения; рост рынка XR в образовании и промышленности.<\/p>\n<h2>7. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Установите любое AR-приложение (например, примерка мебели, переводчик с камерой) и опишите: тип AR, что распознаётся, какую задачу пользователя решает приложение.<\/li>\n<li>Предложите идею VR- или AR-решения для университета: целевая аудитория, сценарий использования, оборудование, ожидаемый эффект.<\/li>\n<\/ol>\n<h2>8. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>В чём разница между VR и AR?<\/li>\n<li>Что такое смешанная реальность и XR?<\/li>\n<li>Почему в VR важны частота кадров и задержка?<\/li>\n<li>Какие типы AR вы знаете?<\/li>\n<li>Какие инструменты используют для разработки VR/AR?<\/li>\n<li>Приведите примеры применения VR и AR в медицине и ретейле.<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Виртуальная реальность · дополненная реальность · смешанная реальность · XR · метавселенная · VR-шлем · SLAM · маркерная AR · Unity · ARKit · ARCore · WebXR · киберболезнь.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Документация Unity XR. — docs.unity3d.com.<\/li>\n<li>Apple ARKit. — developer.apple.com/augmented-reality.<\/li>\n<li>Google ARCore. — developers.google.com/ar.<\/li>\n<\/ol>\n"}, {"id": "lec-14", "kind": "lec", "num": 14, "title": "Цифровой маркетинг и аналитика", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 2\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Познакомить студентов с каналами и инструментами цифрового маркетинга, воронкой продаж, ключевыми показателями эффективности (KPI) и методами аналитики рекламных кампаний.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Понятие и цели цифрового маркетинга.<\/li>\n<li>Каналы цифрового маркетинга.<\/li>\n<li>Воронка продаж и путь клиента.<\/li>\n<li>Ключевые показатели эффективности.<\/li>\n<li>Инструменты аналитики.<\/li>\n<li>Стратегия и тренды.<\/li>\n<\/ol>\n<h2>1. Понятие и цели цифрового маркетинга<\/h2>\n<p><strong>Цифровой маркетинг<\/strong> — продвижение товаров и услуг с использованием цифровых каналов: сайтов, поисковых систем, социальных сетей, электронной почты, мессенджеров, мобильных приложений.<\/p>\n<p>Отличия от традиционного маркетинга: точный выбор аудитории (<strong>таргетинг<\/strong>); измеримость каждого действия; возможность быстро менять кампанию по результатам; двусторонняя коммуникация с клиентом.<\/p>\n<p>Цели: повышение узнаваемости бренда; привлечение трафика; генерация заявок (лидов); рост продаж; удержание и лояльность клиентов.<\/p>\n<h2>2. Каналы цифрового маркетинга<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Канал<\/th>\n<th>Суть<\/th>\n<th>Инструменты<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>SEO (поисковая оптимизация)<\/td>\n<td>Улучшение сайта, чтобы он занимал высокие позиции в бесплатной выдаче поисковиков<\/td>\n<td>Ключевые слова, качественный контент, скорость сайта, ссылки<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Контекстная реклама (PPC, SEM)<\/td>\n<td>Платные объявления в поиске и на сайтах, показываемые по запросу пользователя<\/td>\n<td>Google Ads, Яндекс Директ<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SMM (маркетинг в социальных сетях)<\/td>\n<td>Продвижение и общение с аудиторией в соцсетях<\/td>\n<td>Instagram, Facebook, TikTok, Telegram, Meta Business Suite<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Таргетированная реклама<\/td>\n<td>Показ объявлений аудитории, выбранной по полу, возрасту, интересам, геолокации<\/td>\n<td>Рекламные кабинеты соцсетей<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Контент-маркетинг<\/td>\n<td>Полезный контент, привлекающий и удерживающий аудиторию<\/td>\n<td>Статьи, видео, подкасты, инфографика<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Email-маркетинг<\/td>\n<td>Рассылки подписчикам<\/td>\n<td>Mailchimp, SendPulse<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Маркетинг влияния<\/td>\n<td>Сотрудничество с блогерами<\/td>\n<td>Обзоры, интеграции<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Мессенджер-маркетинг<\/td>\n<td>Чат-боты и рассылки в мессенджерах<\/td>\n<td>WhatsApp Business, Telegram-боты<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Видеомаркетинг<\/td>\n<td>Ролики, прямые эфиры<\/td>\n<td>YouTube, Reels<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Воронка продаж и путь клиента<\/h2>\n<p><strong>Воронка продаж<\/strong> — модель, показывающая, как сокращается число потенциальных клиентов на каждом этапе пути к покупке.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Этап<\/th>\n<th>Действие пользователя<\/th>\n<th>Показатель<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Охват / показы<\/td>\n<td>Увидел рекламу<\/td>\n<td>Impressions, охват<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Интерес<\/td>\n<td>Кликнул, перешёл на сайт<\/td>\n<td>Клики, CTR<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Рассмотрение<\/td>\n<td>Изучил товар, добавил в корзину<\/td>\n<td>Время на сайте, глубина просмотра<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Конверсия<\/td>\n<td>Купил, оставил заявку<\/td>\n<td>Конверсии, CR<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Лояльность<\/td>\n<td>Купил повторно, порекомендовал<\/td>\n<td>Повторные покупки, LTV<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Модель <strong>AIDA<\/strong>: внимание (Attention) → интерес (Interest) → желание (Desire) → действие (Action).<\/p>\n<h2>4. Ключевые показатели эффективности (KPI)<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Показатель<\/th>\n<th>Формула<\/th>\n<th>Смысл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>CTR (кликабельность)<\/td>\n<td>Клики / Показы × 100 %<\/td>\n<td>Насколько объявление привлекает внимание<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CPC (цена клика)<\/td>\n<td>Затраты / Клики<\/td>\n<td>Стоимость одного перехода<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CPM (цена 1000 показов)<\/td>\n<td>Затраты / Показы × 1000<\/td>\n<td>Стоимость охвата<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CR (коэффициент конверсии)<\/td>\n<td>Конверсии / Клики × 100 %<\/td>\n<td>Доля посетителей, совершивших целевое действие<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CPA (цена действия)<\/td>\n<td>Затраты / Конверсии<\/td>\n<td>Сколько стоит одна продажа или заявка<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ROI (окупаемость инвестиций)<\/td>\n<td>(Доход − Затраты) / Затраты × 100 %<\/td>\n<td>Рентабельность кампании<\/td>\n<\/tr>\n<tr class=\
