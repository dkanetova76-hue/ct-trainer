<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цифровые технологии</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Электронный учебник «Цифровые технологии» (710500): лекции, практические занятия, СРС, тесты по таксономии Блума, контрольные вопросы и отчёты.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>/* Layout: top bar with section tabs, left course map, reading column (~70ch), right on-page contents on wide screens.
   Look: a board-room dossier — cool paper, slate-blue ink, a stamp-red accent used only for marks and alerts. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunk:#e9ebe6; --ink:#1c2531; --muted:#5a6573; --line:#d6dbd9;
  --accent:#2a4a7a; --accent-soft:#e3e9f3; --stamp:#a5372a; --stamp-soft:#f6e6e2;
  --ok:#2d7a4d; --ok-soft:#e1f0e6; --warn:#a06a12; --warn-soft:#f6ecd8;
  --f-display:"Literata", "PT Serif", Georgia, serif;
  --f-read:"Literata", "PT Serif", Georgia, serif;
  --f-ui:"IBM Plex Sans", "PT Sans", "Segoe UI", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", "PT Mono", Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a21; --surface:#1c232c; --sunk:#232b36; --ink:#e4e8ee; --muted:#9aa5b3; --line:#323c49;
  --accent:#8fb0e3; --accent-soft:#25344a; --stamp:#e2816f; --stamp-soft:#3a2622;
  --ok:#7cc79a; --ok-soft:#1f3529; --warn:#e0b265; --warn-soft:#3a2f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a21; --surface:#1c232c; --sunk:#232b36; --ink:#e4e8ee; --muted:#9aa5b3; --line:#323c49;
  --accent:#8fb0e3; --accent-soft:#25344a; --stamp:#e2816f; --stamp-soft:#3a2622;
  --ok:#7cc79a; --ok-soft:#1f3529; --warn:#e0b265; --warn-soft:#3a2f1c; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;line-height:1.15;text-decoration:none;color:var(--ink);min-width:0}
.brand b{font-family:var(--f-display);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:8px 11px;border-radius:var(--r);text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.tabs a:hover{background:var(--sunk);color:var(--ink)}
.tabs a.on{color:var(--accent);background:var(--accent-soft)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 10px;cursor:pointer}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr) 220px;gap:0;max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:18px 10px 40px max(16px,env(safe-area-inset-left,0px))}
.side h6{margin:16px 8px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side h6:first-child{margin-top:0}
.side a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:var(--r);text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.3}
.side a:hover{background:var(--sunk)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side a .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:34px;flex:none}
.side a.on .n{color:var(--accent)}
.side a .dot{margin-left:auto;flex:none;width:7px;height:7px;border-radius:50%;background:transparent;align-self:center}
.side a.done .dot{background:var(--ok)}

main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:760px;margin:0 auto}
.toc{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 57px);overflow-y:auto;padding:28px 16px 40px 8px;font-size:12.5px}
.toc b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.toc a{display:block;padding:3px 0 3px 10px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;line-height:1.35}
.toc a:hover,.toc a.on{color:var(--accent);border-left-color:var(--accent)}

/* page head */
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);font-weight:600;margin:0 0 8px}
h1.ttl{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:0 0 14px;text-wrap:balance}
.head-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.done-toggle{cursor:pointer}
.done-toggle input{accent-color:var(--ok)}
.done-toggle.is-done{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}

/* reading text */
.doc{font-family:var(--f-read);font-size:17px;line-height:1.7}
.doc h2{font-family:var(--f-display);font-size:23px;line-height:1.25;font-weight:600;margin:44px 0 12px;text-wrap:balance;scroll-margin-top:80px}
.doc h3{font-family:var(--f-ui);font-size:17px;font-weight:600;margin:28px 0 8px;scroll-margin-top:80px}
.doc h4{font-family:var(--f-ui);font-size:15px;font-weight:600;margin:22px 0 6px;color:var(--accent)}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{padding-left:24px;margin:0 0 14px}
.doc li p{margin:0 0 4px}
.doc blockquote{margin:0 0 14px;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 var(--r) var(--r) 0}
.doc blockquote p:last-child{margin:0}
.doc .meta{display:flex;flex-wrap:wrap;gap:6px 8px;font-family:var(--f-ui);font-size:13px;color:var(--muted);margin:0 0 8px}
.doc .meta p{margin:0;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.doc .meta p:has(br){border-radius:var(--r);flex-basis:100%;padding:8px 12px;line-height:1.55}
.doc .note{font-family:var(--f-ui);font-size:13.5px;color:var(--muted)}
.tbl{overflow-x:auto;margin:6px 0 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.doc table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--sunk);font-weight:600}
.doc tr:last-child td{border-bottom:0}
.doc td p,.doc th p{margin:0}
.katex{font-size:1.06em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0}

/* answer fields */
.answer,.fld-wrap{font-family:var(--f-ui);margin:14px 0 26px;padding:14px;border:1px dashed var(--accent);border-radius:var(--r);background:var(--surface)}
.answer label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.answer label span{text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400}
textarea.fld,.answer textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:var(--bg);font-family:var(--f-ui);font-size:14.5px;line-height:1.5}
.answer.big textarea{min-height:160px}
.answer .saved{font-size:12px;color:var(--muted);margin-top:4px;min-height:1em}
.doc p > textarea.fld{display:block;margin-top:4px}
.doc input.chk{width:18px;height:18px;vertical-align:-3px;margin-right:8px;accent-color:var(--accent)}
.chk-count{font-family:var(--f-ui);font-weight:600;color:var(--accent)}

/* widgets */
.widget{font-family:var(--f-ui);font-size:14px;margin:18px 0 24px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.w-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline;padding:12px 16px;background:var(--sunk);border-bottom:1px solid var(--line)}
.w-head b{font-size:14.5px}
.w-head small{color:var(--muted)}
.w-body{padding:14px 16px;display:grid;gap:14px}
.w-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
.w-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.w-row label{font-size:13.5px}
.w-row output,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px}
.w-row input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.w-in{display:flex;flex-direction:column;gap:4px;font-size:13px}
.w-in input,.w-in select{border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;background:var(--bg);font-family:var(--f-mono);font-size:14px;width:100%}
.w-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.w-kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--bg)}
.w-kpi span{display:block;font-size:12px;color:var(--muted)}
.w-kpi b{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.w-kpi.good{border-color:var(--ok);background:var(--ok-soft)} .w-kpi.bad{border-color:var(--stamp);background:var(--stamp-soft)} .w-kpi.mid{border-color:var(--warn);background:var(--warn-soft)}
.w-msg{padding:10px 12px;border-radius:var(--r);background:var(--accent-soft);font-size:13.5px}
.w-msg.bad{background:var(--stamp-soft)} .w-msg.good{background:var(--ok-soft)}
.w-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:13.5px}
.bar i{display:block;height:12px;border-radius:3px;background:var(--accent);min-width:2px;transition:width .2s}
.bar .trk{background:var(--sunk);border-radius:3px}
.bar.win i{background:var(--ok)} .bar.low i{background:var(--stamp)}
.bar b{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.alt{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;background:var(--bg)}
.alt h5{margin:0;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.alt h5 .num{color:var(--accent);white-space:nowrap}
.alt.win{border-color:var(--ok)}
.sc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:4px 9px;cursor:pointer;font-family:var(--f-mono);font-size:13px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--surface)}
.rate-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.rate-tbl td,.rate-tbl th{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.rate-tbl th{font-weight:600;color:var(--muted);font-size:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08);color:var(--surface)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--stamp);border-color:var(--stamp)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--f-ui)}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;max-width:48%;color:var(--ink)}
.pager a small{color:var(--muted);font-size:12px}
.pager a:last-child{text-align:right;margin-left:auto}

/* title page */
.cover{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:30px 28px;display:grid;gap:18px;position:relative;overflow:hidden}
.cover .seal{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border:2px solid var(--stamp);border-radius:50%;opacity:.18}
.cover .seal::after{content:"";position:absolute;inset:12px;border:1px solid var(--stamp);border-radius:50%}
.cover h1{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,4.2vw,44px);line-height:1.1;margin:0;text-wrap:balance;max-width:16ch}
.cover .sub{font-size:15px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:10px 12px}
.facts b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.facts span{font-size:12px;color:var(--muted)}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:22px;margin:36px 0 12px}
.struct td .lnk{display:block;text-decoration:none;color:var(--ink);line-height:1.35}
.struct td .lnk small{font-family:var(--f-mono);color:var(--muted)}
.struct td .lnk.done small::after{content:" ✓";color:var(--ok)}
.prog{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card b{font-size:15px}
.card span{font-size:13px;color:var(--muted)}
.card .lvl{font-family:var(--f-mono);font-size:12px;color:var(--stamp)}
.card .res{margin-top:auto;font-size:12.5px;font-family:var(--f-mono)}

/* tests */
.quiz{font-family:var(--f-ui)}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px}
.q-prog{height:4px;background:var(--sunk);border-radius:2px;margin-bottom:22px;overflow:hidden}
.q-prog i{display:block;height:100%;background:var(--accent)}
.q-text{font-family:var(--f-read);font-size:20px;line-height:1.45;margin:0 0 18px}
.opts{display:grid;gap:8px;margin-bottom:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 14px;cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none;width:18px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--stamp);background:var(--stamp-soft)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:var(--r);margin-bottom:16px;font-size:14.5px}
.fb.good{background:var(--ok-soft)} .fb.bad{background:var(--stamp-soft)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.score-big{font-family:var(--f-mono);font-size:54px;font-weight:600;line-height:1}
.review{display:grid;gap:10px;margin-top:10px}
.review div{border:1px solid var(--line);border-left:3px solid var(--stamp);border-radius:var(--r);padding:10px 12px;background:var(--surface);font-size:14px}
.review p{margin:4px 0}

/* exam */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tickets a{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink);font-family:var(--f-mono);font-size:18px;font-weight:600}
.tickets a:hover{border-color:var(--accent);color:var(--accent)}
.tickets a.has{border-color:var(--ok);color:var(--ok)}
.tq{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:16px;margin-bottom:14px;font-family:var(--f-ui)}
.tq .q{font-family:var(--f-read);font-size:17px;line-height:1.55;margin:6px 0 12px}

/* report */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-family:var(--f-ui)}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--surface);font-size:14.5px;color:var(--ink)}
.ready{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);font-family:var(--f-ui);display:grid;gap:8px}
.ready ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--stamp)}
.sheet{background:#fff;color:#111;font-family:"Times New Roman",Times,serif;font-size:15px;line-height:1.5;padding:40px 36px 40px 56px;border:1px solid var(--line);border-radius:4px;margin-top:14px;overflow-x:auto}
.sheet h3{text-align:center;font-size:16px;margin:0 0 6px}
.sheet h4{font-size:15px;margin:16px 0 4px}
.sheet p{margin:0 0 6px;white-space:pre-wrap}
.sheet .c{text-align:center}
.sheet .empty{color:#a5372a;font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--stamp)}

figure.flow{margin:10px 0 20px;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px}
figure.flow svg{display:block;min-width:640px;width:100%;height:auto}
figure.flow .nd{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
figure.flow .nd.end{fill:var(--ok-soft);stroke:var(--ok)}
figure.flow .nd.ask{fill:var(--warn-soft);stroke:var(--warn)}
figure.flow text{fill:var(--ink);font-family:var(--f-ui);font-size:13px}
figure.flow .lb{fill:var(--muted);font-size:12px}
figure.flow path{stroke:var(--muted);stroke-width:1.4;fill:none}
figure.flow .ah{fill:var(--muted);stroke:none}

<script>window.__DATA__={"sections": [{"id": "program", "kind": "program", "num": 0, "title": "Рабочая программа дисциплины", "html": "<h2>1. Общая характеристика<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Показатель<\/th>\n<th>Содержание<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Код дисциплины<\/td>\n<td>Б.1.3.10<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Направление подготовки<\/td>\n<td>710500 «Интернет-технологии и управление»<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Профиль<\/td>\n<td>Интернет-технологии и управление<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Академическая степень<\/td>\n<td>Бакалавриат<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Трудоёмкость<\/td>\n<td>4 кредита (ECTS) / 120 академических часов<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Лекции<\/td>\n<td>30 часов<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Практические занятия<\/td>\n<td>30 часов<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Самостоятельная работа студентов<\/td>\n<td>60 часов<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Итоговая аттестация<\/td>\n<td>Экзамен (компьютерное тестирование)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Формируемые компетенции<\/td>\n<td>ОК-1, ПК-1, ИК-2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Разработчик<\/td>\n<td>к.ф.-м.н., доцент Канетова Д. Э.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Кафедра<\/td>\n<td>«Информационные технологии и математика», МНУ им. К. Ш. Токтомаматова<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>2. Цель дисциплины<\/h2>\n<p>Формирование у студентов базовых знаний и практических навыков в области современных цифровых технологий, необходимых для решения профессиональных задач в сфере информационных технологий и управления: изучение фундаментальных аспектов цифровой трансформации, инструментов и платформ для сбора и анализа данных, основ интернет-технологий для оптимизации бизнес-процессов и принятия управленческих решений.<\/p>\n<h2>3. Задачи дисциплины<\/h2>\n<ol type=\"1\">\n<li>Освоить принципы работы цифровых систем и платформ.<\/li>\n<li>Приобрести навыки использования цифровых инструментов для автоматизации и управления процессами.<\/li>\n<li>Изучить подходы к сбору, обработке и анализу данных для поддержки управленческих решений.<\/li>\n<li>Развить знания в области интернет-технологий, включая веб-разработку и основы кибербезопасности.<\/li>\n<li>Сформировать способность адаптироваться к быстро меняющимся требованиям цифрового мира и применять новые технологии для достижения конкурентных преимуществ.<\/li>\n<\/ol>\n<h2>4. Место дисциплины<\/h2>\n<p><strong>Пререквизиты<\/strong>: информатика; математика и статистика; информационные системы и технологии; английский язык (базовый уровень).<\/p>\n<p><strong>Постреквизиты<\/strong>: веб-разработка и веб-дизайн; анализ данных и машинное обучение; информационная безопасность; цифровой маркетинг и SMM; базы данных и большие данные; управление цифровыми проектами.<\/p>\n<h2>5. Компетенции и результаты обучения<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Код<\/th>\n<th>Компетенция<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>ОК-1<\/td>\n<td>Способен критически оценивать и использовать научные знания об окружающем мире, ориентироваться в ценностях жизни и культуры, занимать активную гражданскую позицию<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ПК-1<\/td>\n<td>Способен проводить исследование и анализ рынка интернет-технологий<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ИК-2<\/td>\n<td>Способен приобретать и применять новые знания с использованием информационных технологий для решения сложных проблем в работе и обучении<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>РО-1.<\/strong> Способен использовать базовые знания в профессиональной работе с использованием информационных технологий, анализировать и оценивать явления в науке и технике.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Студент должен<\/th>\n<th>Содержание<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Знать<\/td>\n<td>Принципы работы цифровых технологий; основы обработки и анализа данных; принципы интернет-технологий, баз данных и информационных систем; основы кибербезопасности; основы цифровой трансформации<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Уметь<\/td>\n<td>Использовать цифровые инструменты для анализа данных и поддержки решений; применять интернет-технологии; автоматизировать рабочие процессы; анализировать и визуализировать данные; работать с цифровыми платформами<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Владеть<\/td>\n<td>Базовыми навыками программирования и работы с данными; инструментами веб-разработки и анализа данных; методами защиты данных; навыками самообучения и работы с документацией на английском языке<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>6. Тематический план<\/h2>\n<p>Каждая тема включает 2 часа лекций, 2 часа практических занятий и 4 часа СРС.<\/p>\n<table style=\"width:100%;\">\n\n<thead>\n<tr class=\"header\">\n<th>№<\/th>\n<th>Тема<\/th>\n<th>Лек.<\/th>\n<th>Пр.<\/th>\n<th>СРС<\/th>\n<th>Модуль<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Введение в цифровые технологии<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Основы компьютерных технологий<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Основы работы с данными<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>Базы данных и SQL<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5<\/td>\n<td>Анализ и визуализация данных<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>6<\/td>\n<td>Введение в интернет-технологии<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>7<\/td>\n<td>Современные бизнес-тренды и цифровизация<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М1<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>8<\/td>\n<td>Методология проектирования предприятий для цифровизации<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>9<\/td>\n<td>Цифровая безопасность и защита информации<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>10<\/td>\n<td>Облачные технологии<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>11<\/td>\n<td>Машинное обучение<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>12<\/td>\n<td>Интернет вещей (IoT)<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>13<\/td>\n<td>Виртуальная и дополненная реальность (VR/AR)<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>14<\/td>\n<td>Цифровой маркетинг и аналитика<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>15<\/td>\n<td>Цифровая трансформация бизнеса<\/td>\n<td>2<\/td>\n<td>2<\/td>\n<td>4<\/td>\n<td>М2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><\/td>\n<td><strong>Итого<\/strong><\/td>\n<td><strong>30<\/strong><\/td>\n<td><strong>30<\/strong><\/td>\n<td><strong>60<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Практические занятия<\/strong>: ПЗ-1 «Современные бизнес-тренды и актуальность цифровых технологий»; ПЗ-2 «Эволюция ИТ-индустрии»; ПЗ-3 «Корпоративные информационные системы»; ПЗ-4 «Методология архитектуры предприятия»; ПЗ-5 «Интернет вещей»; ПЗ-6 «Поддержка принятия решений и интеллектуальный анализ данных»; ПЗ-7 «Моделирование и мультиагентные системы»; ПЗ-8 «Машинное обучение» (занятия 8–9); ПЗ-9 «VR/AR» (занятия 10–11); ПЗ-10 «Цифровой маркетинг и аналитика» (занятия 12–13); ПЗ-11 «Цифровая трансформация бизнеса» (занятия 14–15). Практические задания к темам 2–4, 6, 9 и 10 даны в конце соответствующих лекций; SQL-тренажёр — в лекции 4.<\/p>\n<h2>7. Система оценивания<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Вид контроля<\/th>\n<th>Форма<\/th>\n<th>Баллы<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Модуль 1 (лекции 1–7)<\/td>\n<td>Компьютерное тестирование<\/td>\n<td>20<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Модуль 2 (лекции 8–15)<\/td>\n<td>Письменный / устный ответ на контрольные вопросы<\/td>\n<td>20<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Текущий контроль (с учётом СРС)<\/td>\n<td>Практические занятия, кейсы СРС, активность<\/td>\n<td>30<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Итоговый контроль (экзамен)<\/td>\n<td>Компьютерное тестирование<\/td>\n<td>30<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>Итого<\/strong><\/td>\n<td><\/td>\n<td><strong>100<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Студенты, набравшие в сумме не менее 51 балла, получают положительную оценку.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Баллы<\/th>\n<th>Буквенная оценка<\/th>\n<th>Цифровой эквивалент<\/th>\n<th>Традиционная оценка<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>85–100<\/td>\n<td>A<\/td>\n<td>4,0<\/td>\n<td>Отлично<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>80–84<\/td>\n<td>B<\/td>\n<td>3,33<\/td>\n<td>Хорошо<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>70–79<\/td>\n<td>C<\/td>\n<td>3,0<\/td>\n<td>Хорошо<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>61–69<\/td>\n<td>D<\/td>\n<td>2,33<\/td>\n<td>Удовлетворительно<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>51–60<\/td>\n<td>E<\/td>\n<td>2,0<\/td>\n<td>Удовлетворительно<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>31–50<\/td>\n<td>FX<\/td>\n<td>0<\/td>\n<td>Неудовлетворительно<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>0–30<\/td>\n<td>F<\/td>\n<td>0<\/td>\n<td>Неудовлетворительно<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>8. Требования дисциплины<\/h2>\n<ul>\n<li>Регулярное посещение лекций и практических занятий, участие в обсуждениях.<\/li>\n<li>Выполнение практических работ и кейсов СРС в срок; задержка сдачи может привести к снижению баллов.<\/li>\n<li>Самостоятельное выполнение заданий: ответы набираются своими словами, плагиат и копирование чужих работ не допускаются.<\/li>\n<li>Подготовка к модульным контролям по тестам и контрольным вопросам учебника.<\/li>\n<\/ul>\n<h2>9. Литература<\/h2>\n<p><strong>Основная<\/strong><\/p>\n<ol type=\"1\">\n<li>Фролов К. В., Иванов Д. Д., Фролов А. К. Цифровые технологии : учеб. пособие. — СПб., 2024. — 99 с.<\/li>\n<li>Информационные технологии. Курс лекций. — vshot.ru/it-ebook.<\/li>\n<li>Концепция цифровой трансформации Кыргызской Республики на 2024–2028 годы. — cbd.minjust.gov.kg.<\/li>\n<\/ol>\n<p><strong>Дополнительная<\/strong><\/p>\n<ol type=\"1\">\n<li>Прохоров А., Коник Л. Цифровая трансформация: анализ, тренды, мировой опыт. — 2021.<\/li>\n<li>Интернет вещей (IoT): современные технологии и приложения / под ред. И. В. Савельева. — 2022.<\/li>\n<li>Кузнецов Д. И. Основы анализа данных и машинного обучения. — М. : ДМК Пресс, 2020.<\/li>\n<li>Таненбаум Э. С. Компьютерные сети. — СПб. : Питер, 2020.<\/li>\n<li>Котлер Ф. Маркетинг 5.0: технологии для человечности. — М. : Альпина, 2021.<\/li>\n<\/ol>\n<p><strong>Интернет-ресурсы<\/strong><\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Ресурс<\/th>\n<th>Назначение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Coursera — «Foundations of Data Science»<\/td>\n<td>Основы анализа данных<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Kaggle (kaggle.com)<\/td>\n<td>Наборы данных и практика машинного обучения<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Microsoft Learn (learn.microsoft.com)<\/td>\n<td>Облачные технологии, Azure<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Codecademy — «Introduction to Cybersecurity»<\/td>\n<td>Основы кибербезопасности<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DataCamp — «Introduction to Python»<\/td>\n<td>Python для анализа данных<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Google Digital Garage<\/td>\n<td>Основы цифрового маркетинга<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>AWS Training (aws.training)<\/td>\n<td>Облачные сервисы Amazon<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>W3Schools, MDN Web Docs<\/td>\n<td>HTML, CSS, JavaScript, SQL<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}, {"id": "lec-1", "kind": "lec", "num": 1, "title": "Введение в цифровые технологии", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 1\n<\/p>\n<p>\nОК-1, ПК-1\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Познакомить студентов с базовыми понятиями цифровых технологий, показать их место в современной экономике, управлении и повседневной жизни, а также сформировать понимание различий между оцифровкой, цифровизацией и цифровой трансформацией.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Определение и суть цифровых технологий.<\/li>\n<li>История и этапы развития цифровых технологий.<\/li>\n<li>Влияние цифровизации на общество и экономику.<\/li>\n<li>Ключевые технологии: обзор и применение.<\/li>\n<li>Роль цифровых технологий в управлении и бизнесе.<\/li>\n<li>Современные тренды цифровизации.<\/li>\n<li>Пример из практики и вопросы для обсуждения.<\/li>\n<\/ol>\n<h2>1. Определение и суть цифровых технологий<\/h2>\n<p><strong>Цифровые технологии<\/strong> — совокупность методов, устройств и программного обеспечения, которые используют цифровую (двоичную) форму представления данных для их сбора, обработки, хранения и передачи.<\/p>\n<p>Любая информация — текст, звук, изображение, показания датчика — в цифровой системе превращается в последовательность нулей и единиц. Именно это делает информацию универсальной: её можно без потерь копировать, передавать по сети на любое расстояние, обрабатывать программами и объединять с другими данными.<\/p>\n<p>Примеры цифровых технологий: компьютерные системы, интернет, мобильная связь, базы данных, облачные сервисы, искусственный интеллект.<\/p>\n<p><strong>Основные характеристики цифровых технологий<\/strong><\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Характеристика<\/th>\n<th>Содержание<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Скорость обработки<\/td>\n<td>Большие объёмы информации обрабатываются за доли секунды<\/td>\n<td>Поиск в интернете по миллиардам страниц<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Автоматизация<\/td>\n<td>Рутинные операции выполняются без участия человека<\/td>\n<td>Автоматическое начисление зарплаты<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Интеграция<\/td>\n<td>Разные системы и устройства обмениваются данными<\/td>\n<td>Интернет-магазин передаёт заказ на склад и в службу доставки<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Масштабируемость<\/td>\n<td>Решение легко тиражируется на новых пользователей<\/td>\n<td>Мобильное приложение банка для миллиона клиентов<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Точность и воспроизводимость<\/td>\n<td>Цифровая копия идентична оригиналу<\/td>\n<td>Электронный документ с цифровой подписью<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Три понятия, которые важно различать<\/strong><\/p>\n<ul>\n<li><strong>Оцифровка (digitization)<\/strong> — перевод аналоговой информации в цифровую форму: сканирование бумажного архива, запись звука в файл.<\/li>\n<li><strong>Цифровизация (digitalization)<\/strong> — использование цифровых данных и технологий для изменения отдельных процессов: электронный документооборот вместо бумажного, онлайн-запись к врачу.<\/li>\n<li><strong>Цифровая трансформация (digital transformation)<\/strong> — глубокое изменение бизнес-модели, структуры и культуры организации на основе цифровых технологий: банк, который превратился в мобильную платформу финансовых услуг.<\/li>\n<\/ul>\n<blockquote>\n<p>Оцифровка меняет носитель информации, цифровизация — процесс, цифровая трансформация — саму модель деятельности.<\/p>\n<\/blockquote>\n<h2>2. История и этапы развития цифровых технологий<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Период<\/th>\n<th>Ключевые события и технологии<\/th>\n<th>Значение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1940–1960-е<\/td>\n<td>Первые электронные вычислительные машины (ENIAC, UNIVAC), языки программирования FORTRAN и COBOL<\/td>\n<td>Компьютер как инструмент научных и военных расчётов<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1970–1980-е<\/td>\n<td>Микропроцессор, персональные компьютеры (Apple II, IBM PC), локальные сети<\/td>\n<td>Компьютер приходит в офис и дом<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>1990-е<\/td>\n<td>Всемирная паутина (WWW), браузеры, электронная почта, первые интернет-магазины<\/td>\n<td>Массовая цифровизация данных и коммуникаций<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2000-е<\/td>\n<td>Широкополосный интернет, поисковые системы, социальные сети, смартфоны<\/td>\n<td>Информация доступна в любом месте и в любое время<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>2010-е – н. в.<\/td>\n<td>Облачные вычисления, большие данные, интернет вещей, искусственный интеллект, блокчейн<\/td>\n<td>Цифровые технологии становятся основой экономики<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Каждая волна снижала стоимость вычислений и расширяла круг пользователей. По наблюдению, известному как <strong>закон Мура<\/strong>, количество транзисторов на кристалле микросхемы долгое время удваивалось примерно каждые два года, что и обеспечило экспоненциальный рост производительности.<\/p>\n<h2>3. Влияние цифровизации на общество и экономику<\/h2>\n<p><strong>Позитивные изменения<\/strong><\/p>\n<ol type=\"1\">\n<li><em>Экономика<\/em>: ускорение бизнес-процессов, снижение транзакционных издержек, появление новых отраслей — электронной коммерции, финтеха, цифровых платформ.<\/li>\n<li><em>Общество<\/em>: доступ к информации и образованию, электронные государственные услуги, развитие удалённой работы и обучения.<\/li>\n<li><em>Государственное управление<\/em>: прозрачность процедур, сокращение очередей и бумажного документооборота. В Кыргызской Республике эти задачи закреплены в Концепции цифровой трансформации на 2024–2028 годы (портал государственных услуг, система электронного взаимодействия «Түндүк»).<\/li>\n<\/ol>\n<p><strong>Негативные аспекты и риски<\/strong><\/p>\n<ol type=\"1\">\n<li><em>Безопасность<\/em>: рост киберугроз, утечки персональных данных.<\/li>\n<li><em>Социальные риски<\/em>: цифровое неравенство между городом и селом, между поколениями.<\/li>\n<li><em>Экономические риски<\/em>: зависимость от технологий и поставщиков, исчезновение части профессий.<\/li>\n<\/ol>\n<h2>4. Ключевые технологии: обзор и применение<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Технология<\/th>\n<th>Суть<\/th>\n<th>Пример применения<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Big Data (большие данные)<\/td>\n<td>Анализ огромных массивов данных для прогнозов и решений<\/td>\n<td>Поисковые системы ранжируют результаты по поведению миллионов пользователей<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>IoT (интернет вещей)<\/td>\n<td>Связь между физическими устройствами через интернет<\/td>\n<td>Умный дом, датчики на производстве<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>AI (искусственный интеллект)<\/td>\n<td>Системы, выполняющие задачи, требующие интеллекта<\/td>\n<td>Чат-боты, голосовые ассистенты, распознавание лиц<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Блокчейн<\/td>\n<td>Распределённый реестр, записи в котором нельзя незаметно изменить<\/td>\n<td>Криптовалюты, смарт-контракты<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Облачные технологии<\/td>\n<td>Хранение данных и работа приложений через интернет<\/td>\n<td>Google Drive, Microsoft 365<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>VR/AR<\/td>\n<td>Виртуальная и дополненная реальность<\/td>\n<td>Тренажёры, примерка товаров<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Подробно каждая из этих технологий рассматривается в последующих лекциях курса.<\/p>\n<h2>5. Роль цифровых технологий в управлении и бизнесе<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Сфера<\/th>\n<th>Цифровые инструменты<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Управление персоналом<\/td>\n<td>HRM-системы для подбора, учёта и обучения сотрудников<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Маркетинг<\/td>\n<td>Аналитика данных и таргетированная реклама<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Производство<\/td>\n<td>Промышленный интернет вещей, роботизация<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Финансы<\/td>\n<td>ИИ для оценки кредитного риска, онлайн-платежи<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Управление организацией<\/td>\n<td>ERP-системы, электронный документооборот, дашборды руководителя<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Преимущества для бизнеса<\/strong>: снижение издержек, повышение скорости процессов, рост качества решений за счёт данных, новые каналы продаж.<\/p>\n<h2>6. Современные тренды цифровизации<\/h2>\n<ol type=\"1\">\n<li><strong>Омниканальность<\/strong> — единый клиентский опыт в онлайн- и офлайн-каналах (интернет-магазин + пункты выдачи + мобильное приложение).<\/li>\n<li><strong>Кибербезопасность<\/strong> — рост инвестиций в защиту данных, шифрование, биометрическую аутентификацию.<\/li>\n<li><strong>Платформенная экономика<\/strong> — сервисы, которые соединяют продавцов и покупателей (маркетплейсы, такси-агрегаторы).<\/li>\n<li><strong>Гиперавтоматизация<\/strong> — сочетание ИИ и программных роботов (RPA) для автоматизации сложных процессов.<\/li>\n<li><strong>Устойчивое развитие<\/strong> — цифровой мониторинг энергопотребления и экологических показателей.<\/li>\n<\/ol>\n<h2>7. Пример из практики<\/h2>\n<p><strong>Кейс: Amazon и цифровые технологии.<\/strong> Компания использует большие данные для анализа покупательского поведения и персональных рекомендаций; роботов и ИИ — для автоматизации складов; IoT и GPS — для отслеживания доставки в реальном времени. Персонализация, построенная на данных, обеспечивает значительную часть продаж, а автоматизация складов снижает издержки обработки заказов.<\/p>\n<p>Вывод: эффект дают не отдельные технологии, а их сочетание, подчинённое бизнес-цели — удобству клиента и скорости доставки.<\/p>\n<h2>8. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Составьте список цифровых технологий, которыми вы пользуетесь в течение одного дня, и укажите, какую задачу решает каждая.<\/li>\n<li>Приведите пример организации Кыргызстана, которая внедрила цифровые сервисы. Определите, что это — оцифровка, цифровизация или цифровая трансформация.<\/li>\n<\/ol>\n<h2>9. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Дайте определение цифровых технологий.<\/li>\n<li>Чем цифровизация отличается от цифровой трансформации?<\/li>\n<li>Назовите основные этапы развития цифровых технологий.<\/li>\n<li>Какие риски несёт цифровизация для общества?<\/li>\n<li>Как цифровизация изменит рабочую среду через 10 лет?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Цифровые технологии · оцифровка · цифровизация · цифровая трансформация · закон Мура · большие данные · интернет вещей · искусственный интеллект · блокчейн · омниканальность.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Фролов К. В., Иванов Д. Д., Фролов А. К. Цифровые технологии : учеб. пособие. — СПб., 2024.<\/li>\n<li>Концепция цифровой трансформации Кыргызской Республики на 2024–2028 годы. — cbd.minjust.gov.kg.<\/li>\n<li>Прохоров А., Коник Л. Цифровая трансформация: анализ, тренды, мировой опыт. — 2021.<\/li>\n<\/ol>\n"}, {"id": "lec-2", "kind": "lec", "num": 2, "title": "Основы компьютерных технологий", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 1\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Познакомить студентов с принципами работы компьютера, его основными компонентами, видами программного обеспечения и основами компьютерных сетей; показать роль компьютерных технологий в управлении и бизнесе.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Понятие компьютерных технологий.<\/li>\n<li>Архитектура компьютера: основные компоненты.<\/li>\n<li>Программное обеспечение: виды и классификация.<\/li>\n<li>Операционные системы и виртуализация.<\/li>\n<li>Основы компьютерных сетей.<\/li>\n<li>Роль компьютерных технологий в управлении и бизнесе.<\/li>\n<li>Современные тренды.<\/li>\n<\/ol>\n<h2>1. Понятие компьютерных технологий<\/h2>\n<p><strong>Компьютерные технологии<\/strong> — совокупность аппаратных и программных средств, используемых для сбора, обработки, хранения и передачи данных.<\/p>\n<p>Основные функции: обработка информации; хранение данных; автоматизация задач; обеспечение взаимодействия между системами и людьми.<\/p>\n<p>Любая компьютерная система состоит из двух частей: <strong>аппаратного обеспечения<\/strong> (hardware — физические устройства) и <strong>программного обеспечения<\/strong> (software — программы, которые управляют устройствами и решают задачи пользователя).<\/p>\n<h2>2. Архитектура компьютера: основные компоненты<\/h2>\n<p>В основе большинства современных компьютеров лежит <strong>архитектура фон Неймана<\/strong>: программа и данные хранятся в общей памяти, а процессор последовательно выбирает и выполняет команды.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Компонент<\/th>\n<th>Назначение<\/th>\n<th>Основная характеристика<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Центральный процессор (CPU)<\/td>\n<td>Выполняет вычисления и управляет работой системы<\/td>\n<td>Тактовая частота (ГГц), число ядер<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Оперативная память (RAM)<\/td>\n<td>Временное хранение данных и программ, с которыми идёт работа сейчас; очищается при выключении<\/td>\n<td>Объём (ГБ), скорость<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Накопитель HDD<\/td>\n<td>Постоянное хранение больших объёмов данных на магнитных дисках<\/td>\n<td>Ёмкость велика, скорость невысокая<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Накопитель SSD<\/td>\n<td>Постоянное хранение на флеш-памяти<\/td>\n<td>Высокая скорость и надёжность<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Материнская плата<\/td>\n<td>Соединяет все компоненты и обеспечивает их взаимодействие<\/td>\n<td>Разъёмы, чипсет<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Графический процессор (GPU)<\/td>\n<td>Обработка графики и параллельные вычисления (в том числе для машинного обучения)<\/td>\n<td>Число вычислительных блоков, видеопамять<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Устройства ввода<\/td>\n<td>Передают данные в компьютер<\/td>\n<td>Клавиатура, мышь, сканер, микрофон<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Устройства вывода<\/td>\n<td>Представляют результаты пользователю<\/td>\n<td>Монитор, принтер, колонки<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Иерархия памяти.<\/strong> Чем ближе память к процессору, тем она быстрее и дороже: регистры процессора → кэш → оперативная память → SSD/HDD → внешние и облачные хранилища. Поэтому оперативная память используется для текущей работы, а накопители — для постоянного хранения.<\/p>\n<h2>3. Программное обеспечение: виды и классификация<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Вид ПО<\/th>\n<th>Назначение<\/th>\n<th>Примеры<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Системное<\/td>\n<td>Управляет аппаратными ресурсами и обеспечивает работу других программ<\/td>\n<td>Операционные системы Windows, Linux, macOS; драйверы; утилиты<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Прикладное<\/td>\n<td>Решает конкретные задачи пользователя<\/td>\n<td>Microsoft Office, 1С, браузер Google Chrome, Adobe Photoshop<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Инструментальное<\/td>\n<td>Используется для разработки программ<\/td>\n<td>Языки Python, Java; среды Visual Studio, PyCharm<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Отдельно выделяют <strong>антивирусное и служебное ПО<\/strong> (архиваторы, средства резервного копирования). По способу распространения ПО бывает коммерческим, бесплатным (freeware) и свободным с открытым кодом (open source, например Linux, LibreOffice).<\/p>\n<h2>4. Операционные системы и виртуализация<\/h2>\n<p><strong>Операционная система (ОС)<\/strong> — комплекс системных программ, который управляет ресурсами компьютера (процессором, памятью, устройствами, файлами) и обеспечивает работу прикладных программ и взаимодействие с пользователем.<\/p>\n<p>Основные функции ОС: управление файлами и данными; запуск и управление приложениями (процессами); распределение памяти; управление устройствами через драйверы; обеспечение безопасности и прав доступа; пользовательский интерфейс (графический или командная строка).<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>ОС<\/th>\n<th>Особенности<\/th>\n<th>Типичное применение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Windows<\/td>\n<td>Широкая совместимость с прикладными программами<\/td>\n<td>Офис, бизнес, домашние компьютеры<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Linux<\/td>\n<td>Открытый код, надёжность, гибкая настройка<\/td>\n<td>Серверы, разработка, облака<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>macOS<\/td>\n<td>Интеграция с устройствами Apple<\/td>\n<td>Мультимедиа, дизайн<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Android, iOS<\/td>\n<td>Мобильные ОС<\/td>\n<td>Смартфоны и планшеты<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Виртуализация<\/strong> — технология, позволяющая на одном физическом сервере запускать несколько <strong>виртуальных машин<\/strong>, каждая со своей операционной системой. Программа-гипервизор (VMware, Hyper-V, VirtualBox) делит ресурсы физического компьютера между виртуальными машинами. Виртуализация экономит оборудование и электроэнергию и лежит в основе облачных вычислений.<\/p>\n<h2>5. Основы компьютерных сетей<\/h2>\n<p><strong>Компьютерная сеть<\/strong> — система, обеспечивающая обмен данными между компьютерами и другими устройствами.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Тип сети<\/th>\n<th>Охват<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>LAN (локальная)<\/td>\n<td>Офис, здание, дом<\/td>\n<td>Компьютеры отдела, подключённые к коммутатору<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>WAN (глобальная)<\/td>\n<td>Города, страны<\/td>\n<td>Интернет, сеть филиалов банка<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>WLAN / Wi-Fi<\/td>\n<td>Беспроводной доступ в пределах здания<\/td>\n<td>Точка доступа в кафе или университете<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Основные компоненты сети<\/strong>: сервер (хранит данные и предоставляет услуги); клиенты (устройства пользователей); коммутатор (соединяет устройства внутри локальной сети); маршрутизатор (направляет данные между сетями); кабели и беспроводные точки доступа.<\/p>\n<p><strong>Протоколы<\/strong> — правила обмена данными: TCP/IP — базовый стек интернета; HTTP/HTTPS — передача веб-страниц; FTP — передача файлов; SMTP — отправка электронной почты.<\/p>\n<h2>6. Роль компьютерных технологий в управлении и бизнесе<\/h2>\n<ol type=\"1\">\n<li>Автоматизация учёта: программы 1С, SAP.<\/li>\n<li>Управление персоналом: HRM-системы.<\/li>\n<li>Управление проектами: Trello, Jira, Asana.<\/li>\n<li>Продажи и маркетинг: CRM-системы (Bitrix24, Salesforce), анализ данных о клиентах.<\/li>\n<li>Безопасность: антивирусы, шифрование, резервное копирование.<\/li>\n<\/ol>\n<h2>7. Современные тренды<\/h2>\n<ul>\n<li><strong>Искусственный интеллект<\/strong> в автоматизации, чат-ботах, анализе данных.<\/li>\n<li><strong>Облачные вычисления<\/strong> — доступ к ресурсам через интернет (Google Workspace, AWS, Azure).<\/li>\n<li><strong>Интернет вещей<\/strong> — устройства, взаимодействующие через сеть.<\/li>\n<li><strong>Периферийные вычисления (edge computing)<\/strong> — обработка данных рядом с источником.<\/li>\n<li><strong>Квантовые вычисления<\/strong> — перспективная технология для задач, недоступных классическим компьютерам.<\/li>\n<\/ul>\n<p><strong>Пример из практики.<\/strong> Компания перевела работу сотрудников на облачную платформу Google Workspace: документы хранятся и редактируются совместно, совещания проходят в Google Meet. Результат — снижение расходов на собственные серверы и ускорение совместной работы.<\/p>\n<h2>8. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Составьте таблицу характеристик своего компьютера или смартфона: процессор, объём оперативной памяти, тип и объём накопителя, операционная система.<\/li>\n<li>Приведите три примера прикладных программ, используемых в вашей будущей профессии.<\/li>\n<li>Нарисуйте схему локальной сети небольшого офиса на 5 рабочих мест с принтером и выходом в интернет.<\/li>\n<\/ol>\n<h2>9. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Чем оперативная память отличается от накопителя?<\/li>\n<li>Чем системное ПО отличается от прикладного? Приведите примеры.<\/li>\n<li>Какие функции выполняет операционная система?<\/li>\n<li>Что такое виртуальная машина и зачем нужна виртуализация?<\/li>\n<li>Чем маршрутизатор отличается от коммутатора?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Аппаратное обеспечение · программное обеспечение · процессор · оперативная память · SSD · операционная система · виртуализация · гипервизор · LAN · WAN · протокол TCP/IP.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Таненбаум Э. С. Современные операционные системы. — СПб. : Питер, 2020.<\/li>\n<li>Таненбаум Э. С. Компьютерные сети. — СПб. : Питер, 2020.<\/li>\n<li>Петцольд Ч. Код. Тайный язык информатики. — М. : МИФ, 2021.<\/li>\n<\/ol>\n"}, {"id": "lec-3", "kind": "lec", "num": 3, "title": "Основы работы с данными", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 1\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Познакомить студентов с типами данных, форматами их представления, методами сбора, обработки и хранения, а также с основными видами анализа данных и этическими правилами работы с ними.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Понятие данных и их роль в современной экономике.<\/li>\n<li>Типы данных и их классификация.<\/li>\n<li>Форматы данных: CSV, JSON, XML.<\/li>\n<li>Методы сбора данных.<\/li>\n<li>Обработка и подготовка данных.<\/li>\n<li>Хранение данных.<\/li>\n<li>Основы анализа данных.<\/li>\n<li>Этика и безопасность работы с данными.<\/li>\n<\/ol>\n<h2>1. Понятие данных и их роль в экономике<\/h2>\n<p><strong>Данные<\/strong> — факты, зафиксированные в форме, пригодной для хранения, передачи и обработки: числа, тексты, изображения, звуки, показания датчиков.<\/p>\n<p>Важно различать уровни: <em>данные<\/em> (сырые факты: «12 500», «Ош») → <em>информация<\/em> (данные в контексте: «выручка филиала в Оше — 12 500 сомов») → <em>знания<\/em> (понимание закономерностей: «выручка в Оше растёт по пятницам»). Цель работы с данными — превратить их в знания, на основе которых принимаются решения.<\/p>\n<p>В цифровой экономике данные называют «новой нефтью»: они становятся стратегическим ресурсом, из которого компании извлекают ценность — персонализируют предложения, прогнозируют спрос, снижают издержки.<\/p>\n<h2>2. Типы данных и их классификация<\/h2>\n<p><strong>По степени структурированности<\/strong><\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Тип<\/th>\n<th>Описание<\/th>\n<th>Примеры<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Структурированные<\/td>\n<td>Имеют чёткую схему: строки и столбцы<\/td>\n<td>Таблицы Excel, базы данных клиентов<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Полуструктурированные<\/td>\n<td>Имеют метки и вложенность, но не жёсткую схему<\/td>\n<td>JSON, XML, электронные письма<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Неструктурированные<\/td>\n<td>Не имеют заранее заданной структуры<\/td>\n<td>Тексты, фото, видео, аудио, публикации в соцсетях<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>По источнику<\/strong><\/p>\n<ul>\n<li><em>Первичные (first-party)<\/em> — собранные самой организацией: история покупок, заявки клиентов.<\/li>\n<li><em>Партнёрские (second-party)<\/em> — полученные от партнёра по соглашению.<\/li>\n<li><em>Сторонние (third-party)<\/em> — приобретённые у внешних поставщиков, открытые данные государства.<\/li>\n<\/ul>\n<p><strong>По типу значений<\/strong>: количественные (числовые — дискретные и непрерывные) и качественные (категориальные — пол, регион, статус заказа).<\/p>\n<h2>3. Форматы данных<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Формат<\/th>\n<th>Назначение<\/th>\n<th>Фрагмент<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>CSV<\/td>\n<td>Табличные данные в текстовом файле; значения разделены запятой или точкой с запятой<\/td>\n<td><code>id;город;выручка<\/code><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>JSON<\/td>\n<td>Обмен структурированными данными между программами, особенно в веб-разработке<\/td>\n<td><code>{\"id\": 1, \"город\": \"Ош\"}<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>XML<\/td>\n<td>Текстовый формат с тегами для хранения и передачи данных<\/td>\n<td><code>&lt;город&gt;Ош&lt;/город&gt;<\/code><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>XLSX<\/td>\n<td>Электронные таблицы с формулами и форматированием<\/td>\n<td>Файл Excel<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>CSV удобен для выгрузки таблиц, JSON — для веб-сервисов и API, XML — для документов и обмена между корпоративными системами.<\/p>\n<h2>4. Методы сбора данных<\/h2>\n<ol type=\"1\">\n<li><strong>Анкетирование и опросы<\/strong> — Google Forms, SurveyMonkey.<\/li>\n<li><strong>Мониторинг и сенсоры<\/strong> — датчики температуры, GPS-трекеры, счётчики.<\/li>\n<li><strong>Веб-аналитика<\/strong> — Google Analytics, Яндекс Метрика: посещения сайта, клики, конверсии.<\/li>\n<li><strong>API и интеграции<\/strong> — автоматическое получение данных из других систем (курсы валют, погода, данные платёжных систем).<\/li>\n<li><strong>Учётные системы<\/strong> — данные, которые возникают при работе ERP, CRM, кассовых программ.<\/li>\n<\/ol>\n<h2>5. Обработка и подготовка данных<\/h2>\n<p>На подготовку данных уходит большая часть времени аналитика. Основные операции:<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Операция<\/th>\n<th>Содержание<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Очистка<\/td>\n<td>Удаление дубликатов, исправление ошибок, обработка пропусков<\/td>\n<td>Один клиент записан дважды: «Асанов» и «Асанов »<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Трансформация<\/td>\n<td>Приведение к единым форматам и единицам<\/td>\n<td>Даты «12.03.24» и «2024-03-12» → один формат<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Фильтрация<\/td>\n<td>Выбор данных по заданным условиям<\/td>\n<td>Только заказы за март<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Сортировка<\/td>\n<td>Упорядочивание по одному или нескольким критериям<\/td>\n<td>Клиенты по убыванию суммы покупок<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Агрегирование<\/td>\n<td>Объединение и группировка данных для получения итогов<\/td>\n<td>Сумма продаж по каждому филиалу<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Обогащение<\/td>\n<td>Добавление данных из других источников<\/td>\n<td>Добавить к адресу клиента район города<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>6. Хранение данных<\/h2>\n<ul>\n<li><strong>Реляционные базы данных (SQL)<\/strong>: MySQL, PostgreSQL, Microsoft SQL Server — таблицы со связями (подробно в лекции 4).<\/li>\n<li><strong>Нереляционные базы (NoSQL)<\/strong>: MongoDB, Redis — документы, пары «ключ–значение», графы.<\/li>\n<li><strong>Локальное хранение<\/strong>: компьютеры и серверы организации.<\/li>\n<li><strong>Облачные хранилища<\/strong>: Google Drive, Amazon S3, Microsoft Azure.<\/li>\n<li><strong>Хранилища данных (Data Warehouse)<\/strong> — централизованные хранилища, объединяющие данные из разных систем для анализа.<\/li>\n<\/ul>\n<h2>7. Основы анализа данных<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Вид анализа<\/th>\n<th>Вопрос<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Описательный (дескриптивный)<\/td>\n<td>Что произошло?<\/td>\n<td>Отчёт о продажах за квартал<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Диагностический<\/td>\n<td>Почему это произошло?<\/td>\n<td>Падение продаж связано с ростом цен конкурента<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Прогнозный (предиктивный)<\/td>\n<td>Что произойдёт?<\/td>\n<td>Прогноз спроса на следующий месяц<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Предписывающий (прескриптивный)<\/td>\n<td>Что делать?<\/td>\n<td>Рекомендация, сколько товара закупить<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Базовые статистические показатели<\/strong>: среднее арифметическое, медиана (центральное значение упорядоченного ряда), мода, минимум и максимум, размах, стандартное отклонение (мера разброса).<\/p>\n<p><em>Пример.<\/em> Ежедневная выручка кафе за 5 дней: 10, 12, 11, 13, 54 тыс. сомов. Среднее = 20 тыс., медиана = 12 тыс. Один праздничный день резко поднял среднее, а медиана лучше описывает «обычный» день. Поэтому при выбросах используют медиану.<\/p>\n<p><strong>Инструменты<\/strong>: Microsoft Excel, Google Sheets — базовый анализ; Power BI, Tableau — визуализация; Python и R — программный анализ; Hadoop, Spark — обработка больших данных.<\/p>\n<h2>8. Этика и безопасность работы с данными<\/h2>\n<p>Принципы: <strong>конфиденциальность<\/strong> (защита персональных данных); <strong>прозрачность<\/strong> (человек знает, какие данные о нём собираются и зачем); <strong>минимизация<\/strong> (собирать только необходимое); <strong>законность<\/strong> — соблюдение Закона КР «Об информации персонального характера», европейского регламента GDPR для работы с клиентами из ЕС.<\/p>\n<p>Риски: утечка данных, использование данных без согласия, дискриминация на основе алгоритмов.<\/p>\n<p><strong>Пример из практики.<\/strong> Розничная сеть анализирует чеки программы лояльности: какие товары покупают вместе и в какие дни. По результатам меняется выкладка товаров и формируются персональные скидки. Структурированные данные чеков дополняются неструктурированными отзывами покупателей.<\/p>\n<h2>9. Задания для самостоятельной работы<\/h2>\n<ol type=\"1\">\n<li>Приведите примеры данных, которые собирает ваш университет. Разделите их на структурированные, полуструктурированные и неструктурированные.<\/li>\n<li>В Excel или Google Sheets создайте таблицу из 10 строк (например, расходы за неделю), отсортируйте её, отфильтруйте и рассчитайте среднее и медиану.<\/li>\n<\/ol>\n<h2>10. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Чем данные отличаются от информации?<\/li>\n<li>Приведите примеры структурированных и неструктурированных данных.<\/li>\n<li>Для чего используются форматы CSV и JSON?<\/li>\n<li>Что входит в очистку данных?<\/li>\n<li>Чем прогнозный анализ отличается от предписывающего?<\/li>\n<li>Когда медиана описывает данные лучше среднего?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>Данные · информация · структурированные данные · CSV · JSON · XML · очистка данных · фильтрация · агрегирование · хранилище данных · медиана · персональные данные.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Фролов К. В. и др. Цифровые технологии : учеб. пособие. — СПб., 2024.<\/li>\n<li>Кузнецов Д. И. Основы анализа данных и машинного обучения. — М. : ДМК Пресс, 2020.<\/li>\n<\/ol>\n"}, {"id": "lec-4", "kind": "lec", "num": 4, "title": "Базы данных и SQL", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 1\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Сформировать представление о базах данных и системах управления ими, освоить основные понятия реляционной модели и базовые команды языка SQL для создания таблиц, добавления, выборки, изменения и удаления данных.<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Понятие базы данных и СУБД.<\/li>\n<li>Виды баз данных.<\/li>\n<li>Основные понятия реляционной модели: таблица, запись, поле, ключи.<\/li>\n<li>Язык SQL: группы команд.<\/li>\n<li>Примеры запросов SQL.<\/li>\n<li>Применение баз данных в бизнесе и современные тренды.<\/li>\n<li>SQL-тренажёр и кроссворд.<\/li>\n<\/ol>\n<h2>1. Понятие базы данных и СУБД<\/h2>\n<p><strong>База данных (БД)<\/strong> — организованная совокупность взаимосвязанных данных, хранящихся по определённым правилам и предназначенных для коллективного использования.<\/p>\n<p><strong>Система управления базами данных (СУБД)<\/strong> — программное обеспечение для создания баз данных, хранения, поиска, изменения данных и управления доступом к ним. Примеры: MySQL, PostgreSQL, Microsoft SQL Server, Oracle, SQLite.<\/p>\n<p>Функции БД в информационных системах: хранение больших объёмов информации; быстрый поиск и обработка; одновременная работа многих пользователей; защита и разграничение доступа; поддержка целостности (например, нельзя оформить заказ на несуществующего клиента).<\/p>\n<h2>2. Виды баз данных<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Вид<\/th>\n<th>Модель хранения<\/th>\n<th>Примеры СУБД<\/th>\n<th>Когда применяется<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Реляционные (SQL)<\/td>\n<td>Таблицы, связанные ключами<\/td>\n<td>MySQL, PostgreSQL, SQL Server<\/td>\n<td>Учёт, финансы, CRM — где важны строгая структура и целостность<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Документные (NoSQL)<\/td>\n<td>Документы JSON<\/td>\n<td>MongoDB<\/td>\n<td>Каталоги товаров, профили пользователей с разной структурой<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>«Ключ–значение»<\/td>\n<td>Пары ключ–значение<\/td>\n<td>Redis<\/td>\n<td>Кэш, сессии пользователей<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Графовые<\/td>\n<td>Узлы и связи<\/td>\n<td>Neo4j<\/td>\n<td>Социальные сети, рекомендации<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>По размещению базы бывают <strong>локальными<\/strong> (на сервере организации) и <strong>облачными<\/strong> (Amazon RDS, Google Cloud SQL, Azure SQL).<\/p>\n<h2>3. Основные понятия реляционной модели<\/h2>\n<p>Реляционная модель была предложена Эдгаром Коддом в 1970 году. Данные хранятся в <strong>таблицах<\/strong> (отношениях).<\/p>\n<ul>\n<li><strong>Таблица<\/strong> — набор данных об объектах одного типа (сотрудники, товары, заказы).<\/li>\n<li><strong>Запись (строка, кортеж)<\/strong> — сведения об одном объекте.<\/li>\n<li><strong>Поле (столбец, атрибут)<\/strong> — одна характеристика объекта; у каждого поля есть тип данных.<\/li>\n<li><strong>Первичный ключ (PRIMARY KEY)<\/strong> — поле, значение которого уникально идентифицирует каждую запись (например, <code>id<\/code>).<\/li>\n<li><strong>Внешний ключ (FOREIGN KEY)<\/strong> — поле, которое ссылается на первичный ключ другой таблицы и задаёт связь между таблицами.<\/li>\n<li><strong>Индекс<\/strong> — вспомогательная структура, ускоряющая поиск по полю (как алфавитный указатель в книге).<\/li>\n<\/ul>\n<p><strong>Пример связи.<\/strong> Таблица <code>departments<\/code> (отделы) и таблица <code>employees<\/code> (сотрудники). В <code>employees<\/code> есть поле <code>dept_id<\/code> — внешний ключ на <code>departments.id<\/code>. Связь «один ко многим»: в одном отделе много сотрудников.<\/p>\n<p><strong>Основные типы данных SQL<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Тип<\/th>\n<th>Назначение<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>INT / INTEGER<\/td>\n<td>Целые числа<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>DECIMAL(10,2), FLOAT<\/td>\n<td>Дробные числа (суммы, цены)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>VARCHAR(n)<\/td>\n<td>Строка переменной длины до n символов<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TEXT<\/td>\n<td>Длинный текст<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DATE, DATETIME<\/td>\n<td>Дата; дата и время<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>BOOLEAN<\/td>\n<td>Логическое значение<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>NULL<\/strong> — специальное обозначение отсутствия значения (не ноль и не пустая строка).<\/p>\n<h2>4. Язык SQL: группы команд<\/h2>\n<p><strong>SQL (Structured Query Language)<\/strong> — язык структурированных запросов для работы с реляционными базами данных.<\/p>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Группа<\/th>\n<th>Назначение<\/th>\n<th>Команды<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>DDL (Data Definition Language)<\/td>\n<td>Определение структуры<\/td>\n<td><code>CREATE<\/code>, <code>ALTER<\/code>, <code>DROP<\/code>, <code>TRUNCATE<\/code><\/td>\n<\/tr>\n<tr class=\"even\">\n<td>DML (Data Manipulation Language)<\/td>\n<td>Работа с данными<\/td>\n<td><code>SELECT<\/code>, <code>INSERT<\/code>, <code>UPDATE<\/code>, <code>DELETE<\/code><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DCL (Data Control Language)<\/td>\n<td>Управление доступом<\/td>\n<td><code>GRANT<\/code>, <code>REVOKE<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Различайте: <code>DELETE<\/code> удаляет строки (можно с условием), <code>TRUNCATE<\/code> очищает таблицу целиком, <code>DROP<\/code> удаляет саму таблицу вместе со структурой.<\/p>\n<h2>5. Примеры запросов SQL<\/h2>\n<p><strong>Создание таблицы<\/strong><\/p>\n<pre><code>CREATE TABLE employees (\n  id      INT PRIMARY KEY,\n  name    VARCHAR(100) NOT NULL,\n  dept    VARCHAR(50),\n  salary  DECIMAL(10,2),\n  hired   DATE\n);<\/code><\/pre>\n<p><strong>Добавление данных<\/strong><\/p>\n<pre><code>INSERT INTO employees (id, name, dept, salary, hired)\nVALUES (1, &#39;Асанова Айгуль&#39;, &#39;IT&#39;, 65000, &#39;2022-09-01&#39;);<\/code><\/pre>\n<p><strong>Выборка данных<\/strong><\/p>\n<pre><code>SELECT name, salary FROM employees\nWHERE salary &gt; 50000\nORDER BY salary DESC;<\/code><\/pre>\n<p><strong>Обновление и удаление<\/strong><\/p>\n<pre><code>UPDATE employees SET dept = &#39;Аналитика&#39; WHERE id = 1;\nDELETE FROM employees WHERE id = 7;<\/code><\/pre>\n<p><strong>Агрегатные функции и группировка<\/strong><\/p>\n<pre><code>SELECT dept, COUNT(*) AS staff, AVG(salary) AS avg_salary\nFROM employees\nGROUP BY dept;<\/code><\/pre>\n<p>Агрегатные функции: <code>COUNT<\/code> — количество, <code>SUM<\/code> — сумма, <code>AVG<\/code> — среднее, <code>MIN<\/code> и <code>MAX<\/code> — наименьшее и наибольшее значения.<\/p>\n<p><strong>Соединение таблиц (JOIN)<\/strong><\/p>\n<pre><code>SELECT e.name, d.title\nFROM employees e\nJOIN departments d ON e.dept_id = d.id;<\/code><\/pre>\n<p><code>JOIN<\/code> объединяет строки двух таблиц по общему полю.<\/p>\n<blockquote>\n<p>Важно: <code>UPDATE<\/code> и <code>DELETE<\/code> без условия <code>WHERE<\/code> изменят или удалят <strong>все<\/strong> строки таблицы.<\/p>\n<\/blockquote>\n<h2>6. Применение баз данных в бизнесе и тренды<\/h2>\n<ul>\n<li><strong>CRM-системы<\/strong> — данные о клиентах и сделках.<\/li>\n<li><strong>Учёт запасов<\/strong> — остатки товаров, поступления, отгрузки.<\/li>\n<li><strong>Финансовые системы<\/strong> — платежи, проводки, отчётность.<\/li>\n<li><strong>Веб-приложения<\/strong> — пользователи, заказы, публикации.<\/li>\n<\/ul>\n<p>Тренды: облачные БД как сервис (DBaaS); NoSQL для больших объёмов неоднородных данных; автоматизация администрирования; шифрование и аудит доступа.<\/p>\n<h2>7. SQL-тренажёр<\/h2>\n<p>В тренажёре загружена учебная таблица <code>employees<\/code> (10 сотрудников). Наберите запрос и нажмите «Выполнить». Поддерживаются <code>SELECT … FROM employees<\/code>, <code>WHERE<\/code> (условия <code>=<\/code>, <code>&lt;&gt;<\/code>, <code>&gt;<\/code>, <code>&lt;<\/code>, <code>&gt;=<\/code>, <code>&lt;=<\/code>, <code>LIKE<\/code>, связки <code>AND<\/code>/<code>OR<\/code>), <code>GROUP BY<\/code>, <code>ORDER BY … ASC/DESC<\/code>, <code>LIMIT<\/code>, функции <code>COUNT<\/code>, <code>SUM<\/code>, <code>AVG<\/code>, <code>MIN<\/code>, <code>MAX<\/code>.<\/p>\n<div class=\"widget\" data-w=\"sql\">\n\n<\/div>\n<p>Попробуйте: выбрать сотрудников отдела IT; найти зарплаты выше 50 000; подсчитать число сотрудников по отделам; найти максимальную зарплату.<\/p>\n<h2>8. Кроссворд «Основы баз данных и SQL»<\/h2>\n<p>Впишите термины. Буквы набираются латиницей; для ответов из двух слов используйте пробел.<\/p>\n<div class=\"widget\" data-w=\"xw\">\n\n<\/div>\n<h2>9. Вопросы для самопроверки<\/h2>\n<ol type=\"1\">\n<li>Чем база данных отличается от СУБД?<\/li>\n<li>Что такое первичный и внешний ключи?<\/li>\n<li>К какой группе команд SQL относятся <code>CREATE<\/code> и <code>SELECT<\/code>?<\/li>\n<li>Чем <code>DELETE<\/code> отличается от <code>DROP<\/code>?<\/li>\n<li>Для чего используется <code>JOIN<\/code>?<\/li>\n<li>В чём преимущества реляционных баз перед нереляционными и наоборот?<\/li>\n<\/ol>\n<h2>Ключевые понятия<\/h2>\n<p>База данных · СУБД · таблица · запись · поле · первичный ключ · внешний ключ · индекс · SQL · DDL · DML · JOIN · агрегатная функция · NULL.<\/p>\n<h2>Литература<\/h2>\n<ol type=\"1\">\n<li>Фролов К. В. и др. Цифровые технологии : учеб. пособие. — СПб., 2024.<\/li>\n<li>W3Schools SQL Tutorial. — w3schools.com/sql.<\/li>\n<li>Документация MySQL. — dev.mysql.com/doc.<\/li>\n<\/ol>\n"}, {"id": "lec-5", "kind": "lec", "num": 5, "title": "Анализ и визуализация данных", "html": "<div class=\"meta\">\n<p>\n2 академических часа\n<\/p>\n<p>\nМодуль 1\n<\/p>\n<p>\nПК-1, ИК-2\n<\/p>\n<\/div>\n<h2>Цель лекции<\/h2>\n<p>Познакомить студентов с этапами и видами анализа данных, базовыми статистическими показателями, принципами выбора графиков и инструментами визуализации (Excel, Power BI, Tableau, Python).<\/p>\n<p><strong>План лекции<\/strong><\/p>\n<ol type=\"1\">\n<li>Введение в анализ данных.<\/li>\n<li>Типы анализа данных.<\/li>\n<li>Статистические показатели и корреляция.<\/li>\n<li>Основы визуализации: виды графиков.<\/li>\n<li>Принципы эффективной визуализации.<\/li>\n<li>Инструменты визуализации.<\/li>\n<li>Применение в управлении и бизнесе, тренды.<\/li>\n<\/ol>\n<h2>1. Введение в анализ данных<\/h2>\n<p><strong>Анализ данных<\/strong> — исследование и обработка данных с целью выявления полезной информации, закономерностей и тенденций для принятия решений.<\/p>\n<p>Задачи анализа: получение ключевых выводов (инсайтов); поддержка обоснованных решений; выявление закономерностей, отклонений и трендов.<\/p>\n<p><strong>Этапы анализа данных<\/strong><\/p>\n<ol type=\"1\">\n<li><em>Постановка вопроса<\/em> — что именно нужно узнать.<\/li>\n<li><em>Сбор данных<\/em> — из баз данных, файлов, веб-аналитики, опросов.<\/li>\n<li><em>Очистка<\/em> — устранение ошибок, пропусков, дубликатов.<\/li>\n<li><em>Анализ<\/em> — статистические методы, группировки, модели.<\/li>\n<li><em>Визуализация и интерпретация<\/em> — графики, дашборды, выводы.<\/li>\n<li><em>Решение и контроль<\/em> — действие и проверка его результата.<\/li>\n<\/ol>\n<h2>2. Типы анализа данных<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Тип<\/th>\n<th>Вопрос<\/th>\n<th>Методы<\/th>\n<th>Пример<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Описательный<\/td>\n<td>Что произошло?<\/td>\n<td>Сводные таблицы, средние, доли<\/td>\n<td>Выручка по месяцам<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Диагностический<\/td>\n<td>Почему?<\/td>\n<td>Сравнение групп, корреляция, детализация<\/td>\n<td>Падение продаж в одном регионе<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Прогнозный<\/td>\n<td>Что будет?<\/td>\n<td>Регрессия, временные ряды, машинное обучение<\/td>\n<td>Прогноз спроса<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Предписывающий<\/td>\n<td>Что делать?<\/td>\n<td>Оптимизация, моделирование сценариев<\/td>\n<td>Оптимальный план закупок<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>3. Статистические показатели и корреляция<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Показатель<\/th>\n<th>Смысл<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Среднее арифметическое<\/td>\n<td>Сумма значений, делённая на их количество<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Медиана<\/td>\n<td>Центральное значение упорядоченного ряда; устойчива к выбросам<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Мода<\/td>\n<td>Наиболее часто встречающееся значение<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Размах<\/td>\n<td>Разность максимального и минимального значений<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Стандартное отклонение<\/td>\n<td>Типичное отклонение значений от среднего (мера разброса)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Корреляция<\/strong> — статистическая связь между двумя переменными. Коэффициент корреляции Пирсона <em>r<\/em> принимает значения от −1 до +1: <em>r<\/em> близко к +1 — сильная прямая связь (растёт одна величина — растёт и другая); близко к −1 — сильная обратная связь; около 0 — линейной связи нет.<\/p>\n<blockquote>\n<p>Корреляция не означает причинность. Продажи мороженого и число солнечных ожогов растут вместе, но причина у обоих одна — жаркая погода.<\/p>\n<\/blockquote>\n<p><strong>Калькулятор описательной статистики.<\/strong> Введите ряд чисел через пробел или точку с запятой — например, ежедневные продажи.<\/p>\n<div class=\"widget\" data-w=\"stats\">\n\n<\/div>\n<h2>4. Основы визуализации: виды графиков<\/h2>\n<p><strong>Визуализация данных<\/strong> — представление данных в графической форме, упрощающей восприятие, сравнение и поиск закономерностей.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr class=\"header\">\n<th>Задача<\/th>\n<th>Подходящий график<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Динамика во времени<\/td>\n<td>Линейный график<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Сравнение категорий<\/td>\n<td>Столбчатая (линейчатая) диаграмма<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Доли целого (немного категорий)<\/td>\n<td>Круговая или кольцевая диаграмма<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Распределение значений<\/td>\n<td>Гистограмма<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Связь двух переменных<\/td>\n<td>Точечная диаграмма (диаграмма рассеяния)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Интенсивность по двум измерениям<\/td>\n<td>Тепловая карта<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Мониторинг ключевых показателей<\/td>\n<td>Дашборд<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>5. Принципы эффективной визуализации<\/h2>\n<ol type=\"1\">\n<li><strong>Простота<\/strong> — убрать лишние элементы (объёмные эффекты, фоновые рисунки).<\/li>\n<li><strong>Фокус<\/strong> — выделить главное цветом или подписью, остальное сделать нейтральным.<\/li>\n<li><strong>Честная шкала<\/strong> — ось столбчатой диаграммы начинается с нуля, иначе различия искажаются.<\/li>\n<li><strong>Цвет со смыслом<\/strong> — понятная и контрастная палитра, одинаковый цвет для одной категории на всех графиках.<\/li>\n<li><strong>Соответствие типу данных<\/strong> — график выбирается по задаче, а не по красоте.<\/li>\n<li><strong>Подписи<\/strong> — название, единицы измерения, источник данных.<\/li>\n<li><strong>Интерактивность<\/strong> — фильтры и детализация для больших объёмов данных.<\/li>\n<\/ol>\n<h2>6. Инструменты визуализации<\/h2>\n<div class=\"tbl\"><table>\n\n<thead>\n<tr class=\"header\">\n<th>Инструмент<\/th>\n<th>Особенности<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Microsoft Excel / Google Sheets<\/td>\n<td>Сводные таблицы, стандартные диаграммы, доступность<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Power BI<\/td>\n<td>Интерактивные дашборды, подключение к множеству источников, язык DAX<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Tableau<\/td>\n<td>Мощная визуальная аналитика, Tableau Public для публикации<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Looker Studio (Google Data Studio)<\/td>\n<td>Бесплатные онлайн-отчёты, интеграция с Google Analytics<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Python (matplotlib, seaborn, plotly)<\/td>\n<td>Программная визуализация любой сложности<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>R (ggplot2)<\/td>\n<td>Статистическая графика<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h
